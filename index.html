<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5b8cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1d2740; --border:#2a3552;
    --text:#e8ecf7; --muted:#8a93ab; --accent:#5b8cff; --accent2:#7c5bff;
    --green:#3ecf8e; --red:#ff5c7a; --amber:#ffb946; --on-accent:#fff;
    --radius:14px; --shadow:0 8px 24px rgba(0,0,0,0.35);
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Themes — each sets the same token set; --on-accent is the text color used
     on top of the accent gradient (buttons, logo), only Slate needs it dark. */
  [data-theme="sunset"]{
    --bg:#1a1310; --panel:#241a15; --panel2:#2e221b; --border:#453526;
    --text:#fbeee3; --muted:#b89a85; --accent:#fb923c; --accent2:#f43f5e;
    --green:#4ade80; --red:#f43f5e; --amber:#fcd34d;
  }
  [data-theme="rose"]{
    --bg:#180f16; --panel:#20151d; --panel2:#2a1b25; --border:#3d2434;
    --text:#fbe8f3; --muted:#b88aa3; --accent:#f472b6; --accent2:#c026d3;
    --green:#34d399; --red:#fb7185; --amber:#fbbf24;
  }
  [data-theme="ocean"]{
    --bg:#081417; --panel:#0d1f23; --panel2:#122a30; --border:#1c3a42;
    --text:#e3f6f8; --muted:#7fa8ae; --accent:#2dd4bf; --accent2:#06b6d4;
    --green:#4ade80; --red:#fb7185; --amber:#fbbf24;
  }
  [data-theme="slate"]{
    --bg:#121212; --panel:#1a1a1a; --panel2:#222222; --border:#2e2e2e;
    --text:#f0f0f0; --muted:#8c8c8c; --accent:#d4d4d8; --accent2:#a1a1aa;
    --green:#86efac; --red:#fca5a5; --amber:#fde68a; --on-accent:#18181b;
  }
  [data-theme="paper"]{
    --bg:#f7f3ec; --panel:#ffffff; --panel2:#f1ece2; --border:#e4dcc9;
    --text:#2b2620; --muted:#79705f; --accent:#c2410c; --accent2:#9a3412;
    --green:#15803d; --red:#be123c; --amber:#b45309;
    --shadow:0 8px 24px rgba(43,38,32,.08);
  }
  [data-theme="soft"]{
    --bg:#faf9fc; --panel:#ffffff; --panel2:#f4f2fa; --border:#e8e4f3;
    --text:#1c1a22; --muted:#8a8594; --accent:#a78bfa; --accent2:#f0abfc;
    --green:#16a34a; --red:#e11d48; --amber:#d97706; --on-accent:#1c1a22;
    --shadow:0 8px 24px rgba(90,70,150,.08);
  }
  [data-theme="ignite"]{
    --bg:#0a0a0a; --panel:#161616; --panel2:#1f1f1f; --border:#2e2e2e;
    --text:#f5f5f0; --muted:#9a9a94; --accent:#ffb020; --accent2:#ff6a1a;
    --green:#4ade80; --red:#ff4d4d; --amber:#ffd166; --on-accent:#141414;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);transition:background .2s,color .2s;font-variant-numeric:tabular-nums;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .app{display:flex;min-height:100vh;}

  .sidebar{width:210px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:4px;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px 10px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--on-accent);}
  .brand .name{font-weight:700;font-size:16px;}
  .brand .sub{font-size:11px;color:var(--muted);}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500;user-select:none;transition:background .1s,transform .1s;}
  .nav-item:active{transform:scale(.98);}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--panel2);color:var(--text);}
  .nav-item.active{background:linear-gradient(135deg,color-mix(in srgb, var(--accent) 18%, transparent),color-mix(in srgb, var(--accent2) 18%, transparent));color:var(--text);box-shadow:inset 3px 0 0 var(--accent);}
  .nav-item.active svg{color:var(--accent);}
  .sidebar-footer{margin-top:auto;padding:10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:8px;}

  .main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1150px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    position:sticky;top:0;z-index:40;padding:14px 0;margin:-14px 0 22px;
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar h1{font-size:22px;margin:0;}
  .month-switch{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px 8px;}
  .month-switch button{background:var(--panel2);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;}
  .month-switch button:hover{border-color:var(--accent);}
  .month-switch .label{font-weight:600;min-width:150px;text-align:center;font-size:14px;}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:var(--on-accent);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:transform .1s ease;}
  .btn:active{transform:scale(.96);}
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:color-mix(in srgb, var(--red) 15%, transparent);color:var(--red);border:1px solid color-mix(in srgb, var(--red) 30%, transparent);}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:8px;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  @media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  @keyframes cardReveal{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .stagger-card{animation:cardReveal .45s ease both;animation-delay:calc(var(--i, 0) * 60ms);}
  .card.highlight{border-color:color-mix(in srgb, var(--accent) 50%, transparent);background:linear-gradient(180deg,color-mix(in srgb, var(--accent) 8%, transparent),var(--panel));}
  .card .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .card .v{font-size:21px;font-weight:700;}
  .card .v.pos{color:var(--green);}
  .card .v.neg{color:var(--red);}
  .card .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .spark{position:relative;height:26px;margin:10px 4px 0 0;color:var(--muted);}
  .spark.good{color:var(--green);}
  .spark.bad{color:var(--red);}
  .spark svg{display:block;width:100%;height:100%;overflow:visible;}
  .spark .spark-line{fill:none;stroke:currentColor;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;}
  .spark .spark-area{fill:currentColor;opacity:.12;stroke:none;}
  .spark-dot{position:absolute;right:0;width:6px;height:6px;border-radius:50%;background:currentColor;transform:translate(50%,-50%);box-shadow:0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);}
  @keyframes sparkReveal{from{clip-path:inset(-4px 100% -4px -4px);}to{clip-path:inset(-4px -6px -4px -4px);}}
  @keyframes sparkDot{from{opacity:0;}to{opacity:1;}}
  .spark.anim svg{animation:sparkReveal .75s ease both;animation-delay:calc(var(--i, 0) * 60ms + .25s);}
  .spark.anim .spark-dot{animation:sparkDot .3s ease both;animation-delay:calc(var(--i, 0) * 60ms + .9s);}
  .trend-arrow{font-size:11.5px;font-weight:700;margin-top:6px;}
  .trend-arrow.trend-good{color:var(--green);}
  .trend-arrow.trend-bad{color:var(--red);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-head h2{font-size:15px;margin:0;font-weight:700;}
  .panel-head .hint{font-size:12px;color:var(--muted);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:8px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--panel2);}
  input[type=text],input[type=number],textarea{
    background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;width:100%;
  }
  select{
    background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;font-weight:600;cursor:pointer;
  }
  select.status-done{color:var(--green);border-color:color-mix(in srgb, var(--green) 50%, transparent);background:color-mix(in srgb, var(--green) 8%, transparent);}
  select.status-none{color:var(--amber);border-color:color-mix(in srgb, var(--amber) 40%, transparent);background:color-mix(in srgb, var(--amber) 6%, transparent);}
  select.recur-yes{color:var(--accent);border-color:color-mix(in srgb, var(--accent) 50%, transparent);background:color-mix(in srgb, var(--accent) 8%, transparent);}
  select.recur-no{color:var(--muted);border-color:var(--border);background:var(--bg);}
  /* Custom category dropdown (replaces a plain <select> with an icon-chip popover) */
  .cat-dd{position:relative;display:inline-block;outline:none;}
  .cat-dd-trigger{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;user-select:none;transition:border-color .12s ease,box-shadow .12s ease;}
  .cat-dd-trigger:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--border));}
  .cat-dd.open .cat-dd-trigger,.cat-dd:focus-visible .cat-dd-trigger{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
  .cat-dd-chip{width:22px;height:22px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .cat-dd-label{font-size:12.5px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-dd-caret{font-size:9px;color:var(--muted);flex-shrink:0;transition:transform .15s ease;}
  .cat-dd.open .cat-dd-caret{transform:rotate(180deg);}
  .cat-dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:210px;max-height:280px;overflow-y:auto;background:var(--panel2);border:1px solid var(--border);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.4);z-index:60;padding:5px;display:none;}
  .cat-dd.open .cat-dd-menu{display:block;}
  .cat-dd-opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:13px;color:var(--text);cursor:pointer;}
  .cat-dd-opt:hover{background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .cat-dd-opt.selected{background:color-mix(in srgb, var(--accent) 20%, transparent);font-weight:600;}
  .row-input{border:none;background:transparent;padding:4px 6px;width:100%;}
  .row-input:focus{background:var(--panel2);border-radius:6px;}
  .amt-cell{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px;}
  .del-btn:hover{color:var(--red);background:color-mix(in srgb, var(--red) 10%, transparent);}

  .weekly-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:700px){.weekly-grid{grid-template-columns:repeat(2,1fr);}}
  .weekly-item label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  .weekly-item select{width:100%;}

  .field-inline{display:flex;gap:10px;align-items:center;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 10px;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal.recap-modal{width:min(460px,92vw);max-height:88vh;overflow-y:auto;padding:26px 24px;}
  .recap-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .recap-title{font-size:24px;font-weight:800;margin:4px 0 2px;}
  .recap-sub{font-size:12.5px;color:var(--muted);}
  .recap-hero{margin:18px 0 14px;padding:18px;border-radius:14px;text-align:center;border:1px solid color-mix(in srgb, var(--accent) 30%, var(--border));background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--accent2) 14%, transparent));}
  .recap-hero .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .recap-hero .big{font-size:34px;font-weight:800;margin-top:4px;}
  .recap-hero .big.pos{color:var(--green);}
  .recap-hero .big.neg{color:var(--red);}
  .recap-hero .note{font-size:12px;color:var(--muted);margin-top:4px;}
  .recap-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px;}
  .recap-tile{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;}
  .recap-tile .k{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .recap-tile .v{font-size:15px;font-weight:700;margin-top:3px;}
  .recap-rows{display:flex;flex-direction:column;gap:8px;}
  .recap-row{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;}
  .recap-row .rl{flex:1;min-width:0;}
  .recap-row .rt{font-size:11px;color:var(--muted);}
  .recap-row .rv{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .recap-row .ramt{font-size:13.5px;font-weight:700;text-align:right;white-space:nowrap;}
  .recap-row .ramt small{display:block;font-size:11px;font-weight:600;color:var(--muted);}
  .recap-empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 0 6px;}
  @media (max-width:520px){.recap-btn-text{display:none;}.recap-tile{padding:10px 9px;}.recap-tile .v{font-size:13px;}}
  .toast-stack{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column-reverse;gap:10px;pointer-events:none;}
  .toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.35);max-width:320px;
    opacity:0;transform:translateY(10px) scale(.98);transition:opacity .25s ease,transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateY(0) scale(1);}
  .toast-icon{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .toast-icon.ok{background:var(--green);color:#06281a;}
  .toast-body{display:flex;flex-direction:column;min-width:0;}
  .toast-title{font-size:13px;font-weight:600;color:var(--text);}
  .toast-sub{font-size:11.5px;color:var(--muted);}
  .toast-close{margin-left:4px;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;background:none;border:none;padding:4px;}
  .toast-close:hover{color:var(--text);}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;width:340px;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .legend-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .cat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;flex-shrink:0;}
  .sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .sync-dot-ok{background:var(--green);}
  .sync-dot-error{background:var(--red);}
  .sync-dot-pending{background:var(--amber);}
  .cat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .cat-bar-label{width:150px;flex-shrink:0;font-size:13px;display:flex;align-items:center;}
  .cat-bar-track{flex:1;min-width:80px;background:var(--bg);border-radius:6px;height:16px;overflow:hidden;border:1px solid var(--border);}
  .cat-bar-fill{height:100%;border-radius:6px;transition:width .2s;}
  .cat-bar-amt{width:120px;flex-shrink:0;text-align:right;font-size:13px;font-weight:600;}
  .cat-bar-pct{color:var(--muted);font-weight:400;font-size:11.5px;}
  .seg-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .seg-btn{background:var(--panel2);border:none;color:var(--muted);padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;transition:transform .1s ease;}
  .seg-btn:active{transform:scale(.96);}
  .seg-btn.active{background:var(--accent);color:var(--on-accent);}
  @media (max-width:600px){
    .cat-bar-label{width:100%;}
    .cat-bar-amt{width:auto;margin-left:auto;}
  }
  .cat-breakdown-layout{display:flex;gap:30px;flex-wrap:wrap;align-items:center;}
  .cat-breakdown-donut{flex:0 0 auto;margin:0 auto;}
  .cat-breakdown-bars{flex:1 1 260px;min-width:220px;}
  .donut-wrap{position:relative;display:inline-block;}
  .donut-wrap svg path{animation:donutIn .5s ease backwards;}
  @keyframes donutIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
  .donut-wrap svg{transform-origin:center;}
  .donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:64%;}
  .donut-center-value{font-size:19px;font-weight:700;color:var(--text);}
  .donut-center-label{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .delta-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border);}
  .delta-row:last-child{border-bottom:none;}
  .delta-arrow{font-size:11px;flex-shrink:0;margin-top:3px;}
  .delta-up{color:var(--red);}
  .delta-down{color:var(--green);}
  .delta-icon{flex-shrink:0;}
  .delta-text{color:var(--text);line-height:1.45;}
  .heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .heatmap-dow{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.03em;padding-bottom:6px;}
  .heatmap-cell{position:relative;aspect-ratio:1;border-radius:7px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--text);cursor:default;}
  .heatmap-cell .bill-marker{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 1.5px var(--panel);}

<script>
/* =========================================================
   BUDGET TRACKER — single-file local app

   Each incoming / outgoing item, and the savings amount, carries
   a status: 'none' (pending) or 'done' (actually happened).
   - Current Balance (live) = Starting Balance + done incoming
     - done outgoing - (savings if done). It updates the moment
     you flip an item's dropdown to "Done".
   - Total Left Over (projected) = Starting Balance + ALL incoming
     - weekly budget - ALL outgoing - savings, regardless of status.
     This is what carries forward as next month's Starting Balance.
   ========================================================= */
const DATA_KEY_BASE = 'budgetTracker.v5';
const PROFILES_META_KEY = 'budgetTracker.profiles';
function dataKeyFor(profileId){ return `${DATA_KEY_BASE}:${profileId}`; }

const OUTGOING_CATEGORIES = [
  'Uncategorized','Housing','Bills & Utilities','Groceries','Transport',
  'Subscriptions','Shopping','Pay in 3','Eating Out','Health & Fitness','Grooming','Entertainment',
  'Savings & Debt','Other'
];
const CATEGORY_COLORS = {
  'Uncategorized':'#8a93ab','Housing':'#5b8cff','Bills & Utilities':'#7c5bff',
  'Groceries':'#3ecf8e','Transport':'#36c5f0','Subscriptions':'#ffb946',
  'Shopping':'#ff5c7a','Pay in 3':'#2ec4b6','Eating Out':'#f2994a','Health & Fitness':'#00b894',
  'Grooming':'#d4a373','Entertainment':'#bb6bd9','Savings & Debt':'#e84393','Other':'#636e72'
};
const CATEGORY_ICONS = {
  'Uncategorized':'❔','Housing':'🏠','Bills & Utilities':'🧾','Groceries':'🛒','Transport':'🚗',
  'Subscriptions':'🔁','Shopping':'🛍️','Pay in 3':'📦','Eating Out':'🍽️','Health & Fitness':'💪',
  'Grooming':'💇','Entertainment':'🎬','Savings & Debt':'💰','Other':'📁'
};
function categoryColor(cat){ return CATEGORY_COLORS[cat] || CATEGORY_COLORS['Other']; }
function categoryIcon(cat){ return CATEGORY_ICONS[cat] || CATEGORY_ICONS['Other']; }

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabelFromKey(k){
  const [y,m] = k.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-GB',{month:'long',year:'numeric'});
}
function shiftKey(k, delta){
  let [y,m] = k.split('-').map(Number);
  m += delta;
  while(m>12){m-=12;y++;}
  while(m<1){m+=12;y--;}
  return y+'-'+String(m).padStart(2,'0');
}

function blankMonth(startingBalance){
  return {
    startingBalance: round2(startingBalance||0),
    weekly: {
      week1:{amount:0, status:'none', recurring:false}, week2:{amount:0, status:'none', recurring:false},
      week3:{amount:0, status:'none', recurring:false}, week4:{amount:0, status:'none', recurring:false}
    },
    incoming: [],
    savings: {amount:0, status:'none'},
    stocks: {amount:0, status:'none'},
    outgoings: [],
    adjustment: 0
  };
}
function freshMonth(startingBalance){
  const m = blankMonth(startingBalance);
  m.incoming.push({id:uid(), name:'Pay', amount:0, status:'none', recurring:false});
  return m;
}
function carryForwardMonth(prevMonth, startingBalance){
  const m = blankMonth(startingBalance);
  m.incoming = prevMonth.incoming.filter(i=>i.recurring).map(i=>({id:uid(), name:i.name, amount:i.amount, status:'none', recurring:true, day:i.day||null, lastWeekday: i.lastWeekday!=null?i.lastWeekday:null}));
  m.outgoings = prevMonth.outgoings.filter(o=>o.recurring).map(o=>({id:uid(), name:o.name, amount:o.amount, status:'none', recurring:true, category:o.category||'Uncategorized', day:o.day||null, lastWeekday: o.lastWeekday!=null?o.lastWeekday:null}));
  ['week1','week2','week3','week4'].forEach(wk=>{
    if(prevMonth.weekly[wk].recurring){
      m.weekly[wk] = {amount: prevMonth.weekly[wk].amount, status:'none', recurring:true};
    }
  });
  return m;
}
// Backfills recurring items/weeks from sourceMonth into an ALREADY-EXISTING targetMonth
// (e.g. it was created before an item was switched to Recurring). Never overwrites
// anything already present in targetMonth — only adds what's missing.
function syncRecurringForward(sourceMonth, targetMonth){
  const normName = s => (s||'').trim().toLowerCase();
  ['week1','week2','week3','week4'].forEach(wk=>{
    if(sourceMonth.weekly[wk].recurring && !targetMonth.weekly[wk].recurring){
      targetMonth.weekly[wk] = {amount: sourceMonth.weekly[wk].amount, status:'none', recurring:true};
    }
  });
  const targetIncomingNames = new Set(targetMonth.incoming.map(i=>normName(i.name)));
  sourceMonth.incoming.filter(i=>i.recurring).forEach(i=>{
    if(!targetIncomingNames.has(normName(i.name))){
      targetMonth.incoming.push({id:uid(), name:i.name, amount:i.amount, status:'none', recurring:true, day:i.day||null, lastWeekday: i.lastWeekday!=null?i.lastWeekday:null});
    }
  });
  const targetOutgoingNames = new Set(targetMonth.outgoings.map(o=>normName(o.name)));
  sourceMonth.outgoings.filter(o=>o.recurring).forEach(o=>{
    if(!targetOutgoingNames.has(normName(o.name))){
      targetMonth.outgoings.push({id:uid(), name:o.name, amount:o.amount, status:'none', recurring:true, category:o.category||'Uncategorized', day:o.day||null, lastWeekday: o.lastWeekday!=null?o.lastWeekday:null});
    }
  });
}
// When a recurring item's category, day-of-month, or schedule is changed, keep
// every future month's copy of that same recurring item (matched by name) in
// sync — these are classification/scheduling, not something that should drift
// month to month like an amount. listKey is 'outgoings' or 'incoming'.
function propagateOutgoingFieldForward(item, fromMonthKey, field, listKey){
  if(!item.recurring) return;
  const normName = s => (s||'').trim().toLowerCase();
  const name = normName(item.name);
  Object.keys(state.months).filter(k=>k>fromMonthKey).forEach(k=>{
    state.months[k][listKey||'outgoings'].forEach(o=>{
      if(o.recurring && normName(o.name)===name) o[field] = item[field];
    });
  });
}
function propagateScheduleForward(item, fromMonthKey, listKey){
  if(!item.recurring) return;
  const normName = s => (s||'').trim().toLowerCase();
  const name = normName(item.name);
  Object.keys(state.months).filter(k=>k>fromMonthKey).forEach(k=>{
    state.months[k][listKey].forEach(o=>{
      if(o.recurring && normName(o.name)===name){ o.day = item.day; o.lastWeekday = item.lastWeekday; }
    });
  });
}
// When an item is newly marked Recurring (just added that way, or switched from
// One-off), drop a copy into every month that ALREADY exists after this one —
// not just the next month created by "New Month". Each propagated copy is
// tagged with syncSourceId so later edits to the item's name/amount (e.g. while
// still filling it in on the Recurring tab) update that same copy instead of
// leaving a stale placeholder and creating a duplicate under the new name.
function syncNewRecurringForward(item, fromMonthKey, listKey){
  if(!item.recurring) return;
  const normName = s => (s||'').trim().toLowerCase();
  const name = normName(item.name);
  Object.keys(state.months).filter(k=>k>fromMonthKey).forEach(k=>{
    const list = state.months[k][listKey];
    let copy = list.find(x=>x.syncSourceId===item.id);
    if(!copy) copy = list.find(x=>x.recurring && !x.syncSourceId && normName(x.name)===name);
    if(copy){
      copy.syncSourceId = item.id;
      copy.name = item.name;
      copy.amount = item.amount;
      copy.day = item.day||null;
      copy.lastWeekday = item.lastWeekday!=null?item.lastWeekday:null;
      if(listKey==='outgoings') copy.category = item.category||'Uncategorized';
    } else if(listKey==='incoming'){
      list.push({id:uid(), name:item.name, amount:item.amount, status:'none', recurring:true, syncSourceId:item.id, day:item.day||null, lastWeekday: item.lastWeekday!=null?item.lastWeekday:null});
    } else {
      list.push({id:uid(), name:item.name, amount:item.amount, status:'none', recurring:true, syncSourceId:item.id, category:item.category||'Uncategorized', day:item.day||null, lastWeekday: item.lastWeekday!=null?item.lastWeekday:null});
    }
  });
}
function syncNewRecurringWeeklyForward(fromMonthKey, wk, amount){
  Object.keys(state.months).filter(k=>k>fromMonthKey).forEach(k=>{
    const w = state.months[k].weekly[wk];
    if(!w.recurring) state.months[k].weekly[wk] = {amount, status:'none', recurring:true};
  });
}
function defaultState(){
  const now = new Date();
  const key = monthKey(now);

// Keeps every month's Starting Balance in sync with the month before it, so any

function cascadeForward(){

    const cur = state.months[keys[i]], next = state.months[keys[i+1]];
    const newStart = round2(monthTotals(cur).totalLeftOver);
    if(next.startingBalance !== newStart) next.startingBalance = newStart;

}

  const weekKeys = ['week1','week2','week3','week4'];
  const weeklyTotal = weekKeys.reduce((s,k)=>s+(Number(m.weekly[k].amount)||0),0);
  const doneWeekly = weekKeys.reduce((s,k)=>s+(m.weekly[k].status==='done' ? (Number(m.weekly[k].amount)||0) : 0),0);

  const span = max-min;
  const pts = values.map((v,i)=>({
    x: i/(values.length-1)*100,
    y: span<0.005 ? 12 : 21 - ((v-min)/span)*18

  const line = pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');

  });
  let manual = 0;

// Tweens a display-only figure's text from whatever it currently reads to
// the new value, instead of just snapping to it. Tracks the target on the
// element itself so an animation already in flight yields to a newer call.
function animateNumberText(el, toValue, duration=450){
  const toKey = String(toValue);
  if(el.dataset.animValue===undefined){
    // First paint of this element (e.g. just switched months) — show the
    // real value immediately rather than counting up from zero.
    el.dataset.animValue = toKey;
    el.textContent = fmt(toValue);
    return;
  }
  const fromValue = parseFloat(el.dataset.animValue);
  el.dataset.animValue = toKey;
  if(Math.abs(fromValue-toValue) < 0.005){ el.textContent = fmt(toValue); return; }
  const start = performance.now();
  const easeOutCubic = t => 1 - Math.pow(1-t, 3);
  function tick(now){
    if(el.dataset.animValue !== toKey) return;
    const t = Math.min(1, (now-start)/duration);
    el.textContent = fmt(fromValue + (toValue-fromValue)*easeOutCubic(t));
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.onload = resolve;
    script.onerror = ()=>{ tesseractLoadPromise = null; reject(new Error('Failed to load Tesseract.js')); };
    document.head.appendChild(script);

// Phone photos straight into Tesseract read as gibberish: they're huge, shadowed
// and unevenly lit. This decodes with EXIF rotation applied, resizes so text is
// a readable size, then returns two versions: contrast-stretched greyscale,
// and the same with uneven lighting/shadows flattened out.
async function loadImageForOcr(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){}
  }
  return await new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function preprocessReceiptImage(file){
  const img = await loadImageForOcr(file);
  const longest = Math.max(img.width, img.height);
  let scale = 1;
  if(longest > 2000) scale = 2000/longest;
  else if(longest < 1400) scale = Math.min(2, 1400/longest);
  const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h);
  const d = data.data;
  const n = w*h;
  const gray = new Uint8ClampedArray(n);
  const hist = new Uint32Array(256);
  for(let i=0, j=0; j<n; i+=4, j++){
    const g = Math.round(d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);
    gray[j] = g; hist[g]++;
  }
  // Stretch contrast between the 2nd and 98th percentile so faded thermal
  // paper and dim lighting use the full tonal range.
  let lo = 0, hi = 255, acc = 0;
  for(let v=0; v<256; v++){ acc += hist[v]; if(acc >= n*0.02){ lo = v; break; } }
  acc = 0;
  for(let v=255; v>=0; v--){ acc += hist[v]; if(acc >= n*0.02){ hi = v; break; } }
  if(hi-lo < 20){ lo = 0; hi = 255; }
  const range = hi-lo;
  for(let j=0; j<n; j++) gray[j] = Math.max(0, Math.min(255, (gray[j]-lo)*255/range));
  const toCanvas = pixels=>{
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    const octx = out.getContext('2d');
    const od = octx.createImageData(w, h);
    for(let i=0, j=0; j<n; i+=4, j++){ od.data[i]=od.data[i+1]=od.data[i+2]=pixels[j]; od.data[i+3]=255; }
    octx.putImageData(od, 0, 0);
    return out;
  };
  // Flatten uneven lighting: divide each pixel by a heavily blurred copy of the
  // image (integral image keeps that fast) so a shadow across the receipt stops
  // looking like a change in ink. The floor stops dark backgrounds, where grain
  // dominates, from being amplified into noise. Output stays smooth greyscale —
  // Tesseract does its own binarising better than a hard cut here.
  const stride = w+1;
  const integral = new Uint32Array(stride*(h+1));
  for(let y=0; y<h; y++){
    let rowSum = 0;
    for(let x=0; x<w; x++){
      rowSum += gray[y*w+x];
      integral[(y+1)*stride + x+1] = integral[y*stride + x+1] + rowSum;
    }
  }
  const r = Math.max(30, Math.round(Math.min(w, h)/10));
  const flat = new Uint8ClampedArray(n);
  for(let y=0; y<h; y++){
    const y0 = Math.max(0, y-r), y1 = Math.min(h-1, y+r);
    for(let x=0; x<w; x++){
      const x0 = Math.max(0, x-r), x1 = Math.min(w-1, x+r);
      const area = (x1-x0+1)*(y1-y0+1);
      const mean = (integral[(y1+1)*stride + x1+1] - integral[y0*stride + x1+1] - integral[(y1+1)*stride + x0] + integral[y0*stride + x0]) / area;
      flat[y*w+x] = gray[y*w+x] * 215 / Math.max(mean, 90);
    }
  }
  return {flat: toCanvas(flat), greyscale: toCanvas(gray)};
}
function rotateCanvas(src, deg){
  if(deg===0) return src;
  const out = document.createElement('canvas');
  const swap = deg===90 || deg===270;
  out.width = swap ? src.height : src.width;
  out.height = swap ? src.width : src.height;
  const ctx = out.getContext('2d');
  ctx.translate(out.width/2, out.height/2);
  ctx.rotate(deg*Math.PI/180);
  ctx.drawImage(src, -src.width/2, -src.height/2);
  return out;
}
// Runs OCR on the cleaned-up photo. Tries it upright first; if Tesseract isn't
// confident (a sideways or upside-down receipt reads as noise), tries the other
// orientations, then plain greyscale, and keeps the most confident read.
// onStage(label) reports which attempt is running.
async function ocrReceipt(file, onProgress, onStage){
  const variants = await preprocessReceiptImage(file);
  const worker = await Tesseract.createWorker('eng', 1, {
    logger: info=>{ if(info.status==='recognizing text') onProgress(info.progress); }
  });
  try{
    await worker.setParameters({tessedit_pageseg_mode:'6', preserve_interword_spaces:'1', user_defined_dpi:'300'});
    let best = null;
    const attempt = async (canvas, deg)=>{
      const { data } = await worker.recognize(rotateCanvas(canvas, deg));
      if(!best || data.confidence > best.confidence) best = {text:data.text, confidence:data.confidence, deg};
      return best.confidence >= 65;
    };
    if(await attempt(variants.flat, 0)) return best;
    for(const deg of [90, 270, 180]){
      if(onStage) onStage('Trying another angle…');
      if(await attempt(variants.flat, deg)) return best;
    }
    if(onStage) onStage('Trying another filter…');
    await attempt(variants.greyscale, best.deg);
    return best;
  } finally {
    await worker.terminate();
  }
}
// Keyword → category guesses from common UK merchant names on a receipt.
const RECEIPT_CATEGORY_KEYWORDS = [
  [['tesco','sainsbury','asda','morrisons','lidl','aldi','co-op','coop','waitrose','iceland'], 'Groceries'],
  [['shell','bp ','esso','texaco','gulf','applegreen','petrol'], 'Transport'],
  [['costa','starbucks','greggs','mcdonald','kfc','burger king','nando','pret','subway','deliveroo','just eat','uber eats','domino','pizza'], 'Eating Out'],
  [['boots','superdrug','pharmacy'], 'Health & Fitness'],
  [['primark','h&m','zara','next retail','asos','jd sports'], 'Shopping'],
];
function guessMerchantFromText(lowerText){
  for(const [keywords] of RECEIPT_CATEGORY_KEYWORDS){
    const hit = keywords.find(k=>lowerText.includes(k));
    if(hit) return hit.trim().replace(/\b\w/g, c=>c.toUpperCase());
  }
  return '';
}
function guessCategoryFromText(lowerText){
  for(const [keywords, cat] of RECEIPT_CATEGORY_KEYWORDS){
    if(keywords.some(k=>lowerText.includes(k))) return cat;
  }
  return null;
}
// Pulls a best-guess total and merchant name out of raw OCR text. Heuristic,
// not exact — the caller always leaves the result editable before saving.
function parseReceiptText(rawText, confidence=100){
  // OCR often reads the decimal point as a comma or space ("12,34", "12 34").
  const raw = rawText.replace(/(\d)[,\s](\d{2})(?!\d)/g, (m, a, b)=> m.includes(' ') && /\d{3}\s\d{2}/.test(m) ? m : `${a}.${b}`);
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const lowerText = raw.toLowerCase();
  const totalLineRe = /\b(total|amount due|balance due|to pay|grand total)\b/i;
  let amount = null;
  for(const line of lines){
    if(totalLineRe.test(line)){
      const m = line.match(/(\d{1,4}\.\d{2})/);
      if(m){ amount = parseFloat(m[1]); break; }
    }
  }
  if(amount==null){
    const moneyRe = /(\d{1,4}\.\d{2})\b/g;
    let max = null, m;
    while((m = moneyRe.exec(raw))){
      const v = parseFloat(m[1]);
      if(!isNaN(v) && (max===null || v>max)) max = v;
    }
    amount = max;
  }
  // Prefer a recognised merchant name; otherwise the first early line that
  // looks like real words (mostly letters) rather than OCR noise.
  let reason = guessMerchantFromText(lowerText);
  // A guessed line is only trusted when the read was confident; low-confidence
  // text often looks plausible but is noise.
  if(!reason && confidence>=70){
    for(const line of lines.slice(0,8)){
      const clean = line.replace(/[^a-zA-Z0-9&' .-]/g,'').trim();
      const letters = (clean.match(/[a-zA-Z]/g)||[]).length;
      if(letters>=4 && letters/clean.length>=0.7 && /[aeiouAEIOU]/.test(clean)){ reason = clean; break; }
    }
  }
  return {amount, reason, category: guessCategoryFromText(lowerText)};
}

// Wires up one categoryDropdownHtml() element's open/close and selection
// behavior. onChange(newValue) fires after the dropdown's own display has
// already been updated, mirroring a <select>.onchange handler.
function initCategoryDropdown(dd, onChange){
  if(!dd) return;
  const trigger = dd.querySelector('.cat-dd-trigger');
  const menu = dd.querySelector('.cat-dd-menu');
  const close = ()=>dd.classList.remove('open');
  trigger.onclick = e=>{
    e.stopPropagation();
    const willOpen = !dd.classList.contains('open');
    document.querySelectorAll('.cat-dd.open').forEach(o=>o.classList.remove('open'));
    if(willOpen) dd.classList.add('open');
  };
  dd.querySelectorAll('.cat-dd-opt').forEach(opt=>{
    opt.onclick = e=>{
      e.stopPropagation();
      const val = opt.dataset.value;
      dd.dataset.value = val;
      trigger.style.borderLeftColor = categoryColor(val);
      trigger.querySelector('.cat-dd-chip').style.background = categoryColor(val);
      trigger.querySelector('.cat-dd-chip').textContent = categoryIcon(val);
      trigger.querySelector('.cat-dd-label').textContent = val;
      menu.querySelectorAll('.cat-dd-opt').forEach(o=>o.classList.toggle('selected', o===opt));
      close();
      onChange(val);
    };
  });
  dd.onkeydown = e=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); trigger.click(); }
    else if(e.key==='Escape'){ close(); }
  };

// Recurring schedule for an incoming/outgoing item: either a fixed day-of-month
// (item.day) or a "last <weekday> of the month" rule (item.lastWeekday, 0=Sun..
// 6=Sat) — used for things like a payday that lands on the last Friday.
const WEEKDAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function scheduleSelectHtml(cls, item){

  return `<select class="${cls}">

    </optgroup>

function applyScheduleValue(item, v){
  if(v && v.startsWith('w:')){ item.lastWeekday = Number(v.slice(2)); item.day = null; }
  else if(v && v.startsWith('d:')){ item.day = Number(v.slice(2)); item.lastWeekday = null; }
  else { item.day = null; item.lastWeekday = null; }
}
// Resolves an item's schedule to an actual day-of-month (1-31) for a specific
// calendar month, or null if it has none. month is 1-12.
function resolveScheduledDay(item, year, month){
  const daysInMonth = new Date(year, month, 0).getDate();
  if(item.lastWeekday!=null && item.lastWeekday!==undefined){
    for(let d=daysInMonth; d>=1; d--){
      if(new Date(year, month-1, d).getDay()===item.lastWeekday) return d;
    }
    return null;
  }
  if(item.day) return Math.min(item.day, daysInMonth);
  return null;
}
function scheduleHint(item, year, month){
  const day = resolveScheduledDay(item, year, month);
  if(!day) return '';
  const d = new Date(year, month-1, day);
  return `Next: ${d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'})}`;
}

// ---------- tiny SVG line chart (no external deps) ----------
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
let chartTooltipEl = null;
function ensureChartTooltip(){
  if(chartTooltipEl) return chartTooltipEl;
  chartTooltipEl = document.createElement('div');
  chartTooltipEl.style.cssText = 'position:fixed;pointer-events:none;z-index:200;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow);display:none;white-space:nowrap;';

function showChartTooltip(evt, text){

  t.textContent = text;

  const pad = 12;
  let left = evt.clientX + pad, top = evt.clientY - 14;
  const maxLeft = window.innerWidth - t.offsetWidth - pad;
  if(left > maxLeft) left = evt.clientX - t.offsetWidth - pad;

}
function hideChartTooltip(){

}
function lineChart(container, data, opts={}){
  // Accepts either a flat array of {x,y,label} (single series, default color)
  // or an array of series: {color, name, dashed, points:[{x,y,label}]}
  const isMulti = Array.isArray(data) && data.length>0 && data[0].points !== undefined;
  const series = isMulti ? data : [{color:cssVar('--accent','#5b8cff'), points:data}];
  const w = opts.width||container.clientWidth||600, h = opts.height||240;
  const padL=54,padR=16,padT=16,padB=28;
  const allVals = series.flatMap(s=>s.points.map(p=>p.y));
  const maxV = Math.max(...allVals, 0), minV = Math.min(...allVals, 0);
  const rawRange = maxV - minV;
  const range = rawRange || 1;
  const n = series[0].points.length;
  const svg = svgEl('svg',{viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, style:'display:block'});
  const gridColor = getComputedStyle(document.body).getPropertyValue('--border').trim() || '#2a3552';
  const mutedColor = getComputedStyle(document.body).getPropertyValue('--muted').trim() || '#8a93ab';
  for(let i=0;i<=3;i++){
    const y = padT + (h-padT-padB)*i/3;
    svg.appendChild(svgEl('line',{x1:padL,y1:y,x2:w-padR,y2:y,stroke:gridColor,'stroke-width':1}));
    const val = rawRange===0 ? maxV : maxV - (range*i/3);
    const t = svgEl('text',{x:6,y:y+4,'font-size':10,fill:mutedColor}); t.textContent = state.currency+Math.round(val).toLocaleString();
    svg.appendChild(t);
  }
  const xStep = n>1 ? (w-padL-padR)/(n-1) : 0;
  const yFor = v => padT + (h-padT-padB)*(1-((v-minV)/range));

  series.forEach(s=>{
    let d='';
    s.points.forEach((p,i)=>{
      const x = padL + xStep*i;
      const y = yFor(p.y);
      d += (i===0?'M':'L')+x+','+y+' ';
    });
    const pathAttrs = {d, fill:'none', stroke:s.color||cssVar('--accent','#5b8cff'), 'stroke-width':2.4, 'stroke-linejoin':'round','stroke-linecap':'round'};
    if(s.dashed) pathAttrs['stroke-dasharray'] = '6,4';
    const pathEl = svgEl('path', pathAttrs);
    svg.appendChild(pathEl);
    // Draw the line in on render rather than having it just appear. Dashed
    // (projected) lines fade in instead, since the dash pattern is already
    // using stroke-dasharray for its own purpose.
    if(s.dashed){
      pathEl.style.opacity = '0';
      pathEl.style.transition = 'opacity .6s ease .15s';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ pathEl.style.opacity = '1'; }));
    } else {
      const len = pathEl.getTotalLength ? pathEl.getTotalLength() : 0;
      if(len){
        pathEl.style.strokeDasharray = len;
        pathEl.style.strokeDashoffset = len;
        pathEl.style.transition = 'stroke-dashoffset .8s ease';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ pathEl.style.strokeDashoffset = '0'; }));
      }
    }
    s.points.forEach((p,i)=>{
      const x = padL + xStep*i;
      const y = yFor(p.y);
      const label = p.label || p.x;
      const tipText = s.name ? `${label} — ${s.name}: ${fmt(p.y)}` : `${label}: ${fmt(p.y)}`;
      const dot = svgEl('circle',{cx:x,cy:y,r:3,fill:s.color||cssVar('--accent','#5b8cff'),style:'pointer-events:none;'});
      const onHover = evt => { showChartTooltip(evt, tipText); dot.setAttribute('r',5); };
      const onLeave = () => { hideChartTooltip(); dot.setAttribute('r',3); };
      const hit = svgEl('circle',{cx:x,cy:y,r:10,fill:'transparent',style:'cursor:pointer;'});
      hit.addEventListener('mouseenter', onHover);
      hit.addEventListener('mousemove', onHover);
      hit.addEventListener('mouseleave', onLeave);
      svg.appendChild(hit);
      svg.appendChild(dot);
    });
  });

  const maxLabels = Math.min(n, Math.floor(w/80));
  const step = Math.max(1, Math.round(n/maxLabels));
  series[0].points.forEach((p,i)=>{
    if(i%step!==0 && i!==n-1) return;
    const x = padL + xStep*i;
    // First/last labels anchor inward so they can't spill past the chart's own edge.
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    const t = svgEl('text',{x, y:h-8, 'font-size':10, fill:mutedColor, 'text-anchor':anchor});
    t.textContent = p.x;
    svg.appendChild(t);
  });
  container.innerHTML='';
  container.appendChild(svg);
}

function donutSlicePath(cx,cy,outerR,innerR,startA,endA){
  const toRad = d=>d*Math.PI/180;
  const pt=(r,a)=>[cx+r*Math.cos(toRad(a)), cy+r*Math.sin(toRad(a))];
  const [x1,y1]=pt(outerR,startA), [x2,y2]=pt(outerR,endA);
  const [x3,y3]=pt(innerR,endA), [x4,y4]=pt(innerR,startA);
  const largeArc = (endA-startA) > 180 ? 1 : 0;
  return `M ${x1} ${y1} A ${outerR} ${outerR} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerR} ${innerR} 0 ${largeArc} 0 ${x4} ${y4} Z`;
}

  const wrap = document.createElement('div');
  wrap.className = 'donut-wrap';
  wrap.style.width = size+'px';
  wrap.style.height = size+'px';

  const svg = svgEl('svg', {viewBox:`0 0 ${size} ${size}`, width:size, height:size, style:'display:block;overflow:visible;'});
  svg.appendChild(svgEl('circle',{cx,cy,r:(outerR+innerR)/2, fill:'none', stroke:borderColor,'stroke-width':outerR-innerR}));

  const center = document.createElement('div');
  center.className = 'donut-center';
  const centerValue = document.createElement('div'); centerValue.className='donut-center-value';
  const centerLabel = document.createElement('div'); centerLabel.className='donut-center-label';
  center.appendChild(centerValue); center.appendChild(centerLabel);
  const setCenter = (value,label)=>{ centerValue.textContent=value; centerLabel.textContent=label; };
  setCenter(fmt(total), total ? 'Total' : 'No spending');

  if(total>0){
    let angle = -90, idx = 0;
    const allPaths = [];
    rows.forEach(r=>{
      const frac = r.amount/total;
      const sweep = frac*360;
      const color = categoryColor(r.category);
      const pct = Math.round(frac*100);
      const tipText = `${categoryIcon(r.category)} ${r.category}: ${fmt(r.amount)} (${pct}%)`;
      const segs = sweep >= 359.99 ? [[angle,angle+180],[angle+180,angle+360]] : [[angle, angle+sweep]];
      segs.forEach(([a0,a1])=>{
        const d = donutSlicePath(cx,cy,outerR,innerR,a0,a1);
        const path = svgEl('path', {d, fill:color, stroke:panelColor, 'stroke-width':2});
        path.style.cursor = 'pointer';
        path.style.transition = 'opacity .15s, filter .15s';
        path.style.animationDelay = (idx*0.05)+'s';
        allPaths.push(path);
        path.addEventListener('mouseenter', evt=>{
          path.style.filter = 'brightness(1.15)';
          allPaths.forEach(p=>{ if(p!==path) p.style.opacity='0.4'; });
          setCenter(fmt(r.amount), `${categoryIcon(r.category)} ${r.category} · ${pct}%`);
          showChartTooltip(evt, tipText);
        });
        path.addEventListener('mousemove', evt=>showChartTooltip(evt, tipText));
        path.addEventListener('mouseleave', ()=>{
          path.style.filter='';
          allPaths.forEach(p=>p.style.opacity='1');
          setCenter(fmt(total), 'Total');
          hideChartTooltip();
        });
        svg.appendChild(path);
      });
      angle += sweep;
      idx++;
    });
  }

  wrap.appendChild(svg);
  wrap.appendChild(center);
  container.appendChild(wrap);
}

function renderSyncIndicator(){
  const p = activeProfileMeta();
  const el = document.getElementById('syncStatusLine');
  if(el){
    if(!p || !p.syncEnabled){
      el.innerHTML = 'Data is saved locally in this browser only.';
    } else {
      const s = getSyncStatus(p.id);
      if(!s) el.innerHTML = '<span class="sync-dot sync-dot-pending"></span>Cloud sync on · not yet synced';
      else if(s.status==='error') el.innerHTML = `<span class="sync-dot sync-dot-error"></span>Sync error${s.lastSuccessAt ? ' · last synced '+formatRelativeTime(s.lastSuccessAt) : ''}`;
      else el.innerHTML = `<span class="sync-dot sync-dot-ok"></span>Synced ${formatRelativeTime(s.lastSuccessAt||s.at)}`;
    }
  }
  const detailEl = document.getElementById('syncDetailStatus');
  if(detailEl && p && p.syncEnabled){
    const s = getSyncStatus(p.id);
    if(!s){
      detailEl.textContent = 'Not yet synced from this device.';
    } else {
      const exact = new Date(s.lastSuccessAt||s.at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
      detailEl.textContent = s.status==='error'
        ? `Sync error on last attempt.${s.lastSuccessAt ? ' Last successful sync: '+exact : ' No successful sync yet.'}`
        : `Last synced: ${exact}`;
    }
  }
}

// Walks forward day by day from today (real calendar date, independent of
// whichever month is being viewed) looking for pending outgoings with a Day
// set. Only looks at months that already exist — it never creates one just
// to peek ahead.
function upcomingBills(daysAhead){
  const today = new Date();
  today.setHours(0,0,0,0);
  const results = [];
  for(let i=0; i<=daysAhead; i++){
    const d = new Date(today);
    d.setDate(d.getDate()+i);
    const mk = monthKey(d);
    const m = state.months[mk];
    if(!m) continue;
    const [yy, mo] = mk.split('-').map(Number);
    m.outgoings.forEach(o=>{
      if(o.status==='done') return;
      if(resolveScheduledDay(o, yy, mo) === d.getDate()){
        results.push({type:'out', name:o.name, amount:o.amount, category:o.category, daysAway:i, dueDate:new Date(d)});
      }
    });
    m.incoming.forEach(inc=>{
      if(inc.status==='done') return;
      if(resolveScheduledDay(inc, yy, mo) === d.getDate()){
        results.push({type:'in', name:inc.name, amount:inc.amount, daysAway:i, dueDate:new Date(d)});
      }
    });
  }
  results.sort((a,b)=>a.daysAway-b.daysAway);
  return results;
}
function renderUpcomingBills(){
  const el = document.getElementById('upcomingBillsList');
  if(!el) return;
  document.querySelectorAll('#upcomingBillsToggle .seg-btn').forEach(b=>{
    b.classList.toggle('active', Number(b.dataset.days)===upcomingBillsWindow);
    b.onclick = ()=>{ upcomingBillsWindow = Number(b.dataset.days); renderUpcomingBills(); };
  });
  const bills = upcomingBills(upcomingBillsWindow);
  if(!bills.length){
    el.innerHTML = `<div class="empty">Nothing due or arriving in the next ${upcomingBillsWindow} days.</div>`;
    return;
  }
  el.innerHTML = bills.map(b=>{
    const isIn = b.type==='in';
    const verb = isIn ? 'Arriving' : 'Due';
    const dueText = b.daysAway===0 ? `${verb} today` : b.daysAway===1 ? `${verb} tomorrow` : `${verb} in ${b.daysAway} days`;
    const dateText = b.dueDate.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
    const icon = isIn ? '💰' : categoryIcon(b.category);
    return `
      <div class="bill-row">
        <div class="bill-icon">${icon}</div>
        <div class="bill-info">
          <div class="bill-name">${escapeHtml(b.name)}</div>
          <div class="bill-due${b.daysAway<=1?' due-soon':''}">${dueText} · ${dateText}</div>
        </div>
        <div class="bill-amount" style="${isIn?'color:var(--green);':''}">${isIn?'+':''}${fmt(b.amount)}</div>
      </div>
    `;
  }).join('');
}

// ---------------- Calendar ----------------
// Days (1-31, clamped to the month's real length) that have a pending
// (not yet Done) outgoing with a Day set — name:[] map. Shared by the
// Calendar tab's bill-dot strip and the Trend heatmap's bill markers.
function billDaysForMonth(monthKey){
  const m = state.months[monthKey];
  const map = {};
  if(!m) return map;
  const [y, mo] = monthKey.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(o.status==='done') return;
    const day = resolveScheduledDay(o, y, mo);
    if(!day) return;
    (map[day] = map[day]||[]).push(o.name);
  });
  return map;
}
// Same idea as billDaysForMonth but for pending incoming (pay) — used to mark
// payday on the Calendar tab and the Trend heatmap.
function payDaysForMonth(monthKey){
  const m = state.months[monthKey];
  const map = {};
  if(!m) return map;
  const [y, mo] = monthKey.split('-').map(Number);
  m.incoming.forEach(inc=>{
    if(inc.status==='done') return;
    const day = resolveScheduledDay(inc, y, mo);
    if(!day) return;
    (map[day] = map[day]||[]).push(inc.name);
  });
  return map;
}

// Deletes a tracked month entirely. If it was the currently viewed month,
// moves to the nearest remaining month (or starts a fresh one if none are
// left) so the app is never left pointing at a month that no longer exists.
function deleteMonth(key){
  delete state.months[key];
  const remaining = Object.keys(state.months).sort();
  if(state.currentMonthKey === key){
    if(remaining.length){
      const before = remaining.filter(k=>k<key).pop();
      state.currentMonthKey = before || remaining[0];
    } else {
      const freshKey = monthKey(new Date());
      state.currentMonthKey = freshKey;
      state.months[freshKey] = freshMonth(0);
    }
  }
  save();
}

      {color:actualColor, name:'Actual', points: keys.map((k,i)=>({x:shortLabels[i], label:monthLabels[i], y:stocksSeries[i]}))},
      {color:projectedColor, name:'Projected', dashed:true, points: keys.map((k,i)=>({x:shortLabels[i], label:monthLabels[i], y:plannedStocksSeries[i]}))}
    ], {height:200});
  }
  renderCategoryBreakdown();

}
function renderCategoryBreakdown(){

  document.querySelectorAll('#catBreakdownModeToggle .seg-btn').forEach(b=>{

  }

    <div class="cat-bar-row">

      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${max?(r.amount/max*100).toFixed(1):0}%;background:${categoryColor(r.category)};"></div></div>

    </div>
  `).join('');
}
// Compares this month's category spend against the previous tracked month, one
// callout per category whose spend actually changed — biggest swings first.
function renderCategoryDeltas(monthKey, mode, elId){
  const el = document.getElementById(elId||'catBreakdownDeltas');
  if(!el) return;
  const keys = Object.keys(state.months).sort();
  const idx = keys.indexOf(monthKey);
  if(idx<=0){
    el.innerHTML = '<div class="hint" style="font-size:12px;">Track an earlier month too to see month-over-month comparisons.</div>';
    return;
  }
  const prevKey = keys[idx-1];
  const curMap = {}; categoryBreakdown(state.months[monthKey], mode).forEach(r=>curMap[r.category]=r.amount);
  const prevMap = {}; categoryBreakdown(state.months[prevKey], mode).forEach(r=>prevMap[r.category]=r.amount);
  const cats = new Set([...Object.keys(curMap), ...Object.keys(prevMap)]);
  const deltas = [];
  cats.forEach(category=>{
    const cur = curMap[category]||0, prev = prevMap[category]||0;
    const diff = round2(cur-prev);
    if(Math.abs(diff) < 0.01) return;
    deltas.push({category, cur, prev, diff});
  });
  if(!deltas.length){
    el.innerHTML = `<div class="hint" style="font-size:12px;">No change from ${monthLabelFromKey(prevKey)} in any category.</div>`;
    return;
  }
  deltas.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  el.innerHTML = `
    <div class="hint" style="font-size:12px;margin-bottom:6px;">Compared to ${monthLabelFromKey(prevKey)}</div>
    ${deltas.slice(0,6).map(d=>{
      const up = d.diff>0;
      let text;
      if(d.prev<=0){
        text = `New spending on <b>${escapeHtml(d.category)}</b>: ${fmt(d.cur)}`;
      } else if(d.cur<=0){
        text = `No more spending on <b>${escapeHtml(d.category)}</b> (was ${fmt(d.prev)})`;
      } else {
        const pct = Math.round(Math.abs(d.diff)/d.prev*100);
        text = `You spent <b>${pct}% ${up?'more':'less'}</b> on <b>${escapeHtml(d.category)}</b> than ${monthLabelFromKey(prevKey)} (${fmt(d.cur)} vs ${fmt(d.prev)})`;
      }
      return `<div class="delta-row">
        <span class="delta-arrow ${up?'delta-up':'delta-down'}">${up?'▲':'▼'}</span>
        <span class="delta-icon">${categoryIcon(d.category)}</span>
        <span class="delta-text">${text}</span>
      </div>`;
    }).join('')}
  `;
}
// Daily spend heatmap data: Quick Add entries carry a real timestamp, so those
// are placed on their exact day; any other outgoing with an optional "Day" set
// (e.g. Rent on the 1st) is placed on that day of the displayed month, clamped
// to the month's actual length. In 'done' mode, dated non-Quick-Add outgoings
// only count once marked Done — Quick Add entries are always Done already.
function dailySpendSeries(monthKey, mode){
  const m = state.months[monthKey];
  const days = {};
  if(!m) return days;
  const [y, mo] = monthKey.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(o.quickAdd && o.ts){
      const d = new Date(o.ts);
      if(d.getFullYear()!==y || (d.getMonth()+1)!==mo) return;
      const day = d.getDate();
      days[day] = round2((days[day]||0) + (Number(o.amount)||0));
      return;
    }
    if(mode==='done' && o.status!=='done') return;
    const day = resolveScheduledDay(o, y, mo);
    if(day) days[day] = round2((days[day]||0) + (Number(o.amount)||0));
  });
  return days;
}
function hexToRgbTriplet(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? `${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}` : '91,140,255';
}
function renderSpendingHeatmap(){
  const el = document.getElementById('spendHeatmap');
  if(!el) return;
  const monthKey = categoryBreakdownMonth;
  if(!monthKey){ el.innerHTML = '<div class="empty">No months tracked yet.</div>'; return; }
  const [y, mo] = monthKey.split('-').map(Number);
  const daysInMonth = new Date(y, mo, 0).getDate();
  const mondayIndex = jsDay => (jsDay+6)%7; // JS: 0=Sun..6=Sat -> Monday-first index
  const firstDow = mondayIndex(new Date(y, mo-1, 1).getDay());
  const daySpend = dailySpendSeries(monthKey, categoryBreakdownMode);
  const billDays = billDaysForMonth(monthKey);
  const payDays = payDaysForMonth(monthKey);
  const max = Math.max(0, ...Object.values(daySpend));
  const accentRgb = hexToRgbTriplet(getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#5b8cff');
  const monthShort = monthLabelFromKey(monthKey).split(' ')[0];

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="heatmap-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const amt = daySpend[day]||0;
    const ratio = max>0 ? amt/max : 0;
    const isWeekend = mondayIndex(new Date(y, mo-1, day).getDay()) >= 5;
    const bg = amt>0 ? `rgba(${accentRgb},${(0.18+0.72*ratio).toFixed(2)})` : 'transparent';
    const billNames = billDays[day];
    const payNames = payDays[day];
    let tip = amt>0 ? `${monthShort} ${day}: ${fmt(amt)}` : `${monthShort} ${day}: no dated spending`;
    if(payNames) tip += ` · pay: ${payNames.join(', ')}`;
    if(billNames) tip += ` · due: ${billNames.join(', ')}`;
    const marker = (billNames?'<span class="bill-marker"></span>':'') + (payNames?'<span class="pay-marker"></span>':'');
    cells += `<div class="heatmap-cell${isWeekend?' weekend':''}" data-tip="${escapeHtml(tip)}" style="background:${bg};">${day}${marker}</div>`;
  }
  if(!Object.keys(daySpend).length && !Object.keys(billDays).length && !Object.keys(payDays).length){
    el.innerHTML = '<div class="empty">No Quick Add spends or dated outgoings for this month yet — add a "Day" to an outgoing, or use Quick Add.</div>';
    return;
  }
  el.innerHTML = `
    <div class="heatmap-grid">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="heatmap-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="heatmap-legend">
      <span>Less</span>
      <span class="heatmap-legend-swatch" style="background:rgba(${accentRgb},0.18);"></span>
      <span class="heatmap-legend-swatch" style="background:rgba(${accentRgb},0.4);"></span>
      <span class="heatmap-legend-swatch" style="background:rgba(${accentRgb},0.65);"></span>
      <span class="heatmap-legend-swatch" style="background:rgba(${accentRgb},0.9);"></span>
      <span>More</span>
      <span style="margin-left:14px;display:inline-flex;align-items:center;gap:5px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;"></span>Bill due</span>
      <span style="margin-left:10px;display:inline-flex;align-items:center;gap:5px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;"></span>Payday</span>
    </div>
  `;
  el.querySelectorAll('.heatmap-cell[data-tip]').forEach(c=>{
    c.addEventListener('mouseenter', evt=>showChartTooltip(evt, c.dataset.tip));
    c.addEventListener('mousemove', evt=>showChartTooltip(evt, c.dataset.tip));
    c.addEventListener('mouseleave', hideChartTooltip);
  });
}

// ---------------- Quarterly ----------------
function quarterOfMonth(mm){ return Math.floor((mm-1)/3)+1; }
const QUARTER_LABEL = q => ['Jan–Mar','Apr–Jun','Jul–Sep','Oct–Dec'][q-1];
function quarterStatsFor(gk, groups){
  const g = groups[gk];
  const monthKeys = g.monthKeys.slice().sort();
  let income=0, spending=0, saved=0;
  const catTotals = {};
  monthKeys.forEach(mk=>{
    const m = state.months[mk];
    const t = monthTotals(m);
    income += t.doneIncoming;
    spending += t.doneOutgoing + t.doneWeekly;
    saved += t.doneSavings + t.doneStocks;
    m.outgoings.forEach(o=>{
      if(o.status!=='done') return;
      const cat = o.category || 'Uncategorized';
      catTotals[cat] = (catTotals[cat]||0) + (Number(o.amount)||0);
    });
  });
  const firstM = state.months[monthKeys[0]];
  const lastM = state.months[monthKeys[monthKeys.length-1]];
  const startBalance = round2(firstM.startingBalance);
  const endBalance = round2(monthTotals(lastM).liveBalance);
  const net = round2(income - spending - saved);
  const savingsRate = income>0 ? Math.round(saved/income*100) : 0;
  const catRows = Object.entries(catTotals).filter(([,amt])=>amt>0)
    .map(([category,amount])=>({category, amount:round2(amount)}))
    .sort((a,b)=>b.amount-a.amount);
  return {gk, year:g.year, q:g.q, monthKeys, income:round2(income), spending:round2(spending), saved:round2(saved), net, startBalance, endBalance, savingsRate, catRows};
}

  } else {

            <div class="cat-bar-amt">${fmt(r.amount)}</div>

  document.getElementById('quarterlyNext').onclick = ()=>{

function recurringTableHtml(kind){
  const label = kind==='incoming' ? 'Source' : 'Name';
  const catTh = kind==='outgoing' ? '<th style="width:140px;">Category</th><th style="width:76px;">Day</th>' : '<th style="width:150px;">Schedule</th>';
  return `
    <table class="responsive-table">

      <tbody class="recur-body-${kind}"></tbody>
    </table>
  `;
}
function drawRecurringTable(m, kind){
  const list = kind==='incoming' ? m.incoming : m.outgoings;
  const body = document.querySelector(`.recur-body-${kind}`);
  const items = list.filter(x=>x.recurring);
  const colspan = kind==='outgoing' ? 6 : 5;
  const [curYear, curMonthNum] = state.currentMonthKey.split('-').map(Number);
  body.innerHTML = items.map(x=>`
    <tr data-id="${x.id}">
      <td class="cell-name">
        <div class="cell-name-flex">
          <input class="row-input recur-name-${kind}" type="text" value="${escapeHtml(x.name)}">
          ${kind==='incoming' ? `<span class="hint schedule-hint">${scheduleHint(x, curYear, curMonthNum)}</span>` : ''}
        </div>
      </td>
      ${kind==='outgoing'
        ? `<td class="cell-category" data-label="Category">${categoryDropdownHtml(`recur-category-${kind}`, x.category)}</td><td class="cell-day" data-label="Day">${dayInputHtml(`recur-day-${kind}`, x.day)}</td>`
        : `<td class="cell-category" data-label="Schedule">${scheduleSelectHtml(`recur-schedule-${kind}`, x)}</td>`}
      <td data-label="Amount"><input class="row-input recur-amount-${kind} amt-cell" type="number" step="0.01" value="${x.amount}"></td>
      <td data-label="Status">${statusSelectHtml(`recur-status-${kind}`, x.status)}</td>
      <td class="cell-del"><button class="del-btn recur-del-${kind}">✕</button></td>
    </tr>
  `).join('') || `<tr><td colspan="${colspan}" class="empty">No recurring ${kind==='incoming'?'incoming':'outgoings'} yet</td></tr>`;
  body.querySelectorAll('tr').forEach(tr=>{
    const id = tr.dataset.id;
    const item = list.find(x=>x.id===id);
    if(!item) return;
    const listKey = kind==='incoming' ? 'incoming' : 'outgoings';
    tr.querySelector(`.recur-name-${kind}`).oninput = e=>{ item.name=e.target.value; syncNewRecurringForward(item, state.currentMonthKey, listKey); save(); };
    tr.querySelector(`.recur-amount-${kind}`).oninput = e=>{ item.amount=Number(e.target.value); syncNewRecurringForward(item, state.currentMonthKey, listKey); save(); };
    const sel = tr.querySelector(`.recur-status-${kind}`);
    sel.onchange = e=>{ item.status=e.target.value; save(); e.target.className = `recur-status-${kind} status-select status-${e.target.value}`; };
    const catSel = tr.querySelector(`.recur-category-${kind}`);

    const dayInp = tr.querySelector(`.recur-day-${kind}`);
    if(dayInp) dayInp.onchange = e=>{ item.day = clampDay(e.target.value); e.target.value = item.day||''; propagateOutgoingFieldForward(item, state.currentMonthKey, 'day'); save(); };
    const schedSel = tr.querySelector(`.recur-schedule-${kind}`);
    if(schedSel) schedSel.onchange = e=>{
      applyScheduleValue(item, e.target.value);
      propagateScheduleForward(item, state.currentMonthKey, 'incoming');
      save();
      tr.querySelector('.schedule-hint').textContent = scheduleHint(item, curYear, curMonthNum);
    };
    tr.querySelector(`.recur-del-${kind}`).onclick = ()=>{
      if(kind==='incoming') m.incoming = m.incoming.filter(x=>x.id!==id);
      else m.outgoings = m.outgoings.filter(x=>x.id!==id);
      save(); renderRecurring();
    };
  });
}

        <input type="number" step="0.01" class="pot-amount-${potKey}" placeholder="Amount" style="max-width:140px;">
        <select class="pot-dir-${potKey}">
          <option value="out">Transfer to Current Balance</option>
          <option value="in">Transfer from Current Balance</option>
        </select>
        <input type="text" class="pot-note-${potKey}" placeholder="Note (optional)" style="max-width:200px;">
        <button class="btn small pot-transfer-${potKey}">Transfer</button>
      </div>
      <div class="field-inline" style="margin-bottom:14px;flex-wrap:wrap;">
        <label style="font-size:12px;color:var(--muted);">Manually set current balance to</label>
        <input type="number" step="0.01" class="pot-setbal-${potKey}" placeholder="${round2(potBalance(potKey))}" style="max-width:140px;">
        <button class="btn secondary small pot-setbal-btn-${potKey}">Set balance</button>
        <span style="font-size:12px;color:var(--muted);">records the difference as an adjustment — doesn't touch Current Balance</span>
      </div>
      <table>
        <thead><tr><th>Month</th><th style="width:60px;">Type</th><th style="width:70px;">Source</th><th>Note</th><th style="width:110px;">Amount</th><th style="width:36px;"></th></tr></thead>
        <tbody class="pot-body-${potKey}">
          ${rows.length ? rows.map(r=>`
            <tr>
              <td>${monthLabelFromKey(r.month)}</td>
              <td>${r.type==='in' ? '<span style="color:var(--green);">In</span>' : '<span style="color:var(--red);">Out</span>'}</td>
              <td>${r.source==='auto'?'Auto':(r.source==='adjustment'?'Adjust':'Manual')}</td>
              <td>${escapeHtml(r.note)}</td>
              <td class="amt-cell">${fmt(r.amount)}</td>
              <td>${r.source!=='auto' ? `<button class="del-btn pot-del-${potKey}" data-id="${r.id}">✕</button>` : ''}</td>
            </tr>
          `).join('') : '<tr><td colspan="6" class="empty">No transfers yet</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
function wirePotPanel(potKey){
  const amountInp = document.querySelector(`.pot-amount-${potKey}`);
  const dirSel = document.querySelector(`.pot-dir-${potKey}`);
  const noteInp = document.querySelector(`.pot-note-${potKey}`);
  const btn = document.querySelector(`.pot-transfer-${potKey}`);
  btn.onclick = ()=>{
    const amt = Number(amountInp.value);
    if(!amt || amt<=0) return;
    addPotTransfer(potKey, dirSel.value, amt, noteInp.value);
    renderPots();
  };
  const setBalInp = document.querySelector(`.pot-setbal-${potKey}`);
  const setBalBtn = document.querySelector(`.pot-setbal-btn-${potKey}`);
  setBalBtn.onclick = ()=>{
    if(setBalInp.value === '') return;
    setPotBalance(potKey, Number(setBalInp.value));
    renderPots();
  };
  document.querySelectorAll(`.pot-del-${potKey}`).forEach(b=>{
    b.onclick = ()=>{ deletePotTransfer(potKey, b.dataset.id); renderPots(); };
  });
}
function renderPots(){
  const el = document.getElementById('view-pots');
  el.innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="card highlight"><div class="k">Savings Pot</div><div class="v pos">${fmt(potBalance('savings'))}</div><div class="sub">total currently in savings</div></div>
      <div class="card highlight"><div class="k">Stocks &amp; Shares Pot</div><div class="v pos">${fmt(potBalance('stocks'))}</div><div class="sub">total currently invested</div></div>
    </div>
    ${potPanelHtml('savings','Savings Pot')}
    ${potPanelHtml('stocks','Stocks & Shares Pot')}
  `;
  wirePotPanel('savings');
  wirePotPanel('stocks');
}

// ---------------- Settings ----------------
function renderSettings(){
  const el = document.getElementById('view-settings');
  const p = activeProfileMeta();
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Profiles</h2><span class="hint">separate budgets on the same browser — e.g. you and a partner</span></div>
      <table>
        <thead><tr><th>Name</th><th style="width:100px;">Active</th><th style="width:36px;"></th></tr></thead>
        <tbody id="profilesBody"></tbody>
      </table>
      <button class="btn small" id="addProfileBtn" style="margin-top:12px;">+ Add profile</button>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Cloud Sync</h2><span class="hint">optional — keeps data safe if this browser is cleared, and lets one profile follow you across devices</span></div>
      <div class="field-inline">
        <label style="font-size:12px;color:var(--muted);">Sync "${escapeHtml(p.name)}" to the cloud</label>
        <select id="syncToggle">
          <option value="off" ${!p.syncEnabled?'selected':''}>Off (local only)</option>
          <option value="on" ${p.syncEnabled?'selected':''}>On</option>
        </select>
      </div>
      <div id="syncCodeBlock" class="${p.syncEnabled?'':'hidden'}" style="margin-top:12px;">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">Sync code — this browser's URL now has it built in, but save it separately too (a note, password manager) in case you ever lose this exact bookmark</label>
        <div class="field-inline">

        <div class="field-inline" style="margin-top:12px;">
          <span id="syncDetailStatus" style="font-size:12px;color:var(--muted);"></span>
          <button class="btn secondary small" id="syncNowBtn">Sync now</button>
        </div>
      </div>
      <div class="formula-note">To bring this profile's cloud data onto a new device: either open this browser's exact URL there (the sync code travels in the link), or make a fresh profile, turn Cloud Sync on for it, then paste this same code below and pull.</div>
      <div class="field-inline" style="margin-top:10px;">
        <input type="text" id="pullSyncCodeInput" placeholder="Paste a sync code" style="max-width:220px;">

    <div class="panel">
      <div class="panel-head"><h2>Preferences</h2></div>
      <div class="field-inline">
        <label style="min-width:170px;font-size:12px;color:var(--muted);">Currency symbol</label>
        <input type="text" id="currencyInput" value="${escapeHtml(state.currency)}" style="max-width:80px;">
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Data</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn secondary small" id="exportJsonBtn">Export backup (JSON)</button>
        <label class="btn secondary small" style="cursor:pointer;">
          Import backup (JSON)
          <input type="file" id="importInput" accept="application/json" style="display:none;">
        </label>
        <button class="btn danger small" id="resetBtn">Reset this profile's data</button>
      </div>
    </div>
  `;
  function drawProfilesTable(){
    const body = document.getElementById('profilesBody');
    body.innerHTML = profilesMeta.profiles.map(p=>`
      <tr data-id="${p.id}">
        <td><input class="row-input profile-name" type="text" value="${escapeHtml(p.name)}"></td>
        <td>${p.id===profilesMeta.activeId ? '<span style="color:var(--green);font-weight:600;font-size:12px;">Current</span>' : `<button class="btn secondary small profile-switch">Switch</button>`}</td>
        <td>${profilesMeta.profiles.length>1 ? `<button class="del-btn profile-del">✕</button>` : ''}</td>
      </tr>
    `).join('');
    body.querySelectorAll('tr').forEach(tr=>{
      const id = tr.dataset.id;
      tr.querySelector('.profile-name').onchange = e=>renameProfile(id, e.target.value);
      const switchBtn = tr.querySelector('.profile-switch');
      if(switchBtn) switchBtn.onclick = ()=>switchProfile(id);
      const delBtn = tr.querySelector('.profile-del');
      if(delBtn) delBtn.onclick = ()=>{
        const p = profilesMeta.profiles.find(x=>x.id===id);
        openConfirmModal('Delete this profile?', `This permanently deletes "${escapeHtml(p.name)}" and all of its budget data. This cannot be undone.`, ()=>{
          deleteProfile(id);
