function applyScheduleValue(item, v){
  if(v && v.startsWith('w:')){ item.lastWeekday = Number(v.slice(2)); item.day = null; }
  else if(v && v.startsWith('d:')){ item.day = Number(v.slice(2)); item.lastWeekday = null; }
  else { item.day = null; item.lastWeekday = null; }
}
// Resolves an item's schedule to an actual day-of-month (1-31) for a specific
// calendar month, or null if it has none. month is 1-12.
function resolveScheduledDay(item, year, month){
  const daysInMonth = new Date(year, month, 0).getDate();
  if(item.lastWeekday!=null && item.lastWeekday!==undefined){
    for(let d=daysInMonth; d>=1; d--){
      if(new Date(year, month-1, d).getDay()===item.lastWeekday) return d;
    }
    return null;
  }
  if(item.day) return Math.min(item.day, daysInMonth);
  return null;
}
function scheduleHint(item, year, month){
  const day = resolveScheduledDay(item, year, month);
  if(!day) return '';
  const d = new Date(year, month-1, day);
  return `Next: ${d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'})}`;
}

// ---------- tiny SVG line chart (no external deps) ----------
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
let chartTooltipEl = null;
function ensureChartTooltip(){
  if(chartTooltipEl) return chartTooltipEl;
  chartTooltipEl = document.createElement('div');
  chartTooltipEl.style.cssText = 'position:fixed;pointer-events:none;z-index:200;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow);display:none;white-space:nowrap;';
  document.body.appendChild(chartTooltipEl);
  return chartTooltipEl;
}
function showChartTooltip(evt, text, isHtml, anchor){
  const t = ensureChartTooltip();
  if(isHtml) t.innerHTML = text; else t.textContent = text;
  t.style.display = 'block';
  const pad = 12;
  if(anchor){
    // Touch: keep the readout above the chart so a finger never covers it.
    const left = Math.min(Math.max(pad, anchor.x - t.offsetWidth/2), window.innerWidth - t.offsetWidth - pad);
    let top = anchor.top - t.offsetHeight - 8;
    if(top < 64) top = anchor.top + 6;
    t.style.left = left + 'px'; t.style.top = top + 'px';
    return;
  }
  let left = evt.clientX + pad, top = evt.clientY - 14;
  const maxLeft = window.innerWidth - t.offsetWidth - pad;
  if(left > maxLeft) left = evt.clientX - t.offsetWidth - pad;
  t.style.left = Math.max(pad, left) + 'px';
  t.style.top = Math.max(pad, top) + 'px';
}
function hideChartTooltip(){
  if(chartTooltipEl) chartTooltipEl.style.display = 'none';
}
// Scrub through a card sparkline: highlights the nearest month's point and
// shows its value (and change from the month before) in the chart tooltip.
let activeSpark = null;
function clearSparkHover(sp){
  if(!sp) return;
  sp.classList.remove('hovering');
  sp.querySelectorAll('.spark-pt.on').forEach(p=>p.classList.remove('on'));
}
document.addEventListener('pointermove', e=>{
  const sp = e.target.closest ? e.target.closest('.spark') : null;
  if(sp !== activeSpark){ clearSparkHover(activeSpark); activeSpark = sp; }
  if(!sp){ if(chartTooltipEl && chartTooltipEl.dataset.spark) { hideChartTooltip(); delete chartTooltipEl.dataset.spark; } return; }
  if(!sp._pts) sp._pts = JSON.parse(sp.dataset.pts);
  const rect = sp.getBoundingClientRect();
  const idx = Math.max(0, Math.min(sp._pts.length-1, Math.round((e.clientX-rect.left)/rect.width*(sp._pts.length-1))));
  const dots = sp.querySelectorAll('.spark-pt');
  dots.forEach((d,i)=>d.classList.toggle('on', i===idx));
  sp.classList.add('hovering');
  sp.querySelector('.spark-guide').style.left = dots[idx].style.left;
  const [label, val] = sp._pts[idx];
  let text = `${label}  ${fmt(val)}`;
  if(idx>0){
    const diff = round2(val - sp._pts[idx-1][1]);
    if(Math.abs(diff)>=0.005) text += `  (${diff>0?'+':''}${fmt(diff)})`;
  }
  showChartTooltip(e, text);
  chartTooltipEl.dataset.spark = '1';
});
document.addEventListener('pointerout', e=>{
  if(!e.relatedTarget && activeSpark){ clearSparkHover(activeSpark); activeSpark = null; hideChartTooltip(); }
});
let lineChartUid = 0;
// Interactive line chart. data is a flat array of {x,y,label} (one series) or
// an array of series: {color, name, dashed, points:[{x,y,label}]}.
// opts: height, width, marker:{index,label} (a vertical "Today" line),
// animate:false (skip the draw-in, used when redrawing after a legend toggle).
// Hover/touch scrubs across all series at once; legend items (a .legend
// sibling, or one generated here for multi-series charts) toggle series.
function lineChart(container, data, opts={}){
  const isMulti = Array.isArray(data) && data.length>0 && data[0].points !== undefined;
  const allSeries = isMulti ? data : [{color:cssVar('--accent','#5b8cff'), points:data}];
  container._lc = {data, opts};
  const hidden = container._hidden || (container._hidden = new Set());
  let visible = allSeries.map((s,i)=>({s,i})).filter(({i})=>!hidden.has(i));
  if(!visible.length){ hidden.clear(); visible = allSeries.map((s,i)=>({s,i})); }
  const animate = opts.animate !== false;
  const w = opts.width||container.clientWidth||600, h = opts.height||240;
  const narrow = w < 520;
  const allVals = visible.flatMap(({s})=>s.points.map(p=>p.y));
  let maxV = Math.max(...allVals, 0), minV = Math.min(...allVals, 0);
  // Round the axis to tidy numbers (0, 5k, 10k …) instead of splitting the raw range.
  const rawRange = maxV - minV;
  const nTicks = 4;
  let tickStep = 0;
  if(rawRange>0){
    const rough = rawRange/nTicks, mag = Math.pow(10, Math.floor(Math.log10(rough)));
    tickStep = [1,2,2.5,5,10].map(f=>f*mag).find(x=>x>=rough) || 10*mag;
    minV = Math.floor(minV/tickStep+1e-9)*tickStep;
    maxV = Math.ceil(maxV/tickStep-1e-9)*tickStep;
  }
  const tickCount = tickStep ? Math.round((maxV-minV)/tickStep) : 3;
  const range = (maxV - minV) || 1;
  const fmtAxis = v => narrow ? fmtCompact(v) : state.currency+Math.round(v).toLocaleString();
  const axisLabels = Array.from({length:tickCount+1}, (_,i)=>fmtAxis(rawRange===0 ? maxV : maxV - (range*i/tickCount)));
  const padL = Math.max(narrow ? 34 : 54, Math.max(...axisLabels.map(l=>l.length))*(narrow?6.4:6.2)+12), padR = narrow ? 12 : 16, padT = 18, padB = narrow ? 30 : 28;
  const axisFont = narrow ? 11 : 10;
  const n = allSeries[0].points.length;
  const uid = ++lineChartUid;
  const svg = svgEl('svg',{viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, style:'display:block;touch-action:pan-y;'});
  const gridColor = cssVar('--border','#2a3552');
  const mutedColor = cssVar('--muted','#8a93ab');
  const textColor = cssVar('--text','#e8ecf7');
  const bottom = h-padB;
  const defs = svgEl('defs',{});
  svg.appendChild(defs);
  for(let i=0;i<=tickCount;i++){
    const y = padT + (h-padT-padB)*i/tickCount;
    svg.appendChild(svgEl('line',{x1:padL,y1:y,x2:w-padR,y2:y,stroke:gridColor,'stroke-width':1}));
    const t = svgEl('text',{x:padL-7,y:y+4,'font-size':axisFont,fill:mutedColor,'text-anchor':'end'}); t.textContent = axisLabels[i];
    svg.appendChild(t);
  }
  const xStep = n>1 ? (w-padL-padR)/(n-1) : 0;
  const yFor = v => padT + (h-padT-padB)*(1-((v-minV)/range));
  const xFor = i => padL + xStep*i;
  if(minV<0 && maxV>0){
    svg.appendChild(svgEl('line',{x1:padL,y1:yFor(0),x2:w-padR,y2:yFor(0),stroke:mutedColor,'stroke-width':1,'stroke-dasharray':'2,3',opacity:.7}));
  }
  if(opts.marker && opts.marker.index>=0 && opts.marker.index<n){
    const mx = xFor(opts.marker.index);
    svg.appendChild(svgEl('line',{x1:mx,y1:padT-4,x2:mx,y2:bottom,stroke:mutedColor,'stroke-width':1,'stroke-dasharray':'3,3',opacity:.55}));
    const mt = svgEl('text',{x:mx,y:padT-6,'font-size':9.5,fill:mutedColor,'text-anchor':'middle','font-weight':600});
    mt.textContent = opts.marker.label || 'Today';
    svg.appendChild(mt);
  }

  const smallDots = n<=16;
  const dotRefs = [];
  visible.forEach(({s,i:si})=>{
    const color = s.color||cssVar('--accent','#5b8cff');
    const pts = s.points.map((p,i)=>({x:xFor(i), y:yFor(p.y)}));
    const d = smoothPath(pts);
    if(!s.dashed){
      const gid = `lcg${uid}_${si}`;
      const grad = svgEl('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1});
      grad.appendChild(svgEl('stop',{offset:0,'stop-color':color,'stop-opacity':.28}));
      grad.appendChild(svgEl('stop',{offset:1,'stop-color':color,'stop-opacity':0}));
      defs.appendChild(grad);
      const area = svgEl('path',{d:`${d} L${pts[pts.length-1].x},${bottom} L${pts[0].x},${bottom} Z`, fill:`url(#${gid})`, stroke:'none'});
      if(animate){
        area.style.opacity = '0';
        area.style.transition = 'opacity .9s ease .3s';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ area.style.opacity = '1'; }));
      }
      svg.appendChild(area);
    }
    const pathAttrs = {d, fill:'none', stroke:color, 'stroke-width':narrow?2.8:2.4, 'stroke-linejoin':'round','stroke-linecap':'round'};
    if(s.dashed) pathAttrs['stroke-dasharray'] = '6,4';
    const pathEl = svgEl('path', pathAttrs);
    svg.appendChild(pathEl);
    if(animate){
      // Solid lines draw in; dashed (projected) ones fade in, since their dash
      // pattern already uses stroke-dasharray.
      if(s.dashed){
        pathEl.style.opacity = '0';
        pathEl.style.transition = 'opacity .6s ease .15s';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ pathEl.style.opacity = '1'; }));
      } else {
        const len = pathEl.getTotalLength ? pathEl.getTotalLength() : 0;
        if(len){
          pathEl.style.strokeDasharray = len;
          pathEl.style.strokeDashoffset = len;
          pathEl.style.transition = 'stroke-dashoffset .9s cubic-bezier(.4,.1,.2,1)';
          requestAnimationFrame(()=>requestAnimationFrame(()=>{ pathEl.style.strokeDashoffset = '0'; }));
        }
      }
    }
    if(smallDots){
      pts.forEach(pt=>svg.appendChild(svgEl('circle',{cx:pt.x,cy:pt.y,r:2.6,fill:color,style:'pointer-events:none;'})));
    }
    dotRefs.push({color, name:s.name, pts, ring:null, s});
  });

  const maxLabels = Math.max(1, Math.min(n, Math.floor((w-padL-padR)/(narrow?58:90))));
  // On phones drop the year from month labels ("Apr 2026" → "Apr"); keep a '26 suffix only when the data spans years.
  const yearsSeen = new Set(allSeries[0].points.map(p=>(String(p.x).match(/\b(20\d\d)$/)||[])[1]).filter(Boolean));
  const xText = x => { const str = String(x); if(!narrow) return str; return yearsSeen.size>1 ? str.replace(/ 20(\d\d)$/," '$1") : str.replace(/ 20\d\d$/,''); };
  const step = Math.max(1, Math.round(n/maxLabels));
  allSeries[0].points.forEach((p,i)=>{
    // Skip a regular label that would collide with the always-shown last one.
    if((i%step!==0 || (n-1-i)<step) && i!==n-1) return;
    const x = xFor(i);
    // First/last labels anchor inward so they can't spill past the chart's own edge.
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    const t = svgEl('text',{x, y:h-8, 'font-size':axisFont, fill:mutedColor, 'text-anchor':anchor});
    t.textContent = xText(p.x);
    svg.appendChild(t);
  });

  // Hover/touch scrubbing: one overlay catches the pointer, snaps to the nearest
  // month, and lights up that month on every visible series.
  const guide = svgEl('line',{y1:padT-2,y2:bottom,stroke:textColor,'stroke-width':1,'stroke-dasharray':'3,3',opacity:0,style:'pointer-events:none;'});
  svg.appendChild(guide);
  dotRefs.forEach(r=>{
    r.ring = svgEl('circle',{r:5.5,fill:cssVar('--panel','#161d2e'),stroke:r.color,'stroke-width':2.4,opacity:0,style:'pointer-events:none;'});
    svg.appendChild(r.ring);
  });
  const overlay = svgEl('rect',{x:padL-8,y:0,width:w-padL-padR+16,height:h,fill:'transparent',style:'cursor:crosshair;'});
  const scrub = evt=>{
    const rect = svg.getBoundingClientRect();
    const px = (evt.clientX-rect.left)*(w/rect.width);
    const idx = n>1 ? Math.max(0, Math.min(n-1, Math.round((px-padL)/xStep))) : 0;
    const x = xFor(idx);
    guide.setAttribute('x1',x); guide.setAttribute('x2',x); guide.setAttribute('opacity',.45);
    dotRefs.forEach(r=>{
      const pt = r.pts[idx];
      if(!pt){ r.ring.setAttribute('opacity',0); return; }
      r.ring.setAttribute('cx',x); r.ring.setAttribute('cy',pt.y); r.ring.setAttribute('opacity',1);
    });
    const label = allSeries[0].points[idx].label || allSeries[0].points[idx].x;
    const rows = dotRefs.map(r=>{
      if(!r.s.points[idx]) return '';
      const v = r.s.points[idx].y;
      let delta = '';
      if(dotRefs.length===1 && idx>0){
        const dv = round2(v - r.s.points[idx-1].y);
        if(Math.abs(dv)>=0.005) delta = ` <span style="color:var(--muted);font-weight:500;">(${dv>0?'+':''}${escapeHtml(fmt(dv))})</span>`;
      }
      return `<div style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${r.color};flex-shrink:0;"></span>${r.name?escapeHtml(r.name)+': ':''}${escapeHtml(fmt(v))}${delta}</div>`;
    }).join('');
    showChartTooltip(evt, `<div style="margin-bottom:3px;">${escapeHtml(String(label))}</div>${rows}`, true, evt.pointerType==='touch' ? {x:evt.clientX, top:rect.top} : null);
  };
  const endScrub = ()=>{
    guide.setAttribute('opacity',0);
    dotRefs.forEach(r=>r.ring.setAttribute('opacity',0));
    hideChartTooltip();
  };
  overlay.addEventListener('pointermove', scrub);
  overlay.addEventListener('pointerdown', scrub);
  overlay.addEventListener('pointerleave', endScrub);
  overlay.addEventListener('pointercancel', endScrub);
  svg.appendChild(overlay);

  container.innerHTML='';
  container.appendChild(svg);
  if(allSeries.length>1) wireChartLegend(container, allSeries);
}
// Clickable legend: clicking an item hides/shows that series and redraws.
// Uses an existing .legend directly after the chart if there is one (item
// order must match series order), otherwise builds a simple one.
function wireChartLegend(container, allSeries){
  let legend = container.nextElementSibling;
  if(!legend || !legend.classList.contains('legend')){
    legend = document.createElement('div');
    legend.className = 'legend auto-legend';
    legend.innerHTML = allSeries.map(s=>`<div class="legend-item"><span class="${s.dashed?'dash':'dot'}" style="${s.dashed?'border-color':'background'}:${s.color};"></span>${escapeHtml(s.name||'')}</div>`).join('');
    container.after(legend);
  }
  const items = [...legend.querySelectorAll('.legend-item')];
  items.forEach((it,i)=>{
    it.classList.add('toggle');
    it.classList.toggle('off', container._hidden.has(i));
    it.onclick = ()=>{
      if(container._hidden.has(i)) container._hidden.delete(i);
      else if(container._hidden.size < allSeries.length-1) container._hidden.add(i);
      lineChart(container, container._lc.data, {...container._lc.opts, animate:false});
    };
  });
}

// Half-ring gauge for a category breakdown: one glowing arc segment per category
// (biggest first), the total underneath. rows = [{category, amount}], sorted desc.
function gaugeChartHtml(rows, total, caption){
  if(!(total>0)) return '';
  const CAP = 6;
  let segRows = rows.slice(0, CAP);
  if(rows.length > CAP) segRows = [...rows.slice(0, CAP-1), {category:'Others', amount: rows.slice(CAP-1).reduce((a,r)=>a+r.amount,0), others:true}];
  let cum = 0;
  const gap = 1.6;
  const segs = segRows.map(r=>{
    const pct = r.amount/total*100;
    const len = Math.max(pct-gap, 0.7);
    const color = r.others ? '#8a93ab' : categoryColor(r.category);
    const out = `<path class="g-seg" d="M30,140 A110,110 0 0 1 250,140" pathLength="100" fill="none" stroke="${color}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(100-len).toFixed(2)}" stroke-dashoffset="${(-cum).toFixed(2)}" style="filter:drop-shadow(0 0 5px ${color});animation-delay:${(segRows.indexOf(r)*0.06).toFixed(2)}s;"><title>${escapeHtml(r.category)}: ${escapeHtml(fmt(r.amount))} (${Math.round(pct)}%)</title></path>`;
    cum += pct;
    return out;
  }).join('');
  return `<div class="gauge-wrap">
    <svg viewBox="0 0 280 160" role="img" aria-label="${escapeHtml(caption||'Spending')} by category">
      <path d="M30,140 A110,110 0 0 1 250,140" pathLength="100" fill="none" stroke="color-mix(in srgb, var(--text) 10%, transparent)" stroke-width="18" stroke-linecap="round"/>
      ${segs}
    </svg>
    <div class="gauge-center"><div class="gauge-total">${escapeHtml(fmt(total))}</div><div class="gauge-cap">${escapeHtml(caption||'')}</div></div>
  </div>`;
}
// Category breakdown drawn as activity rings: one glowing ring per category (the biggest
// spends first), each sized against the biggest and labelled with its share of the total.
// rows = [{category, amount}], sorted desc. More than 5 categories → the rest are
// gathered into a grey "Others" ring.
function donutChart(container, rows, opts={}){
  const size = opts.size || 220;
  const total = rows.reduce((s,r)=>s+r.amount,0);
  const CAP = 5;
  let ringRows = rows.slice(0, CAP);
  if(rows.length > CAP){
    const rest = rows.slice(CAP-1);
    ringRows = [...rows.slice(0, CAP-1), {category:'Others', amount: rest.reduce((s,r)=>s+r.amount,0), others:true}];
  }
  const max = ringRows.length ? Math.max(...ringRows.map(r=>r.amount)) : 0;
  const colorOf = r => r.others ? '#8a93ab' : categoryColor(r.category);
  const SWEEP = 75;      // each ring is a 270° arc (75% of a circle) so the top-left quadrant is free for labels
  const R0 = 91, STEP = 12, W = 9;

  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'donut-wrap';
  wrap.style.width = size+'px';
  wrap.style.height = size+'px';

  const svg = svgEl('svg', {viewBox:'0 0 200 200', width:size, height:size, style:'display:block;overflow:visible;'});
  const trackColor = 'color-mix(in srgb, var(--text) 10%, transparent)';

  const center = document.createElement('div');
  center.className = 'donut-center';
  center.style.width = '40%';
  const centerValue = document.createElement('div'); centerValue.className='donut-center-value';
  const centerLabel = document.createElement('div'); centerLabel.className='donut-center-label';
  centerValue.style.fontSize = Math.round(size*0.085)+'px';
  centerLabel.style.fontSize = Math.max(9, Math.round(size*0.052))+'px';
  center.appendChild(centerValue); center.appendChild(centerLabel);
  const setCenter = (value,label)=>{ centerValue.textContent=value; centerLabel.textContent=label; };
  const resetCenter = ()=>setCenter(total ? fmtCompact(total) : '—', total ? 'Total' : 'No spending');
  resetCenter();

  const groups = [];
  if(total>0){
    ringRows.forEach((r,i)=>{
      const radius = R0 - STEP*i;
      const color = colorOf(r);
      const pct = Math.round(r.amount/total*100);
      const g = svgEl('g', {transform:'rotate(-90 100 100)'});
      g.style.transition = 'opacity .15s';
      g.style.cursor = 'pointer';
      const base = {cx:100, cy:100, r:radius, fill:'none', pathLength:100, 'stroke-linecap':'round'};
      g.appendChild(svgEl('circle', {...base, stroke:trackColor, 'stroke-width':W, 'stroke-dasharray':`${SWEEP} 100`}));
      const fill = svgEl('circle', {...base, stroke:color, 'stroke-width':W, 'stroke-dasharray':'0 100'});
      fill.style.filter = `drop-shadow(0 0 3px ${color})`;
      fill.style.transition = 'stroke-dasharray .8s cubic-bezier(.4,.1,.2,1)';
      const dash = `${Math.max(r.amount/max*SWEEP, 2)} 100`;
      g.appendChild(fill);
      // roomy invisible hit area so the thin ring is easy to hover or tap
      g.appendChild(svgEl('circle', {...base, stroke:'transparent', 'stroke-width':W+3, 'stroke-dasharray':`${SWEEP} 100`, style:'pointer-events:stroke;'}));
      setTimeout(()=>fill.setAttribute('stroke-dasharray', dash), 40);
      groups.push(g);
      svg.appendChild(g);
      // percentage label at the start of the ring (12 o'clock), in the free quadrant
      const t = svgEl('text', {x:95, y:100 - radius + 3.7, 'text-anchor':'end', 'font-size':10.2, 'font-weight':800, fill:color});
      t.style.pointerEvents = 'none';
      t.textContent = pct+'%';
      svg.appendChild(t);

      const tipText = `${r.others ? '' : categoryIcon(r.category)+' '}${r.category}: ${fmt(r.amount)} (${pct}%)`;
      const select = evt=>{
        groups.forEach(o=>{ o.style.opacity = o===g ? '1' : '0.35'; });
        setCenter(fmtCompact(r.amount), r.category);
        if(evt && evt.pointerType!=='touch') showChartTooltip(evt, tipText);
      };
      const clear = ()=>{ groups.forEach(o=>o.style.opacity='1'); resetCenter(); hideChartTooltip(); };
      g.addEventListener('pointerenter', select);
      g.addEventListener('pointermove', evt=>{ if(evt.pointerType!=='touch') showChartTooltip(evt, tipText); });
      g.addEventListener('pointerleave', evt=>{ if(evt.pointerType!=='touch') clear(); });
      g.addEventListener('pointerdown', evt=>{ if(evt.pointerType==='touch'){ evt.stopPropagation(); select(evt); } });
      container._ringClear = clear;
    });
    // tapping anywhere else on touch screens goes back to the total
    svg.addEventListener('pointerdown', evt=>{ if(evt.pointerType==='touch' && container._ringClear) container._ringClear(); });
  } else {
    svg.appendChild(svgEl('circle', {cx:100, cy:100, r:R0, fill:'none', stroke:trackColor, 'stroke-width':W}));
  }

  wrap.appendChild(svg);
  wrap.appendChild(center);
  container.appendChild(wrap);
}

let currentView = 'month';
let quickAddLogExpanded = false;
let categoryBreakdownMonth = null;
let categoryBreakdownMode = 'all';
let categoryBreakdownKind = 'out'; // 'out' = spending, 'in' = income
let monthCatMode = 'all';
let upcomingBillsWindow = 14;

function render(){
  document.getElementById('monthLabel').textContent = monthLabelFromKey(state.currentMonthKey);
  document.body.setAttribute('data-theme', state.theme);
  document.getElementById('themeSelect').value = state.theme;

// Days until the next dated income that hasn't been received yet (this month or next),
// preferring regular pay (recurring or Salary). null when nothing is scheduled.
function daysUntilPayday(){
  const today = new Date(); today.setHours(0,0,0,0);
  const cur = monthKey(today), nxt = monthKey(new Date(today.getFullYear(), today.getMonth()+1, 1));
  let regular = null, any = null;
  [cur, nxt].forEach(k=>{
    const m = state.months[k];
    if(!m) return;
    const [y, mo] = k.split('-').map(Number);
    m.incoming.forEach(i=>{
      if(i.status==='done' || i.transfer || !((Number(i.amount)||0)>0)) return;
      const d = resolveScheduledDay(i, y, mo);
      if(!d) return;
      const date = new Date(y, mo-1, d);
      if(date<=today) return;
      if(any===null || date<any) any = date;
      if((i.recurring || i.category==='Salary') && (regular===null || date<regular)) regular = date;
    });
  });
  const pick = regular || any;
  return pick ? Math.round((pick-today)/86400000) : null;
}

let emberMemo = {rev:-1, data:null};
function emberStats(){
  if(emberMemo.rev===dataRev && emberMemo.data) return emberMemo.data;
  const now = new Date(); now.setHours(0,0,0,0);
  const curKey = monthKey(now);
  const dayIdx = (y,m0,d)=>Math.round(Date.UTC(y,m0,d)/86400000);
  const todayIdx = dayIdx(now.getFullYear(), now.getMonth(), now.getDate());
  // days with something logged in Quick Add
  const logSet = new Set();
  let doneItems = 0;
  Object.keys(state.months).forEach(k=>{
    const m = state.months[k];
    [...m.outgoings, ...m.incoming].forEach(it=>{
      if(it.quickAdd && it.ts){ const d = new Date(it.ts); logSet.add(dayIdx(d.getFullYear(), d.getMonth(), d.getDate())); }
      else if(it.status==='done' && !it.pay3Id) doneItems++;
    });
  });
  const days = [...logSet].sort((a,b)=>a-b);
  let best = 0, run = 0;
  days.forEach((d,i)=>{ run = (i>0 && d===days[i-1]+1) ? run+1 : 1; best = Math.max(best, run); });
  let cur = 0, probe = logSet.has(todayIdx) ? todayIdx : todayIdx-1;
  while(logSet.has(probe)){ cur++; probe--; }
  const last7 = []; for(let i=6;i>=0;i--) last7.push(logSet.has(todayIdx-i));
  // monthly scores
  const monthRows = Object.keys(state.months).filter(k=>k<=curKey).sort().map(k=>({k, sc:monthScoreData(k)})).filter(x=>x.sc && x.sc.active);
  const good = monthRows.map(x=>x.sc.score>=80);
  let bestB = 0, runB = 0; good.forEach(g=>{ runB = g ? runB+1 : 0; bestB = Math.max(bestB, runB); });
  let curB = 0; for(let i=good.length-1;i>=0 && good[i];i--) curB++;
  const goodMonths70 = monthRows.filter(x=>x.sc.score>=70).length;
  const bonusXp = state.ember.bonusXp||0, bossXp = bossXpFromPlans();
  const xp = days.length*5 + goodMonths70*15 + doneItems + bonusXp + bossXp;
  const lvlFloor = emberLvlFloor;
  let level = 1; while(xp >= lvlFloor(level+1)) level++;
  const span = lvlFloor(level+1)-lvlFloor(level);
  const levelPct = Math.round((xp-lvlFloor(level))/span*100);
  const xpToNext = lvlFloor(level+1)-xp;
  // badges
  const earned = {};
  const pots = round2(potBalance('savings') + potBalance('stocks'));
  earned.k1 = pots>=1000;
  earned.s7 = best>=7; earned.s30 = best>=30;
  earned.sc80 = monthRows.some(x=>x.sc.score>=80);
  earned.b3 = bestB>=3;
  earned.pot = monthRows.some(x=>x.k<curKey && x.sc.parts.find(p=>p.id==='bills').pts>=19.99 && state.months[x.k].outgoings.filter(o=>!o.quickAdd).length>=3);
  earned.sav = Object.keys(state.months).filter(k=>k<=curKey).some(k=>{ const t = monthTotals(state.months[k]); return t.allIncoming>0 && (t.savingsAmount+t.stocksAmount)/t.allIncoming>=0.2; });
  const plans = Array.isArray(state.pay3) ? state.pay3 : [];
  earned.p3 = plans.length>0 && plans.every(pl=>pl.inst && pl.inst.length && pl.inst.every(i=>i.paid));
  // a whole past weekend with nothing logged, in a week where you were logging
  earned.nsw = false;
  if(days.length>=3){
    for(let d=days[0]; d<todayIdx-1 && !earned.nsw; d++){
      const dt = new Date(d*86400000); if(dt.getUTCDay()!==6) continue;       // Saturday
      if(logSet.has(d) || logSet.has(d+1) || d+1>=todayIdx) continue;
      let around = 0; for(let j=1;j<=5;j++){ if(logSet.has(d-j)) around++; }
      if(around>=2) earned.nsw = true;
    }
  }
  // flame mood
  const cm = state.months[curKey];
  const ct = cm ? monthTotals(cm) : null;
  const curScore = monthRows.length && monthRows[monthRows.length-1].k===curKey ? monthRows[monthRows.length-1].sc.score : null;
  const overdue = cm ? (()=>{ const sc = monthScoreData(curKey); const b = sc && sc.parts.find(p=>p.id==='bills'); return b && b.pts<19.99; })() : false;
  const activeLogger = days.some(d=>d>=todayIdx-60);
  const gap = days.length ? todayIdx - days[days.length-1] : 99;
  let flame = 'st', why = 'You\'re on track.';
  if((ct && ct.totalLeftOver<0) || overdue || (activeLogger && gap>=4)){
    flame = 'lo';
    why = ct && ct.totalLeftOver<0 ? 'You\'re over budget this month.' : overdue ? 'A bill is overdue.' : 'You haven\'t logged anything for a few days.';
  } else if(cur>=30 || (curScore!==null && curScore>=85)){
    flame = 'bl'; why = cur>=30 ? 'A big logging streak!' : 'Score 85+ — brilliant.';
  }
  const data = {logDays:days.length, cur, best, last7, bestB, curB, xp, level, levelPct, xpToNext, earned, flame, why, curScore};
  emberMemo = {rev:dataRev, data};
  return data;
}

// Congratulate new milestones / level-ups once (the first visit just records what you already have).
function checkEmberMilestones(){
  const e = emberStats();
  const st = state.ember;
  const nowEarned = EMBER_BADGES.filter(b=>e.earned[b.id]).map(b=>b.id);
  if(!st.init){ st.init = true; st.seen = nowEarned; st.level = e.level; save(); return; }
  const fresh = nowEarned.filter(id=>!st.seen.includes(id));
  const oldLevel = st.level || 1;
  const leveled = e.level > oldLevel;
  if(!fresh.length && !leveled) return;
  st.seen = nowEarned; st.level = e.level; save();
  if(state.celebrate){
    const names = fresh.map(id=>EMBER_BADGES.find(b=>b.id===id).name);
    const newSkins = leveled ? EMBER_SKINS.filter(k=>!k.season && k.lvl>(oldLevel||1) && k.lvl<=e.level).map(k=>k.name) : [];
    const msg = leveled ? `Ember reached Level ${e.level}` : 'New milestone';
    setTimeout(()=>{
      showToast(msg, [...names, ...newSkins.map(n=>'New skin: '+n)].join(' · ') || 'Keep it burning');
      const btn = document.getElementById('emberBtn');
      if(btn){ btn.classList.remove('ember-burst'); void btn.offsetWidth; btn.classList.add('ember-burst'); }
    }, 500);
  }
}

  const quickAddAmount = document.getElementById('quickAddAmount');
  const quickAddReason = document.getElementById('quickAddReason');
  const quickAddType = document.getElementById('quickAddType');
  const quickAddCategory = document.querySelector('.quickAddCategory');
  const quickAddReasonEl = document.getElementById('quickAddReason');
  const smartOut = attachSmartCategory(quickAddReasonEl, quickAddCategory, 'out');
  initCategoryDropdown(quickAddCategory, ()=>smartOut.markPicked());
  const quickAddIncomeCategory = document.querySelector('.quickAddIncomeCategory');
  const smartIn = attachSmartCategory(quickAddReasonEl, quickAddIncomeCategory, 'in');
  initCategoryDropdown(quickAddIncomeCategory, ()=>smartIn.markPicked());
  const syncQuickAddCategoryVisibility = ()=>{
    const isOut = quickAddType.value==='out';
    quickAddCategory.style.display = isOut ? '' : 'none';
    quickAddIncomeCategory.style.display = isOut ? 'none' : '';
    document.querySelectorAll('#quickAddSeg .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.v===quickAddType.value));
  };
  syncQuickAddCategoryVisibility();
  quickAddType.onchange = syncQuickAddCategoryVisibility;
  document.querySelectorAll('#quickAddSeg .seg-btn').forEach(b=>{
    b.onclick = ()=>{ quickAddType.value = b.dataset.v; syncQuickAddCategoryVisibility(); };
  });
  const doQuickAdd = ()=>{
    const amt = Number(quickAddAmount.value);
    if(!amt || amt<=0) return;
    const reason = quickAddReason.value.trim();
    const type = quickAddType.value;
    const repeat = document.getElementById('quickAddRepeat').getAttribute('aria-pressed')==='true';
    const entry = {id:uid(), name: reason || (type==='out'?'Spent':'Received'), amount: amt, status:'done', recurring:false, quickAdd:true, ts:Date.now()};
    if(repeat){
      // A repeating Quick Add is a regular recurring item: it lands in Outgoings/Incoming (not just the log),
      // is dated today, counts as done this month, and appears in every later month.
      delete entry.quickAdd; delete entry.ts;
      entry.recurring = true;
      const [ky, kmo] = state.currentMonthKey.split('-').map(Number);
      entry.day = Math.min(new Date().getDate(), new Date(ky, kmo, 0).getDate());
    }
    const listKey = type==='out' ? 'outgoings' : 'incoming';
    entry.category = (type==='out' ? quickAddCategory : quickAddIncomeCategory).dataset.value;
    m[listKey].push(entry);
    if(repeat) syncNewRecurringForward(entry, state.currentMonthKey, listKey);
    const lucky = repeat ? null : luckyRoll();
    save();
    quickAddLogExpanded = !repeat || quickAddLogExpanded;
    renderMonth();
    showToast(`Added ${fmt(amt)}${repeat?' · repeats monthly':''}`, type==='out' ? (entry.category||entry.name) : entry.name);
    if(lucky) setTimeout(()=>showLuckyEmber(lucky), 900);
  };
  document.getElementById('quickAddBtn').onclick = doQuickAdd;
  const repeatBtn = document.getElementById('quickAddRepeat');
  repeatBtn.onclick = ()=>{
    const on = repeatBtn.getAttribute('aria-pressed')!=='true';
    repeatBtn.setAttribute('aria-pressed', on);
    repeatBtn.classList.toggle('on', on);
  };
  [quickAddAmount, quickAddReason].forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doQuickAdd(); });
  });

  const receiptInput = document.getElementById('receiptInput');
  const receiptStatus = document.getElementById('receiptStatus');
  receiptInput.onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;
    quickAddType.value = 'out';
    syncQuickAddCategoryVisibility();
    receiptStatus.className = 'quick-receipt-status';
    receiptStatus.textContent = 'Loading scanner…';
    try{
      await ensureTesseractLoaded();
      receiptStatus.textContent = 'Cleaning up photo…';
      let stage = 'Scanning';
      const { text, confidence } = await ocrReceipt(file, p=>{ receiptStatus.textContent = `${stage}… ${Math.round(p*100)}%`; }, label=>{ stage = label.replace('…',''); });
      console.log('Receipt OCR confidence', Math.round(confidence), text);
      if(confidence < 35){
        receiptStatus.className = 'quick-receipt-status error';
        receiptStatus.textContent = "Couldn't read that clearly — lay the receipt flat in good light, fill the frame, and try again. Or enter it manually.";
      } else {
        const parsed = parseReceiptText(text, confidence);
        if(parsed.amount) quickAddAmount.value = parsed.amount;
        if(parsed.reason) quickAddReason.value = parsed.reason;
        const scanCat = parsed.category || (parsed.reason && (suggestCategory(parsed.reason,'out')||{}).category);
        if(scanCat) smartOut.markAuto(scanCat, 'keyword');
        receiptStatus.className = 'quick-receipt-status ok';
        receiptStatus.textContent = !parsed.amount ? "Couldn't find a total — fill it in manually. (A flat, well-lit photo that fills the frame reads best.)"
          : confidence < 60 ? 'Low confidence — double-check the amount before adding.'
          : 'Got a guess — check it before adding.';
      }
    }catch(err){
      console.error('Receipt scan failed', err);
      receiptStatus.className = 'quick-receipt-status error';
      receiptStatus.textContent = 'Could not read that image — try a clearer photo, or enter it manually.';
    }
    receiptInput.value = '';
  };

  const quickAddLogToggle = document.getElementById('quickAddLogToggle');
  const quickAddLogWrap = document.getElementById('quickAddLogWrap');
  quickAddLogToggle.onclick = ()=>{
    quickAddLogExpanded = !quickAddLogExpanded;
    applyQuickAddLogState();
  };
  function applyQuickAddLogState(){
    const count = m.incoming.filter(i=>i.quickAdd).length + m.outgoings.filter(o=>o.quickAdd).length;
    quickAddLogWrap.classList.toggle('hidden', !quickAddLogExpanded);
    quickAddLogToggle.textContent = (quickAddLogExpanded ? '▾ Hide log' : '▸ Show log') + (count ? ` (${count})` : '');
  }
  function drawQuickAddLog(){
    applyQuickAddLogState();
    const body = document.getElementById('quickAddLogBody');
    const entries = [
      ...m.incoming.filter(i=>i.quickAdd).map(i=>({...i, kind:'in'})),
      ...m.outgoings.filter(o=>o.quickAdd).map(o=>({...o, kind:'out'}))
    ].sort((a,b)=>(b.ts||0)-(a.ts||0));
    body.innerHTML = entries.length ? entries.map(e=>`
      <tr data-id="${e.id}" data-kind="${e.kind}">
        <td>${e.kind==='in' ? '<span style="color:var(--green);">In</span>' : '<span style="color:var(--red);">Out</span>'}</td>
        <td>${catTile(e.category||(e.kind==='in'?'Salary':'Uncategorized'),'sm inl')}${escapeHtml(e.name)}</td>
        <td class="amt-cell">${fmt(e.amount)}</td>
        <td><button class="del-btn quick-log-del">✕</button></td>
      </tr>
    `).join('') : `<tr><td colspan="4" class="empty">No quick adds yet this month</td></tr>`;
    body.querySelectorAll('tr').forEach(tr=>{
      const btn = tr.querySelector('.quick-log-del');
      if(!btn) return;
      btn.onclick = ()=>{
        const id = tr.dataset.id, kind = tr.dataset.kind;
        removeWithUndo(m, kind==='in' ? 'incoming' : 'outgoings', id, null, ()=>renderMonth());
      };
    });
  }
  drawQuickAddLog();

  document.getElementById('startingBalanceInput').oninput = e=>{ m.startingBalance = Number(e.target.value); save(); refreshCards(); };
  const liveBalanceInput = document.getElementById('liveBalanceInput');
  const commitBalanceEdit = e=>{
    const newVal = Number(e.target.value);
    const currentLive = monthTotals(m).liveBalance;
    const delta = round2(newVal - currentLive);
    if(delta){ m.adjustment = round2((Number(m.adjustment)||0) + delta); save(); }
    refreshCards();
  };
  liveBalanceInput.onchange = commitBalanceEdit;
  liveBalanceInput.addEventListener('keydown', e=>{ if(e.key==='Enter') e.target.blur(); });
  const clearAdjustmentLink = document.getElementById('clearAdjustment');
  if(clearAdjustmentLink){
    clearAdjustmentLink.onclick = e=>{
      e.preventDefault();
      m.adjustment = 0; save(); renderMonth();
    };
  }
  const refreshWeekSummary = wk=>{
    const item = el.querySelector(`.wk-item[data-week="${wk}"]`);
    if(item) item.querySelector('.wk-summary').innerHTML = weekSummaryHtml(['week1','week2','week3','week4'].indexOf(wk), m.weekly[wk]);
  };
  el.querySelectorAll('.wk-item').forEach(item=>{
    const wk = item.dataset.week;
    const summary = item.querySelector('.wk-summary');
    const toggle = ()=>{
      const open = item.classList.contains('collapsed');
      item.classList.toggle('collapsed', !open);
      if(open) expandedWeeks.add(wk); else expandedWeeks.delete(wk);
    };
    summary.onclick = e=>{ if(e.target.closest('.cs-status')){ toggleStatusSelect(item.querySelector('.stog select')); return; } toggle(); };
    summary.onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } };
  });
  el.querySelectorAll('.week-input').forEach(inp=>{
    inp.oninput = e=>{ const wk = e.target.dataset.week; m.weekly[wk].amount = Number(e.target.value); save(); refreshCards(); refreshWeekSummary(wk); };
  });
  el.querySelectorAll('.week-status').forEach(sel=>{
    sel.onchange = e=>{
      const wk = e.target.dataset.week;
      m.weekly[wk].status = e.target.value; save();
      e.target.className = `week-status status-select status-${e.target.value}`;
      refreshCards();
      refreshWeekSummary(wk);
    };
  });
  el.querySelectorAll('.week-recur').forEach(sel=>{
    sel.onchange = e=>{
      const wk = e.target.dataset.week;
      m.weekly[wk].recurring = (e.target.value==='yes');
      if(m.weekly[wk].recurring) syncNewRecurringWeeklyForward(state.currentMonthKey, wk, m.weekly[wk].amount);
      else stopRecurringWeekInLaterMonths(m, wk);
      save();
      e.target.className = `week-recur recur-select ${m.weekly[wk].recurring?'recur-yes':'recur-no'}`;
      refreshWeekSummary(wk);
    };
  });
  document.getElementById('savingsInput').oninput = e=>{ m.savings.amount = Number(e.target.value); save(); refreshCards(); };
  const savingsStatusSel = el.querySelector('.savings-status');
  savingsStatusSel.onchange = e=>{
    m.savings.status = e.target.value; save();
    e.target.className = `savings-status status-select status-${e.target.value}`;
    refreshCards();
  };
  document.getElementById('stocksInput').oninput = e=>{ m.stocks.amount = Number(e.target.value); save(); refreshCards(); };
  const stocksStatusSel = el.querySelector('.stocks-status');
  stocksStatusSel.onchange = e=>{
    m.stocks.status = e.target.value; save();
    e.target.className = `stocks-status status-select status-${e.target.value}`;
    refreshCards();
  };

  const incomeBody = document.getElementById('incomeBody');
  function drawIncome(){
    const vInfo = virtualIncomeInfo(m);
    const vFrom = vInfo.key ? monthLabelFromKey(vInfo.key).split(' ')[0] : '';
    const virtualRows = vInfo.items.map(i=>`
      <tr class="inc-virtual"><td colspan="7">
        <div class="iv-row">
          <span class="iv-lock" title="Paid last month to fund this month's budget. Edit it in ${escapeHtml(vFrom)}.">${iconSvg('M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3').replace('<svg ','<svg class="hero-ico" ')}</span>
          ${catTile(i.category||'Uncategorized','sm')}
          <div class="iv-main"><div class="iv-name">${escapeHtml(i.name)}</div><div class="iv-sub">from ${escapeHtml(vFrom)} · funds this month's budget</div></div>
          <div class="iv-amt">${escapeHtml(fmt(Number(i.amount)||0))}</div>
          <span class="iv-status${i.status==='done'?' done':''}">${i.status==='done'?'Received ✓':'Expected'}</span>
        </div>
      </td></tr>`).join('');
    incomeBody.innerHTML = virtualRows + m.incoming.map(i=>`
      <tr data-id="${i.id}" class="out-row inc-row${expandedIncRows.has(i.id)?'':' collapsed'}">
        <td class="cell-summary" role="button" tabindex="0" aria-label="Show or hide details">${incomeSummaryHtml(i)}</td>
        <td class="cell-name">
          <div class="cell-name-flex">
            <input class="row-input inc-name" type="text" value="${escapeHtml(i.name)}">
            <div class="name-sub"><span class="hint schedule-hint">${scheduleHint(i, curYear, curMonthNum)}</span>${fundsSelectHtml('inc-funds', i)}</div>
          </div>
        </td>
        <td class="cell-incat" data-label="Category">${categoryDropdownHtml('inc-category', i.category, INCOME_CATEGORIES)}</td>
        <td class="cell-sched" data-label="Schedule">${scheduleSelectHtml('inc-schedule', i)}</td>
        <td data-label="Amount"><input class="row-input inc-amount amt-cell" type="number" step="0.01" value="${i.amount}"></td>
        <td data-label="Status">${statusSelectHtml('inc-status', i.status, {yes:'Received', no:'Not received'})}</td>
        <td data-label="Recurring">${recurringSelectHtml('inc-recur', i.recurring)}</td>
        <td class="cell-del"><button class="del-btn inc-del" aria-label="Delete income"><span class="del-x">✕</span><span class="del-label">Delete this income</span></button></td>
      </tr>
    `).join('');
    if(!incomeBody.innerHTML.trim()) incomeBody.innerHTML = `<tr><td colspan="7" class="empty">No incoming added yet</td></tr>`;
    incomeBody.querySelectorAll('tr:not(.inc-virtual)').forEach(tr=>{
      const id = tr.dataset.id;
      const item = m.incoming.find(x=>x.id===id);
      if(!item) return;
      const summary = tr.querySelector('.cell-summary');
      const refreshSummary = ()=>{ summary.innerHTML = incomeSummaryHtml(item); };
      const toggleRow = ()=>{
        const open = tr.classList.contains('collapsed');
        tr.classList.toggle('collapsed', !open);
        if(open) expandedIncRows.add(id); else expandedIncRows.delete(id);
      };
      summary.onclick = e=>{ if(e.target.closest('.cs-status')){ toggleStatusSelect(tr.querySelector('.stog select')); return; } toggleRow(); };
      summary.onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggleRow(); } };
      tr.querySelector('.inc-name').oninput = e=>{ item.name=e.target.value; save(); refreshSummary(); };
      tr.querySelector('.inc-name').onchange = ()=>{
        const c = autoCategoryForName(item.name, item.category, 'in');
        if(!c) return;
        item.category = c;
        setCategoryDropdownValue(tr.querySelector('.inc-category'), c);
        propagateOutgoingFieldForward(item, state.currentMonthKey, 'category', 'incoming');
        save(); refreshCards(); refreshSummary();
      };
      tr.querySelector('.inc-amount').oninput = e=>{ item.amount=Number(e.target.value); save(); refreshCards(); refreshSummary(); };
      const sel = tr.querySelector('.inc-status');
      sel.onchange = e=>{ item.status=e.target.value; save(); e.target.className = `inc-status status-select status-${e.target.value}`; refreshCards(); refreshSummary(); afterIncomeMarkedDone(item, state.currentMonthKey); };
      const recurSel = tr.querySelector('.inc-recur');
      recurSel.onchange = e=>{ item.recurring = (e.target.value==='yes'); if(item.recurring) syncNewRecurringForward(item, state.currentMonthKey, 'incoming'); else stopRecurringInLaterMonths(m, 'incoming', item); save(); e.target.className = `inc-recur recur-select ${item.recurring?'recur-yes':'recur-no'}`; refreshSummary(); };
      initCategoryDropdown(tr.querySelector('.inc-category'), val=>{ item.category = val; propagateOutgoingFieldForward(item, state.currentMonthKey, 'category', 'incoming'); save(); refreshSummary(); });
      tr.querySelector('.inc-funds').onchange = e=>{
        item.fundsNext = e.target.value==='next';
        if(item.recurring) propagateOutgoingFieldForward(item, state.currentMonthKey, 'fundsNext', 'incoming');
        save();

// Walks forward day by day from today (real calendar date, independent of
// whichever month is being viewed) looking for pending outgoings with a Day
// set. Only looks at months that already exist — it never creates one just
// to peek ahead.
function upcomingBills(daysAhead){
  const today = new Date();
  today.setHours(0,0,0,0);
  const results = [];
  for(let i=0; i<=daysAhead; i++){
    const d = new Date(today);
    d.setDate(d.getDate()+i);
    const mk = monthKey(d);
    const m = state.months[mk];
    if(!m) continue;
    const [yy, mo] = mk.split('-').map(Number);
    m.outgoings.forEach(o=>{
      if(o.status==='done') return;
      if(resolveScheduledDay(o, yy, mo) === d.getDate()){
        results.push({type:'out', name:o.name, amount:o.amount, category:o.category, recurring:!!o.recurring, daysAway:i, dueDate:new Date(d)});
      }
    });
    m.incoming.forEach(inc=>{
      if(inc.status==='done') return;
      if(resolveScheduledDay(inc, yy, mo) === d.getDate()){
        results.push({type:'in', name:inc.name, amount:inc.amount, daysAway:i, dueDate:new Date(d)});
      }
    });
  }
  results.sort((a,b)=>a.daysAway-b.daysAway);
  return results;
}
function renderUpcomingBills(){
  const el = document.getElementById('upcomingBillsList');
  if(!el) return;
  document.querySelectorAll('#upcomingBillsToggle .seg-btn').forEach(b=>{
    b.classList.toggle('active', Number(b.dataset.days)===upcomingBillsWindow);
    b.onclick = ()=>{ upcomingBillsWindow = Number(b.dataset.days); renderUpcomingBills(); };
  });
  const items = upcomingBills(upcomingBillsWindow);
  if(!items.length){
    el.innerHTML = `<div class="empty">Nothing due or arriving in the next ${upcomingBillsWindow} days.</div>`;
    return;
  }
  const fmtDate = d => d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
  const when = n => n===0 ? 'today' : n===1 ? 'tomorrow' : `in ${n} days`;
  const bills = items.filter(b=>b.type==='out');
  const next = bills[0] || null;
  const thisWeek = items.filter(b=>b.daysAway<=7);
  const later = items.filter(b=>b.daysAway>7);
  const sum = list => round2(list.filter(b=>b.type==='out').reduce((a,b)=>a+(Number(b.amount)||0),0));
  const count = list => list.filter(b=>b.type==='out').length;
  const row = (b, showWhen) => {
    const isIn = b.type==='in';
    const cat = isIn ? 'Salary' : (b.category||'Uncategorized');
    return `<div class="ub-row">
      ${catTile(cat,'sm')}
      <div class="ub-info"><div class="ub-name">${escapeHtml(b.name)}</div><div class="ub-date${b.daysAway<=1?' due-soon':''}">${isIn?'Arrives ':''}${fmtDate(b.dueDate)}${showWhen?` · ${when(b.daysAway)}`:''}</div></div>
      <div class="ub-amt" style="${isIn?'color:var(--green);':''}">${isIn?'+':''}${escapeHtml(fmt(b.amount))}</div>
    </div>`;
  };
  const group = (title, list, showWhen) => {
    if(!list.length) return '';
    const n = count(list);
    return `<div class="ub-group">
      <div class="ub-group-head"><div class="ub-group-title">${title}</div><div class="ub-group-sum">${n?`${n} bill${n!==1?'s':''} · <b>${escapeHtml(fmt(sum(list)))}</b>`:'income only'}</div></div>
      <div class="ub-list">${list.map(b=>row(b, showWhen)).join('')}</div>
    </div>`;
  };
  // Hero card for the very next bill
  let nextHtml = '';
  if(next){
    const others = thisWeek.filter(b=>b.type==='out' && b!==next);
    const cat = next.category || 'Uncategorized';
    nextHtml = `<div class="ub-next">
      <div class="ub-next-top"><span class="ub-next-k">Next due</span><span class="ub-chip${next.daysAway<=1?' soon':''}">${next.daysAway===0?'Today':next.daysAway===1?'Tomorrow':'In '+next.daysAway+' days'}</span></div>
      <div class="ub-next-main">
        ${catTile(cat,'md')}
        <div class="ub-next-info"><div class="ub-next-name">${escapeHtml(next.name)}</div><div class="ub-next-sub">${fmtDate(next.dueDate)} · ${escapeHtml(cat)} · ${next.recurring?'Recurring':'One-off'}</div></div>
        <div class="ub-next-amt">${escapeHtml(fmt(next.amount))}</div>
      </div>
      ${others.length ? `<div class="ub-next-foot"><span>After this, ${others.length} more bill${others.length!==1?'s':''} this week</span><b>${escapeHtml(fmt(sum(others)))}</b></div>` : ''}
    </div>`;
  }
  const groups = group('This week', thisWeek, true) + group('Later', later, false);
  el.innerHTML = nextHtml + `<div class="ub-groups${thisWeek.length && later.length ? '' : ' single'}">${groups}</div>`;
}

// ---------------- Calendar ----------------
// Days (1-31, clamped to the month's real length) that have a pending
// (not yet Done) outgoing with a Day set — name:[] map. Shared by the
// Calendar tab's bill-dot strip and the Trend heatmap's bill markers.
function billDaysForMonth(monthKey){
  const m = state.months[monthKey];
  const map = {};
  if(!m) return map;
  const [y, mo] = monthKey.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(o.status==='done') return;
    const day = resolveScheduledDay(o, y, mo);
    if(!day) return;
    (map[day] = map[day]||[]).push(o.name);
  });
  return map;
}
// Same idea as billDaysForMonth but for pending incoming (pay) — used to mark
// payday on the Calendar tab and the Trend heatmap.
function payDaysForMonth(monthKey){
  const m = state.months[monthKey];
  const map = {};
  if(!m) return map;
  const [y, mo] = monthKey.split('-').map(Number);
  m.incoming.forEach(inc=>{
    if(inc.status==='done') return;
    const day = resolveScheduledDay(inc, y, mo);
    if(!day) return;
    (map[day] = map[day]||[]).push(inc.name);
  });
  return map;
}

// Deletes a tracked month entirely. If it was the currently viewed month,
// moves to the nearest remaining month (or starts a fresh one if none are
// left) so the app is never left pointing at a month that no longer exists.
function deleteMonth(key){
  delete state.months[key];
  const remaining = Object.keys(state.months).sort();
  if(state.currentMonthKey === key){
    if(remaining.length){
      const before = remaining.filter(k=>k<key).pop();
      state.currentMonthKey = before || remaining[0];
    } else {
      const freshKey = monthKey(new Date());
      state.currentMonthKey = freshKey;
      state.months[freshKey] = freshMonth(0);
    }
  }
  save();
}

// ---------------- Trend ----------------
// Which slice of tracked months the Trend charts show: a number of months, or
// 'all'. The window is placed around the month being viewed, leaning forward
// so upcoming (projected) months are visible.
let trendRange = 12;
function trendWindow(keys){
  const n = keys.length;
  const size = trendRange==='all' ? n : Math.min(n, trendRange);
  let anchor = 0;
  keys.forEach((k,i)=>{ if(k<=state.currentMonthKey) anchor = i; });
  let start = anchor - Math.floor(size/3);
  start = Math.max(0, Math.min(n-size, start));
  return Array.from({length:size}, (_,i)=>start+i);
}

// Compares this month's category spend against the previous tracked month, one
// callout per category whose spend actually changed — biggest swings first.
function renderCategoryDeltas(monthKey, mode, elId, kind){
  const isIncome = kind==='in';
  const rowsFor = mm => isIncome ? incomeBreakdown(mm, mode) : categoryBreakdown(mm, mode);
  const el = document.getElementById(elId||'catBreakdownDeltas');
  if(!el) return;
  const keys = Object.keys(state.months).sort();
  const idx = keys.indexOf(monthKey);
  if(idx<=0){
    el.innerHTML = '<div class="hint" style="font-size:12px;">Track an earlier month too to see month-over-month comparisons.</div>';
    return;
  }
  const prevKey = keys[idx-1];
  const curMap = {}; rowsFor(state.months[monthKey]).forEach(r=>curMap[r.category]=r.amount);
  const prevMap = {}; rowsFor(state.months[prevKey]).forEach(r=>prevMap[r.category]=r.amount);
  const cats = new Set([...Object.keys(curMap), ...Object.keys(prevMap)]);
  const deltas = [];
  cats.forEach(category=>{
    const cur = curMap[category]||0, prev = prevMap[category]||0;
    const diff = round2(cur-prev);
    if(Math.abs(diff) < 0.01) return;
    deltas.push({category, cur, prev, diff});
  });
  if(!deltas.length){
    el.innerHTML = `<div class="hint" style="font-size:12px;">No change from ${monthLabelFromKey(prevKey)} in any category.</div>`;
    return;
  }
  deltas.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  el.innerHTML = `
    <div class="hint" style="font-size:12px;margin-bottom:6px;">Compared to ${monthLabelFromKey(prevKey)}</div>
    ${deltas.slice(0,6).map(d=>{
      const up = d.diff>0;
      let text;
      if(d.prev<=0){
        text = isIncome ? `<b>${escapeHtml(d.category)}</b>: new this month (${fmt(d.cur)})` : `New spending on <b>${escapeHtml(d.category)}</b>: ${fmt(d.cur)}`;
      } else if(d.cur<=0){
        text = isIncome ? `<b>${escapeHtml(d.category)}</b>: nothing this month (was ${fmt(d.prev)})` : `No more spending on <b>${escapeHtml(d.category)}</b> (was ${fmt(d.prev)})`;
      } else {
        const pct = Math.round(Math.abs(d.diff)/d.prev*100);
        text = isIncome
          ? `<b>${escapeHtml(d.category)}</b>: <b>${pct}% ${up?'more':'less'}</b> than ${monthLabelFromKey(prevKey)} (${fmt(d.cur)} vs ${fmt(d.prev)})`
          : `You spent <b>${pct}% ${up?'more':'less'}</b> on <b>${escapeHtml(d.category)}</b> than ${monthLabelFromKey(prevKey)} (${fmt(d.cur)} vs ${fmt(d.prev)})`;
      }
      const good = isIncome ? up : !up;
      return `<div class="delta-row">
        <span class="delta-arrow ${good?'delta-down':'delta-up'}">${up?'▲':'▼'}</span>
        ${catTile(d.category)}
        <span class="delta-text">${text}</span>
      </div>`;
    }).join('')}
  `;
}
// Daily spend heatmap data: Quick Add entries carry a real timestamp, so those
// are placed on their exact day; any other outgoing with an optional "Day" set
// (e.g. Rent on the 1st) is placed on that day of the displayed month, clamped
// to the month's actual length. In 'done' mode, dated non-Quick-Add outgoings
// only count once marked Done — Quick Add entries are always Done already.
function dailySpendSeries(monthKey, mode){
  const m = state.months[monthKey];
  const days = {};
  if(!m) return days;
  const [y, mo] = monthKey.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(o.quickAdd && o.ts){
      const d = new Date(o.ts);
      if(d.getFullYear()!==y || (d.getMonth()+1)!==mo) return;
      const day = d.getDate();
      days[day] = round2((days[day]||0) + (Number(o.amount)||0));
      return;
    }
    if(mode==='done' && o.status!=='done') return;
    const day = resolveScheduledDay(o, y, mo);
    if(day) days[day] = round2((days[day]||0) + (Number(o.amount)||0));
  });
  return days;
}
function hexToRgbTriplet(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? `${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}` : '91,140,255';
}
// ---- Daily spending heatmap (month view, year view, day details) ----
let heatmapMonth = null, heatmapMode = 'all', heatmapView = 'month', heatmapYear = null;
const mondayIndexOf = jsDay => (jsDay+6)%7; // JS: 0=Sun..6=Sat -> Monday-first
const WEEKDAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

// Compact money for tiny cells: £42, £4.50, £1.2k.
function fmtCompact(n){
  const v = Math.abs(n), sign = n<0 ? '-' : '';
  if(v>=10000) return sign+state.currency+Math.round(v/1000)+'k';
  if(v>=1000) return sign+state.currency+(v/1000).toFixed(1).replace(/\.0$/,'')+'k';
  if(v>=100) return sign+state.currency+Math.round(v);
  return sign+state.currency+v.toFixed(2).replace(/\.00$/,'');
}
function heatmapCtx(mk){
  const [y, mo] = mk.split('-').map(Number);
  const dim = new Date(y, mo, 0).getDate();
  const now = new Date();
  const isCurrent = mk===monthKey(now), isPast = mk<monthKey(now);
  return {y, mo, dim, isCurrent, isPast, today: isCurrent ? now.getDate() : 0, elapsed: isPast ? dim : (isCurrent ? now.getDate() : 0)};
}
// Every dated outgoing/incoming (any status) by day, for tooltips, ghost
// amounts and the day-detail panel.
function scheduledByDay(mk){
  const m = state.months[mk];
  const bills = {}, pays = {};
  if(!m) return {bills, pays};
  const [y, mo] = mk.split('-').map(Number);
  m.outgoings.forEach(o=>{
    const d = resolveScheduledDay(o, y, mo);
    if(d && !o.quickAdd) (bills[d] = bills[d]||[]).push({name:o.name, amount:Number(o.amount)||0, done:o.status==='done', category:o.category||'Uncategorized'});
  });
  m.incoming.forEach(i=>{
    const d = resolveScheduledDay(i, y, mo);
    if(d && !i.quickAdd) (pays[d] = pays[d]||[]).push({name:i.name, amount:Number(i.amount)||0, done:i.status==='done'});
  });
  return {bills, pays};
}
// Quick Add spends only, by day — everyday discretionary spending, free of
// bills like rent that would otherwise dominate weekday patterns.
function discretionaryByDay(mk){
  const m = state.months[mk];
  const days = {};
  if(!m) return days;
  const [y, mo] = mk.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(!(o.quickAdd && o.ts)) return;
    const d = new Date(o.ts);
    if(d.getFullYear()!==y || (d.getMonth()+1)!==mo) return;
    days[d.getDate()] = round2((days[d.getDate()]||0) + (Number(o.amount)||0));
  });
  return days;
}
function cumulativeSpend(series, dim, upto){
  const out = [];
  let run = 0;
  for(let d=1; d<=Math.min(dim, upto); d++){ run += series[d]||0; out.push(round2(run)); }
  return out;
}

function heatmapMonthHtml(mk){
  const c = heatmapCtx(mk);
  const daySpend = dailySpendSeries(mk, heatmapMode);

  const firstDow = mondayIndexOf(new Date(c.y, c.mo-1, 1).getDay());

  // Month stats

  for(let d=1; d<=c.dim; d++){
    const amt = daySpend[d]||0;
    if(amt>0 && (!busiest || amt>busiest.amt)) busiest = {day:d, amt};
    if(d<=c.elapsed){
      spentToDate += amt;
      if(amt===0){ noSpend++; run++; best = Math.max(best, run); } else run = 0;

  const curStreak = run;
  const total = round2(Object.values(daySpend).reduce((a,b)=>a+b,0));
  const chips = [
    `<div class="hm-stat"><div class="k">Month total</div><div class="v">${fmt(total)}</div></div>`,
    c.elapsed>0 ? `<div class="hm-stat"><div class="k">Daily average</div><div class="v">${fmt(round2(spentToDate/c.elapsed))}</div></div>` : '',
    busiest ? `<div class="hm-stat"><div class="k">Busiest day</div><div class="v">${monthShort} ${busiest.day} · ${fmt(busiest.amt)}</div></div>` : '',
    c.elapsed>0 ? `<div class="hm-stat" title="Days with nothing logged against them"><div class="k">No-spend days</div><div class="v">${noSpend}<span class="hm-sub"> · best streak ${best}${curStreak>=2?` · now ${curStreak}`:''}</span></div></div>` : ''
  ].join('');

  let cells = '';
  for(let i=0; i<firstDow; i++) cells += `<div class="heatmap-cell empty"></div>`;
  for(let day=1; day<=c.dim; day++){
    const amt = daySpend[day]||0;
    const ratio = max>0 ? amt/max : 0;
    const dow = mondayIndexOf(new Date(c.y, c.mo-1, day).getDay());
    const isWeekend = dow >= 5;
    const isToday = day===c.today;
    const isFuture = !c.isPast && day>c.elapsed;
    const bg = amt>0 ? `rgba(${accentRgb},${(0.18+0.72*ratio).toFixed(2)})` : 'transparent';
    const dayBills = bills[day]||[], dayPays = pays[day]||[];
    const pendingBills = dayBills.filter(b=>!b.done), pendingPays = dayPays.filter(p=>!p.done);
    const ghostAmt = heatmapMode==='done' ? round2(pendingBills.reduce((a,b)=>a+b.amount,0)) : 0;
    const noSpendDay = !isFuture && amt===0;
    let tip = `<div style="font-weight:700;margin-bottom:3px;">${WEEKDAY_FULL[dow].slice(0,3)} ${day} ${monthShort}</div>`;
    tip += amt>0 ? `<div>Spent: ${escapeHtml(fmt(amt))}</div>` : (noSpendDay ? '<div style="color:var(--muted);">Nothing logged</div>' : '<div style="color:var(--muted);">Nothing planned</div>');
    pendingBills.forEach(b=>{ tip += `<div><span style="color:var(--amber);">●</span> Due: ${escapeHtml(b.name)} ${escapeHtml(fmt(b.amount))}</div>`; });
    pendingPays.forEach(p=>{ tip += `<div><span style="color:var(--green);">●</span> Pay: ${escapeHtml(p.name)} ${escapeHtml(fmt(p.amount))}</div>`; });
    tip += '<div style="color:var(--muted);margin-top:3px;">Click for details</div>';
    const markers = (pendingPays.length?'<span class="pay-marker"></span>':'') + (pendingBills.length?'<span class="bill-marker"></span>':'');
    const low = (amt>0 ? (ratio>0.5?'hm-hot':'') : '');
    cells += `<button type="button" class="heatmap-cell${isWeekend?' weekend':''}${isToday?' today':''}${isFuture?' future':''}${low?' '+low:''}" data-day="${day}" data-tip="${escapeHtml(tip)}" style="background:${bg};">
      <span class="hm-day">${day}</span>
      <span class="hm-markers">${markers}</span>
      <span class="hm-foot">
        ${amt>0 ? `<span class="hm-amt">${fmtCompact(amt)}</span>` : (noSpendDay ? '<span class="hm-tick">✓</span>' : '')}
        ${ghostAmt>0 ? `<span class="hm-ghost">${fmtCompact(ghostAmt)} due</span>` : ''}
      </span>
    </button>`;
  }

  // Weekday pattern from Quick Add spends only
  const wd = Array.from({length:7}, ()=>({sum:0, count:0}));
  for(let d=1; d<=c.elapsed; d++) wd[mondayIndexOf(new Date(c.y, c.mo-1, d).getDay())].count++;
  Object.entries(disc).forEach(([d,v])=>{ if(Number(d)<=c.elapsed) wd[mondayIndexOf(new Date(c.y, c.mo-1, Number(d)).getDay())].sum += v; });
  const avgs = wd.map(x=>x.count ? x.sum/x.count : 0);
  const maxAvg = Math.max(0, ...avgs);
  let wdInsight = 'Log spends with Quick Add to see which days cost you most.';
  if(maxAvg>0){
    const top = avgs.indexOf(maxAvg);
    wdInsight = `${WEEKDAY_FULL[top]}s cost you most — about ${fmt(round2(maxAvg))} on average.`;
    const sum = (idxs, f) => idxs.reduce((a,i)=>a+wd[i][f],0);
    const wkndDays = sum([5,6],'count'), wkdyDays = sum([0,1,2,3,4],'count');
    if(wkndDays>0 && wkdyDays>0){
      const wknd = sum([5,6],'sum')/wkndDays, wkdy = sum([0,1,2,3,4],'sum')/wkdyDays;
      if(wkdy>0 && wknd>0){
        const ratio = wknd/wkdy;
        if(ratio>=2) wdInsight += ` Weekend days cost about ${ratio.toFixed(1).replace(/\.0$/,'')}× as much as weekdays.`;
        else {
          const pct = Math.round((ratio-1)*100);
          if(Math.abs(pct)>=5) wdInsight += ` Weekends run ${Math.abs(pct)}% ${pct>0?'higher':'lower'} than weekdays.`;
        }
      }
    }
  }
  const wdHtml = `
    <div class="hm-card">
      <div class="hm-card-title">Everyday spending by weekday</div>
      <div class="hm-wd">
        ${avgs.map((a,i)=>`<div class="hm-wd-col" title="${WEEKDAY_FULL[i]}: ${escapeHtml(fmt(round2(a)))} avg over ${wd[i].count} day${wd[i].count!==1?'s':''}">
          <div class="hm-wd-val">${a>0?fmtCompact(a):''}</div>
          <div class="hm-wd-track"><div class="hm-wd-bar${a===maxAvg&&a>0?' top':''}${i>=5?' wknd':''}" style="height:${maxAvg?Math.max(a/maxAvg*100, a>0?4:0).toFixed(1):0}%;"></div></div>
          <div class="hm-wd-lbl">${WEEKDAY_FULL[i].slice(0,3)}</div>
        </div>`).join('')}
      </div>
      <div class="hm-insight">${wdInsight}</div>
    </div>`;

  // Pace vs the previous tracked month
  let paceHtml = '', paceAfter = null;
  if(c.elapsed>0){
    const keys = Object.keys(state.months).sort();
    const prevKey = keys[keys.indexOf(mk)-1];
    const curCum = cumulativeSpend(daySpend, c.dim, c.elapsed);
    let caption = `${fmt(curCum[curCum.length-1]||0)} spent by day ${c.elapsed}.`;
    let series;
    const dayLabel = d => `${monthShort} ${d}`;
    const xs = Array.from({length:c.dim}, (_,i)=>i+1);
    if(prevKey){
      const pc = heatmapCtx(prevKey);
      const prevCumRaw = cumulativeSpend(dailySpendSeries(prevKey, heatmapMode), pc.dim, pc.dim);
      const prevCum = xs.map(d=>prevCumRaw[Math.min(d, prevCumRaw.length)-1]||0);
      const diff = round2((curCum[c.elapsed-1]||0) - prevCum[c.elapsed-1]);
      caption += Math.abs(diff)<0.005 ? ` Exactly level with ${monthLabelFromKey(prevKey)}.`
        : ` <span style="color:var(--${diff>0?'red':'green'});font-weight:700;">${fmt(Math.abs(diff))} ${diff>0?'more':'less'}</span> than ${monthLabelFromKey(prevKey)} by the same day.`;
      series = [
        {color:cssVar('--muted','#8a93ab'), name:monthLabelFromKey(prevKey), dashed:true, points: xs.map((d,i)=>({x:String(d), label:dayLabel(d), y:prevCum[i]}))},
        {color:cssVar('--accent','#5b8cff'), name:monthLabelFromKey(mk), points: curCum.map((v,i)=>({x:String(i+1), label:dayLabel(i+1), y:v}))}
      ];
    } else {
      series = [{color:cssVar('--accent','#5b8cff'), name:monthLabelFromKey(mk), points: curCum.map((v,i)=>({x:String(i+1), label:dayLabel(i+1), y:v}))}];
    }
    paceHtml = `
      <div class="hm-card">
        <div class="hm-card-title">Spending pace</div>
        <div id="hmPace"></div>
        <div class="hm-insight">${caption}</div>
      </div>`;
    paceAfter = ()=>{
      const pe = document.getElementById('hmPace');
      if(pe && series[0].points.length>=2) lineChart(pe, series, {height:170, marker: c.today ? {index:c.today-1, label:'Today'} : null});
      else if(pe) pe.innerHTML = '<div class="empty">Not enough days yet.</div>';
    };
  }

  const empty = !Object.keys(daySpend).length && !Object.keys(bills).length && !Object.keys(pays).length;
  const html = `
    <div class="hm-stats">${chips}</div>
    ${empty ? '<div class="empty" style="padding:6px 0 14px;">No Quick Add spends or dated outgoings for this month yet — click any day to log one, or give an outgoing a Day.</div>' : ''}
    <div class="heatmap-grid">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="heatmap-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    ${heatmapLegendHtml(accentRgb)}
    <div class="hm-insights">${wdHtml}${paceHtml}</div>`;
  return {html, after: root=>{
    root.querySelectorAll('.heatmap-cell[data-day]').forEach(cell=>{
      cell.addEventListener('mouseenter', evt=>showChartTooltip(evt, cell.dataset.tip, true));
      cell.addEventListener('mousemove', evt=>showChartTooltip(evt, cell.dataset.tip, true));
      cell.addEventListener('mouseleave', hideChartTooltip);
      cell.addEventListener('click', ()=>{ hideChartTooltip(); openDayModal(mk, Number(cell.dataset.day)); });
    });
    if(paceAfter) paceAfter();
  }};
}

// Year at a glance: twelve mini calendars on one shared colour scale.
function heatmapYearHtml(keys){
  const y = heatmapYear;
  const accentRgb = hexToRgbTriplet(getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#5b8cff');
  const monthData = Array.from({length:12}, (_,i)=>{
    const mk = `${y}-${String(i+1).padStart(2,'0')}`;
    const tracked = !!state.months[mk];
    return {mk, i, tracked, spend: tracked ? dailySpendSeries(mk, heatmapMode) : {}};
  });
  const max = Math.max(0, ...monthData.flatMap(m=>Object.values(m.spend)));
  const yearTotal = round2(monthData.reduce((a,m)=>a+Object.values(m.spend).reduce((x,v)=>x+v,0),0));
  const cards = monthData.map(m=>{
    const dim = new Date(y, m.i+1, 0).getDate();
    const first = mondayIndexOf(new Date(y, m.i, 1).getDay());
    let sq = '';
    for(let b=0; b<first; b++) sq += '<span class="hm-sq blank"></span>';
    for(let d=1; d<=dim; d++){
      const a = m.spend[d]||0;
      sq += `<span class="hm-sq" style="${a>0?`background:rgba(${accentRgb},${(0.2+0.7*(max?a/max:0)).toFixed(2)});border-color:transparent;`:''}"></span>`;
    }
    const total = round2(Object.values(m.spend).reduce((x,v)=>x+v,0));
    const name = new Date(y, m.i, 1).toLocaleString('en-GB',{month:'short'});
    return `<button type="button" class="hm-mini${m.tracked?'':' untracked'}" data-mk="${m.mk}" ${m.tracked?'':'disabled'}>
      <div class="hm-mini-head"><span>${name}</span><span class="hm-sub">${m.tracked && total>0 ? fmtCompact(total) : ''}</span></div>
      <div class="hm-mini-grid">${sq}</div>
    </button>`;
  }).join('');
  const html = `
    <div class="hm-stats"><div class="hm-stat"><div class="k">${y} total</div><div class="v">${fmt(yearTotal)}</div></div></div>
    <div class="hm-year">${cards}</div>
    ${heatmapLegendHtml(accentRgb)}`;
  return {html, after: root=>{
    root.querySelectorAll('.hm-mini:not(.untracked)').forEach(b=>b.addEventListener('click', ()=>{
      heatmapMonth = b.dataset.mk; heatmapView = 'month'; renderSpendingHeatmap();
    }));
  }};
}

// Day details: what was spent, what's due, payday, and (for today or earlier)
// a form to log a spend against that exact day.
function openDayModal(mk, day){
  const m = state.months[mk];
  if(!m) return;
  const c = heatmapCtx(mk);
  const date = new Date(c.y, c.mo-1, day);
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.className = 'modal day-modal';
  const spends = m.outgoings.filter(o=>{
    if(!(o.quickAdd && o.ts)) return false;
    const d = new Date(o.ts);
    return d.getFullYear()===c.y && d.getMonth()+1===c.mo && d.getDate()===day;
  });
  const {bills, pays} = scheduledByDay(mk);
  const dayBills = bills[day]||[], dayPays = pays[day]||[];
  const spentTotal = round2(spends.reduce((a,o)=>a+(Number(o.amount)||0),0));
  const canAdd = c.isPast || (c.isCurrent && day<=c.today);
  const row = (tile, name, sub, amt) => `<div class="dm-row">${tile}<div class="dm-main"><div class="dm-name">${escapeHtml(name)}</div><div class="dm-sub">${sub}</div></div><div class="dm-amt">${escapeHtml(fmt(amt))}</div></div>`;
  const spendRows = spends.map(o=>`<div class="dm-row">${catTile(o.category||'Uncategorized','sm')}<div class="dm-main"><div class="dm-name">${escapeHtml(o.name)}</div><div class="dm-sub">${escapeHtml(o.category||'Uncategorized')} · ${new Date(o.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="dm-amt">${escapeHtml(fmt(o.amount))}</div><button class="del-btn dm-del" data-id="${o.id}" aria-label="Delete">✕</button></div>`).join('');
  const billRows = dayBills.map(b=>row(catTile(b.category,'sm'), b.name, b.done?'Bill · done':'Bill · due', b.amount)).join('');
  const payRows = dayPays.map(p=>row(catTile('Salary','sm'), p.name, p.done?'Payday · received':'Payday · expected', p.amount)).join('');
  const section = (title, html) => html ? `<div class="dm-sec"><div class="dm-sec-title">${title}</div><div class="dm-list">${html}</div></div>` : '';
  box.innerHTML = `
    <h3 style="margin-bottom:2px;">${date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>
    <div class="dm-total">${spentTotal>0 ? `${escapeHtml(fmt(spentTotal))} logged` : 'Nothing logged this day'}</div>
    ${section('Spent', spendRows)}
    ${section('Bills', billRows)}
    ${section('Pay', payRows)}
    ${canAdd ? `
      <div class="dm-sec"><div class="dm-sec-title">Log a spend on this day</div>
        <div class="dm-form">
          <input type="number" step="0.01" id="dmAmount" placeholder="Amount">
          <input type="text" id="dmReason" placeholder="Reason">
          ${categoryDropdownHtml('dmCategory','Uncategorized')}
          <button class="btn small" id="dmAdd">Add</button>
        </div>
      </div>` : `<div class="dm-note">This day hasn't happened yet, so spending can't be logged against it.</div>`}
    <div class="actions"><button class="btn secondary small" id="dmClose">Close</button></div>`;
  bg.classList.add('open');
  bg.onclick = e=>{ if(e.target===bg) closeRecapModal(); };
  document.getElementById('dmClose').onclick = closeRecapModal;
  box.querySelectorAll('.dm-del').forEach(b=>b.onclick = ()=>{
    removeWithUndo(m, 'outgoings', b.dataset.id, null,
      ()=>{ renderSpendingHeatmap(); openDayModal(mk, day); },
      ()=>{ renderSpendingHeatmap(); if(document.getElementById('modalBg').classList.contains('open') && document.getElementById('dmClose')) openDayModal(mk, day); });
  });
  if(canAdd){
    const cat = box.querySelector('.dmCategory');
    const amountEl = document.getElementById('dmAmount'), reasonEl = document.getElementById('dmReason');
    const smartDm = attachSmartCategory(reasonEl, cat, 'out');
    initCategoryDropdown(cat, ()=>smartDm.markPicked());
    const add = ()=>{
      const amt = Number(amountEl.value);
      if(!amt || amt<=0) return;
      const isToday = c.isCurrent && day===c.today;
      const ts = isToday ? Date.now() : new Date(c.y, c.mo-1, day, 12, 0, 0).getTime();
      m.outgoings.push({id:uid(), name: reasonEl.value.trim() || 'Spent', amount:amt, status:'done', recurring:false, quickAdd:true, ts, category: cat.dataset.value});
      save(); renderSpendingHeatmap(); openDayModal(mk, day);
      showToast(`Added ${fmt(amt)}`, date.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}));
    };
    document.getElementById('dmAdd').onclick = add;
    [amountEl, reasonEl].forEach(i=>i.addEventListener('keydown', e=>{ if(e.key==='Enter') add(); }));
  }
}

// ---------------- Quarterly ----------------
function quarterOfMonth(mm){ return Math.floor((mm-1)/3)+1; }
const QUARTER_LABEL = q => ['Jan–Mar','Apr–Jun','Jul–Sep','Oct–Dec'][q-1];
function quarterStatsFor(gk, groups){
  const g = groups[gk];
  const monthKeys = g.monthKeys.slice().sort();
  let income=0, spending=0, saved=0;
  const catTotals = {};
  monthKeys.forEach(mk=>{
    const m = state.months[mk];
    const t = monthTotals(m);
    income += t.doneIncoming;
    spending += t.doneOutgoing + t.doneWeekly;
    saved += t.doneSavings + t.doneStocks;
    m.outgoings.forEach(o=>{
      if(o.status!=='done') return;
      const cat = o.category || 'Uncategorized';
      catTotals[cat] = (catTotals[cat]||0) + (Number(o.amount)||0);
    });
  });
  const firstM = state.months[monthKeys[0]];
  const lastM = state.months[monthKeys[monthKeys.length-1]];
  const startBalance = round2(firstM.startingBalance);
  const endBalance = round2(monthTotals(lastM).liveBalance);
  const net = round2(income - spending - saved);
  const savingsRate = income>0 ? Math.round(saved/income*100) : 0;
  const catRows = Object.entries(catTotals).filter(([,amt])=>amt>0)
    .map(([category,amount])=>({category, amount:round2(amount)}))
    .sort((a,b)=>b.amount-a.amount);
  return {gk, year:g.year, q:g.q, monthKeys, income:round2(income), spending:round2(spending), saved:round2(saved), net, startBalance, endBalance, savingsRate, catRows};
}
let quarterlySelectedKey = null;
function renderQuarterly(){
  const el = document.getElementById('view-quarterly');
  const keys = Object.keys(state.months).sort();
  if(!keys.length){
    el.innerHTML = '<div class="panel"><div class="empty">No months tracked yet — head to Month Tracker to get started.</div></div>';
    return;
  }
  const groups = {};
  keys.forEach(k=>{
    const [y, mo] = k.split('-').map(Number);
    const q = quarterOfMonth(mo);
    const gk = `${y}-Q${q}`;
    (groups[gk] = groups[gk] || {year:y, q, monthKeys:[]}).monthKeys.push(k);
  });
  const groupKeys = Object.keys(groups).sort();
  const quarterStats = groupKeys.map(gk=>quarterStatsFor(gk, groups));
  if(!quarterlySelectedKey || !groupKeys.includes(quarterlySelectedKey)){
    quarterlySelectedKey = groupKeys[groupKeys.length-1];

      {color:cssVar('--accent','#5b8cff'), name:'Net', dashed:true, points: quarterStats.map((qs,i)=>({x:labels[i], label:`Q${qs.q} ${qs.year}`, y:qs.net}))}
    ], {height:220});

    detailEl.innerHTML = `
      <div class="panel-head" style="margin-bottom:10px;">
        <h2>Q${qs.q} ${qs.year} <span style="font-weight:400;color:var(--muted);font-size:13px;">(${QUARTER_LABEL(qs.q)})</span></h2>
        <span class="hint">${qs.monthKeys.length} month${qs.monthKeys.length!==1?'s':''} tracked</span>
      </div>
      <div class="grid">

        <div class="card"><div class="k">Spending</div><div class="v neg">${fmt(qs.spending)}</div><div class="sub">outgoings + weekly, Done</div></div>
        <div class="card"><div class="k">Saved</div><div class="v pos">${fmt(qs.saved)}</div><div class="sub">savings + stocks, Done</div></div>

      </div>
      ${qs.catRows.length ? (()=>{

              <div class="cat-bar-row">
                <div class="cat-bar-label">${catTile(r.category,'inl')}${escapeHtml(r.category)}</div>
                <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${qs.catRows[0].amount?(r.amount/qs.catRows[0].amount*100).toFixed(1):0}%;--c:${categoryColor(r.category)};"></div></div>

  if(sampleBtn) sampleBtn.onclick = ()=>openYearReview(new Date().getFullYear(), true);

// Recurring items that exist in later (already generated) months but not in the
// month being viewed — e.g. something added as recurring in November while you're
// looking at October. Each gets a button that jumps to that month to edit it.
function recurringElsewhere(m, listKey){
  const norm = n => String(n||'').trim().toLowerCase();
  const have = new Set(m[listKey].filter(x=>x.recurring && !x.transfer).map(x=>norm(x.name)));
  const found = new Map();
  Object.keys(state.months).sort().filter(k=>k>state.currentMonthKey).forEach(k=>{
    state.months[k][listKey].forEach(x=>{
      if(!x.recurring || x.transfer) return;
      const key = norm(x.name);
      if(have.has(key) || found.has(key)) return;
      found.set(key, {x, k});
    });
  });
  return found;
}
function drawRecurringElsewhere(m, kind){
  const box = document.getElementById(`recurElse-${kind}`);
  if(!box) return;
  const listKey = kind==='incoming' ? 'incoming' : 'outgoings';
  const found = recurringElsewhere(m, listKey);
  if(!found.size){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="rc-else-title">Added in later months <small>— not in ${escapeHtml(monthLabelFromKey(state.currentMonthKey))} yet</small></div><div class="rw-list">` +
    [...found.values()].map(({x,k})=>`
      <div class="rw-row">
        ${catTile(x.category||(kind==='incoming'?'Salary':'Uncategorized'),'md')}
        <div class="rw-main"><div class="rw-name">${escapeHtml(x.name||'Unnamed')}</div><div class="rw-sub">Recurring from ${escapeHtml(monthLabelFromKey(k))} · ${escapeHtml(fmt(Number(x.amount)||0))}</div></div>
        <button type="button" class="btn secondary small rc-open" data-month="${k}">Open ${escapeHtml(monthLabelFromKey(k).split(' ')[0])}</button>
      </div>`).join('') + `</div>`;
  box.querySelectorAll('.rc-open').forEach(b=>{
    b.onclick = ()=>{ state.currentMonthKey = b.dataset.month; ensureMonth(state.currentMonthKey); save(); render(); };
  });
}

function drawRecurringTable(m, kind){

  const [curYear, curMonthNum] = state.currentMonthKey.split('-').map(Number);

  body.innerHTML = items.map(x=>`
    <tr data-id="${x.id}" class="out-row${kind==='incoming'?' inc-row':''}${expandedRecurRows.has(x.id)?'':' collapsed'}">

    </tr>
  `).join('') || `<tr><td colspan="${colspan}" class="empty">No recurring ${kind==='incoming'?'incoming':'outgoings'} yet</td></tr>`;
  body.querySelectorAll('tr').forEach(tr=>{
