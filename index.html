    const summary = tr.querySelector('.cell-summary');
    const refreshSummary = ()=>{ summary.innerHTML = summaryFor(item); };
    const toggleRow = ()=>{
      const open = tr.classList.contains('collapsed');
      tr.classList.toggle('collapsed', !open);
      if(open) expandedRecurRows.add(id); else expandedRecurRows.delete(id);
    };
    summary.onclick = e=>{ if(e.target.closest('.cs-status')){ toggleStatusSelect(tr.querySelector('.stog select')); return; } toggleRow(); };
    summary.onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggleRow(); } };
    tr.querySelector(`.recur-name-${kind}`).oninput = e=>{ item.name=e.target.value; syncNewRecurringForward(item, state.currentMonthKey, listKey); save(); refreshSummary(); };
    tr.querySelector(`.recur-name-${kind}`).onchange = ()=>{
      const c = autoCategoryForName(item.name, item.category, kind==='incoming' ? 'in' : 'out');
      if(!c) return;
      item.category = c;
      setCategoryDropdownValue(tr.querySelector(`.recur-category-${kind}`), c);
      propagateOutgoingFieldForward(item, state.currentMonthKey, 'category', listKey);
      syncNewRecurringForward(item, state.currentMonthKey, listKey);
      save(); refreshSummary();
    };
    tr.querySelector(`.recur-amount-${kind}`).oninput = e=>{ item.amount=Number(e.target.value); syncNewRecurringForward(item, state.currentMonthKey, listKey); save(); refreshSummary(); };
    const sel = tr.querySelector(`.recur-status-${kind}`);
    sel.onchange = e=>{ item.status=e.target.value; save(); e.target.className = `recur-status-${kind} status-select status-${e.target.value}`; refreshSummary(); if(kind==='incoming') afterIncomeMarkedDone(item, state.currentMonthKey); };
    const catSel = tr.querySelector(`.recur-category-${kind}`);
    if(catSel) initCategoryDropdown(catSel, val=>{ item.category = val; propagateOutgoingFieldForward(item, state.currentMonthKey, 'category', listKey); save(); refreshSummary(); });
    const dayInp = tr.querySelector(`.recur-day-${kind}`);
    if(dayInp) dayInp.onchange = e=>{ item.day = clampDay(e.target.value); e.target.value = item.day||''; propagateOutgoingFieldForward(item, state.currentMonthKey, 'day'); save(); refreshSummary(); };
    const fundsSel = tr.querySelector('.recur-funds');
    if(fundsSel) fundsSel.onchange = e=>{
      item.fundsNext = e.target.value==='next';
      propagateOutgoingFieldForward(item, state.currentMonthKey, 'fundsNext', 'incoming');
      save();
      renderRecurring();
    };
    const schedSel = tr.querySelector(`.recur-schedule-${kind}`);
    if(schedSel) schedSel.onchange = e=>{
      applyScheduleValue(item, e.target.value);
      propagateScheduleForward(item, state.currentMonthKey, 'incoming');
      save();
      tr.querySelector('.schedule-hint').textContent = scheduleHint(item, curYear, curMonthNum);
    };
    tr.querySelector(`.recur-del-${kind}`).onclick = ()=>{
      expandedRecurRows.delete(id);
      removeWithUndo(m, kind==='incoming' ? 'incoming' : 'outgoings', id, item.name || 'recurring item', ()=>renderRecurring());
    };
  });
}

function bossLook(plan){

  const clean = String(plan.name||'Boss').trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}'&-]/gu,'') || 'Debt';

const BOSS_MOOD_TEXT = {fight:'FULL OF FIGHT', hurt:'WOUNDED', weak:'ONE HIT FROM DEFEAT', dead:'DEFEATED'};
const BOSS_XP_HIT = 20, BOSS_XP_DEFEAT = 150;
function bossHpSegs(plan, hitIdx){
  return plan.inst.map((it,i)=>{
    const on = !pay3Paid(plan,i);
    return `<i class="${on?'on':''}${i===hitIdx?' hit':''}" style="--w:${Math.max(1, Math.round(it.amount*100))};"></i>`;
  }).join('');
}
function bossXpFromPlans(){
  let xp = 0;
  (state.pay3||[]).forEach(plan=>{
    if(!plan.inst || !plan.inst.length) return;
    const paid = plan.inst.filter((_,i)=>pay3Paid(plan,i)).length;
    xp += paid*BOSS_XP_HIT + (paid>=plan.inst.length ? BOSS_XP_DEFEAT : 0);
  });
  return xp;
}
// The "hit" moment: a slash across the monster, damage number, and (on the last payment) an ember burst.
function showBossStrike(plan, idx){
  if(!state.celebrate || !plan || !plan.inst[idx]) return;
  const n = plan.inst.length;
  const paidCount = plan.inst.filter((_,i)=>pay3Paid(plan,i)).length;
  const defeated = paidCount>=n;
  const look = bossLook(plan);
  const amt = plan.inst[idx].amount;
  const left = round2(plan.inst.reduce((a,it,i)=>a+(pay3Paid(plan,i)?0:it.amount),0));
  const nextIdx = plan.inst.findIndex((_,i)=>!pay3Paid(plan,i));
  const fmtDay = str => parseYmd(str).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  const gain = BOSS_XP_HIT + (defeated ? BOSS_XP_DEFEAT : 0);
  const bc = `hsl(${look.hue} 78% 60%)`;
  let ov = document.getElementById('bossOverlay');
  if(!ov){ ov = document.createElement('div'); ov.id = 'bossOverlay'; ov.className = 'boss-overlay'; ov.setAttribute('aria-hidden','true'); document.body.appendChild(ov); }
  const sparks = defeated ? Array.from({length:26}, (_,i)=>{
    const a = (i/26)*Math.PI*2 + Math.random()*.3, r = 70 + Math.random()*90;
    const col = ['#ffd9a0','#ffb15a','#ff7a3c','#fff4d0',bc][i%5];
    return `<i class="bo-p" style="--dx:${Math.round(Math.cos(a)*r)}px;--dy:${Math.round(Math.sin(a)*r)}px;--d:${(.55+Math.random()*.25).toFixed(2)}s;--s:${(4+Math.random()*5).toFixed(1)}px;background:${col};box-shadow:0 0 10px ${col};"></i>`;
  }).join('') : '';
  const mood = defeated ? 'weak' : bossMood(paidCount, n);
  ov.innerHTML = `<div class="bo-card" style="--bc:${bc};">
    <div class="bo-k">${defeated ? 'BOSS DEFEATED' : 'DIRECT HIT'}</div>
    <div class="bo-stage${defeated?' defeat':''}">
      ${bossSvg(look.kind, look.hue, mood, true)}
      ${defeated ? '' : `<svg class="bo-slash" viewBox="0 0 230 230" aria-hidden="true"><defs><linearGradient id="boSl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b0" stop-opacity="0"/><stop offset=".5" stop-color="#fff2b0"/><stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/></linearGradient></defs>
        <path class="s1" d="M18,40 L212,196" stroke="url(#boSl)" stroke-width="9" stroke-linecap="round" fill="none"/>
        <path class="s2" d="M48,16 L204,150" stroke="url(#boSl)" stroke-width="5" stroke-linecap="round" fill="none"/></svg>`}
      ${defeated ? '<i class="bo-ring"></i>' : ''}${sparks}
      <div class="bo-dmg">${defeated ? '<span class="bo-tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>DEFEATED' : '-'+escapeHtml(fmt(amt))}</div>
    </div>
    <div class="bo-title">${escapeHtml(look.title)}</div>
    <div class="bo-sub">${defeated ? `${escapeHtml(plan.name)} is paid off — ${escapeHtml(fmt(plan.total))} cleared` : `Hit ${paidCount} of ${n} landed${nextIdx>=0 ? ' · next ' + fmtDay(plan.inst[nextIdx].date) : ''}`}</div>
    <div class="bo-panel">
      <div class="boss-hp-h"><span>HP</span><span>${defeated ? '' : `<s>${escapeHtml(fmt(round2(left+amt)))}</s> `}<b>${escapeHtml(fmt(left))}</b> / ${escapeHtml(fmt(plan.total))}</span></div>
      <div class="boss-hp">${bossHpSegs(plan, idx)}</div>
      <div class="bo-chips">
        <div class="bo-chip xp"><div class="k">XP</div><div class="v">+${gain}</div></div>
        <div class="bo-chip"><div class="k">${defeated ? 'CLEARED' : 'NEXT HIT'}</div><div class="v sm">${defeated ? escapeHtml(fmt(plan.total)) : nextIdx>=0 ? escapeHtml(fmtDay(plan.inst[nextIdx].date)+' · '+fmt(plan.inst[nextIdx].amount)) : '—'}</div></div>
      </div>

  ov.classList.add('open'); ov.setAttribute('aria-hidden','false');

  document.getElementById('boOk').onclick = close;

// Called when an instalment is ticked as paid in the Month Tracker.
function afterOutgoingMarkedDone(item){

const LUCKY_TIERS = {

// Decides whether this log earns a lucky ember (about 1 in 4, and never more than 7 logs apart). Returns a tier or null.
function luckyRoll(){
  if(!state.celebrate) return null;
  const L = state.ember.lucky;
  L.since = (L.since||0) + 1;
  if(L.since < 2) return null;
  if(L.since < 7 && Math.random() > 0.25) return null;
  L.since = 0;
  const r = Math.random();
  return r < 1/40 ? LUCKY_TIERS.gold : r < 1/40 + 1/8 ? LUCKY_TIERS.rare : LUCKY_TIERS.spark;
}
const LUCKY_TIPS = [
  () => 'Small amounts add up: '+fmt(4)+' a day is about '+fmt(1460)+' a year.',
  () => 'The 24-hour rule: wait a day before any non-essential purchase and half the urges fade.',
  () => 'Paying yourself first works — move savings out the moment your pay lands.',
  () => 'Forgotten subscriptions are the most common budget leak. Check the Recurring page now and then.',
  () => 'The 50/30/20 rule splits pay into needs, wants and savings.',
  () => 'Round a spend up to the next whole amount and tuck the difference into a pot.',
  () => 'Checking your budget for five minutes a week beats a big monthly tidy-up.'
];
function luckyFact(e){
  const out = [];
  if(e.cur>=2) out.push({k:'YOUR STREAK', t:`You've logged ${e.cur} days in a row${e.best>e.cur ? `. Your best ever is ${e.best}.` : ' — your best yet!'}`});
  out.push({k:'YOUR EMBER', t:`${e.xpToNext} XP to Level ${e.level+1}.`});
  const m = state.months[monthKey(new Date())];
  if(m){
    const today = new Date(); today.setHours(0,0,0,0);
    let todayTotal = 0; const cats = {};
    m.outgoings.forEach(o=>{
      if(!o.quickAdd || !o.ts) return;
      const amt = Number(o.amount)||0;
      if(o.ts >= today.getTime()) todayTotal += amt;
      const c = o.category || o.name; cats[c] = (cats[c]||0) + amt;
    });
    if(todayTotal>0) out.push({k:'TODAY', t:`You've logged ${fmt(round2(todayTotal))} of spending today.`});
    const top = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
    if(top) out.push({k:'YOUR SPENDING', t:`${top[0]} is what you've logged most this month: ${fmt(round2(top[1]))}.`});
  }
  const n = daysUntilPayday();
  if(n!==null && n>0) out.push({k:'PAYDAY', t:`${n} day${n!==1?'s':''} until payday.`});
  const sum = pay3Summary();
  if(sum.owed>0) out.push({k:'BOSSES', t:`${fmt(sum.owed)} left to defeat across your Pay in 3 plans.`});
  const tip = {k:'DID YOU KNOW', t:LUCKY_TIPS[Math.floor(Math.random()*LUCKY_TIPS.length)]()};
  return Math.random() < 0.6 && out.length ? out[Math.floor(Math.random()*out.length)] : tip;
}
function showLuckyEmber(tier){

    <div class="lk-count">Embers caught: <b>${L.caught}</b> · Rare <b style="color:${LUCKY_TIERS.rare.fg};">${L.rare||0}</b> · Golden <b style="color:${LUCKY_TIERS.gold.fg};">${L.gold||0}</b></div>
    <button class="btn bo-ok" id="lkOk">Nice — got it</button>

    if(!$('p3Date').value || !(total>0)) return {prov, total, n, every, inst:null};
    return {prov, total, n, every, inst: buildPay3Schedule(total, n, every, parseYmd($('p3Date').value), $('p3FirstPaid').checked)};
  };

      : 'Enter the total and first payment date to see the schedule.';
  };
  ['p3Provider','p3Total','p3Date','p3N','p3Every','p3FirstPaid'].forEach(id=>{ $(id).addEventListener('input', updatePreview); $(id).addEventListener('change', updatePreview); });
  $('p3Date').addEventListener('change', ()=>{ $('p3FirstPaid').checked = $('p3Date').value <= today; updatePreview(); });
  updatePreview();
  $('p3FormToggle').onclick = ()=>{ p3FormOpen = !p3FormOpen; renderPay3(); };
  $('p3Add').onclick = ()=>{
    const r = readSchedule();
    if(!r.inst){ $('p3Total').focus(); return; }
    state.pay3.push({id:uid(), name: $('p3Name').value.trim() || 'Purchase', provider:r.prov, total:round2(r.total), every:r.every, inst:r.inst});
    syncPay3All();
    save();
    showToast('Plan added', `${r.n} instalments tracked`);
    p3FormOpen = false;
    renderPay3();
  };

  // --- cards
  el.querySelectorAll('.p3-toggle').forEach(b=>b.onclick = ()=>{
    const plan = state.pay3.find(x=>x.id===b.dataset.plan);
    if(!plan) return;
    const i = Number(b.dataset.i);
    const nowPaid = !pay3Paid(plan, i);
    setPay3Paid(plan, i, nowPaid);
    renderPay3();
    if(nowPaid) showBossStrike(plan, i);
  });
  el.querySelectorAll('.p3-del').forEach(b=>b.onclick = ()=>{

      state.pay3.splice(Math.min(idx, state.pay3.length), 0, plan);
      syncPay3All();
      save();
      render();
    });
  });
}

const recurWhatIf = new Set();
// Recurring outgoings for the summary: this month's, plus any that only exist in later months.
function recurringSummaryItems(m){
  const own = m.outgoings.filter(o=>o.recurring && (Number(o.amount)||0)>0).map(o=>({...o, _from:null}));
  const other = [...recurringElsewhere(m, 'outgoings').values()].filter(({x})=>(Number(x.amount)||0)>0).map(({x,k})=>({...x, _from:k}));
  return [...own, ...other].sort((a,b)=>b.amount-a.amount);
}
function recurringSummaryHtml(m){

function updateRecurWhatIf(m){
  const el = document.getElementById('rcWhatIf');
  if(!el) return;
  const items = recurringSummaryItems(m).filter(o=>recurWhatIf.has(o.id));
  const monthly = round2(items.reduce((a,o)=>a+(Number(o.amount)||0),0));
  el.innerHTML = items.length
    ? `Cancel ${items.length} and you'd save <b>${fmt(monthly)}</b> a month — <b>${fmt(monthly*12)}</b> a year.`
    : '';

function refreshRecurringSummary(){
  const box = document.getElementById('recurSummary');
  if(!box) return;
  const m = state.months[state.currentMonthKey];
  if(!m) return;
  // Forget ticks for items that no longer exist
  const ids = new Set(recurringSummaryItems(m).map(o=>o.id));
  [...recurWhatIf].forEach(id=>{ if(!ids.has(id)) recurWhatIf.delete(id); });
  box.innerHTML = recurringSummaryHtml(m);
  box.querySelectorAll('.rc-check').forEach(c=>c.onchange = ()=>{
    if(c.checked) recurWhatIf.add(c.dataset.id); else recurWhatIf.delete(c.dataset.id);

}

// ---------------- Push reminders ----------------
// A scheduled job (.github/workflows/reminders.yml) reads your synced budget each morning and
// pushes "due today / tomorrow / overdue" to every device that turned reminders on here.
const PUSH_PUBLIC_KEY = 'BA65VlyQdykUQfsM_kB63btFf-qonJe3_gZQnbJhaA2wWnTThnFQ2TutuEBnhTKtOR594VIdZXVg2QA-uBJEikI';
function pushB64ToBytes(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw, c=>c.charCodeAt(0));
}
// The service worker can be missing or slow (e.g. over plain http); never wait on it forever.
function pushRegistration(){
  if(!('serviceWorker' in navigator)) return Promise.resolve(null);
  return Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null), 2500))]).catch(()=>null);
}
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushIsStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
function pushIsIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
async function pushDocRef(){
  const p = activeProfileMeta();
  if(!p || !p.syncEnabled || !p.syncCode) return null;
  const db = initCloud();
  return db ? db.collection('budgets').doc(p.syncCode+'__push') : null;
}
async function pushReadSubs(ref){
  const snap = await ref.get();
  if(!snap.exists) return [];
  try{ return JSON.parse(snap.data().subs || '[]'); }catch(e){ return []; }
}
async function enablePushReminders(){
  const ref = await pushDocRef();
  if(!ref){ showToast('Turn on Cloud Sync first', 'Reminders read your synced budget.'); return; }
  const perm = await Notification.requestPermission();
  if(perm!=='granted'){ showToast('Notifications are blocked', 'Allow them for this site in your browser or phone settings, then try again.'); return; }
  const reg = await pushRegistration();
  if(!reg){ showToast("Reminders aren't ready yet", 'Open the installed app (or the live site) and try again.'); return; }
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:pushB64ToBytes(PUSH_PUBLIC_KEY)});
  const subs = (await pushReadSubs(ref)).filter(x=>x.endpoint!==sub.endpoint);
  subs.push(sub.toJSON());
  await ref.set({subs: JSON.stringify(subs), updatedAt: Date.now()});
  showToast('Reminders are on', 'This device will get a daily nudge when something is due.');
}
async function disablePushReminders(){
  try{
    const reg = await pushRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    const ref = await pushDocRef();
    if(sub){
      if(ref){ const subs = (await pushReadSubs(ref)).filter(x=>x.endpoint!==sub.endpoint); await ref.set({subs: JSON.stringify(subs), updatedAt: Date.now()}); }
      await sub.unsubscribe();
    }
  }catch(e){ console.error(e); }
  showToast('Reminders are off', 'This device will stop getting them.');
}

  box.innerHTML = `<div class="push-msg">${msg}</div>${actions?`<div class="push-actions">${actions}</div>`:''}${setup}`;

function exportJson(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  downloadBlob(blob, 'budget-tracker-backup.json');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}
function importJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.months) throw new Error('bad format');
      state = data;
      normalizeState();
      save();
      currentView='month';
      render();
    }catch(err){
      alert('Could not import this file — it doesn\'t look like an Embalance backup.');
    }
  };
  reader.readAsText(file);
}

// ---------------- Month recap ----------------
// Gathers the highlights for one tracked month: headline figures, its biggest
// category and single spend, and how spending compares to the month before.
function monthRecapData(key){
  const m = state.months[key];
  if(!m) return null;
  const t = monthTotals(m);
  const keys = Object.keys(state.months).sort();
  const idx = keys.indexOf(key);
  const prevKey = idx>0 ? keys[idx-1] : null;
  const pt = prevKey ? monthTotals(state.months[prevKey]) : null;
  const spent = round2(t.allOutgoing + t.weeklyTotal);
  const earned = t.allIncoming;
  const saved = round2(t.savingsAmount + t.stocksAmount);
  const net = round2(t.totalLeftOver - (Number(m.startingBalance)||0));
  const cats = categoryBreakdown(m, 'all');
  const catTotal = cats.reduce((s,r)=>s+r.amount,0);
  const topCat = cats[0] ? {...cats[0], pct: catTotal ? Math.round(cats[0].amount/catTotal*100) : 0} : null;
  const biggest = m.outgoings.filter(o=>(Number(o.amount)||0)>0).sort((a,b)=>b.amount-a.amount)[0] || null;
  const incomeRows = incomeBreakdown(m, 'all');
  const incomeTotal = incomeRows.reduce((a,r)=>a+r.amount,0);
  const topIncome = incomeRows[0] && incomeRows[0].category!=='Uncategorized' ? {...incomeRows[0], pct: incomeTotal ? Math.round(incomeRows[0].amount/incomeTotal*100) : 0} : null;
  const prevSpent = pt ? round2(pt.allOutgoing + pt.weeklyTotal) : null;
  const spendChangePct = prevSpent>=0.01 ? Math.round((spent-prevSpent)/prevSpent*100) : null;
  return {key, prevKey, spent, earned, saved, net, topCat, topIncome, biggest, spendChangePct, active: spent>0 || earned>0};
}

const SEARCH_RECENT_KEY = 'embalance.recentSearches';
let searchState = {q:'', type:'all', month:'any', status:'any', min:0, cat:'', overdue:false, sel:0};
function searchRecents(){
  try{ const a = JSON.parse(localStorage.getItem(SEARCH_RECENT_KEY)||'[]'); return Array.isArray(a) ? a.slice(0,5) : []; }catch(e){ return []; }
}
function searchRemember(q){
  q = (q||'').trim(); if(!q) return;
  try{ const a = [q, ...searchRecents().filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,5); localStorage.setItem(SEARCH_RECENT_KEY, JSON.stringify(a)); }catch(e){}
}
// Every outgoing and incoming item across all months, flattened.
function searchEntries(){
  const out = [];
  Object.keys(state.months).forEach(k=>{
    const m = state.months[k];
    const [y, mo] = k.split('-').map(Number);
    const label = monthLabelFromKey(k);
    const push = (item, kind)=>{
      if(item.transfer) return;
      let date = null;
      if(item.quickAdd && item.ts) date = new Date(item.ts);
      else { const d = resolveScheduledDay(item, y, mo); if(d) date = new Date(y, mo-1, d); }
      const amount = Number(item.amount)||0;
      const cat = item.category || (kind==='in' ? 'Uncategorized' : 'Uncategorized');
      out.push({kind, quick:!!item.quickAdd, monthKey:k, monthLabel:label, item, id:item.id, name:item.name||'Unnamed', cat, amount, done:item.status==='done', recurring:!!item.recurring, date,
        hay: `${item.name||''} ${cat} ${label} ${kind==='in'?'incoming received':'outgoing spend'} ${item.status==='done'?'paid done':'unpaid not paid pending'} ${item.quickAdd?'quick add':''}`.toLowerCase(), amountStr: amount.toFixed(2)});
    };
    m.incoming.forEach(i=>push(i,'in'));
    m.outgoings.forEach(o=>push(o,'out'));
  });
  return out;
}
function searchTokens(q){ return (q||'').toLowerCase().split(/\s+/).map(t=>t.replace(/^£/,'')).filter(Boolean); }
function searchMatch(e, st, ignoreType){
  const today = new Date(); today.setHours(0,0,0,0);
  const curKey = monthKey(today);
  if(!ignoreType){
    if(st.type==='out' && !(e.kind==='out' && !e.quick)) return false;
    if(st.type==='in' && !(e.kind==='in' && !e.quick)) return false;
    if(st.type==='quick' && !e.quick) return false;
  }
  if(st.month!=='any' && e.monthKey!==st.month) return false;
  if(st.status==='paid' && !e.done) return false;
  if(st.status==='unpaid' && e.done) return false;
  if(st.min && e.amount < st.min) return false;
  if(st.cat && e.cat!==st.cat) return false;
  if(st.overdue){
    if(e.kind!=='out' || e.done || e.quick) return false;
    const past = e.monthKey<curKey || (e.date && e.date<today);
    if(!past) return false;
  }
  return searchTokens(st.q).every(t=> e.hay.includes(t) || (/^[0-9.]+$/.test(t) && e.amountStr.includes(t)));
}
function searchHasCriteria(st){ return !!(st.q.trim() || st.type!=='all' || st.month!=='any' || st.status!=='any' || st.min || st.cat || st.overdue); }
function searchSorted(list){
  return list.slice().sort((a,b)=> a.monthKey<b.monthKey ? 1 : a.monthKey>b.monthKey ? -1 : ((a.date?a.date.getTime():9e15)-(b.date?b.date.getTime():9e15)));
}
function searchHighlight(name, q){
  const tokens = searchTokens(q).filter(t=>!/^[0-9.]+$/.test(t) || name.toLowerCase().includes(t));
  let html = escapeHtml(name);
  tokens.forEach(t=>{
    const safe = escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try{ html = html.replace(new RegExp('('+safe+')(?![^<]*>)','ig'), '<mark>$1</mark>'); }catch(e){}
  });
  return html;
}
function searchResultRowHtml(e, idx, curKey){
  const cat = e.kind==='in' ? (e.cat==='Uncategorized' ? 'Salary' : e.cat) : e.cat;
  const dateTxt = e.date ? e.date.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}) : 'No date';
  const bits = [e.quick ? 'Quick add' : e.cat, dateTxt];
  if(e.recurring) bits.push('Recurring');
  const stLabel = e.kind==='in' ? (e.done?'Received':'Not received') : (e.done?'Paid':'Not paid');
  return `<div class="so-row${idx===searchState.sel?' sel':''}${e.monthKey===curKey?' cur':''}" data-idx="${idx}">
    ${catTile(cat,'md')}
    <div class="so-info"><div class="so-name">${searchHighlight(e.name, searchState.q)}</div><div class="so-meta">${escapeHtml(bits.join(' · '))}</div></div>
    <span class="so-st ${e.done?'done':'none'}">${stLabel}</span>
    <div class="so-amt${e.kind==='in'?' in':''}">${e.kind==='in'?'+':''}${escapeHtml(fmt(e.amount))}</div>
  </div>`;
}
let searchResultsFlat = [];
function renderSearch(){
  const filtersEl = document.getElementById('searchFilters');

    const curKey = monthKey(new Date());
    const quick = [
      {name:'Overdue bills', sub:'Due already, still unpaid', n:count({overdue:true}), set:{overdue:true}, path:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M12 13v3M12 18h.01', color:'var(--amber)'},

    ];
    searchResultsFlat = [];
    bodyEl.innerHTML = `
      ${recents.length ? `<div class="so-h">RECENT</div><div class="so-recents">${recents.map(r=>`<button type="button" class="so-chip so-recent" data-q="${escapeHtml(r)}"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>${escapeHtml(r)}</button>`).join('')}</div>` : ''}
      <div class="so-h">QUICK SEARCHES</div>

    bodyEl.querySelectorAll('.so-recent').forEach(b=>b.onclick = ()=>{ searchState.q = b.dataset.q; document.getElementById('searchInput').value = b.dataset.q; searchState.sel = 0; renderSearch(); });
    bodyEl.querySelectorAll('.so-qs').forEach(r=>r.onclick = ()=>{ Object.assign(searchState, quick[Number(r.dataset.q)].set, {sel:0}); renderSearch(); });
    return;
  }
  // filters row
  const forCounts = entries.filter(e=>searchMatch(e, st, true));
  const n = f => forCounts.filter(f).length;
  const chip = (id, label, count)=>`<button type="button" class="so-chip${st.type===id?' on':''}" data-type="${id}">${label}<small>${count}</small></button>`;
  const months = [...new Set(entries.map(e=>e.monthKey))].sort().reverse();
  filtersEl.innerHTML = chip('all','All',forCounts.length) + chip('out','Outgoings',n(e=>e.kind==='out'&&!e.quick)) + chip('in','Incoming',n(e=>e.kind==='in'&&!e.quick)) + chip('quick','Quick Add',n(e=>e.quick))
    + `<span class="so-spacer"></span>
    <select class="so-sel" id="soMonth" aria-label="Month"><option value="any">Any month</option>${months.map(k=>`<option value="${k}"${st.month===k?' selected':''}>${escapeHtml(monthLabelFromKey(k))}</option>`).join('')}</select>
    <select class="so-sel" id="soStatus" aria-label="Status"><option value="any"${st.status==='any'?' selected':''}>Paid &amp; unpaid</option><option value="paid"${st.status==='paid'?' selected':''}>Paid</option><option value="unpaid"${st.status==='unpaid'?' selected':''}>Not paid</option></select>`;
  filtersEl.querySelectorAll('.so-chip').forEach(b=>b.onclick = ()=>{ searchState.type = b.dataset.type; searchState.sel = 0; renderSearch(); });
  filtersEl.querySelector('#soMonth').onchange = e=>{ searchState.month = e.target.value; searchState.sel = 0; renderSearch(); };
  filtersEl.querySelector('#soStatus').onchange = e=>{ searchState.status = e.target.value; searchState.sel = 0; renderSearch(); };
  // results
  const res = searchSorted(entries.filter(e=>searchMatch(e, st)));
  searchResultsFlat = res;
  if(searchState.sel >= res.length) searchState.sel = Math.max(0, res.length-1);
  if(!res.length){
    bodyEl.innerHTML = `<div class="so-empty">No matches — try a name, a category or an amount.</div>`;
    return;
  }
  const monthsShown = new Set(res.map(e=>e.monthKey)).size;
  const spent = round2(res.filter(e=>e.kind==='out'&&!e.quick || e.kind==='out'&&e.quick).reduce((a,e)=>a+e.amount,0));

  let lastMonth = null;
  res.forEach((e,i)=>{
    if(e.monthKey!==lastMonth){ html += `<div class="so-month">${escapeHtml(e.monthLabel)}</div>`; lastMonth = e.monthKey; }
    html += searchResultRowHtml(e, i, curKey);
  });
  bodyEl.innerHTML = html;
  bodyEl.querySelectorAll('.so-row').forEach(r=>{
    r.onclick = ()=>openSearchResult(searchResultsFlat[Number(r.dataset.idx)]);
  });
}

(function wireSearch(){

    }
  });
  document.getElementById('searchClear').onclick = ()=>{ input.value=''; searchState.q=''; searchState.sel=0; renderSearch(); input.focus(); };

  document.getElementById('searchOverlay').addEventListener('mousedown', ev=>{ if(ev.target.id==='searchOverlay') closeSearchOverlay(); });

// ---------------- Year in review ----------------
function yearReviewData(year){
  const curKey = monthKey(new Date());
  const rows = Object.keys(state.months).filter(k=>k.startsWith(year+'-') && k<=curKey).sort().map(k=>{
    const m = state.months[k], t = monthTotals(m);
    const sc = monthScoreData(k);
    return {k, m, t, spent:round2(t.allOutgoing+t.weeklyTotal), earned:t.allIncoming, saved:round2(t.savingsAmount+t.stocksAmount), score: sc && sc.active ? sc.score : null};
  }).filter(x=>x.earned>0 || x.spent>0);
  if(rows.length<3) return {year, ok:false, n:rows.length};
  const sum = f => round2(rows.reduce((a,x)=>a+f(x),0));

  const scores = rows.filter(x=>x.score!==null).map(x=>x.score);

  let quickCount = 0, run = 0, best = 0, bestEnd = null, runEnd = null;

// Monthly score out of 100, from four parts: spending vs income (30), saving rate (25),
// leftover cushion (25) and bills on track (20).
function monthScoreData(key){
  const m = state.months[key];
  if(!m) return null;
  const t = monthTotals(m);
  const earned = t.allIncoming;
  const spent = round2(t.allOutgoing + t.weeklyTotal);
  const saved = round2(t.savingsAmount + t.stocksAmount);
  const left = t.totalLeftOver;
  const clamp = (v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const pct = v=>Math.round(v*100);
  const parts = [];
  // 1. spending
  const spendRatio = earned>0 ? spent/earned : null;
  parts.push({id:'spend', name:'Spending vs income', max:30, icon:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', color:'var(--red)',
    pts: spendRatio===null ? 0 : clamp(30*(1-Math.max(0,spendRatio-0.7)/0.3), 0, 30),
    note: spendRatio===null ? 'No income tracked yet' : `You plan to spend ${pct(spendRatio)}% of your income (aim for under 70%)`,
    tip: 'Trim spending a little to get under 70% of your income.'});
  // 2. saving
  const rate = earned>0 ? saved/earned : 0;
  parts.push({id:'save', name:'Saving rate', max:25, icon:CATEGORY_ICON_PATHS['Savings & Debt'], color:'var(--green)',
    pts: clamp(25*rate/0.2, 0, 25),
    note: `${fmt(saved)} set aside — ${pct(rate)}% of income (aim for 20%)`,
    tip: 'Move a bit more into savings or stocks — 20% of income is the target.'});
  // 3. cushion
  const leftRatio = earned>0 ? left/earned : 0;
  parts.push({id:'cushion', name:'Money left over', max:25, icon:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', color:'var(--accent)',
    pts: left<0 ? 0 : clamp(8 + 17*(leftRatio/0.1), 0, 25),
    note: left<0 ? `You'd finish ${fmt(-left)} short` : `${fmt(left)} left at the end (${pct(leftRatio)}% of income)`,
    tip: 'Build the leftover up to around 10% of your income.'});
  // 4. bills on track
  const now = new Date(), curKey = monthKey(now);
  const [y, mo] = key.split('-').map(Number);
  const due = m.outgoings.filter(o=>!o.quickAdd && (Number(o.amount)||0)>0 && (key<curKey || (key===curKey && (()=>{ const d = resolveScheduledDay(o,y,mo); return d && d<=now.getDate(); })())));
  const overdue = due.filter(o=>o.status!=='done');
  parts.push({id:'bills', name:'Bills on track', max:20, icon:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M9 15l2 2 4-4', color:'var(--amber)',
    pts: due.length ? 20*(1-overdue.length/due.length) : 20,
    note: !due.length ? 'Nothing due yet this month' : overdue.length ? `${overdue.length} of ${due.length} bills due so far still unpaid` : `All ${due.length} bills due so far are paid`,
    tip: 'Mark overdue bills as paid, or give them a new date.'});
  parts.forEach(p=>{ p.pts = round2(p.pts); });
  const score = Math.round(parts.reduce((a,p)=>a+p.pts,0));
  const weakest = parts.slice().sort((a,b)=>(a.pts/a.max)-(b.pts/b.max))[0];
  const rating = score>=85 ? ['Excellent','var(--green)'] : score>=70 ? ['Healthy','var(--green)'] : score>=50 ? ['Okay','var(--amber)'] : ['Needs attention','var(--red)'];
  return {key, score, parts, weakest, rating, active: earned>0 || spent>0};
}

      <div class="recap-rows">${rows.join('')}</div>`
    : `<div class="recap-empty">Nothing tracked in this month yet — add some income or outgoings and the recap will fill in.</div>`}
    ${d.active && yearReviewData(Number(d.key.slice(0,4))).ok ? `<a class="recap-link" id="recapYearLink">See your ${d.key.slice(0,4)} year in review →</a>` : ''}
    <div class="actions"><button class="btn small" id="recapClose">${opts.fromNewMonth ? 'Continue' : 'Close'}</button></div>`;
  bg.classList.add('open');
  bg.onclick = e=>{ if(e.target===bg) closeRecapModal(); };
  const yearLink = document.getElementById('recapYearLink');
  if(yearLink) yearLink.onclick = ()=>openYearReview(Number(d.key.slice(0,4)));
  document.getElementById('recapClose').onclick = ()=>{
    closeRecapModal();
    // Rolling December into January: offer the whole year next.
    if(opts.fromNewMonth && d.key.endsWith('-12') && yearReviewData(Number(d.key.slice(0,4))).ok) setTimeout(()=>openYearReview(Number(d.key.slice(0,4))), 250);
  };
  if(d.active){
    const netEl = document.getElementById('recapNet');
    netEl.dataset.animValue = '0';
    setTimeout(()=>animateNumberText(netEl, d.net, 900), 150);
  }
}

// ---------------- modal ----------------
function openConfirmModal(title, body, onConfirm){
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.innerHTML = `<h3>${title}</h3><p style="font-size:13px;color:var(--muted);">${body}</p>
    <div class="actions"><button class="btn secondary small" id="modalCancel">Cancel</button><button class="btn danger small" id="modalOk">Confirm</button></div>`;
  bg.classList.add('open');
  document.getElementById('modalCancel').onclick = ()=>bg.classList.remove('open');
  document.getElementById('modalOk').onclick = ()=>{ bg.classList.remove('open'); onConfirm(); };
}
function openInputModal(title, placeholder, onConfirm){
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.innerHTML = `<h3>${title}</h3>
    <input type="text" id="modalInputField" placeholder="${escapeHtml(placeholder||'')}" style="width:100%;">
    <div class="actions"><button class="btn secondary small" id="modalCancel">Cancel</button><button class="btn small" id="modalOk">Add</button></div>`;
  bg.classList.add('open');
  const inputEl = document.getElementById('modalInputField');
  inputEl.focus();
  const commit = ()=>{
    const val = inputEl.value.trim();
    bg.classList.remove('open');
    if(val) onConfirm(val);
  };
  document.getElementById('modalCancel').onclick = ()=>bg.classList.remove('open');
  document.getElementById('modalOk').onclick = commit;
  inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') commit(); });
}

// ---------------- nav / events ----------------
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
document.getElementById('hamburgerBtn').onclick = ()=>{
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
};
document.getElementById('sidebarBackdrop').onclick = closeSidebar;
{
  const sfSet = document.getElementById('sfSettings');
  const openSettings = ()=>{ currentView = 'settings'; render(); closeSidebar(); };
  sfSet.addEventListener('click', openSettings);
  sfSet.addEventListener('keydown', ev=>{ if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); openSettings(); } });
}
document.querySelectorAll('.bn-item').forEach(b=>{
  b.addEventListener('click', ()=>{ currentView = b.dataset.view; render(); window.scrollTo(0,0); });
});
document.getElementById('bnFab').addEventListener('click', openQuickAdd);
// Hide the bottom bar while typing so it doesn't float above the on-screen keyboard.
document.addEventListener('focusin', e=>{
  if(window.innerWidth<=860 && e.target.matches && e.target.matches('input,textarea,select')) document.body.classList.add('kbd-open');
});
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{ const a = document.activeElement; if(!(a && a.matches && a.matches('input,textarea,select'))) document.body.classList.remove('kbd-open'); }, 120);
});
document.querySelectorAll('.nav-item').forEach(n=>{
  n.addEventListener('click', ()=>{ currentView = n.dataset.view; render(); closeSidebar(); });
});
document.getElementById('prevMonth').onclick = ()=>{ state.currentMonthKey = shiftKey(state.currentMonthKey,-1); ensureMonth(state.currentMonthKey); save(); render(); };
document.getElementById('nextMonth').onclick = ()=>{ state.currentMonthKey = shiftKey(state.currentMonthKey,1); ensureMonth(state.currentMonthKey); save(); render(); };
document.getElementById('recapBtn').onclick = ()=>openRecapModal(state.currentMonthKey);
document.getElementById('scoreBtn').onclick = ()=>openScoreModal(state.currentMonthKey);
document.getElementById('newMonthBtn').onclick = ()=>{
  const leavingKey = state.currentMonthKey;
  const current = ensureMonth(state.currentMonthKey);
  const leftOver = monthTotals(current).totalLeftOver;
  const nextKey = shiftKey(state.currentMonthKey, 1);
  const nextAlreadyExisted = !!state.months[nextKey];
  const next = ensureMonth(nextKey);
  next.startingBalance = round2(leftOver);
  if(nextAlreadyExisted) syncRecurringForward(current, next);
  state.currentMonthKey = nextKey;
  save();
  render();
  const recap = monthRecapData(leavingKey);
  if(recap && recap.active) openRecapModal(leavingKey, {fromNewMonth:true});
  else if(leavingKey.endsWith('-12') && yearReviewData(Number(leavingKey.slice(0,4))).ok) openYearReview(Number(leavingKey.slice(0,4)));
};
document.getElementById('themeSelect').onchange = e=>{
  state.theme = e.target.value;
  save(); render();
};

render();
if(bootstrapFromUrlIfNeeded()) render();
(function(){
  const p = activeProfileMeta();
  if(p && p.syncEnabled && p.syncCode) updateUrlHashForSyncCode(p.syncCode);
})();
syncActiveProfileFromCloud();
setInterval(renderSyncIndicator, 60000);

// Clears the app's cached files (service worker + Cache Storage, plus the browser's
// cached copy of this page) and reloads. Budget data lives in localStorage and
// Firestore, neither of which is touched.
async function forceRefresh(){
  const btn = document.getElementById('forceRefreshBtn');
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const names = await caches.keys();
      await Promise.all(names.map(n=>caches.delete(n)));
    }
    await fetch(location.pathname, {cache:'reload'});
  }catch(e){
    console.error('Force refresh partly failed', e);
  }
  location.reload();
}
document.getElementById('forceRefreshBtn').onclick = forceRefresh;

if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(hadController) showToast('Updated', 'Reload to get the latest version');
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Service worker registration failed', e));
  });
}
