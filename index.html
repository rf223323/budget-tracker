    const t = Math.min(1, (now-start)/duration);
    el.textContent = fmt(fromValue + (toValue-fromValue)*easeOutCubic(t));
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Reads a live theme CSS variable (e.g. '--accent') so chart colors follow
// whichever theme is currently selected instead of a hardcoded hex.
function cssVar(name, fallback){
  const v = getComputedStyle(document.body).getPropertyValue(name).trim();
  return v || fallback;
}

// A small auto-dismissing confirmation toast, bottom-right of the screen.
function showToast(title, sub){
  const stack = document.getElementById('toastStack');
  if(!stack) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `
    <div class="toast-icon ok">✓</div>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${sub ? `<div class="toast-sub">${escapeHtml(sub)}</div>` : ''}
    </div>
    <button class="toast-close" aria-label="Dismiss">×</button>
  `;
  stack.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  const dismiss = ()=>{
    el.classList.remove('show');
    setTimeout(()=>el.remove(), 250);
  };
  el.querySelector('.toast-close').onclick = dismiss;
  setTimeout(dismiss, 3500);
}

// ---------------- Undo for deletes ----------------
// A deletion removes the item straight away and shows a toast with an Undo
// button; Ctrl/Cmd+Z undoes the most recent one too.
const undoStack = [];
function showUndoToast(label, onUndo, duration){
  const stack = document.getElementById('toastStack');
  if(!stack) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `
    <div class="toast-icon del">🗑</div>
    <div class="toast-body">
      <div class="toast-title">Deleted ${escapeHtml(label)}</div>
    </div>
    <button class="toast-undo" type="button">Undo</button>
    <button class="toast-close" aria-label="Dismiss">×</button>
  `;
  stack.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  let done = false;
  const entry = {};
  const dismiss = ()=>{
    if(done) return;
    done = true;
    const i = undoStack.indexOf(entry); if(i>=0) undoStack.splice(i,1);
    el.classList.remove('show');
    setTimeout(()=>el.remove(), 250);
  };
  const undo = ()=>{
    if(done) return;
    dismiss();
    onUndo();
    showToast('Restored', label);
  };
  entry.run = undo;
  undoStack.push(entry);
  el.querySelector('.toast-undo').onclick = undo;
  el.querySelector('.toast-close').onclick = dismiss;
  setTimeout(dismiss, duration || 7000);
}
document.addEventListener('keydown', e=>{
  if(!((e.metaKey||e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase()==='z')) return;
  const t = e.target;
  if(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  const last = undoStack[undoStack.length-1];
  if(last){ e.preventDefault(); last.run(); }
});
// Removes an item from m[listKey] by id, then offers to put it back in the same
// position. afterChange redraws whatever was showing; afterUndo (default: a
// full render) redraws after a restore.
// When a recurring item is removed (deleted, or switched to One-off), its copies
// in months AFTER this one that have already been generated should go too.
// Only still-recurring, not-yet-Done copies are touched, matched by the source
// id they were synced from or by name.
function monthKeyOf(m){ return Object.keys(state.months).find(k=>state.months[k]===m) || null; }
function futureRecurringCopies(m, listKey, item){
  const key = monthKeyOf(m);
  if(!key) return [];
  const norm = v => (v||'').trim().toLowerCase();
  const name = norm(item.name);
  const found = [];
  Object.keys(state.months).filter(k=>k>key).sort().forEach(k=>{
    state.months[k][listKey].forEach((x,idx)=>{
      if(!x.recurring || x.status==='done' || x.pay3Id || x===item) return;
      if(x.syncSourceId===item.id || norm(x.name)===name) found.push({key:k, idx, item:x});
    });
  });
  return found;
}
function removeFutureCopies(found, listKey){
  const byMonth = {};
  found.forEach(f=>{ (byMonth[f.key] = byMonth[f.key]||new Set()).add(f.item); });
  Object.entries(byMonth).forEach(([k,set])=>{ state.months[k][listKey] = state.months[k][listKey].filter(x=>!set.has(x)); });
}
function restoreFutureCopies(found, listKey){
  found.slice().sort((a,b)=>a.key===b.key ? a.idx-b.idx : a.key.localeCompare(b.key)).forEach(f=>{
    const arr = state.months[f.key] && state.months[f.key][listKey];
    if(!arr) return;
    const next = arr.slice();
    next.splice(Math.min(f.idx, next.length), 0, f.item);
    state.months[f.key][listKey] = next;
  });
}
function laterMonthsLabel(found){
  const n = new Set(found.map(f=>f.key)).size;
  return n ? ` (also from ${n} later month${n!==1?'s':''})` : '';
}
// Removes an item from m[listKey] by id, then offers to put it back in the same
// position. afterChange redraws whatever was showing; afterUndo (default: a
// full render) redraws after a restore. A recurring item also leaves the later
// months it was already copied into, and comes back with Undo.
function removeWithUndo(m, listKey, id, label, afterChange, afterUndo){
  const idx = m[listKey].findIndex(x=>x.id===id);
  if(idx<0) return;
  const removed = m[listKey][idx];
  const future = (removed.recurring && (listKey==='outgoings' || listKey==='incoming')) ? futureRecurringCopies(m, listKey, removed) : [];
  m[listKey] = m[listKey].filter(x=>x.id!==id);
  removeFutureCopies(future, listKey);
  save();
  if(afterChange) afterChange();
  showUndoToast((label || removed.name || 'item') + laterMonthsLabel(future), ()=>{
    const next = m[listKey].slice();
    next.splice(Math.min(idx, next.length), 0, removed);
    m[listKey] = next;
    restoreFutureCopies(future, listKey);
    save();
    (afterUndo || render)();
  });
}
// Switching a recurring item to One-off should also stop it appearing in later
// months that were already generated.
function stopRecurringWeekInLaterMonths(m, wk){
  const key = monthKeyOf(m);
  if(!key) return;
  const prev = [];
  Object.keys(state.months).filter(k=>k>key).sort().forEach(k=>{
    const w = state.months[k].weekly[wk];
    if(w && w.recurring && w.status!=='done'){ prev.push({key:k, week:w}); state.months[k].weekly[wk] = {amount:0, status:'none', recurring:false}; }
  });
  if(!prev.length) return;
  save();
  const n = prev.length;
  showUndoToast(`${wk.replace('week','Week ')} from ${n} later month${n!==1?'s':''}`, ()=>{
    prev.forEach(p=>{ if(state.months[p.key]) state.months[p.key].weekly[wk] = p.week; });
    save();
    render();
  });
}
function stopRecurringInLaterMonths(m, listKey, item){
  const future = futureRecurringCopies(m, listKey, item);
  if(!future.length) return;
  removeFutureCopies(future, listKey);
  save();
  showUndoToast(`${item.name||'item'}${laterMonthsLabel(future)}`, ()=>{
    restoreFutureCopies(future, listKey);
    save();
    render();
  });
}

// ---------------- Smart categorising ----------------
// Suggests a category from what you type, learning from your own history first
// (every outgoing/income name you've already categorised) and falling back to a
// built-in list of common merchants and words. Nothing extra is stored — the
// history IS your existing entries, so it improves as you use the app.
function normText(s){ return String(s||'').toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9& ]+/g,' ').replace(/\s+/g,' ').trim(); }
const SMART_KEYWORDS = {
  out: [
    ['Groceries', ['tesco','sainsbury','asda','morrisons','lidl','aldi','waitrose','iceland','co-op','coop','ocado','supermarket','groceries','grocery','milk','bread','eggs','fruit','veg']],
    ['Transport', ['bus','train','tube','tfl','oyster','uber','bolt','taxi','cab','petrol','diesel','fuel','parking','shell','esso','texaco','bp','flight','ryanair','easyjet','mot','car wash','toll']],
    ['Eating Out', ['coffee','costa','starbucks','greggs','mcdonald','kfc','burger','nando','pret','subway','deliveroo','just eat','uber eats','domino','pizza','takeaway','lunch','dinner','breakfast','brunch','cafe','restaurant','pub','bar','drinks','wagamama','pizza express']],
    ['Subscriptions', ['netflix','spotify','disney','prime','amazon prime','icloud','apple music','youtube','now tv','subscription','audible','dropbox','patreon']],
    ['Health & Fitness', ['gym','boots','superdrug','pharmacy','prescription','doctor','dentist','optician','physio','vitamins','fitness','swim']],
    ['Grooming', ['haircut','barber','salon','nails','hairdresser','beauty','spa','wax']],
    ['Entertainment', ['cinema','concert','ticket','tickets','theatre','game','games','steam','playstation','xbox','gig','festival','bowling','museum']],
    ['Shopping', ['amazon','ebay','asos','primark','zara','h&m','next','clothes','shoes','shopping','argos','ikea','currys','jd sports','gift','present']],
    ['Bills & Utilities', ['electric','electricity','gas bill','water','broadband','wifi','internet','council tax','phone bill','sky','virgin','bt','tv licence','insurance','utilities','energy']],
    ['Housing', ['rent','mortgage','landlord','service charge','ground rent']],
    ['Pay in 3', ['klarna','clearpay','afterpay','laybuy']],
    ['Savings & Debt', ['savings','loan','credit card','overdraft','debt']]
  ],
  in: [
    ['Salary', ['salary','wages','wage','payroll','pay','paycheck','bonus','overtime']],
    ['From partner', ['partner','wife','husband','girlfriend','boyfriend','fiance','fiancee','other half']],
    ['Selling goods', ['sold','sale','selling','ebay','vinted','depop','gumtree','marketplace','facebook marketplace','cex']],
    ['From friend', ['friend','mate','owes','paid me back','pay back','split','mum','dad','gift','birthday']]
  ]
};
let smartHistoryCache = {stamp:null, out:null, in:null};
function getSmartHistory(kind){
  if(smartHistoryCache.stamp !== state.__updatedAt){ smartHistoryCache = {stamp: state.__updatedAt, out:null, in:null}; }
  if(smartHistoryCache[kind]) return smartHistoryCache[kind];
  const hist = new Map();
  Object.values(state.months).forEach(m=>{
    (kind==='in' ? m.incoming : m.outgoings).forEach(it=>{
      if(it.pay3Id || it.transfer) return;
      const cat = it.category;
      if(!cat || cat==='Uncategorized') return;
      // strip things like "(2/3)" and trailing numbers so "Gym 2" and "Gym" match
      const key = normText(String(it.name||'').replace(/\(\d+\/\d+\)/g,''));
      if(key.length<2) return;
      const entry = hist.get(key) || {};
      entry[cat] = (entry[cat]||0) + 1;
      hist.set(key, entry);
    });
  });
  smartHistoryCache[kind] = hist;
  return hist;
}
// Returns {category, source:'history'|'keyword'} or null.
function suggestCategory(text, kind){
  const q = normText(text);
  if(q.length<2) return null;
  const list = kind==='in' ? INCOME_CATEGORIES : OUTGOING_CATEGORIES;
  const qTokens = q.split(' ').filter(t=>t.length>=3);
  const scores = {};
  getSmartHistory(kind).forEach((cats, name)=>{
    let s = 0;
    if(name===q) s = 4;
    else if(q.length>=3 && name.length>=3 && (name.startsWith(q) || q.startsWith(name))) s = 3;
    else if(qTokens.length && name.split(' ').some(t=>qTokens.includes(t))) s = 1.5;
    if(!s) return;
    Object.entries(cats).forEach(([cat,c])=>{ scores[cat] = (scores[cat]||0) + s*c; });
  });
  let best = null;
  Object.entries(scores).forEach(([cat,sc])=>{ if(list.includes(cat) && sc>=1.5 && (!best || sc>best.sc)) best = {cat, sc}; });
  if(best) return {category:best.cat, source:'history'};
  const tokens = q.split(' ');
  for(const [cat, words] of SMART_KEYWORDS[kind==='in'?'in':'out']){
    if(!list.includes(cat)) continue;
    if(words.some(w=> w.includes(' ') ? q.includes(w) : (w.length>=5 ? q.includes(w) : tokens.includes(w)))) return {category:cat, source:'keyword'};
  }
  return null;
}
// Wires a "reason" text input to a category dropdown: as you type, the dropdown
// follows the suggestion (marked "auto") until you pick a category yourself.
function attachSmartCategory(reasonInput, dd, kind){
  let picked = false, applied = false, timer = null;
  const setAuto = (on, why)=>{
    dd.classList.toggle('auto', on);
    dd.title = on ? (why==='history' ? 'Suggested from your past entries' : 'Suggested from the name — pick another to override') : '';
  };
  const apply = ()=>{
    if(picked) return;
    const sug = suggestCategory(reasonInput.value, kind);
    if(sug){ setCategoryDropdownValue(dd, sug.category); setAuto(true, sug.source); applied = true; }
    else if(applied){ setCategoryDropdownValue(dd, 'Uncategorized'); setAuto(false); applied = false; }
  };
  reasonInput.addEventListener('input', ()=>{ clearTimeout(timer); timer = setTimeout(apply, 120); });
  return {
    markPicked(){ picked = true; applied = false; setAuto(false); },
    markAuto(category, why){ if(picked) return; setCategoryDropdownValue(dd, category); setAuto(true, why); applied = true; },
    apply
  };
}
// For rows in the tables: when a name is entered and the category was never set,
// fill it in (and tell the caller so it can save and redraw).
function autoCategoryForName(name, currentCategory, kind){
  if(currentCategory && currentCategory!=='Uncategorized') return null;
  const sug = suggestCategory(name, kind);
  return sug ? sug.category : null;
}

// ---------------- Receipt scanning (client-side OCR via Tesseract.js) ----------------
// Loaded lazily from a CDN on first use, never bundled, so a normal page load
// doesn't pay for it. The photo itself never leaves the browser — Tesseract
// runs entirely client-side (WASM), only its own library/model files are
// fetched over the network.
let tesseractLoadPromise = null;
function ensureTesseractLoaded(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.onload = resolve;
    script.onerror = ()=>{ tesseractLoadPromise = null; reject(new Error('Failed to load Tesseract.js')); };
    document.head.appendChild(script);
  });
  return tesseractLoadPromise;
}
// Phone photos straight into Tesseract read as gibberish: they're huge, shadowed
// and unevenly lit. This decodes with EXIF rotation applied, resizes so text is
// a readable size, then returns two versions: contrast-stretched greyscale,
// and the same with uneven lighting/shadows flattened out.
async function loadImageForOcr(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){}
  }
  return await new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function preprocessReceiptImage(file){
  const img = await loadImageForOcr(file);
  const longest = Math.max(img.width, img.height);
  let scale = 1;
  if(longest > 2000) scale = 2000/longest;
  else if(longest < 1400) scale = Math.min(2, 1400/longest);
  const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h);
  const d = data.data;
  const n = w*h;
  const gray = new Uint8ClampedArray(n);
  const hist = new Uint32Array(256);
  for(let i=0, j=0; j<n; i+=4, j++){
    const g = Math.round(d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);
    gray[j] = g; hist[g]++;
  }
  // Stretch contrast between the 2nd and 98th percentile so faded thermal
  // paper and dim lighting use the full tonal range.
  let lo = 0, hi = 255, acc = 0;
  for(let v=0; v<256; v++){ acc += hist[v]; if(acc >= n*0.02){ lo = v; break; } }
  acc = 0;
  for(let v=255; v>=0; v--){ acc += hist[v]; if(acc >= n*0.02){ hi = v; break; } }
  if(hi-lo < 20){ lo = 0; hi = 255; }
  const range = hi-lo;
  for(let j=0; j<n; j++) gray[j] = Math.max(0, Math.min(255, (gray[j]-lo)*255/range));
  const toCanvas = pixels=>{
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    const octx = out.getContext('2d');
    const od = octx.createImageData(w, h);
    for(let i=0, j=0; j<n; i+=4, j++){ od.data[i]=od.data[i+1]=od.data[i+2]=pixels[j]; od.data[i+3]=255; }
    octx.putImageData(od, 0, 0);
    return out;
  };
  // Flatten uneven lighting: divide each pixel by a heavily blurred copy of the
  // image (integral image keeps that fast) so a shadow across the receipt stops
  // looking like a change in ink. The floor stops dark backgrounds, where grain
  // dominates, from being amplified into noise. Output stays smooth greyscale —
  // Tesseract does its own binarising better than a hard cut here.
  const stride = w+1;
  const integral = new Uint32Array(stride*(h+1));
  for(let y=0; y<h; y++){
    let rowSum = 0;
    for(let x=0; x<w; x++){
      rowSum += gray[y*w+x];
      integral[(y+1)*stride + x+1] = integral[y*stride + x+1] + rowSum;
    }
  }
  const r = Math.max(30, Math.round(Math.min(w, h)/10));
  const flat = new Uint8ClampedArray(n);
  for(let y=0; y<h; y++){
    const y0 = Math.max(0, y-r), y1 = Math.min(h-1, y+r);
    for(let x=0; x<w; x++){
      const x0 = Math.max(0, x-r), x1 = Math.min(w-1, x+r);
      const area = (x1-x0+1)*(y1-y0+1);
      const mean = (integral[(y1+1)*stride + x1+1] - integral[y0*stride + x1+1] - integral[(y1+1)*stride + x0] + integral[y0*stride + x0]) / area;
      flat[y*w+x] = gray[y*w+x] * 215 / Math.max(mean, 90);
    }
  }
  return {flat: toCanvas(flat), greyscale: toCanvas(gray)};
}
function rotateCanvas(src, deg){
  if(deg===0) return src;
  const out = document.createElement('canvas');
  const swap = deg===90 || deg===270;
  out.width = swap ? src.height : src.width;
  out.height = swap ? src.width : src.height;
  const ctx = out.getContext('2d');
  ctx.translate(out.width/2, out.height/2);
  ctx.rotate(deg*Math.PI/180);
  ctx.drawImage(src, -src.width/2, -src.height/2);
  return out;
}
// Runs OCR on the cleaned-up photo. Tries it upright first; if Tesseract isn't
// confident (a sideways or upside-down receipt reads as noise), tries the other
// orientations, then plain greyscale, and keeps the most confident read.
// onStage(label) reports which attempt is running.
async function ocrReceipt(file, onProgress, onStage){
  const variants = await preprocessReceiptImage(file);
  const worker = await Tesseract.createWorker('eng', 1, {
    logger: info=>{ if(info.status==='recognizing text') onProgress(info.progress); }
  });
  try{
    await worker.setParameters({tessedit_pageseg_mode:'6', preserve_interword_spaces:'1', user_defined_dpi:'300'});
    let best = null;
    const attempt = async (canvas, deg)=>{
      const { data } = await worker.recognize(rotateCanvas(canvas, deg));
      if(!best || data.confidence > best.confidence) best = {text:data.text, confidence:data.confidence, deg};
      return best.confidence >= 65;
    };
    if(await attempt(variants.flat, 0)) return best;
    for(const deg of [90, 270, 180]){
      if(onStage) onStage('Trying another angle…');
      if(await attempt(variants.flat, deg)) return best;
    }
    if(onStage) onStage('Trying another filter…');
    await attempt(variants.greyscale, best.deg);
    return best;
  } finally {
    await worker.terminate();
  }
}
// Keyword → category guesses from common UK merchant names on a receipt.
const RECEIPT_CATEGORY_KEYWORDS = [
  [['tesco','sainsbury','asda','morrisons','lidl','aldi','co-op','coop','waitrose','iceland'], 'Groceries'],
  [['shell','bp ','esso','texaco','gulf','applegreen','petrol'], 'Transport'],
  [['costa','starbucks','greggs','mcdonald','kfc','burger king','nando','pret','subway','deliveroo','just eat','uber eats','domino','pizza'], 'Eating Out'],
  [['boots','superdrug','pharmacy'], 'Health & Fitness'],
  [['primark','h&m','zara','next retail','asos','jd sports'], 'Shopping'],
];
function guessMerchantFromText(lowerText){
  for(const [keywords] of RECEIPT_CATEGORY_KEYWORDS){
    const hit = keywords.find(k=>lowerText.includes(k));
    if(hit) return hit.trim().replace(/\b\w/g, c=>c.toUpperCase());
  }
  return '';
}
function guessCategoryFromText(lowerText){
  for(const [keywords, cat] of RECEIPT_CATEGORY_KEYWORDS){
    if(keywords.some(k=>lowerText.includes(k))) return cat;
  }
  return null;
}
// Pulls a best-guess total and merchant name out of raw OCR text. Heuristic,
// not exact — the caller always leaves the result editable before saving.
function parseReceiptText(rawText, confidence=100){
  // OCR often reads the decimal point as a comma or space ("12,34", "12 34").
  const raw = rawText.replace(/(\d)[,\s](\d{2})(?!\d)/g, (m, a, b)=> m.includes(' ') && /\d{3}\s\d{2}/.test(m) ? m : `${a}.${b}`);
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const lowerText = raw.toLowerCase();
  const totalLineRe = /\b(total|amount due|balance due|to pay|grand total)\b/i;
  let amount = null;
  for(const line of lines){
    if(totalLineRe.test(line)){
      const m = line.match(/(\d{1,4}\.\d{2})/);
      if(m){ amount = parseFloat(m[1]); break; }
    }
  }
  if(amount==null){
    const moneyRe = /(\d{1,4}\.\d{2})\b/g;
    let max = null, m;
    while((m = moneyRe.exec(raw))){
      const v = parseFloat(m[1]);
      if(!isNaN(v) && (max===null || v>max)) max = v;
    }
    amount = max;
  }
  // Prefer a recognised merchant name; otherwise the first early line that
  // looks like real words (mostly letters) rather than OCR noise.
  let reason = guessMerchantFromText(lowerText);
  // A guessed line is only trusted when the read was confident; low-confidence
  // text often looks plausible but is noise.
  if(!reason && confidence>=70){
    for(const line of lines.slice(0,8)){
      const clean = line.replace(/[^a-zA-Z0-9&' .-]/g,'').trim();
      const letters = (clean.match(/[a-zA-Z]/g)||[]).length;
      if(letters>=4 && letters/clean.length>=0.7 && /[aeiouAEIOU]/.test(clean)){ reason = clean; break; }
    }
  }
  return {amount, reason, category: guessCategoryFromText(lowerText)};
}

// Resolves an item's schedule to an actual day-of-month (1-31) for a specific
// calendar month, or null if it has none. month is 1-12.

  const daysInMonth = new Date(year, month, 0).getDate();

let chartTooltipEl = null;
function ensureChartTooltip(){

  chartTooltipEl.style.cssText = 'position:fixed;pointer-events:none;z-index:200;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow);display:none;white-space:nowrap;';

let lineChartUid = 0;
// Interactive line chart. data is a flat array of {x,y,label} (one series) or

// opts: height, width, marker:{index,label} (a vertical "Today" line),
// animate:false (skip the draw-in, used when redrawing after a legend toggle).
// Hover/touch scrubs across all series at once; legend items (a .legend
// sibling, or one generated here for multi-series charts) toggle series.
function lineChart(container, data, opts={}){
  const isMulti = Array.isArray(data) && data.length>0 && data[0].points !== undefined;
  const allSeries = isMulti ? data : [{color:cssVar('--accent','#5b8cff'), points:data}];
  container._lc = {data, opts};
  const hidden = container._hidden || (container._hidden = new Set());
  let visible = allSeries.map((s,i)=>({s,i})).filter(({i})=>!hidden.has(i));
  if(!visible.length){ hidden.clear(); visible = allSeries.map((s,i)=>({s,i})); }

  const w = opts.width||container.clientWidth||600, h = opts.height||240;
  const narrow = w < 520;
  const allVals = visible.flatMap(({s})=>s.points.map(p=>p.y));
  let maxV = Math.max(...allVals, 0), minV = Math.min(...allVals, 0);

  const rawRange = maxV - minV;

    maxV = Math.ceil(maxV/tickStep-1e-9)*tickStep;
  }
  const tickCount = tickStep ? Math.round((maxV-minV)/tickStep) : 3;
  const range = (maxV - minV) || 1;
  const fmtAxis = v => hideMoney ? state.currency+'•••' : narrow ? fmtCompact(v) : state.currency+Math.round(v).toLocaleString();
  const axisLabels = Array.from({length:tickCount+1}, (_,i)=>fmtAxis(rawRange===0 ? maxV : maxV - (range*i/tickCount)));
  const padL = Math.max(narrow ? 34 : 54, Math.max(...axisLabels.map(l=>l.length))*(narrow?6.4:6.2)+12), padR = narrow ? 12 : 16, padT = 18, padB = narrow ? 30 : 28;
  const axisFont = narrow ? 11 : 10;

  const svg = svgEl('svg',{viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, style:'display:block;touch-action:pan-y;'});
  const gridColor = cssVar('--border','#2a3552');
  const mutedColor = cssVar('--muted','#8a93ab');
  const textColor = cssVar('--text','#e8ecf7');
  const bottom = h-padB;
  const defs = svgEl('defs',{});

  for(let i=0;i<=tickCount;i++){
    const y = padT + (h-padT-padB)*i/tickCount;
    svg.appendChild(svgEl('line',{x1:padL,y1:y,x2:w-padR,y2:y,stroke:gridColor,'stroke-width':1}));
    const t = svgEl('text',{x:padL-7,y:y+4,'font-size':axisFont,fill:mutedColor,'text-anchor':'end'}); t.textContent = axisLabels[i];
    svg.appendChild(t);
  }
  const xStep = n>1 ? (w-padL-padR)/(n-1) : 0;
  const yFor = v => padT + (h-padT-padB)*(1-((v-minV)/range));
  const xFor = i => padL + xStep*i;

    const mx = xFor(opts.marker.index);
    svg.appendChild(svgEl('line',{x1:mx,y1:padT-4,x2:mx,y2:bottom,stroke:mutedColor,'stroke-width':1,'stroke-dasharray':'3,3',opacity:.55}));
    const mt = svgEl('text',{x:mx,y:padT-6,'font-size':9.5,fill:mutedColor,'text-anchor':'middle','font-weight':600});
    mt.textContent = opts.marker.label || 'Today';

  const smallDots = n<=16;
  const dotRefs = [];

    const color = s.color||cssVar('--accent','#5b8cff');
    const pts = s.points.map((p,i)=>({x:xFor(i), y:yFor(p.y)}));

      const gid = `lcg${uid}_${si}`;

      grad.appendChild(svgEl('stop',{offset:0,'stop-color':color,'stop-opacity':.28}));
      grad.appendChild(svgEl('stop',{offset:1,'stop-color':color,'stop-opacity':0}));

      const area = svgEl('path',{d:`${d} L${pts[pts.length-1].x},${bottom} L${pts[0].x},${bottom} Z`, fill:`url(#${gid})`, stroke:'none'});

    }
    const pathAttrs = {d, fill:'none', stroke:color, 'stroke-width':narrow?2.8:2.4, 'stroke-linejoin':'round','stroke-linecap':'round'};

    }

  });

  const maxLabels = Math.max(1, Math.min(n, Math.floor((w-padL-padR)/(narrow?58:90))));
  // On phones drop the year from month labels ("Apr 2026" → "Apr"); keep a '26 suffix only when the data spans years.
  const yearsSeen = new Set(allSeries[0].points.map(p=>(String(p.x).match(/\b(20\d\d)$/)||[])[1]).filter(Boolean));

    const x = xFor(i);
    // First/last labels anchor inward so they can't spill past the chart's own edge.
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    const t = svgEl('text',{x, y:h-8, 'font-size':axisFont, fill:mutedColor, 'text-anchor':anchor});

  // Hover/touch scrubbing: one overlay catches the pointer, snaps to the nearest
  // month, and lights up that month on every visible series.
  const guide = svgEl('line',{y1:padT-2,y2:bottom,stroke:textColor,'stroke-width':1,'stroke-dasharray':'3,3',opacity:0,style:'pointer-events:none;'});
  svg.appendChild(guide);
  dotRefs.forEach(r=>{
    r.ring = svgEl('circle',{r:5.5,fill:cssVar('--panel','#161d2e'),stroke:r.color,'stroke-width':2.4,opacity:0,style:'pointer-events:none;'});

    const x = xFor(idx);

      if(!r.s.points[idx]) return '';
      const v = r.s.points[idx].y;
      let delta = '';
      if(dotRefs.length===1 && idx>0){
        const dv = round2(v - r.s.points[idx-1].y);
        if(Math.abs(dv)>=0.005) delta = ` <span style="color:var(--muted);font-weight:500;">(${dv>0?'+':''}${escapeHtml(fmt(dv))})</span>`;
      }

// Clickable legend: clicking an item hides/shows that series and redraws.
// Uses an existing .legend directly after the chart if there is one (item
// order must match series order), otherwise builds a simple one.
function wireChartLegend(container, allSeries){
  let legend = container.nextElementSibling;
  if(!legend || !legend.classList.contains('legend')){
    legend = document.createElement('div');
    legend.className = 'legend auto-legend';
    legend.innerHTML = allSeries.map(s=>`<div class="legend-item"><span class="${s.dashed?'dash':'dot'}" style="${s.dashed?'border-color':'background'}:${s.color};"></span>${escapeHtml(s.name||'')}</div>`).join('');

  }
  const items = [...legend.querySelectorAll('.legend-item')];
  items.forEach((it,i)=>{

  const CAP = 6;
  let segRows = rows.slice(0, CAP);
  if(rows.length > CAP) segRows = [...rows.slice(0, CAP-1), {category:'Others', amount: rows.slice(CAP-1).reduce((a,r)=>a+r.amount,0), others:true}];
  let cum = 0;
  const gap = 1.6;
  const segs = segRows.map(r=>{
    const pct = r.amount/total*100;
    const len = Math.max(pct-gap, 0.7);
    const color = r.others ? '#8a93ab' : categoryColor(r.category);
    const out = `<path class="g-seg" d="M30,140 A110,110 0 0 1 250,140" pathLength="100" fill="none" stroke="${color}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(100-len).toFixed(2)}" stroke-dashoffset="${(-cum).toFixed(2)}" style="filter:drop-shadow(0 0 5px ${color});animation-delay:${(segRows.indexOf(r)*0.06).toFixed(2)}s;"><title>${escapeHtml(r.category)}: ${escapeHtml(fmt(r.amount))} (${Math.round(pct)}%)</title></path>`;
    cum += pct;
    return out;
  }).join('');
  return `<div class="gauge-wrap">
    <svg viewBox="0 0 280 160" role="img" aria-label="${escapeHtml(caption||'Spending')} by category">
      <path d="M30,140 A110,110 0 0 1 250,140" pathLength="100" fill="none" stroke="color-mix(in srgb, var(--text) 10%, transparent)" stroke-width="18" stroke-linecap="round"/>
      ${segs}
    </svg>
    <div class="gauge-center"><div class="gauge-total">${escapeHtml(fmt(total))}</div><div class="gauge-cap">${escapeHtml(caption||'')}</div></div>
  </div>`;
}
// Category breakdown drawn as activity rings: one glowing ring per category (the biggest
// spends first), each sized against the biggest and labelled with its share of the total.
// rows = [{category, amount}], sorted desc. More than 5 categories → the rest are
// gathered into a grey "Others" ring.
function donutChart(container, rows, opts={}){
  const size = opts.size || 220;
  const total = rows.reduce((s,r)=>s+r.amount,0);
  const CAP = 5;
  let ringRows = rows.slice(0, CAP);
  if(rows.length > CAP){
    const rest = rows.slice(CAP-1);
    ringRows = [...rows.slice(0, CAP-1), {category:'Others', amount: rest.reduce((s,r)=>s+r.amount,0), others:true}];
  }
  const max = ringRows.length ? Math.max(...ringRows.map(r=>r.amount)) : 0;
  const colorOf = r => r.others ? '#8a93ab' : categoryColor(r.category);
  const SWEEP = 75;      // each ring is a 270° arc (75% of a circle) so the top-left quadrant is free for labels
  const R0 = 91, STEP = 12, W = 9;

  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'donut-wrap';
  wrap.style.width = size+'px';
  wrap.style.height = size+'px';

  const svg = svgEl('svg', {viewBox:'0 0 200 200', width:size, height:size, style:'display:block;overflow:visible;'});
  const trackColor = 'color-mix(in srgb, var(--text) 10%, transparent)';

  const center = document.createElement('div');
  center.className = 'donut-center';
  center.style.width = '40%';
  const centerValue = document.createElement('div'); centerValue.className='donut-center-value';
  const centerLabel = document.createElement('div'); centerLabel.className='donut-center-label';
  centerValue.style.fontSize = Math.round(size*0.085)+'px';
  centerLabel.style.fontSize = Math.max(9, Math.round(size*0.052))+'px';
  center.appendChild(centerValue); center.appendChild(centerLabel);
  const setCenter = (value,label)=>{ centerValue.textContent=value; centerLabel.textContent=label; };
  const resetCenter = ()=>setCenter(total ? fmtCompact(total) : '—', total ? 'Total' : 'No spending');
  resetCenter();

  const groups = [];
  if(total>0){
    ringRows.forEach((r,i)=>{
      const radius = R0 - STEP*i;
      const color = colorOf(r);
      const pct = Math.round(r.amount/total*100);
      const g = svgEl('g', {transform:'rotate(-90 100 100)'});
      g.style.transition = 'opacity .15s';
      g.style.cursor = 'pointer';
      const base = {cx:100, cy:100, r:radius, fill:'none', pathLength:100, 'stroke-linecap':'round'};
      g.appendChild(svgEl('circle', {...base, stroke:trackColor, 'stroke-width':W, 'stroke-dasharray':`${SWEEP} 100`}));
      const fill = svgEl('circle', {...base, stroke:color, 'stroke-width':W, 'stroke-dasharray':'0 100'});
      fill.style.filter = `drop-shadow(0 0 3px ${color})`;
      fill.style.transition = 'stroke-dasharray .8s cubic-bezier(.4,.1,.2,1)';
      const dash = `${Math.max(r.amount/max*SWEEP, 2)} 100`;
      g.appendChild(fill);
      // roomy invisible hit area so the thin ring is easy to hover or tap
      g.appendChild(svgEl('circle', {...base, stroke:'transparent', 'stroke-width':W+3, 'stroke-dasharray':`${SWEEP} 100`, style:'pointer-events:stroke;'}));
      setTimeout(()=>fill.setAttribute('stroke-dasharray', dash), 40);
      groups.push(g);
      svg.appendChild(g);
      // percentage label at the start of the ring (12 o'clock), in the free quadrant
      const t = svgEl('text', {x:95, y:100 - radius + 3.7, 'text-anchor':'end', 'font-size':10.2, 'font-weight':800, fill:color});
      t.style.pointerEvents = 'none';
      t.textContent = pct+'%';
      svg.appendChild(t);

      const tipText = `${r.others ? '' : categoryIcon(r.category)+' '}${r.category}: ${fmt(r.amount)} (${pct}%)`;
      const select = evt=>{
        groups.forEach(o=>{ o.style.opacity = o===g ? '1' : '0.35'; });
        setCenter(fmtCompact(r.amount), r.category);
        if(evt && evt.pointerType!=='touch') showChartTooltip(evt, tipText);
      };
      const clear = ()=>{ groups.forEach(o=>o.style.opacity='1'); resetCenter(); hideChartTooltip(); };
      g.addEventListener('pointerenter', select);
      g.addEventListener('pointermove', evt=>{ if(evt.pointerType!=='touch') showChartTooltip(evt, tipText); });
      g.addEventListener('pointerleave', evt=>{ if(evt.pointerType!=='touch') clear(); });
      g.addEventListener('pointerdown', evt=>{ if(evt.pointerType==='touch'){ evt.stopPropagation(); select(evt); } });
      container._ringClear = clear;
    });
    // tapping anywhere else on touch screens goes back to the total
    svg.addEventListener('pointerdown', evt=>{ if(evt.pointerType==='touch' && container._ringClear) container._ringClear(); });
  } else {
    svg.appendChild(svgEl('circle', {cx:100, cy:100, r:R0, fill:'none', stroke:trackColor, 'stroke-width':W}));
  }

  wrap.appendChild(svg);
  wrap.appendChild(center);
  container.appendChild(wrap);
}

// Orders a list's rows by due day and splits them under "To pay / Paid" style headings.
// Only touches the DOM when the order or grouping actually changes, so typing in a row never loses focus.
function applyGrouping(tbody, items, labels, filter){
  if(!tbody) return;
  const [y,mo] = state.currentMonthKey.split('-').map(Number);
  const trs = [...tbody.querySelectorAll('tr[data-id]')];
  tbody.querySelectorAll('tr.grp-row').forEach(r=>{ if(!trs.length) r.remove(); });
  if(!trs.length) return;
  const dayOf = it=>{ const d = resolveScheduledDay(it, y, mo); return d==null ? 99 : d; };
  const info = trs.map(tr=>({tr, it:items.find(x=>x.id===tr.dataset.id)})).filter(x=>x.it);
  info.sort((a,b)=>dayOf(a.it)-dayOf(b.it));
  const vis = x=>!filter || filter(x.it);
  const plan = [];
  [[labels[0], info.filter(x=>x.it.status!=='done')], [labels[1], info.filter(x=>x.it.status==='done')]].forEach(([lab,arr])=>{
    const v = arr.filter(vis);
    if(v.length) plan.push({hdr:true, lab, n:v.length, sum:round2(v.reduce((t,x)=>t+(Number(x.it.amount)||0),0))});
    arr.forEach(x=>plan.push({tr:x.tr, show:vis(x)}));
  });
  const sig = plan.map(p=>p.hdr ? 'h:'+p.lab+':'+p.n : 'r:'+p.tr.dataset.id+':'+p.show).join('|');
  if(tbody.dataset.sig!==sig || tbody.querySelectorAll('tr.grp-row').length!==plan.filter(p=>p.hdr).length){
    tbody.dataset.sig = sig;
    tbody.querySelectorAll('tr.grp-row').forEach(r=>r.remove());
    plan.forEach(p=>{
      if(p.hdr){ const h = document.createElement('tr'); h.className = 'grp-row'; h.innerHTML = '<td colspan="8"><div class="grp-h"><span></span><span></span></div></td>'; tbody.appendChild(h); p.el = h; }
      else { p.tr.style.display = p.show ? '' : 'none'; tbody.appendChild(p.tr); }
    });
  }
  const hdrs = tbody.querySelectorAll('tr.grp-row'); let i = 0;
  plan.filter(p=>p.hdr).forEach(p=>{ const h = hdrs[i++]; if(!h) return; const sp = h.querySelectorAll('.grp-h span'); sp[0].textContent = `${p.lab} · ${p.n}`; sp[1].textContent = fmt(p.sum); });
}

// Days until the next dated income that hasn't been received yet (this month or next),
// preferring regular pay (recurring or Salary). null when nothing is scheduled.
function daysUntilPayday(){
  const today = new Date(); today.setHours(0,0,0,0);
  const cur = monthKey(today), nxt = monthKey(new Date(today.getFullYear(), today.getMonth()+1, 1));
  let regular = null, any = null;
  [cur, nxt].forEach(k=>{
    const m = state.months[k];
    if(!m) return;
    const [y, mo] = k.split('-').map(Number);
    m.incoming.forEach(i=>{
      if(i.status==='done' || i.transfer || !((Number(i.amount)||0)>0)) return;
      const d = resolveScheduledDay(i, y, mo);
      if(!d) return;
      const date = new Date(y, mo-1, d);
      if(date<=today) return;
      if(any===null || date<any) any = date;
      if((i.recurring || i.category==='Salary') && (regular===null || date<regular)) regular = date;
    });
  });
  const pick = regular || any;
  return pick ? Math.round((pick-today)/86400000) : null;
}

function paydayPlan(key){
  const d = safeToSpend(key);

  const m = state.months[key];
  const billsN = m.outgoings.filter(o=>o.status!=='done' && !o.quickAdd && (Number(o.amount)||0)>0).length;
  const days = Math.max(1, daysUntilPayday() || d.daysLeft);
  const rows = [
    {name:'Bills to pay', sub: billsN ? `${billsN} bill${billsN!==1?'s':''} still to pay` : 'Nothing left to pay', amt:d.pendingOut, color:'#f0453a', icon:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6'},

    {name:d.free<0 ? 'Short by' : 'Free to spend', sub: d.free<0 ? 'More is planned than you have' : 'Yours to enjoy', amt:Math.abs(d.free), color: d.free<0 ? '#ff5c5c' : '#ffb15a', icon:'M13 2L4 14h7l-1 8 9-12h-7l1-8z'}

}

function accArt(id, layer, P){

// ---- weekly spin ----
const SPIN_SLICES = 'ccrcccrcccSccrcccrcr'.split('');   // 14 common, 5 rare, 1 super rare
function spinSunday(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return ymd(x); }
// Grants this week's spin the first time the app is opened after Sunday starts.
function spinTick(){
  const S = state.ember.wardrobe.spin;
  const cur = spinSunday(new Date());
  if(!S.last){ S.last = cur; S.banked = 1; return; }
  if(S.last < cur){
    const weeks = Math.max(1, Math.round((parseYmd(cur) - parseYmd(S.last)) / (7*86400000)));
    S.banked = Math.min(3, (S.banked||0) + weeks);   // unspent spins bank up to 3
    S.last = cur;
  }
}
function wheelSvg(size, id){
  const cx = 150, cy = 150, rad = 140, n = SPIN_SLICES.length;
  let out = '';
  SPIN_SLICES.forEach((t,i)=>{
    const a0 = -Math.PI/2 + i*2*Math.PI/n - Math.PI/n, a1 = a0 + 2*Math.PI/n, am = (a0+a1)/2;
    const f = x=>x.toFixed(1);
    const fill = t==='c' ? (i%2 ? '#444f66' : '#394357') : t==='r' ? '#2b72d6' : '#e0a020';
    out += `<path d="M${cx},${cy} L${f(cx+rad*Math.cos(a0))},${f(cy+rad*Math.sin(a0))} A${rad},${rad} 0 0 1 ${f(cx+rad*Math.cos(a1))},${f(cy+rad*Math.sin(a1))}Z" fill="${fill}" stroke="#0b0b0c" stroke-width="2"/>`;
    const rx = cx+104*Math.cos(am), ry = cy+104*Math.sin(am), rot = `rotate(${(am*180/Math.PI+90).toFixed(0)} ${f(rx)} ${f(ry)})`;
    if(t==='c') out += `<circle cx="${f(rx)}" cy="${f(ry)}" r="3.2" fill="#aab6cc"/>`;
    else if(t==='r') out += `<path d="M${f(rx)},${f(ry-7)} l6,7 -6,7 -6,-7Z" fill="#cfe5ff" transform="${rot}"/>`;
    else out += `<path d="M${f(rx)},${f(ry-10)} l3,6.5 7,.8 -5.2,4.8 1.5,7 -6.3,-3.6 -6.3,3.6 1.5,-7 -5.2,-4.8 7,-.8z" fill="#fff6c8" transform="${rot}"/>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 300 300" aria-hidden="true"><g id="${id||''}" style="transform-origin:150px 150px;">${out}</g><circle cx="150" cy="150" r="${rad+4}" fill="none" stroke="#2a2a2d" stroke-width="8"/><circle cx="150" cy="150" r="${rad+4}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 12" opacity=".8"/><circle cx="150" cy="150" r="34" fill="#161617" stroke="#2a2a2d" stroke-width="4"/></svg>`;
}
// Decide the prize: roll a rarity (70 / 25 / 5), then give something you don't own yet in that tier.
// If you already own everything in the tier you get XP instead.
function spinRoll(){
  const r = Math.random(), tier = r < .05 ? 's' : r < .30 ? 'r' : 'c';
  const W = state.ember.wardrobe;
  const pool = [];
  ['acc','bg','title'].forEach(type=>WARDROBE[type].forEach(it=>{ if(it.r===tier && !W.owned[type].includes(it.id)) pool.push({type, it}); }));
  const slices = SPIN_SLICES.map((t,i)=>({t,i})).filter(x=>x.t===(tier==='s'?'S':tier));
  const slice = slices[Math.floor(Math.random()*slices.length)].i;
  if(pool.length){
    const pick = pool[Math.floor(Math.random()*pool.length)];
    W.owned[pick.type].push(pick.it.id);
    return {tier, slice, type:pick.type, item:pick.it, dupe:false, xp:0};
  }
  const xp = WARD_RARITY[tier].xp;
  state.ember.bonusXp = (state.ember.bonusXp||0) + xp;
  return {tier, slice, type:null, item:null, dupe:true, xp};
}
function wardEquip(type, id){

let emberMemo = {rev:-1, data:null};
function emberStats(){
  if(emberMemo.rev===dataRev && emberMemo.data) return emberMemo.data;
  const now = new Date(); now.setHours(0,0,0,0);
  const curKey = monthKey(now);
  const dayIdx = (y,m0,d)=>Math.round(Date.UTC(y,m0,d)/86400000);
  const todayIdx = dayIdx(now.getFullYear(), now.getMonth(), now.getDate());
  // days with something logged in Quick Add
  const logSet = new Set();
  let doneItems = 0;
  Object.keys(state.months).forEach(k=>{
    const m = state.months[k];
    [...m.outgoings, ...m.incoming].forEach(it=>{
      if(it.quickAdd && it.ts){ const d = new Date(it.ts); logSet.add(dayIdx(d.getFullYear(), d.getMonth(), d.getDate())); }
      else if(it.status==='done' && !it.pay3Id) doneItems++;
    });
  });
  const days = [...logSet].sort((a,b)=>a-b);
  let best = 0, run = 0;
  days.forEach((d,i)=>{ run = (i>0 && d===days[i-1]+1) ? run+1 : 1; best = Math.max(best, run); });
  let cur = 0, probe = logSet.has(todayIdx) ? todayIdx : todayIdx-1;
  while(logSet.has(probe)){ cur++; probe--; }
  const last7 = []; for(let i=6;i>=0;i--) last7.push(logSet.has(todayIdx-i));
  // monthly scores
  const monthRows = Object.keys(state.months).filter(k=>k<=curKey).sort().map(k=>({k, sc:monthScoreData(k)})).filter(x=>x.sc && x.sc.active);
  const good = monthRows.map(x=>x.sc.score>=80);
  let bestB = 0, runB = 0; good.forEach(g=>{ runB = g ? runB+1 : 0; bestB = Math.max(bestB, runB); });
  let curB = 0; for(let i=good.length-1;i>=0 && good[i];i--) curB++;
  const goodMonths70 = monthRows.filter(x=>x.sc.score>=70).length;
  const bonusXp = state.ember.bonusXp||0, bossXp = bossXpFromPlans();
  const xp = days.length*5 + goodMonths70*15 + doneItems + bonusXp + bossXp;
  const lvlFloor = emberLvlFloor;
  let level = 1; while(xp >= lvlFloor(level+1)) level++;
  const span = lvlFloor(level+1)-lvlFloor(level);
  const levelPct = Math.round((xp-lvlFloor(level))/span*100);
  const xpToNext = lvlFloor(level+1)-xp;
  // badges
  const earned = {};
  const pots = round2(potBalance('savings') + potBalance('stocks'));
  earned.k1 = pots>=1000;
  earned.s7 = best>=7; earned.s30 = best>=30;
  earned.sc80 = monthRows.some(x=>x.sc.score>=80);
  earned.b3 = bestB>=3;
  earned.pot = monthRows.some(x=>x.k<curKey && x.sc.parts.find(p=>p.id==='bills').pts>=19.99 && state.months[x.k].outgoings.filter(o=>!o.quickAdd).length>=3);
  earned.sav = Object.keys(state.months).filter(k=>k<=curKey).some(k=>{ const t = monthTotals(state.months[k]); return t.allIncoming>0 && (t.savingsAmount+t.stocksAmount)/t.allIncoming>=0.2; });
  const plans = Array.isArray(state.pay3) ? state.pay3 : [];
  earned.p3 = plans.length>0 && plans.every(pl=>pl.inst && pl.inst.length && pl.inst.every(i=>i.paid));
  // a whole past weekend with nothing logged, in a week where you were logging
  earned.nsw = false;
  if(days.length>=3){
    for(let d=days[0]; d<todayIdx-1 && !earned.nsw; d++){
      const dt = new Date(d*86400000); if(dt.getUTCDay()!==6) continue;       // Saturday
      if(logSet.has(d) || logSet.has(d+1) || d+1>=todayIdx) continue;
      let around = 0; for(let j=1;j<=5;j++){ if(logSet.has(d-j)) around++; }
      if(around>=2) earned.nsw = true;
    }
  }
  // flame mood
  const cm = state.months[curKey];
  const ct = cm ? monthTotals(cm) : null;
  const curScore = monthRows.length && monthRows[monthRows.length-1].k===curKey ? monthRows[monthRows.length-1].sc.score : null;
  const overdue = cm ? (()=>{ const sc = monthScoreData(curKey); const b = sc && sc.parts.find(p=>p.id==='bills'); return b && b.pts<19.99; })() : false;
  const activeLogger = days.some(d=>d>=todayIdx-60);
  const gap = days.length ? todayIdx - days[days.length-1] : 99;
  let flame = 'st', why = 'You\'re on track.';
  if((ct && ct.totalLeftOver<0) || overdue || (activeLogger && gap>=4)){
    flame = 'lo';
    why = ct && ct.totalLeftOver<0 ? 'You\'re over budget this month.' : overdue ? 'A bill is overdue.' : 'You haven\'t logged anything for a few days.';
  } else if(cur>=30 || (curScore!==null && curScore>=85)){
    flame = 'bl'; why = cur>=30 ? 'A big logging streak!' : 'Score 85+ — brilliant.';
  }
  const data = {logDays:days.length, cur, best, last7, bestB, curB, xp, level, levelPct, xpToNext, earned, flame, why, curScore};
  emberMemo = {rev:dataRev, data};
  return data;
}

// Congratulate new milestones / level-ups once (the first visit just records what you already have).
function checkEmberMilestones(){
  const e = emberStats();
  const st = state.ember;
  const nowEarned = EMBER_BADGES.filter(b=>e.earned[b.id]).map(b=>b.id);
  if(!st.init){ st.init = true; st.seen = nowEarned; st.level = e.level; save(); return; }
  const fresh = nowEarned.filter(id=>!st.seen.includes(id));
  const oldLevel = st.level || 1;
  const leveled = e.level > oldLevel;
  if(!fresh.length && !leveled) return;
  st.seen = nowEarned; st.level = e.level; save();
  if(state.celebrate){
    const names = fresh.map(id=>EMBER_BADGES.find(b=>b.id===id).name);
    const newSkins = leveled ? EMBER_SKINS.filter(k=>!k.season && k.lvl>(oldLevel||1) && k.lvl<=e.level).map(k=>k.name) : [];
    const msg = leveled ? `Ember reached Level ${e.level}` : 'New milestone';
    setTimeout(()=>{
      showToast(msg, [...names, ...newSkins.map(n=>'New skin: '+n)].join(' · ') || 'Keep it burning');
      const btn = document.getElementById('emberBtn');
      if(btn){ btn.classList.remove('ember-burst'); void btn.offsetWidth; btn.classList.add('ember-burst'); }
    }, 500);
  }
}

  document.querySelectorAll('#planTabs .pt').forEach(b=>b.onclick = ()=>setPlanTab(b.dataset.pt));

    document.getElementById('qaTitle').textContent = isOut ? 'Quick Add · Spent' : 'Quick Add · Received';
    document.getElementById('qaHint').textContent = isOut ? 'added as Paid right away' : 'added as Received right away';
    document.getElementById('qaTile').innerHTML = iconSvg(isOut ? 'M7 17L17 7M8 7h9v9' : 'M17 7L7 17M16 17H7V8');
  };
  syncQuickAddCategoryVisibility();
  quickAddType.onchange = syncQuickAddCategoryVisibility;

    b.onclick = ()=>{ quickAddType.value = b.dataset.v; syncQuickAddCategoryVisibility(); };
  });
  const doQuickAdd = ()=>{
    const amt = Number(quickAddAmount.value);
    if(!amt || amt<=0) return;
    const reason = quickAddReason.value.trim();
    const type = quickAddType.value;
    const repeat = document.getElementById('quickAddRepeat').getAttribute('aria-pressed')==='true';
    const entry = {id:uid(), name: reason || (type==='out'?'Spent':'Received'), amount: amt, status:'done', recurring:false, quickAdd:true, ts:Date.now()};
    if(repeat){
      // A repeating Quick Add is a regular recurring item: it lands in Outgoings/Incoming (not just the log),
      // is dated today, counts as done this month, and appears in every later month.
      delete entry.quickAdd; delete entry.ts;
      entry.recurring = true;
      const [ky, kmo] = state.currentMonthKey.split('-').map(Number);
      entry.day = Math.min(new Date().getDate(), new Date(ky, kmo, 0).getDate());
    }
    const listKey = type==='out' ? 'outgoings' : 'incoming';
    entry.category = (type==='out' ? quickAddCategory : quickAddIncomeCategory).dataset.value;
    m[listKey].push(entry);
    if(repeat) syncNewRecurringForward(entry, state.currentMonthKey, listKey);
    const lucky = repeat ? null : luckyRoll();
    save();
    quickAddLogExpanded = !repeat || quickAddLogExpanded;
    renderMonth();
    showToast(`Added ${fmt(amt)}${repeat?' · repeats monthly':''}`, type==='out' ? (entry.category||entry.name) : entry.name);
    if(lucky) setTimeout(()=>showLuckyEmber(lucky), 900);
  };
  document.getElementById('quickAddBtn').onclick = doQuickAdd;
  const repeatBtn = document.getElementById('quickAddRepeat');
  repeatBtn.onclick = ()=>{
    const on = repeatBtn.getAttribute('aria-pressed')!=='true';
    repeatBtn.setAttribute('aria-pressed', on);
    repeatBtn.classList.toggle('on', on);

  const receiptInput = document.getElementById('receiptInput');
  const receiptStatus = document.getElementById('receiptStatus');
  receiptInput.onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;
    quickAddType.value = 'out';
    syncQuickAddCategoryVisibility();
    receiptStatus.className = 'quick-receipt-status';
    receiptStatus.textContent = 'Loading scanner…';
    try{
      await ensureTesseractLoaded();
      receiptStatus.textContent = 'Cleaning up photo…';
      let stage = 'Scanning';
      const { text, confidence } = await ocrReceipt(file, p=>{ receiptStatus.textContent = `${stage}… ${Math.round(p*100)}%`; }, label=>{ stage = label.replace('…',''); });
      console.log('Receipt OCR confidence', Math.round(confidence), text);
      if(confidence < 35){
        receiptStatus.className = 'quick-receipt-status error';
        receiptStatus.textContent = "Couldn't read that clearly — lay the receipt flat in good light, fill the frame, and try again. Or enter it manually.";
      } else {
        const parsed = parseReceiptText(text, confidence);
        if(parsed.amount) quickAddAmount.value = parsed.amount;
        if(parsed.reason) quickAddReason.value = parsed.reason;
        const scanCat = parsed.category || (parsed.reason && (suggestCategory(parsed.reason,'out')||{}).category);
        if(scanCat) smartOut.markAuto(scanCat, 'keyword');
        receiptStatus.className = 'quick-receipt-status ok';
        receiptStatus.textContent = !parsed.amount ? "Couldn't find a total — fill it in manually. (A flat, well-lit photo that fills the frame reads best.)"
          : confidence < 60 ? 'Low confidence — double-check the amount before adding.'
          : 'Got a guess — check it before adding.';
      }
    }catch(err){
      console.error('Receipt scan failed', err);
      receiptStatus.className = 'quick-receipt-status error';
      receiptStatus.textContent = 'Could not read that image — try a clearer photo, or enter it manually.';
    }
    receiptInput.value = '';
  };

  const quickAddLogToggle = document.getElementById('quickAddLogToggle');

    const count = m.incoming.filter(i=>i.quickAdd).length + m.outgoings.filter(o=>o.quickAdd).length;
    quickAddLogWrap.classList.toggle('hidden', !quickAddLogExpanded);
    quickAddLogToggle.textContent = (quickAddLogExpanded ? '▾ Hide log' : '▸ Show log') + (count ? ` (${count})` : '');
  }
  function drawQuickAddLog(){
    applyQuickAddLogState();
    const body = document.getElementById('quickAddLogBody');
    const entries = [
      ...m.incoming.filter(i=>i.quickAdd).map(i=>({...i, kind:'in'})),
      ...m.outgoings.filter(o=>o.quickAdd).map(o=>({...o, kind:'out'}))
    ].sort((a,b)=>(b.ts||0)-(a.ts||0));
    body.innerHTML = entries.length ? entries.map(e=>`
      <tr data-id="${e.id}" data-kind="${e.kind}">
        <td>${e.kind==='in' ? '<span style="color:var(--green);">In</span>' : '<span style="color:var(--red);">Out</span>'}</td>
        <td>${catTile(e.category||(e.kind==='in'?'Salary':'Uncategorized'),'sm inl')}${escapeHtml(e.name)}</td>
        <td class="amt-cell">${fmt(e.amount)}</td>
        <td><button class="del-btn quick-log-del">✕</button></td>
      </tr>
    `).join('') : `<tr><td colspan="4" class="empty">No quick adds yet this month</td></tr>`;
    body.querySelectorAll('tr').forEach(tr=>{
      const btn = tr.querySelector('.quick-log-del');
      if(!btn) return;
      btn.onclick = ()=>{
        const id = tr.dataset.id, kind = tr.dataset.kind;

      const refreshSummary = ()=>{ summary.innerHTML = incomeSummaryHtml(item); };
      const toggleRow = ()=>{
        if(incWide()){ selIncId = (selIncId===id) ? null : id; showIncPanel(selIncId ? tr : null); return; }
        const open = tr.classList.contains('collapsed');
        tr.classList.toggle('collapsed', !open);
        if(open) expandedIncRows.add(id); else expandedIncRows.delete(id);
      };
      summary.onclick = e=>{ if(e.target.closest('.cs-status') || e.target.closest('.cs-pill')){ e.stopPropagation(); toggleStatusSelect(tr.querySelector('.stog select')); return; } toggleRow(); };

      tr.querySelector('.inc-name').oninput = e=>{ item.name=e.target.value; save(); refreshSummary(); };
      tr.querySelector('.inc-name').onchange = ()=>{
        const c = autoCategoryForName(item.name, item.category, 'in');
        if(!c) return;
        item.category = c;
        setCategoryDropdownValue(tr.querySelector('.inc-category'), c);
        propagateOutgoingFieldForward(item, state.currentMonthKey, 'category', 'incoming');
        save(); refreshCards(); refreshSummary();
      };
      tr.querySelector('.inc-amount').oninput = e=>{ item.amount=Number(e.target.value); save(); refreshCards(); refreshSummary(); };

// Walks forward day by day from today (real calendar date, independent of
// whichever month is being viewed) looking for pending outgoings with a Day
// set. Only looks at months that already exist — it never creates one just
// to peek ahead.
function upcomingBills(daysAhead){
  const today = new Date();
  today.setHours(0,0,0,0);
  const results = [];
  for(let i=0; i<=daysAhead; i++){
    const d = new Date(today);
    d.setDate(d.getDate()+i);
    const mk = monthKey(d);
    const m = state.months[mk];
    if(!m) continue;
    const [yy, mo] = mk.split('-').map(Number);
    m.outgoings.forEach(o=>{
      if(o.status==='done') return;
      if(resolveScheduledDay(o, yy, mo) === d.getDate()){
        results.push({type:'out', name:o.name, amount:o.amount, category:o.category, recurring:!!o.recurring, daysAway:i, dueDate:new Date(d)});
      }
    });
    m.incoming.forEach(inc=>{
      if(inc.status==='done') return;
      if(resolveScheduledDay(inc, yy, mo) === d.getDate()){
        results.push({type:'in', name:inc.name, amount:inc.amount, daysAway:i, dueDate:new Date(d)});
      }
    });
  }
  results.sort((a,b)=>a.daysAway-b.daysAway);
  return results;
}
function renderUpcomingBills(){
  const el = document.getElementById('upcomingBillsList');
  if(!el) return;
  document.querySelectorAll('#upcomingBillsToggle .seg-btn').forEach(b=>{
    b.classList.toggle('active', Number(b.dataset.days)===upcomingBillsWindow);
    b.onclick = ()=>{ upcomingBillsWindow = Number(b.dataset.days); renderUpcomingBills(); };
  });
  const items = upcomingBills(upcomingBillsWindow);
  if(!items.length){
    el.innerHTML = `<div class="empty">Nothing due or arriving in the next ${upcomingBillsWindow} days.</div>`;
    return;
  }
  const fmtDate = d => d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
  const when = n => n===0 ? 'today' : n===1 ? 'tomorrow' : `in ${n} days`;
  const bills = items.filter(b=>b.type==='out');
  const next = bills[0] || null;
  const thisWeek = items.filter(b=>b.daysAway<=7);
  const later = items.filter(b=>b.daysAway>7);
  const sum = list => round2(list.filter(b=>b.type==='out').reduce((a,b)=>a+(Number(b.amount)||0),0));
  const count = list => list.filter(b=>b.type==='out').length;
  const row = (b, showWhen) => {
    const isIn = b.type==='in';
    const cat = isIn ? 'Salary' : (b.category||'Uncategorized');
    return `<div class="ub-row">
      ${catTile(cat,'sm')}
      <div class="ub-info"><div class="ub-name">${escapeHtml(b.name)}</div><div class="ub-date${b.daysAway<=1?' due-soon':''}">${isIn?'Arrives ':''}${fmtDate(b.dueDate)}${showWhen?` · ${when(b.daysAway)}`:''}</div></div>
      <div class="ub-amt" style="${isIn?'color:var(--green);':''}">${isIn?'+':''}${escapeHtml(fmt(b.amount))}</div>
    </div>`;
  };
  const group = (title, list, showWhen) => {
    if(!list.length) return '';
    const n = count(list);
    return `<div class="ub-group">
      <div class="ub-group-head"><div class="ub-group-title">${title}</div><div class="ub-group-sum">${n?`${n} bill${n!==1?'s':''} · <b>${escapeHtml(fmt(sum(list)))}</b>`:'income only'}</div></div>
      <div class="ub-list">${list.map(b=>row(b, showWhen)).join('')}</div>
    </div>`;
  };
  // Hero card for the very next bill
  let nextHtml = '';
  if(next){
    const others = thisWeek.filter(b=>b.type==='out' && b!==next);
    const cat = next.category || 'Uncategorized';
    nextHtml = `<div class="ub-next">
      <div class="ub-next-top"><span class="ub-next-k">Next due</span><span class="ub-chip${next.daysAway<=1?' soon':''}">${next.daysAway===0?'Today':next.daysAway===1?'Tomorrow':'In '+next.daysAway+' days'}</span></div>
      <div class="ub-next-main">
        ${catTile(cat,'md')}
        <div class="ub-next-info"><div class="ub-next-name">${escapeHtml(next.name)}</div><div class="ub-next-sub">${fmtDate(next.dueDate)} · ${escapeHtml(cat)} · ${next.recurring?'Recurring':'One-off'}</div></div>
        <div class="ub-next-amt">${escapeHtml(fmt(next.amount))}</div>
      </div>
      ${others.length ? `<div class="ub-next-foot"><span>After this, ${others.length} more bill${others.length!==1?'s':''} this week</span><b>${escapeHtml(fmt(sum(others)))}</b></div>` : ''}
    </div>`;
  }
  const groups = group('This week', thisWeek, true) + group('Later', later, false);
  el.innerHTML = nextHtml + `<div class="ub-groups${thisWeek.length && later.length ? '' : ' single'}">${groups}</div>`;
}

// ---------------- Calendar ----------------
// Days (1-31, clamped to the month's real length) that have a pending
// (not yet Done) outgoing with a Day set — name:[] map. Shared by the
// Calendar tab's bill-dot strip and the Trend heatmap's bill markers.
function billDaysForMonth(monthKey){
  const m = state.months[monthKey];
  const map = {};
  if(!m) return map;
  const [y, mo] = monthKey.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(o.status==='done') return;
    const day = resolveScheduledDay(o, y, mo);
    if(!day) return;
    (map[day] = map[day]||[]).push(o.name);
  });
  return map;
}
// Same idea as billDaysForMonth but for pending incoming (pay) — used to mark
// payday on the Calendar tab and the Trend heatmap.
function payDaysForMonth(monthKey){
  const m = state.months[monthKey];
  const map = {};
  if(!m) return map;
  const [y, mo] = monthKey.split('-').map(Number);
  m.incoming.forEach(inc=>{
    if(inc.status==='done') return;
    const day = resolveScheduledDay(inc, y, mo);
    if(!day) return;
    (map[day] = map[day]||[]).push(inc.name);
  });
  return map;
}
// ---------------- Bill weather ----------------
// Every day gets a weather icon from how much falls due that day compared with a month's pay:
// clear (nothing), partly cloudy (<2%), cloudy (2-7%), rain (7-17%), storm (17%+ or it would leave you short). Payday is a sun.
const WX = {
  clear:['Clear','#7f8aa3','rgba(127,138,163,0)'], pay:['Payday','#ffc247','rgba(255,194,71,.55)'],
  light:['Partly cloudy','#ffd66e','rgba(255,214,110,.35)'], cloud:['Cloudy','#9fb0c8','rgba(159,176,200,.35)'],
  rain:['Rain','#4aa3ff','rgba(74,163,255,.5)'], storm:['Storm','#b18cff','rgba(177,140,255,.6)']
};
const WX_RANK = {clear:0, pay:0, light:1, cloud:2, rain:3, storm:4};
function wxIcon(level, size){
  const [, c, glow] = WX[level];
  const st = `fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"`;
  let body;
  if(level==='clear') body = `<circle cx="12" cy="12" r="4" ${st} stroke-dasharray="2.4 2.4" opacity=".7"/>`;
  else if(level==='pay'){
    const rays = Array.from({length:8}, (_,i)=>{ const a = i*Math.PI/4; return `<path d="M${(12+Math.cos(a)*7.2).toFixed(1)},${(12+Math.sin(a)*7.2).toFixed(1)} L${(12+Math.cos(a)*9.2).toFixed(1)},${(12+Math.sin(a)*9.2).toFixed(1)}"/>`; }).join('');
    body = `<circle cx="12" cy="12" r="5" fill="${c}" fill-opacity=".28" stroke="${c}" stroke-width="1.8"/><g ${st}>${rays}</g>`;
  }
  else if(level==='light') body = `<g ${st}><circle cx="9" cy="8.5" r="3.2" fill="${c}" fill-opacity=".3"/><path d="M9 2.6V3.6M3.1 8.5H4.1M4.8 4.3l.7.7M13.2 4.3l-.7.7"/></g><path d="M9.6 19.2a3.6 3.6 0 0 1-.2-7.2 5 5 0 0 1 9.4 1.4 3.3 3.3 0 0 1-.4 5.8Z" fill="#9fb0c8" fill-opacity=".22" stroke="#9fb0c8" stroke-width="1.8" stroke-linejoin="round"/>`;
  else if(level==='cloud') body = `<path d="M7.5 18.5a4.2 4.2 0 0 1-.4-8.4A5.8 5.8 0 0 1 18.4 11a3.8 3.8 0 0 1-.4 7.5Z" fill="${c}" fill-opacity=".22" ${st}/>`;
  else if(level==='rain') body = `<path d="M7.5 15.5a4.2 4.2 0 0 1-.4-8.4A5.8 5.8 0 0 1 18.4 8a3.8 3.8 0 0 1-.4 7.5Z" fill="${c}" fill-opacity=".2" ${st}/><g ${st}><path d="M8.5 18.5l-1 2.6M12.5 18.5l-1 2.6M16.5 18.5l-1 2.6"/></g>`;
  else body = `<path d="M7.5 15.5a4.2 4.2 0 0 1-.4-8.4A5.8 5.8 0 0 1 18.4 8a3.8 3.8 0 0 1-.4 7.5Z" fill="${c}" fill-opacity=".22" ${st}/><path d="M12.8 13l-3 4.6h2.7l-1.2 4.4 4.2-5.6h-2.7l1.3-3.4Z" fill="#ffd23a" stroke="#a8730a" stroke-width=".8" stroke-linejoin="round"/>`;
  return `<svg class="wx-ic" width="${size}" height="${size}" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 5px ${glow});" aria-hidden="true">${body}</svg>`;
}
function wxTile(level, size){
  const c = WX[level][1];
  return `<span class="wx-tile" style="width:${size}px;height:${size}px;border-radius:${Math.round(size*.32)}px;background:${c}1f;">${wxIcon(level, Math.round(size*.68))}</span>`;
}
// One month's schedule: what falls due and what lands, by day.
function wxBuildMonth(key){
  const m = state.months[key]; if(!m) return null;
  const [y, mo] = key.split('-').map(Number), dim = new Date(y, mo, 0).getDate();
  const days = [null];
  for(let d=1; d<=dim; d++) days.push({bills:[], income:[], due:0, pay:0});
  m.outgoings.forEach(o=>{
    if(o.quickAdd || o.transfer) return;
    const amt = Number(o.amount)||0, d = resolveScheduledDay(o, y, mo);
    if(!(amt>0) || !d) return;
    days[d].bills.push({name:o.name, amt, done:o.status==='done', cat:o.category||'Uncategorized', pay3:!!o.pay3Id});
    days[d].due += amt;
  });
  m.incoming.forEach(i=>{
    if(i.transfer) return;
    const amt = Number(i.amount)||0, d = resolveScheduledDay(i, y, mo);
    if(!(amt>0) || !d) return;
    days[d].income.push({name:i.name, amt, done:i.status==='done'});
    days[d].pay += amt;
  });
  const t = monthTotals(m);
  const base = t.allIncoming>0 ? t.allIncoming : Math.max(1, t.allOutgoing/0.7);
  return {key, y, mo, dim, days, base};
}
function wxLevel(o, base){
  if(o.pay>0) return 'pay';
  if(!(o.due>0)) return 'clear';
  const pct = o.due/base;
  if(o.short || pct>=0.17) return 'storm';
  if(pct>=0.07) return 'rain';
  if(pct>=0.02) return 'cloud';
  return 'light';
}
// Walks n days from `start`. From today onwards it also tracks your balance (pending bills out, pending pay in).
function wxWalk(start, n, withBal){
  const out = [], cache = {};
  const today = new Date(); today.setHours(0,0,0,0);
  const cm = state.months[monthKey(today)];
  let bal = (withBal && cm && start>=today) ? monthTotals(cm).liveBalance : null;
  for(let i=0; i<n; i++){
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const key = monthKey(dt);
    const md = key in cache ? cache[key] : (cache[key] = wxBuildMonth(key));
    const d = md ? md.days[dt.getDate()] : null;
    const o = {date:dt, key, day:dt.getDate(), bills:d?d.bills:[], income:d?d.income:[], due:d?d.due:0, pay:d?d.pay:0};
    const pendDue = o.bills.filter(b=>!b.done).reduce((a,b)=>a+b.amt,0), pendIn = o.income.filter(b=>!b.done).reduce((a,b)=>a+b.amt,0);
    o.pendDue = pendDue;
    if(bal!==null){ o.balBefore = bal; bal = round2(bal + pendIn - pendDue); o.balAfter = bal; o.short = pendDue>0 && bal<0; }
    o.level = wxLevel(o, md ? md.base : 1);
    out.push(o);
  }
  return out;
}
function wxMonthDays(key){
  const md = wxBuildMonth(key); if(!md) return null;
  const all = wxWalk(new Date(md.y, md.mo-1, 1), md.dim, false);
  const today = new Date(); today.setHours(0,0,0,0);
  if(monthKey(today)===key){
    const tail = wxWalk(today, md.dim - today.getDate() + 1, true);
    tail.forEach((o,i)=>{ all[today.getDate()-1+i] = o; });
  }
  return {md, days:all};
}

const wxList = arr=>arr.length<=1 ? (arr[0]||'') : arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1];

function renderWeatherCard(){

  const today = new Date(); today.setHours(0,0,0,0);
  if(!hero || state.currentMonthKey!==monthKey(today)) return;
  const week = wxWalk(today, 7, true);
  const worst = week.reduce((w,o)=>WX_RANK[o.level]>WX_RANK[w] ? o.level : w, 'clear');
  const storms = week.filter(o=>o.level==='storm'), rains = week.filter(o=>o.level==='rain'), clouds = week.filter(o=>o.level==='cloud');
  const dn = o=>wxWeekday(o.date,'long');
  let head;
  if(storms.length) head = `Storm on ${wxList(storms.map(dn))}` + (rains.length ? `, rain on ${wxList(rains.map(dn))}` : '');
  else if(rains.length) head = `Rain on ${wxList(rains.map(dn))}`;
  else if(clouds.length) head = `Cloudy on ${wxList(clouds.map(dn))}`;
  else if(week.some(o=>o.due>0)) head = 'Just a few light clouds';
  else head = 'Clear skies this week';
  const heavy = week.filter(o=>o.due>0).sort((a,b)=>b.due-a.due)[0];
  const pendTotal = round2(week.reduce((a,o)=>a+o.pendDue,0));
  const strip = week.map((o,i)=>{
    const [, c] = WX[o.level];
    const amt = o.pay>0 ? '+'+fmtCompact(o.pay) : o.due>0 ? fmtCompact(o.due) : '—';
    return `<button type="button" class="wx-day${i===0?' today':''}" data-d="${o.key}|${o.day}"><i>${i===0?'TODAY':wxWeekday(o.date).toUpperCase()}</i>${wxIcon(o.level,22)}<b style="color:${o.due>0||o.pay>0?c:'var(--muted)'};">${escapeHtml(amt)}</b></button>`;
  }).join('');
  let note = '';
  if(heavy && WX_RANK[heavy.level]>=3){
    const big = heavy.bills.slice().sort((a,b)=>b.amt-a.amt)[0];
    note = `<div class="wx-note">${escapeHtml(wxWeekday(heavy.date,'long'))} is the heavy one: <b>${escapeHtml(fmt(heavy.due))}</b>${big && heavy.bills.length>1 ? ` including ${escapeHtml(big.name)}` : big ? ` · ${escapeHtml(big.name)}` : ''}.${heavy.balAfter!==undefined ? (heavy.balAfter<0 ? ` That would leave you <b class="neg">${escapeHtml(fmt(-heavy.balAfter))}</b> short.` : ` That leaves <b>${escapeHtml(fmt(heavy.balAfter))}</b> after bills.`) : ''}</div>`;
  }
  const card = document.createElement('div');
  card.id = 'wxCard'; card.className = 'wx-card wx-slim';
  card.title = head;
  card.innerHTML = `<div class="wx-line"><i>BILL FORECAST · <b>${pendTotal>0 ? escapeHtml(fmt(pendTotal))+' due' : 'nothing due'}</b></i><button type="button" class="wx-open" id="wxOpen">Calendar ›</button></div>
    <div class="wx-strip">${strip}</div>`;
  // slim strip at the very top of the Month Tracker, above everything else
  const mv = document.getElementById('view-month');
  mv.insertBefore(card, mv.firstChild);
  card.querySelectorAll('.wx-day').forEach(b=>b.onclick = ()=>{ const [k,d] = b.dataset.d.split('|'); openWxDay(k, Number(d)); });
  document.getElementById('wxOpen').onclick = ()=>{ wxMonthKey = state.currentMonthKey; currentView = 'calendar'; render(); };
}

// ---- a single day ----
function openWxDay(key, day){
  const data = wxMonthDays(key); if(!data) return;
  const o = data.days[day-1]; if(!o) return;
  const bg = document.getElementById('modalBg'), box = document.getElementById('modalBox');
  const [lab, c] = WX[o.level];
  const dateLabel = o.date.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}).toUpperCase();
  const heaviest = data.days.reduce((m,x)=>x.due>m.due ? x : m, {due:0});
  const bills = o.bills.slice().sort((a,b)=>b.amt-a.amt);
  const title = o.pay>0 && !(o.due>0) ? `+${fmt(o.pay)} lands` : o.due>0 ? `${fmt(o.due)} due` : 'Nothing due';
  const sub = o.due>0 ? (heaviest===o && o.due>0 ? 'The heaviest day of the month' : ({light:'A light day',cloud:'A medium day',rain:'A heavy day',storm:'A very heavy day',pay:'Payday'}[o.level]||'')) : 'A clear day';
  let balBlock = '';
  if(o.balBefore!==undefined && o.pendDue>0){
    const pct = o.balBefore>0 ? Math.min(100, Math.round(o.pendDue/o.balBefore*100)) : 100;
    balBlock = `<div class="wx-bal"><div><span>Balance going in</span><b>${escapeHtml(fmt(o.balBefore))}</b></div><div><span>After bills</span><b class="${o.balAfter<0?'neg':'warn'}">${escapeHtml(fmt(o.balAfter))}</b></div><div class="wx-bar"><i style="width:${pct}%;"></i></div><div class="wx-bal-s">${pct}% of your balance goes out that day</div></div>`;
  }
  let tip = '';
  if(WX_RANK[o.level]>=3 && bills.length){
    const nextPay = data.days.slice(day).find(x=>x && x.income.some(i=>!i.done));
    const big = bills[0];
    if(nextPay && big.amt >= o.due*0.3 && !big.done) tip = `<div class="wx-tip"><b>Tip:</b> Your pay lands on ${escapeHtml(nextPay.date.toLocaleDateString('en-GB',{day:'numeric', month:'short'}))}. If ${escapeHtml(big.name)} can wait until then, this ${o.level==='storm'?'storm':'rain'} eases.</div>`;
  }
  const rows = bills.map(b=>`<div class="wx-bill">${catTile(b.cat,'sm')}<div class="wx-bn"><b>${escapeHtml(b.name)}</b><span>${escapeHtml(b.pay3?'Pay in 3':b.cat)}${b.done?' · paid':''}</span></div><strong>${escapeHtml(fmt(b.amt))}</strong></div>`).join('')
    + o.income.map(i=>`<div class="wx-bill inc"><span class="wx-in">${iconSvg('M12 5v14M6 13l6 6 6-6')}</span><div class="wx-bn"><b>${escapeHtml(i.name)}</b><span>Money in${i.done?' · received':''}</span></div><strong style="color:var(--green);">+${escapeHtml(fmt(i.amt))}</strong></div>`).join('');
  box.className = 'modal recap-modal wx-modal';
  box.innerHTML = `<div class="wx-m-top"><div class="recap-eyebrow" style="color:${c};">${escapeHtml(lab.toUpperCase())} · ${escapeHtml(dateLabel)}</div>
    <div class="wx-m-ic" style="background:${c}1f;box-shadow:0 0 40px ${c}55;">${wxIcon(o.level,76)}</div>
    <div class="wx-m-t">${escapeHtml(title)}</div><div class="wx-m-s">${escapeHtml(sub)}</div></div>
    ${balBlock}<div class="wx-bills">${rows || '<div class="empty">No bills or pay on this day.</div>'}</div>${tip}
    <div class="actions"><button class="btn secondary small" id="wxToMonth">Open ${escapeHtml(monthLabelFromKey(key).split(' ')[0])}</button><button class="btn small" id="wxClose">Close</button></div>`;
  bg.classList.add('open');
  bg.onclick = ev=>{ if(ev.target===bg) closeRecapModal(); };
  document.getElementById('wxClose').onclick = closeRecapModal;
  document.getElementById('wxToMonth').onclick = ()=>{ closeRecapModal(); state.currentMonthKey = key; currentView = 'month'; save(); render(); };
}

function bindWxCalendar(el){
  const keys = Object.keys(state.months).sort();
  const go = d=>{ const i = keys.indexOf(wxMonthKey)+d; if(i>=0 && i<keys.length){ wxMonthKey = keys[i]; renderCalendar(); } };

            const parts = [];
            if(payNames) parts.push(`Pay: ${payNames.join(', ')}`);
            if(billNames) parts.push(`Due: ${billNames.join(', ')}`);
            const tip = `${monthName} ${day} — ${parts.join(' · ')}`;
            const cls = payNames ? 'pay' : 'due';
            return `<span class="mt-bill-dot ${cls}" data-tip="${escapeHtml(tip)}"></span>`;
          }).join('');
          return `

              <div class="mt-name">${monthName}</div>

  `).join('');
  bindWxCalendar(el);
  el.querySelectorAll('.month-tile').forEach(tile=>{

      render();
    };
  });
  el.querySelectorAll('.mt-bill-dot[data-tip]').forEach(dot=>{
    dot.addEventListener('mouseenter', evt=>{ evt.stopPropagation(); showChartTooltip(evt, dot.dataset.tip); });
    dot.addEventListener('mousemove', evt=>{ evt.stopPropagation(); showChartTooltip(evt, dot.dataset.tip); });
    dot.addEventListener('mouseleave', hideChartTooltip);
  });
  el.querySelectorAll('.mt-del-btn').forEach(btn=>{
    btn.onclick = e=>{
      e.stopPropagation();
      const key = btn.dataset.key;
      openConfirmModal(
        `Delete ${monthLabelFromKey(key)}?`,
        `This removes all outgoings, incoming, weekly budget, and balance data tracked for ${monthLabelFromKey(key)}. Later months' starting balances will be recalculated automatically. You'll have a few seconds to undo it.`,
        ()=>{
          const snapshot = state.months[key];
          const previousCurrent = state.currentMonthKey;
          const keysBefore = new Set(Object.keys(state.months));
          deleteMonth(key);
          const createdKeys = Object.keys(state.months).filter(k=>!keysBefore.has(k));
          render();
          showUndoToast(monthLabelFromKey(key), ()=>{
            createdKeys.forEach(k=>{ delete state.months[k]; });
            state.months[key] = snapshot;
            state.currentMonthKey = previousCurrent;
            save();
            render();
          }, 10000);
        }
      );
    };
  });
}
// Deletes a tracked month entirely. If it was the currently viewed month,
// moves to the nearest remaining month (or starts a fresh one if none are
// left) so the app is never left pointing at a month that no longer exists.
function deleteMonth(key){
  delete state.months[key];
  const remaining = Object.keys(state.months).sort();
  if(state.currentMonthKey === key){
    if(remaining.length){
      const before = remaining.filter(k=>k<key).pop();
      state.currentMonthKey = before || remaining[0];
    } else {
      const freshKey = monthKey(new Date());
      state.currentMonthKey = freshKey;
      state.months[freshKey] = freshMonth(0);
    }
  }
  save();
}

// ---------------- Trend ----------------
// Which slice of tracked months the Trend charts show: a number of months, or
// 'all'. The window is placed around the month being viewed, leaning forward
// so upcoming (projected) months are visible.
let trendRange = 12;
function trendWindow(keys){
  const n = keys.length;
  const size = trendRange==='all' ? n : Math.min(n, trendRange);
  let anchor = 0;
  keys.forEach((k,i)=>{ if(k<=state.currentMonthKey) anchor = i; });
  let start = anchor - Math.floor(size/3);
  start = Math.max(0, Math.min(n-size, start));
  return Array.from({length:size}, (_,i)=>start+i);
}

              const [yy, mo] = k.split('-').map(Number);

              const c = (v, cls)=>`<td class="amt-cell${cls?' '+cls:''}${Math.abs(Number(v)||0)<0.005?' zero':''}">${fmt(v)}</td>`;
              return `<tr class="${k===curK?'cur':''}${k>curK?' future':''}"><td class="mt-sticky"><div class="mt-m"><b>${mname}</b><span>${yy}</span>${tag}</div></td>${c(mm.startingBalance)}${c(tt.liveBalance)}${c(tt.allIncoming,'pos')}${c(tt.weeklyTotal,'neg')}${c(tt.allOutgoing,'neg')}${c(tt.savingsAmount)}${c(tt.totalLeftOver, tt.totalLeftOver>=0?'pos strong':'neg strong')}${c(savingsSeries[i])}${c(stocksSeries[i])}${c(actualNetWorth[i])}<td class="amt-cell proj">${fmt(projectedNetWorth[i])}</td></tr>`;
            }).join('')}

      </div>`;
  }
  el.innerHTML = head + pane;

  el.querySelectorAll('#trendTabs .trend-tab').forEach(b=>{

  });
  el.querySelectorAll('#trendRangeToggle .seg-btn').forEach(btn=>{
    btn.onclick = ()=>{ trendRange = btn.dataset.range==='all' ? 'all' : Number(btn.dataset.range); renderTrend(); };
  });
  const hintEl = document.getElementById('trendRangeHint');
  if(hintEl && enough) hintEl.textContent = `${monthLabelFromKey(keys[idxs[0]])} – ${monthLabelFromKey(keys[idxs[idxs.length-1]])} · ${idxs.length} of ${keys.length} months`;

  const pts = arr => idxs.map(i=>({x:shortLabels[i], label:monthLabels[i], y:arr[i]}));
  const actualColor = cssVar('--accent','#5b8cff'), projectedColor = cssVar('--green','#3ecf8e');
  const pair = (actual, planned) => [
    {color:actualColor, name:'Actual', points: pts(actual)},
    {color:projectedColor, name:'Projected', dashed:true, points: pts(planned)}
  ];
  if(trendTab==='overview'){
    if(!enough){
      document.getElementById('netWorthChart').innerHTML = noTrend;
      document.getElementById('trendChart').innerHTML = noTrend;
    } else {
      lineChart(document.getElementById('netWorthChart'), pair(actualNetWorth, projectedNetWorth), {height:250, marker:chartMarker});
      lineChart(document.getElementById('trendChart'), pts(totalLeftOvers), {height:220, marker:chartMarker});
    }
  } else if(trendTab==='spending'){

  } else if(trendTab==='daily'){

      document.getElementById('stocksPotChart').innerHTML = noTrend;
    } else {

      lineChart(document.getElementById('stocksPotChart'), pair(stocksSeries, plannedStocksSeries), {height:210, marker:chartMarker});
    }
  }
}
