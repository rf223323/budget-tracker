// Deletes a tracked month entirely. If it was the currently viewed month,
// moves to the nearest remaining month (or starts a fresh one if none are
// left) so the app is never left pointing at a month that no longer exists.
function deleteMonth(key){
  delete state.months[key];
  const remaining = Object.keys(state.months).sort();
  if(state.currentMonthKey === key){
    if(remaining.length){
      const before = remaining.filter(k=>k<key).pop();
      state.currentMonthKey = before || remaining[0];
    } else {
      const freshKey = monthKey(new Date());
      state.currentMonthKey = freshKey;
      state.months[freshKey] = freshMonth(0);
    }
  }
  save();
}

// ---------------- Trend ----------------
// Which slice of tracked months the Trend charts show: a number of months, or
// 'all'. The window is placed around the month being viewed, leaning forward
// so upcoming (projected) months are visible.
let trendRange = 12;
function trendWindow(keys){
  const n = keys.length;
  const size = trendRange==='all' ? n : Math.min(n, trendRange);
  let anchor = 0;
  keys.forEach((k,i)=>{ if(k<=state.currentMonthKey) anchor = i; });
  let start = anchor - Math.floor(size/3);
  start = Math.max(0, Math.min(n-size, start));
  return Array.from({length:size}, (_,i)=>start+i);
}

// Compares this month's category spend against the previous tracked month, one
// callout per category whose spend actually changed — biggest swings first.
function renderCategoryDeltas(monthKey, mode, elId, kind){
  const isIncome = kind==='in';
  const rowsFor = mm => isIncome ? incomeBreakdown(mm, mode) : categoryBreakdown(mm, mode);
  const el = document.getElementById(elId||'catBreakdownDeltas');
  if(!el) return;
  const keys = Object.keys(state.months).sort();
  const idx = keys.indexOf(monthKey);
  if(idx<=0){
    el.innerHTML = '<div class="hint" style="font-size:12px;">Track an earlier month too to see month-over-month comparisons.</div>';
    return;
  }
  const prevKey = keys[idx-1];
  const curMap = {}; rowsFor(state.months[monthKey]).forEach(r=>curMap[r.category]=r.amount);
  const prevMap = {}; rowsFor(state.months[prevKey]).forEach(r=>prevMap[r.category]=r.amount);
  const cats = new Set([...Object.keys(curMap), ...Object.keys(prevMap)]);
  const deltas = [];
  cats.forEach(category=>{
    const cur = curMap[category]||0, prev = prevMap[category]||0;
    const diff = round2(cur-prev);
    if(Math.abs(diff) < 0.01) return;
    deltas.push({category, cur, prev, diff});
  });
  if(!deltas.length){
    el.innerHTML = `<div class="hint" style="font-size:12px;">No change from ${monthLabelFromKey(prevKey)} in any category.</div>`;
    return;
  }
  deltas.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  el.innerHTML = `
    <div class="hint" style="font-size:12px;margin-bottom:6px;">Compared to ${monthLabelFromKey(prevKey)}</div>
    ${deltas.slice(0,6).map(d=>{
      const up = d.diff>0;
      let text;
      if(d.prev<=0){
        text = isIncome ? `<b>${escapeHtml(d.category)}</b>: new this month (${fmt(d.cur)})` : `New spending on <b>${escapeHtml(d.category)}</b>: ${fmt(d.cur)}`;
      } else if(d.cur<=0){
        text = isIncome ? `<b>${escapeHtml(d.category)}</b>: nothing this month (was ${fmt(d.prev)})` : `No more spending on <b>${escapeHtml(d.category)}</b> (was ${fmt(d.prev)})`;
      } else {
        const pct = Math.round(Math.abs(d.diff)/d.prev*100);
        text = isIncome
          ? `<b>${escapeHtml(d.category)}</b>: <b>${pct}% ${up?'more':'less'}</b> than ${monthLabelFromKey(prevKey)} (${fmt(d.cur)} vs ${fmt(d.prev)})`
          : `You spent <b>${pct}% ${up?'more':'less'}</b> on <b>${escapeHtml(d.category)}</b> than ${monthLabelFromKey(prevKey)} (${fmt(d.cur)} vs ${fmt(d.prev)})`;
      }
      const good = isIncome ? up : !up;
      return `<div class="delta-row">
        <span class="delta-arrow ${good?'delta-down':'delta-up'}">${up?'▲':'▼'}</span>
        ${catTile(d.category)}
        <span class="delta-text">${text}</span>
      </div>`;
    }).join('')}
  `;
}
// Daily spend heatmap data: Quick Add entries carry a real timestamp, so those
// are placed on their exact day; any other outgoing with an optional "Day" set
// (e.g. Rent on the 1st) is placed on that day of the displayed month, clamped
// to the month's actual length. In 'done' mode, dated non-Quick-Add outgoings
// only count once marked Done — Quick Add entries are always Done already.
function dailySpendSeries(monthKey, mode){
  const m = state.months[monthKey];
  const days = {};
  if(!m) return days;
  const [y, mo] = monthKey.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(o.quickAdd && o.ts){
      const d = new Date(o.ts);
      if(d.getFullYear()!==y || (d.getMonth()+1)!==mo) return;
      const day = d.getDate();
      days[day] = round2((days[day]||0) + (Number(o.amount)||0));
      return;
    }
    if(mode==='done' && o.status!=='done') return;
    const day = resolveScheduledDay(o, y, mo);
    if(day) days[day] = round2((days[day]||0) + (Number(o.amount)||0));
  });
  return days;
}
function hexToRgbTriplet(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? `${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}` : '91,140,255';
}
// ---- Daily spending heatmap (month view, year view, day details) ----
let heatmapMonth = null, heatmapMode = 'all', heatmapView = 'month', heatmapYear = null;
const mondayIndexOf = jsDay => (jsDay+6)%7; // JS: 0=Sun..6=Sat -> Monday-first
const WEEKDAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

// Compact money for tiny cells: £42, £4.50, £1.2k.
function fmtCompact(n){
  const v = Math.abs(n), sign = n<0 ? '-' : '';
  if(v>=10000) return sign+state.currency+Math.round(v/1000)+'k';
  if(v>=1000) return sign+state.currency+(v/1000).toFixed(1).replace(/\.0$/,'')+'k';
  if(v>=100) return sign+state.currency+Math.round(v);
  return sign+state.currency+v.toFixed(2).replace(/\.00$/,'');
}
function heatmapCtx(mk){
  const [y, mo] = mk.split('-').map(Number);
  const dim = new Date(y, mo, 0).getDate();
  const now = new Date();
  const isCurrent = mk===monthKey(now), isPast = mk<monthKey(now);
  return {y, mo, dim, isCurrent, isPast, today: isCurrent ? now.getDate() : 0, elapsed: isPast ? dim : (isCurrent ? now.getDate() : 0)};
}
// Every dated outgoing/incoming (any status) by day, for tooltips, ghost
// amounts and the day-detail panel.
function scheduledByDay(mk){
  const m = state.months[mk];
  const bills = {}, pays = {};
  if(!m) return {bills, pays};
  const [y, mo] = mk.split('-').map(Number);
  m.outgoings.forEach(o=>{
    const d = resolveScheduledDay(o, y, mo);
    if(d && !o.quickAdd) (bills[d] = bills[d]||[]).push({name:o.name, amount:Number(o.amount)||0, done:o.status==='done', category:o.category||'Uncategorized'});
  });
  m.incoming.forEach(i=>{
    const d = resolveScheduledDay(i, y, mo);
    if(d && !i.quickAdd) (pays[d] = pays[d]||[]).push({name:i.name, amount:Number(i.amount)||0, done:i.status==='done'});
  });
  return {bills, pays};
}
// Quick Add spends only, by day — everyday discretionary spending, free of
// bills like rent that would otherwise dominate weekday patterns.
function discretionaryByDay(mk){
  const m = state.months[mk];
  const days = {};
  if(!m) return days;
  const [y, mo] = mk.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(!(o.quickAdd && o.ts)) return;
    const d = new Date(o.ts);
    if(d.getFullYear()!==y || (d.getMonth()+1)!==mo) return;
    days[d.getDate()] = round2((days[d.getDate()]||0) + (Number(o.amount)||0));
  });
  return days;
}
function cumulativeSpend(series, dim, upto){
  const out = [];
  let run = 0;
  for(let d=1; d<=Math.min(dim, upto); d++){ run += series[d]||0; out.push(round2(run)); }
  return out;
}

function renderSpendingHeatmap(){
  const el = document.getElementById('spendHeatmap');
  if(!el) return;
  const keys = Object.keys(state.months).sort();
  if(!keys.length){ el.innerHTML = '<div class="empty">No months tracked yet.</div>'; return; }
  if(!heatmapMonth || !state.months[heatmapMonth]) heatmapMonth = state.months[state.currentMonthKey] ? state.currentMonthKey : keys[keys.length-1];
  if(heatmapYear===null) heatmapYear = Number(heatmapMonth.slice(0,4));
  const years = keys.map(k=>Number(k.slice(0,4)));
  const minYear = Math.min(...years), maxYear = Math.max(...years);
  const idx = keys.indexOf(heatmapMonth);

  const navHtml = heatmapView==='year'
    ? `<div class="month-switch"><button id="hmPrev" ${heatmapYear<=minYear?'disabled':''}>‹</button><div class="label">${heatmapYear}</div><button id="hmNext" ${heatmapYear>=maxYear?'disabled':''}>›</button></div>`
    : `<div class="month-switch"><button id="hmPrev" ${idx<=0?'disabled':''}>‹</button><div class="label">${monthLabelFromKey(heatmapMonth)}</div><button id="hmNext" ${idx>=keys.length-1?'disabled':''}>›</button></div>`;
  const controls = `
    <div class="hm-controls">
      ${navHtml}
      <div class="seg-toggle" id="hmViewToggle">
        <button class="seg-btn${heatmapView==='month'?' active':''}" data-v="month">Month</button>
        <button class="seg-btn${heatmapView==='year'?' active':''}" data-v="year">Year</button>
      </div>
      <div class="seg-toggle" id="hmModeToggle">
        <button class="seg-btn${heatmapMode==='all'?' active':''}" data-m="all">Budgeted</button>
        <button class="seg-btn${heatmapMode==='done'?' active':''}" data-m="done">Actual (Done)</button>
      </div>
    </div>`;

  const body = heatmapView==='year' ? heatmapYearHtml(keys) : heatmapMonthHtml(heatmapMonth);
  el.innerHTML = controls + body.html;

  document.getElementById('hmPrev').onclick = ()=>{
    if(heatmapView==='year') heatmapYear--; else heatmapMonth = keys[idx-1];
    renderSpendingHeatmap();
  };
  document.getElementById('hmNext').onclick = ()=>{
    if(heatmapView==='year') heatmapYear++; else heatmapMonth = keys[idx+1];
    renderSpendingHeatmap();
  };
  el.querySelectorAll('#hmViewToggle .seg-btn').forEach(b=>b.onclick = ()=>{
    heatmapView = b.dataset.v;
    if(heatmapView==='year') heatmapYear = Number(heatmapMonth.slice(0,4));
    renderSpendingHeatmap();
  });
  el.querySelectorAll('#hmModeToggle .seg-btn').forEach(b=>b.onclick = ()=>{ heatmapMode = b.dataset.m; renderSpendingHeatmap(); });
  if(body.after) body.after(el);
}

function heatmapLegendHtml(accentRgb){
  return `<div class="heatmap-legend">
      <span>Less</span>
      ${[0.18,0.4,0.65,0.9].map(a=>`<span class="heatmap-legend-swatch" style="background:rgba(${accentRgb},${a});"></span>`).join('')}
      <span>More</span>
      <span class="hm-leg"><span class="hm-leg-dot" style="background:var(--amber);"></span>Bill due</span>
      <span class="hm-leg"><span class="hm-leg-dot" style="background:var(--green);"></span>Payday</span>
      <span class="hm-leg"><span class="hm-leg-tick">✓</span>No spend</span>
    </div>`;
}

function heatmapMonthHtml(mk){
  const c = heatmapCtx(mk);
  const daySpend = dailySpendSeries(mk, heatmapMode);
  const {bills, pays} = scheduledByDay(mk);
  const disc = discretionaryByDay(mk);
  const max = Math.max(0, ...Object.values(daySpend));
  const accentRgb = hexToRgbTriplet(getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#5b8cff');
  const monthShort = monthLabelFromKey(mk).split(' ')[0].slice(0,3);
  const firstDow = mondayIndexOf(new Date(c.y, c.mo-1, 1).getDay());

  // Month stats
  let spentToDate = 0, noSpend = 0, best = 0, run = 0, busiest = null;
  for(let d=1; d<=c.dim; d++){
    const amt = daySpend[d]||0;
    if(amt>0 && (!busiest || amt>busiest.amt)) busiest = {day:d, amt};
    if(d<=c.elapsed){
      spentToDate += amt;
      if(amt===0){ noSpend++; run++; best = Math.max(best, run); } else run = 0;
    }
  }
  const curStreak = run;
  const total = round2(Object.values(daySpend).reduce((a,b)=>a+b,0));
  const chips = [
    `<div class="hm-stat"><div class="k">Month total</div><div class="v">${fmt(total)}</div></div>`,
    c.elapsed>0 ? `<div class="hm-stat"><div class="k">Daily average</div><div class="v">${fmt(round2(spentToDate/c.elapsed))}</div></div>` : '',
    busiest ? `<div class="hm-stat"><div class="k">Busiest day</div><div class="v">${monthShort} ${busiest.day} · ${fmt(busiest.amt)}</div></div>` : '',
    c.elapsed>0 ? `<div class="hm-stat" title="Days with nothing logged against them"><div class="k">No-spend days</div><div class="v">${noSpend}<span class="hm-sub"> · best streak ${best}${curStreak>=2?` · now ${curStreak}`:''}</span></div></div>` : ''
  ].join('');

  let cells = '';
  for(let i=0; i<firstDow; i++) cells += `<div class="heatmap-cell empty"></div>`;
  for(let day=1; day<=c.dim; day++){
    const amt = daySpend[day]||0;
    const ratio = max>0 ? amt/max : 0;
    const dow = mondayIndexOf(new Date(c.y, c.mo-1, day).getDay());
    const isWeekend = dow >= 5;
    const isToday = day===c.today;
    const isFuture = !c.isPast && day>c.elapsed;
    const bg = amt>0 ? `rgba(${accentRgb},${(0.18+0.72*ratio).toFixed(2)})` : 'transparent';
    const dayBills = bills[day]||[], dayPays = pays[day]||[];
    const pendingBills = dayBills.filter(b=>!b.done), pendingPays = dayPays.filter(p=>!p.done);
    const ghostAmt = heatmapMode==='done' ? round2(pendingBills.reduce((a,b)=>a+b.amount,0)) : 0;
    const noSpendDay = !isFuture && amt===0;
    let tip = `<div style="font-weight:700;margin-bottom:3px;">${WEEKDAY_FULL[dow].slice(0,3)} ${day} ${monthShort}</div>`;
    tip += amt>0 ? `<div>Spent: ${escapeHtml(fmt(amt))}</div>` : (noSpendDay ? '<div style="color:var(--muted);">Nothing logged</div>' : '<div style="color:var(--muted);">Nothing planned</div>');
    pendingBills.forEach(b=>{ tip += `<div><span style="color:var(--amber);">●</span> Due: ${escapeHtml(b.name)} ${escapeHtml(fmt(b.amount))}</div>`; });
    pendingPays.forEach(p=>{ tip += `<div><span style="color:var(--green);">●</span> Pay: ${escapeHtml(p.name)} ${escapeHtml(fmt(p.amount))}</div>`; });
    tip += '<div style="color:var(--muted);margin-top:3px;">Click for details</div>';
    const markers = (pendingPays.length?'<span class="pay-marker"></span>':'') + (pendingBills.length?'<span class="bill-marker"></span>':'');
    const low = (amt>0 ? (ratio>0.5?'hm-hot':'') : '');
    cells += `<button type="button" class="heatmap-cell${isWeekend?' weekend':''}${isToday?' today':''}${isFuture?' future':''}${low?' '+low:''}" data-day="${day}" data-tip="${escapeHtml(tip)}" style="background:${bg};">
      <span class="hm-day">${day}</span>
      <span class="hm-markers">${markers}</span>
      <span class="hm-foot">
        ${amt>0 ? `<span class="hm-amt">${fmtCompact(amt)}</span>` : (noSpendDay ? '<span class="hm-tick">✓</span>' : '')}
        ${ghostAmt>0 ? `<span class="hm-ghost">${fmtCompact(ghostAmt)} due</span>` : ''}
      </span>
    </button>`;
  }

  // Weekday pattern from Quick Add spends only
  const wd = Array.from({length:7}, ()=>({sum:0, count:0}));
  for(let d=1; d<=c.elapsed; d++) wd[mondayIndexOf(new Date(c.y, c.mo-1, d).getDay())].count++;
  Object.entries(disc).forEach(([d,v])=>{ if(Number(d)<=c.elapsed) wd[mondayIndexOf(new Date(c.y, c.mo-1, Number(d)).getDay())].sum += v; });
  const avgs = wd.map(x=>x.count ? x.sum/x.count : 0);
  const maxAvg = Math.max(0, ...avgs);
  let wdInsight = 'Log spends with Quick Add to see which days cost you most.';
  if(maxAvg>0){
    const top = avgs.indexOf(maxAvg);
    wdInsight = `${WEEKDAY_FULL[top]}s cost you most — about ${fmt(round2(maxAvg))} on average.`;
    const sum = (idxs, f) => idxs.reduce((a,i)=>a+wd[i][f],0);
    const wkndDays = sum([5,6],'count'), wkdyDays = sum([0,1,2,3,4],'count');
    if(wkndDays>0 && wkdyDays>0){
      const wknd = sum([5,6],'sum')/wkndDays, wkdy = sum([0,1,2,3,4],'sum')/wkdyDays;
      if(wkdy>0 && wknd>0){
        const ratio = wknd/wkdy;
        if(ratio>=2) wdInsight += ` Weekend days cost about ${ratio.toFixed(1).replace(/\.0$/,'')}× as much as weekdays.`;
        else {
          const pct = Math.round((ratio-1)*100);
          if(Math.abs(pct)>=5) wdInsight += ` Weekends run ${Math.abs(pct)}% ${pct>0?'higher':'lower'} than weekdays.`;
        }
      }
    }
  }
  const wdHtml = `
    <div class="hm-card">
      <div class="hm-card-title">Everyday spending by weekday</div>
      <div class="hm-wd">
        ${avgs.map((a,i)=>`<div class="hm-wd-col" title="${WEEKDAY_FULL[i]}: ${escapeHtml(fmt(round2(a)))} avg over ${wd[i].count} day${wd[i].count!==1?'s':''}">
          <div class="hm-wd-val">${a>0?fmtCompact(a):''}</div>
          <div class="hm-wd-track"><div class="hm-wd-bar${a===maxAvg&&a>0?' top':''}${i>=5?' wknd':''}" style="height:${maxAvg?Math.max(a/maxAvg*100, a>0?4:0).toFixed(1):0}%;"></div></div>
          <div class="hm-wd-lbl">${WEEKDAY_FULL[i].slice(0,3)}</div>
        </div>`).join('')}
      </div>
      <div class="hm-insight">${wdInsight}</div>
    </div>`;

  // Pace vs the previous tracked month
  let paceHtml = '', paceAfter = null;
  if(c.elapsed>0){
    const keys = Object.keys(state.months).sort();
    const prevKey = keys[keys.indexOf(mk)-1];
    const curCum = cumulativeSpend(daySpend, c.dim, c.elapsed);
    let caption = `${fmt(curCum[curCum.length-1]||0)} spent by day ${c.elapsed}.`;
    let series;
    const dayLabel = d => `${monthShort} ${d}`;
    const xs = Array.from({length:c.dim}, (_,i)=>i+1);
    if(prevKey){
      const pc = heatmapCtx(prevKey);
      const prevCumRaw = cumulativeSpend(dailySpendSeries(prevKey, heatmapMode), pc.dim, pc.dim);
      const prevCum = xs.map(d=>prevCumRaw[Math.min(d, prevCumRaw.length)-1]||0);
      const diff = round2((curCum[c.elapsed-1]||0) - prevCum[c.elapsed-1]);
      caption += Math.abs(diff)<0.005 ? ` Exactly level with ${monthLabelFromKey(prevKey)}.`
        : ` <span style="color:var(--${diff>0?'red':'green'});font-weight:700;">${fmt(Math.abs(diff))} ${diff>0?'more':'less'}</span> than ${monthLabelFromKey(prevKey)} by the same day.`;
      series = [
        {color:cssVar('--muted','#8a93ab'), name:monthLabelFromKey(prevKey), dashed:true, points: xs.map((d,i)=>({x:String(d), label:dayLabel(d), y:prevCum[i]}))},
        {color:cssVar('--accent','#5b8cff'), name:monthLabelFromKey(mk), points: curCum.map((v,i)=>({x:String(i+1), label:dayLabel(i+1), y:v}))}
      ];
    } else {
      series = [{color:cssVar('--accent','#5b8cff'), name:monthLabelFromKey(mk), points: curCum.map((v,i)=>({x:String(i+1), label:dayLabel(i+1), y:v}))}];
    }
    paceHtml = `
      <div class="hm-card">
        <div class="hm-card-title">Spending pace</div>
        <div id="hmPace"></div>
        <div class="hm-insight">${caption}</div>
      </div>`;
    paceAfter = ()=>{
      const pe = document.getElementById('hmPace');
      if(pe && series[0].points.length>=2) lineChart(pe, series, {height:170, marker: c.today ? {index:c.today-1, label:'Today'} : null});
      else if(pe) pe.innerHTML = '<div class="empty">Not enough days yet.</div>';
    };
  }

  const empty = !Object.keys(daySpend).length && !Object.keys(bills).length && !Object.keys(pays).length;
  const html = `
    <div class="hm-stats">${chips}</div>
    ${empty ? '<div class="empty" style="padding:6px 0 14px;">No Quick Add spends or dated outgoings for this month yet — click any day to log one, or give an outgoing a Day.</div>' : ''}
    <div class="heatmap-grid">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="heatmap-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    ${heatmapLegendHtml(accentRgb)}
    <div class="hm-insights">${wdHtml}${paceHtml}</div>`;
  return {html, after: root=>{
    root.querySelectorAll('.heatmap-cell[data-day]').forEach(cell=>{
      cell.addEventListener('mouseenter', evt=>showChartTooltip(evt, cell.dataset.tip, true));
      cell.addEventListener('mousemove', evt=>showChartTooltip(evt, cell.dataset.tip, true));
      cell.addEventListener('mouseleave', hideChartTooltip);
      cell.addEventListener('click', ()=>{ hideChartTooltip(); openDayModal(mk, Number(cell.dataset.day)); });
    });
    if(paceAfter) paceAfter();
  }};
}

// Year at a glance: twelve mini calendars on one shared colour scale.
function heatmapYearHtml(keys){
  const y = heatmapYear;
  const accentRgb = hexToRgbTriplet(getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#5b8cff');
  const monthData = Array.from({length:12}, (_,i)=>{
    const mk = `${y}-${String(i+1).padStart(2,'0')}`;
    const tracked = !!state.months[mk];
    return {mk, i, tracked, spend: tracked ? dailySpendSeries(mk, heatmapMode) : {}};
  });
  const max = Math.max(0, ...monthData.flatMap(m=>Object.values(m.spend)));
  const yearTotal = round2(monthData.reduce((a,m)=>a+Object.values(m.spend).reduce((x,v)=>x+v,0),0));
  const cards = monthData.map(m=>{
    const dim = new Date(y, m.i+1, 0).getDate();
    const first = mondayIndexOf(new Date(y, m.i, 1).getDay());
    let sq = '';
    for(let b=0; b<first; b++) sq += '<span class="hm-sq blank"></span>';
    for(let d=1; d<=dim; d++){
      const a = m.spend[d]||0;
      sq += `<span class="hm-sq" style="${a>0?`background:rgba(${accentRgb},${(0.2+0.7*(max?a/max:0)).toFixed(2)});border-color:transparent;`:''}"></span>`;
    }
    const total = round2(Object.values(m.spend).reduce((x,v)=>x+v,0));
    const name = new Date(y, m.i, 1).toLocaleString('en-GB',{month:'short'});
    return `<button type="button" class="hm-mini${m.tracked?'':' untracked'}" data-mk="${m.mk}" ${m.tracked?'':'disabled'}>
      <div class="hm-mini-head"><span>${name}</span><span class="hm-sub">${m.tracked && total>0 ? fmtCompact(total) : ''}</span></div>
      <div class="hm-mini-grid">${sq}</div>
    </button>`;
  }).join('');
  const html = `
    <div class="hm-stats"><div class="hm-stat"><div class="k">${y} total</div><div class="v">${fmt(yearTotal)}</div></div></div>
    <div class="hm-year">${cards}</div>
    ${heatmapLegendHtml(accentRgb)}`;
  return {html, after: root=>{
    root.querySelectorAll('.hm-mini:not(.untracked)').forEach(b=>b.addEventListener('click', ()=>{
      heatmapMonth = b.dataset.mk; heatmapView = 'month'; renderSpendingHeatmap();
    }));
  }};
}

// Day details: what was spent, what's due, payday, and (for today or earlier)
// a form to log a spend against that exact day.
function openDayModal(mk, day){
  const m = state.months[mk];
  if(!m) return;
  const c = heatmapCtx(mk);
  const date = new Date(c.y, c.mo-1, day);
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');

    if(!(o.quickAdd && o.ts)) return false;
    const d = new Date(o.ts);
    return d.getFullYear()===c.y && d.getMonth()+1===c.mo && d.getDate()===day;
  });
  const {bills, pays} = scheduledByDay(mk);
  const dayBills = bills[day]||[], dayPays = pays[day]||[];
  const spentTotal = round2(spends.reduce((a,o)=>a+(Number(o.amount)||0),0));

  const spendRows = spends.map(o=>`<div class="dm-row">${catTile(o.category||'Uncategorized','sm')}<div class="dm-main"><div class="dm-name">${escapeHtml(o.name)}</div><div class="dm-sub">${escapeHtml(o.category||'Uncategorized')} · ${new Date(o.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="dm-amt">${escapeHtml(fmt(o.amount))}</div><button class="del-btn dm-del" data-id="${o.id}" aria-label="Delete">✕</button></div>`).join('');
  const billRows = dayBills.map(b=>row(catTile(b.category,'sm'), b.name, b.done?'Bill · done':'Bill · due', b.amount)).join('');
  const payRows = dayPays.map(p=>row(catTile('Salary','sm'), p.name, p.done?'Payday · received':'Payday · expected', p.amount)).join('');
  const section = (title, html) => html ? `<div class="dm-sec"><div class="dm-sec-title">${title}</div><div class="dm-list">${html}</div></div>` : '';
  box.innerHTML = `

    ${section('Spent', spendRows)}
    ${section('Bills', billRows)}
    ${section('Pay', payRows)}
    ${canAdd ? `
      <div class="dm-sec"><div class="dm-sec-title">Log a spend on this day</div>
        <div class="dm-form">
          <input type="number" step="0.01" id="dmAmount" placeholder="Amount">
          <input type="text" id="dmReason" placeholder="Reason">
          ${categoryDropdownHtml('dmCategory','Uncategorized')}
          <button class="btn small" id="dmAdd">Add</button>
        </div>
      </div>` : `<div class="dm-note">This day hasn't happened yet, so spending can't be logged against it.</div>`}
    <div class="actions"><button class="btn secondary small" id="dmClose">Close</button></div>`;
  bg.classList.add('open');
  bg.onclick = e=>{ if(e.target===bg) closeRecapModal(); };
  document.getElementById('dmClose').onclick = closeRecapModal;
  box.querySelectorAll('.dm-del').forEach(b=>b.onclick = ()=>{
    removeWithUndo(m, 'outgoings', b.dataset.id, null,
      ()=>{ renderSpendingHeatmap(); openDayModal(mk, day); },
      ()=>{ renderSpendingHeatmap(); if(document.getElementById('modalBg').classList.contains('open') && document.getElementById('dmClose')) openDayModal(mk, day); });
  });
  if(canAdd){
    const cat = box.querySelector('.dmCategory');

      const isToday = c.isCurrent && day===c.today;
      const ts = isToday ? Date.now() : new Date(c.y, c.mo-1, day, 12, 0, 0).getTime();
      m.outgoings.push({id:uid(), name: reasonEl.value.trim() || 'Spent', amount:amt, status:'done', recurring:false, quickAdd:true, ts, category: cat.dataset.value});
      save(); renderSpendingHeatmap(); openDayModal(mk, day);
      showToast(`Added ${fmt(amt)}`, date.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}));
    };

    [amountEl, reasonEl].forEach(i=>i.addEventListener('keydown', e=>{ if(e.key==='Enter') add(); }));

// ---------------- Quarterly ----------------
function quarterOfMonth(mm){ return Math.floor((mm-1)/3)+1; }
const QUARTER_LABEL = q => ['Jan–Mar','Apr–Jun','Jul–Sep','Oct–Dec'][q-1];
function quarterStatsFor(gk, groups){
  const g = groups[gk];
  const monthKeys = g.monthKeys.slice().sort();
  let income=0, spending=0, saved=0;
  const catTotals = {};
  monthKeys.forEach(mk=>{
    const m = state.months[mk];
    const t = monthTotals(m);
    income += t.doneIncoming;
    spending += t.doneOutgoing + t.doneWeekly;
    saved += t.doneSavings + t.doneStocks;
    m.outgoings.forEach(o=>{
      if(o.status!=='done') return;
      const cat = o.category || 'Uncategorized';
      catTotals[cat] = (catTotals[cat]||0) + (Number(o.amount)||0);
    });
  });
  const firstM = state.months[monthKeys[0]];
  const lastM = state.months[monthKeys[monthKeys.length-1]];
  const startBalance = round2(firstM.startingBalance);
  const endBalance = round2(monthTotals(lastM).liveBalance);
  const net = round2(income - spending - saved);
  const savingsRate = income>0 ? Math.round(saved/income*100) : 0;
  const catRows = Object.entries(catTotals).filter(([,amt])=>amt>0)
    .map(([category,amount])=>({category, amount:round2(amount)}))
    .sort((a,b)=>b.amount-a.amount);
  return {gk, year:g.year, q:g.q, monthKeys, income:round2(income), spending:round2(spending), saved:round2(saved), net, startBalance, endBalance, savingsRate, catRows};
}
let quarterlySelectedKey = null;
function renderQuarterly(){
  const el = document.getElementById('view-quarterly');
  const keys = Object.keys(state.months).sort();
  if(!keys.length){
    el.innerHTML = '<div class="panel"><div class="empty">No months tracked yet — head to Month Tracker to get started.</div></div>';
    return;
  }
  const groups = {};
  keys.forEach(k=>{
    const [y, mo] = k.split('-').map(Number);
    const q = quarterOfMonth(mo);
    const gk = `${y}-Q${q}`;
    (groups[gk] = groups[gk] || {year:y, q, monthKeys:[]}).monthKeys.push(k);
  });
  const groupKeys = Object.keys(groups).sort();
  const quarterStats = groupKeys.map(gk=>quarterStatsFor(gk, groups));
  if(!quarterlySelectedKey || !groupKeys.includes(quarterlySelectedKey)){
    quarterlySelectedKey = groupKeys[groupKeys.length-1];
  }

  el.innerHTML = `
    <div class="panel">

      {color:cssVar('--accent','#5b8cff'), name:'Net', dashed:true, points: quarterStats.map((qs,i)=>({x:labels[i], label:`Q${qs.q} ${qs.year}`, y:qs.net}))}
    ], {height:220});

    document.getElementById('quarterlyChart').innerHTML = '<div class="empty">Track at least two quarters to see a trend line.</div>';

    detailEl.innerHTML = `

        <div class="card"><div class="k">Spending</div><div class="v neg">${fmt(qs.spending)}</div><div class="sub">outgoings + weekly, Done</div></div>
        <div class="card"><div class="k">Saved</div><div class="v pos">${fmt(qs.saved)}</div><div class="sub">savings + stocks, Done</div></div>
        <div class="card highlight"><div class="k">Net Change</div><div class="v ${qs.net>=0?'pos':'neg'}">${fmt(qs.net)}</div><div class="sub">${qs.savingsRate}% savings rate</div></div>
        <div class="card"><div class="k">Starting Balance</div><div class="v">${fmt(qs.startBalance)}</div><div class="sub">start of quarter</div></div>

            <div class="cat-bar-amt">${fmt(r.amount)}</div>
          </div>
        `).join('')}
      ` : ''}
    `;
  };
  renderDetail();
  document.getElementById('quarterlySelect').onchange = e=>{ quarterlySelectedKey = e.target.value; renderDetail(); };
  document.getElementById('quarterlyPrev').onclick = ()=>{

    if(i>0){ quarterlySelectedKey = groupKeys[i-1]; document.getElementById('quarterlySelect').value = quarterlySelectedKey; renderDetail(); }
  };
  document.getElementById('quarterlyNext').onclick = ()=>{
    const i = groupKeys.indexOf(quarterlySelectedKey);
    if(i<groupKeys.length-1){ quarterlySelectedKey = groupKeys[i+1]; document.getElementById('quarterlySelect').value = quarterlySelectedKey; renderDetail(); }
  };
}

// Recurring items that exist in later (already generated) months but not in the
// month being viewed — e.g. something added as recurring in November while you're
// looking at October. Each gets a button that jumps to that month to edit it.
function recurringElsewhere(m, listKey){
  const norm = n => String(n||'').trim().toLowerCase();
  const have = new Set(m[listKey].filter(x=>x.recurring && !x.transfer).map(x=>norm(x.name)));
  const found = new Map();
  Object.keys(state.months).sort().filter(k=>k>state.currentMonthKey).forEach(k=>{
    state.months[k][listKey].forEach(x=>{
      if(!x.recurring || x.transfer) return;
      const key = norm(x.name);
      if(have.has(key) || found.has(key)) return;
      found.set(key, {x, k});
    });
  });
  return found;
}
function drawRecurringElsewhere(m, kind){
  const box = document.getElementById(`recurElse-${kind}`);
  if(!box) return;
  const listKey = kind==='incoming' ? 'incoming' : 'outgoings';
  const found = recurringElsewhere(m, listKey);
  if(!found.size){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="rc-else-title">Added in later months <small>— not in ${escapeHtml(monthLabelFromKey(state.currentMonthKey))} yet</small></div><div class="rw-list">` +
    [...found.values()].map(({x,k})=>`

// ---------------- Cash-flow forecast page ----------------
// Walks your balance day by day for the viewed month: starts from today's live
// balance (or the month's opening balance for a future month), takes off every
// pending bill on its Day, adds pending income on its scheduled day, and
// subtracts an assumed everyday-spending figure per day. Anything pending
// without a date can't be placed, so it's listed separately instead.
function cashflowSettings(){
  if(!state.cashflow || typeof state.cashflow!=='object') state.cashflow = {};
  if(typeof state.cashflow.buffer!=='number') state.cashflow.buffer = 100;
  return state.cashflow;
}
// The default everyday-spending figure: your own plan first (the unpaid weeks of
// the Weekly Budget spread over the days left), then your recent Quick Add
// average if there's no plan. quickAvg is returned too so the page can compare.
function cashflowDefaultDaily(key){
  const now = Date.now(), cutoff = now - 60*86400000;
  let total = 0, first = null;
  Object.values(state.months).forEach(m=>m.outgoings.forEach(o=>{
    if(o.quickAdd && o.ts && o.ts>=cutoff && o.ts<=now){ total += Number(o.amount)||0; if(first===null || o.ts<first) first = o.ts; }
  }));
  const quickAvg = total>0 ? Math.round(total/Math.max(14, Math.ceil((now-first)/86400000)+1)) : null;
  const m = state.months[key];
  if(m){
    const pending = ['week1','week2','week3','week4'].map(k=>m.weekly[k]).filter(w=>w.status!=='done' && (Number(w.amount)||0)>0);
    const pendingWeekly = pending.reduce((a,w)=>a+(Number(w.amount)||0),0);
    if(pendingWeekly>0){
      const [y,mo] = key.split('-').map(Number);
      const dim = new Date(y, mo, 0).getDate();
      const today = key===monthKey(new Date()) ? new Date().getDate() : 1;
      const days = Math.max(1, dim-today+1);
      return {value: Math.round(pendingWeekly/days), source:`From your weekly budget — ${pending.length} unpaid week${pending.length!==1?'s':''} (${fmt(pendingWeekly)}) over ${days} day${days!==1?'s':''}`, quickAvg};
    }
  }
  if(quickAvg!==null) return {value: quickAvg, source:'Your recent Quick Add average (no unpaid weekly budget)', quickAvg};
  return {value:0, source:'No weekly budget or Quick Add history yet — set your own', quickAvg:null};
}
function computeCashflow(key, daily, buffer){
  const m = state.months[key];
  if(!m) return null;
  const now = new Date(), curKey = monthKey(now);
  if(key < curKey) return {past:true};
  const [y, mo] = key.split('-').map(Number);
  const dim = new Date(y, mo, 0).getDate();
  const isCurrent = key===curKey;
  const startDay = isCurrent ? now.getDate() : 1;
  const mt = monthTotals(m);
  // A future month's opening cash includes last month's pay that funds it (it arrives before the month starts).
  const opening = round2(mt.liveBalance + (isCurrent ? 0 : mt.virtualPending));
  // Days are counted from the 1st of the viewed month, so the line can run past
  // month end (day dim+1 = the 1st of next month) and a date is just new Date(y, mo-1, day).
  const nk = monthKey(new Date(y, mo, 1));
  const nm = state.months[nk] || null;
  const events = [];
  const unplaced = {outAmt:0, outN:0, inAmt:0, inN:0, lateIn:0};
  const isPayLike = i => !!i.recurring || i.category==='Salary';
  m.outgoings.forEach(o=>{
    if(o.status==='done' || o.quickAdd) return;
    const amt = Number(o.amount)||0;
    if(amt<=0) return;
    const d = resolveScheduledDay(o, y, mo);
    if(!d){ unplaced.outAmt += amt; unplaced.outN++; return; }
    const late = isCurrent && d<startDay;
    events.push({day: late ? startDay : d, due:d, name:o.name, amount:-amt, kind:'out', late, pay3: !!o.pay3Id});
  });
  m.incoming.forEach(i=>{
    if(i.status==='done' || i.transfer) return;
    const amt = Number(i.amount)||0;
    if(amt<=0) return;
    const d = resolveScheduledDay(i, y, mo);
    if(!d){ unplaced.inAmt += amt; unplaced.inN++; return; }
    if(isCurrent && d<startDay){ unplaced.lateIn += amt; return; }
    events.push({day:d, due:d, name:i.name, amount:amt, kind:'in', payLike:isPayLike(i)});
  });
  // Next month's dated items, in case payday falls there (only used up to that payday).
  const nextEvents = [];
  if(nm){
    nm.outgoings.forEach(o=>{
      if(o.status==='done' || o.quickAdd) return;
      const amt = Number(o.amount)||0, d = resolveScheduledDay(o, ...nk.split("-").map(Number));
      if(amt>0 && d) nextEvents.push({day:dim+d, due:dim+d, name:o.name, amount:-amt, kind:'out', late:false, pay3:!!o.pay3Id});
    });
    nm.incoming.forEach(i=>{
      if(i.status==='done' || i.transfer) return;
      const amt = Number(i.amount)||0, d = resolveScheduledDay(i, ...nk.split('-').map(Number));
      if(amt>0 && d) nextEvents.push({day:dim+d, due:dim+d, name:i.name, amount:amt, kind:'in', payLike:isPayLike(i)});
    });
  }
  // Money you plan to move into savings / stocks has no date, so it's taken off on the
  // first day of the forecast (it's committed, matching the Month Tracker's left-over).
  const savAmt = m.savings.status!=='done' ? Number(m.savings.amount)||0 : 0;
  const stkAmt = m.stocks.status!=='done' ? Number(m.stocks.amount)||0 : 0;
  const setAside = round2(savAmt + stkAmt);
  if(savAmt>0) events.push({day:startDay, due:startDay, name:'Move to savings', amount:-savAmt, kind:'out', late:false, setAside:true});
  if(stkAmt>0) events.push({day:startDay, due:startDay, name:'Move to stocks & shares', amount:-stkAmt, kind:'out', late:false, setAside:true});

  // Horizon: today → the next payday (strictly after the start day, so pay due today
  // counts as already here). Prefer regular pay; fall back to any income.
  const incAfter = list => list.filter(e=>e.kind==='in' && e.day>startDay).sort((a,b)=>a.day-b.day || b.amount-a.amount);
  const pool = [...events, ...nextEvents];
  const payPick = incAfter(pool.filter(e=>e.payLike))[0] || incAfter(pool)[0] || null;
  const endDay = payPick ? payPick.day : dim;
  const noPay = !payPick;
  const horizon = [...events, ...nextEvents].filter(e=>e.day<=endDay);
  horizon.sort((a,b)=>a.day-b.day || a.amount-b.amount);
  events.length = 0; horizon.forEach(e=>events.push(e));

  let bal = opening;
  const series = [];
  for(let d=startDay; d<=endDay; d++){
    events.filter(e=>e.day===d).forEach(e=>{ bal += e.amount; });
    bal -= daily;
    series.push({day:d, bal:round2(bal)});
  }
  events.forEach(e=>{ e.after = series.find(p=>p.day===e.day).bal; });

  // Lowest point counts every day before payday; on payday itself, the balance before the pay lands.
  let low = {day:startDay, bal:opening, fromOpening:true};
  series.forEach(p=>{
    let b = p.bal;
    if(p.day===endDay && payPick) b = round2(b - events.filter(e=>e.day===p.day && e.kind==='in').reduce((a,e)=>a+e.amount,0));
    if(b < low.bal) low = {day:p.day, bal:b};
  });
  const status = low.bal < 0 ? 'short' : (low.bal < buffer ? 'tight' : 'fine');
  const negDays = series.filter(p=>p.bal<0 && !(payPick && p.day===endDay && p.bal>=0));
  const firstNeg = negDays[0] || null;
  const nextPay = payPick ? events.find(e=>e===payPick) || payPick : null;
  const payAmount = payPick ? events.filter(e=>e.kind==='in' && e.day===endDay).reduce((a,e)=>a+e.amount,0) : 0;

  // Suggestions when short: push the biggest bill due before the low point past payday,
  // and/or trim the daily figure.
  let fixes = null;
  if(status==='short'){
    const shortfall = round2(-low.bal);
    const before = events.filter(e=>e.kind==='out' && e.day<=low.day);
    const big = before.sort((a,b)=>a.amount-b.amount)[0] || null;
    const bigAmt = big ? -big.amount : 0;
    const remainingAfterBill = round2(shortfall - bigAmt);
    const daysToLow = Math.max(1, low.day - startDay + 1);
    let trimPerDay = 0, trimTotal = 0;
    if(remainingAfterBill>0){
      trimPerDay = Math.ceil(remainingAfterBill/daysToLow);
      trimTotal = trimPerDay*daysToLow;
    } else if(!big){
      trimPerDay = Math.ceil(shortfall/daysToLow); trimTotal = trimPerDay*daysToLow;
    }
    fixes = {shortfall, big, bigAmt, trimPerDay, trimTotal, daysToLow,
             newDaily: Math.max(0, daily-trimPerDay),
             canTrim: trimPerDay<=daily,
             leftover: round2(bigAmt + trimTotal - shortfall)};
  }
  return {key, isCurrent, startDay, dim, endDay, noPay, payAmount, opening, daily, buffer, events, series, low, status, negDays, firstNeg, nextPay, unplaced, setAside, fixes, y, mo};
}

let cashflowShowAll = false;
function cashflowChartSvg(c){
  const narrow = window.innerWidth<=700;
  const W = narrow ? 360 : 740, H = narrow ? 270 : 310, L = narrow ? 44 : 48, R = narrow ? 344 : 716, T = 30, B = narrow ? 230 : 268;
  const vals = [c.opening, ...c.series.map(p=>p.bal)];
  let vmin = Math.min(...vals, 0), vmax = Math.max(...vals, c.buffer>0?c.buffer:0);
  if(vmax-vmin < 1) vmax = vmin + 1;
  const rough = (vmax-vmin)/5;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1,2,2.5,5,10].map(f=>f*mag).find(s=>s>=rough) || 10*mag;
  vmin = Math.floor(vmin/step)*step; vmax = Math.ceil(vmax/step)*step;
  const x0 = c.startDay-1, span = Math.max(1, c.endDay-x0);
  const xOf = d => L + ((d-x0)/span)*(R-L);
  const yOf = v => B - (v-vmin)/(vmax-vmin)*(B-T);
  const accent = cssVar('--accent','#5b8cff'), green = cssVar('--green','#3ecf8e'), red = cssVar('--red','#ff5c7a'), amber = cssVar('--amber','#ffb946');
  const muted = cssVar('--muted','#8a93ab'), border = cssVar('--border','#2a3552'), text = cssVar('--text','#e8ecf7'), panel2 = cssVar('--panel2','#1d2740'), panel = cssVar('--panel','#161d2e');
  const startX = xOf(c.startDay-1);
  const pts = [{x:startX, y:yOf(c.opening)}, ...c.series.map(p=>({x:xOf(p.day), y:yOf(p.bal)}))];
  const poly = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const zeroY = yOf(0);
  let grid = '', labels = '';
  for(let v=vmin; v<=vmax+step/2; v+=step){
    const y = yOf(v);
    grid += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${R}" y2="${y.toFixed(1)}" stroke="${border}" stroke-width="1"${v===0&&vmin<0?' opacity=".0"':''}/>`;
    labels += `<text x="${L-8}" y="${(y+4).toFixed(1)}" font-size="10.5" fill="${muted}" text-anchor="end">${escapeHtml(state.currency)}${Math.round(v).toLocaleString()}</text>`;
  }
  const zeroLine = vmin<0 ? `<line x1="${L}" y1="${zeroY.toFixed(1)}" x2="${R}" y2="${zeroY.toFixed(1)}" stroke="${text}" stroke-width="1.2" opacity=".55"/>` : '';
  const bufferLine = (c.buffer>0 && c.buffer<=vmax && c.buffer>vmin) ? `<line x1="${L}" y1="${yOf(c.buffer).toFixed(1)}" x2="${R}" y2="${yOf(c.buffer).toFixed(1)}" stroke="${amber}" stroke-width="1" stroke-dasharray="4 4" opacity=".75"/><text x="${L+4}" y="${(yOf(c.buffer)-5).toFixed(1)}" font-size="10" fill="${amber}">${escapeHtml(fmtCompact(c.buffer))} buffer</text>` : '';
  // red shading where the balance is below zero
  let shade = '';
  for(let i=0; i<pts.length-1; i++){
    const a = pts[i], b = pts[i+1];
    const av = i===0 ? c.opening : c.series[i-1].bal, bv = c.series[i].bal;
    if(av>=0 && bv>=0) continue;
    const xs = [], ys = [];
    let x0 = a.x, x1 = b.x, y0 = a.y, y1 = b.y;
    if(av>=0 && bv<0){ const t = av/(av-bv); x0 = a.x + (b.x-a.x)*t; y0 = zeroY; }
    if(av<0 && bv>=0){ const t = av/(av-bv); x1 = a.x + (b.x-a.x)*t; y1 = zeroY; }
    shade += `<polygon points="${x0.toFixed(1)},${zeroY.toFixed(1)} ${x0.toFixed(1)},${y0.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${zeroY.toFixed(1)}" fill="${red}" opacity=".28"/>`;
  }
  const area = `M${poly.replace(/ /g,' L')} L${pts[pts.length-1].x.toFixed(1)},${(vmin<0?zeroY:B).toFixed(1)} L${startX.toFixed(1)},${(vmin<0?zeroY:B).toFixed(1)} Z`;
  // lowest point callout (geometry first, so labels can steer clear of it)
  const lx = xOf(c.low.fromOpening ? c.startDay-1 : c.low.day), ly = yOf(c.low.bal);
  const boxW = narrow ? 112 : 128, boxH = 46;
  let bx = Math.min(Math.max(lx - boxW/2, L+4), R-boxW-4);
  let by = ly - boxH - 26; if(by < T-4) by = ly + 26;
  const placed = [{x0:bx, x1:bx+boxW, y0:Math.min(by,ly-9), y1:Math.max(by+boxH,ly+9)}];
  // markers: one per day, even when several things fall on it
  const dayY = d => yOf(c.series.find(p=>p.day===d).bal);
  const groups = {};
  c.events.forEach(e=>{ (groups[e.day] = groups[e.day] || {day:e.day, outs:[], ins:[]})[e.kind==='in'?'ins':'outs'].push(e); });
  const glist = Object.values(groups);
  const markers = glist.map(g=>{
    const x = xOf(g.day), y = dayY(g.day);
    if(g.ins.length) return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${green}" stroke="${panel}" stroke-width="2"/>`;
    const late = g.outs.some(e=>e.late);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${g.outs.length>1?5:4.2}" fill="${panel}" stroke="${late?red:amber}" stroke-width="2.2"/>`;
  }).join('');
  // labels: biggest outgoing days + payday, each placed where it doesn't collide
  const outTotal = g => g.outs.reduce((a,e)=>a+e.amount,0);
  const toLabel = glist.filter(g=>g.outs.length && !g.ins.length).sort((a,b)=>outTotal(a)-outTotal(b)).slice(0, narrow?2:3).map(g=>{
    const big = g.outs.slice().sort((a,b)=>a.amount-b.amount)[0];
    return {g, kind:'out', text:`${big.name}${g.outs.length>1?` +${g.outs.length-1} more`:''} −${fmtCompact(Math.abs(outTotal(g)))}`};
  });
  const payG = c.nextPay && groups[c.nextPay.day];
  if(payG){
    const ins = payG.ins.reduce((a,e)=>a+e.amount,0);
    toLabel.push({g:payG, kind:'in', text:`${c.nextPay.name}${payG.ins.length>1?` +${payG.ins.length-1} more`:''} +${fmtCompact(ins)}`});
  }
  const charW = narrow ? 6.2 : 6.6, lh = 12;
  toLabel.sort((a,b)=>(a.kind==='in'?-1:0)-(b.kind==='in'?-1:0));   // payday places first, then the biggest bills
  let evLabels = '';
  toLabel.forEach(lb=>{
    const x = xOf(lb.g.day), y = dayY(lb.g.day);
    const w = lb.text.length*charW;
    const anchor = x + 9 + w > R+4 ? 'end' : 'start';
    const tx = anchor==='end' ? x-9 : x+9;
    const x0 = anchor==='end' ? tx-w : tx, x1 = x0+w;
    const tries = lb.kind==='in' ? [4,-12,20,-28] : [-9,-24,-39,15,30];
    const hit = (y0,y1)=>placed.some(r=>x0<r.x1 && x1>r.x0 && y0<r.y1 && y1>r.y0);
    let chosen = null;
    for(const dy of tries){
      const ty = y+dy, y0 = ty-lh+2, y1 = ty+3;
      if(y0 < T-6 || y1 > B+2) continue;
      if(!hit(y0,y1)){ chosen = {ty, y0, y1}; break; }
    }
    if(!chosen) return;
    placed.push({x0, x1, y0:chosen.y0, y1:chosen.y1});
    evLabels += `<text x="${tx.toFixed(1)}" y="${chosen.ty.toFixed(1)}" font-size="10.5" font-weight="700" fill="${lb.kind==='in'?green:text}" text-anchor="${anchor}" stroke="${panel}" stroke-width="3" paint-order="stroke">${escapeHtml(lb.text)}</text>`;
  });
  const lowCol = c.status==='short' ? red : (c.status==='tight' ? amber : accent);
  const lowDate = new Date(c.y, c.mo-1, c.low.day).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const callout = `
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9" fill="none" stroke="${lowCol}" stroke-width="2"/>
    <line x1="${lx.toFixed(1)}" y1="${(by<ly?by+boxH:by).toFixed(1)}" x2="${lx.toFixed(1)}" y2="${(by<ly?ly-9:ly+9).toFixed(1)}" stroke="${lowCol}" stroke-width="1.4"/>
    <rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${boxW}" height="${boxH}" rx="9" fill="${panel2}" stroke="${lowCol}" stroke-width="1.2"/>
    <text x="${(bx+12).toFixed(1)}" y="${(by+19).toFixed(1)}" font-size="10.5" fill="${muted}">Lowest point</text>
    <text x="${(bx+12).toFixed(1)}" y="${(by+37).toFixed(1)}" font-size="${narrow?12.5:14}" font-weight="800" fill="${c.status==='short'?red:text}">${c.low.bal<0?'−':''}${escapeHtml(fmtCompact(Math.abs(c.low.bal)))} · ${escapeHtml(lowDate)}</text>`;
  const nowLine = c.isCurrent ? `<line x1="${startX.toFixed(1)}" y1="${T-8}" x2="${startX.toFixed(1)}" y2="${B}" stroke="${muted}" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/><text x="${startX.toFixed(1)}" y="${T-12}" font-size="10" fill="${muted}" text-anchor="middle" font-weight="600">Now</text>` : '';
  const nTicks = Math.min(c.endDay-c.startDay+1, narrow ? 4 : 7);
  const ticks = [];
  for(let t=0; t<nTicks; t++) ticks.push(nTicks<=1 ? c.startDay : Math.round(c.startDay + t*(c.endDay-c.startDay)/(nTicks-1)));
  const xl = ticks.filter((d,i,a)=>a.indexOf(d)===i).map((d,i)=>{
    const dt = new Date(c.y, c.mo-1, d);
    const lab = (i===0 || dt.getDate()===1 || dt.getMonth()!==new Date(c.y, c.mo-1, ticks[0]).getMonth()) ? dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : String(dt.getDate());
    const anchor = d===c.startDay && c.startDay!==c.endDay ? 'start' : (d===c.endDay ? 'end' : 'middle');
    return `<text x="${(xOf(d)+(anchor==='start'?-4:anchor==='end'?4:0)).toFixed(1)}" y="${H-12}" font-size="10.5" fill="${muted}" text-anchor="${anchor}">${lab}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" data-w="${W}" data-l="${L}" data-r="${R}" style="display:block;touch-action:pan-y;" id="cfSvg" role="img" aria-label="Daily balance forecast">
    <defs><linearGradient id="cfGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${accent}" stop-opacity=".30"/><stop offset="1" stop-color="${accent}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${labels}${bufferLine}${shade}
    <path d="${area}" fill="url(#cfGrad)"/>
    ${zeroLine}
    <polyline points="${poly}" fill="none" stroke="${accent}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"${c.isCurrent?' stroke-dasharray="7 5"':''}/>
    ${nowLine}${markers}${evLabels}${callout}
    <circle id="cfGuideDot" r="5.5" fill="${panel}" stroke="${accent}" stroke-width="2.4" opacity="0" style="pointer-events:none;"/>
    <line id="cfGuide" y1="${T-4}" y2="${B}" stroke="${text}" stroke-width="1" stroke-dasharray="3 3" opacity="0" style="pointer-events:none;"/>
    <rect id="cfOverlay" x="${L}" y="0" width="${R-L}" height="${H}" fill="transparent" style="cursor:crosshair;"/>
    ${xl}
  </svg>`;
}

function renderCashflow(){
  hideChartTooltip();
  const el = document.getElementById('view-cashflow');
  const key = state.currentMonthKey;
  const s = cashflowSettings();
  const def = cashflowDefaultDaily(key);
  const daily = typeof s.daily==='number' ? s.daily : def.value;
  const monthLabel = monthLabelFromKey(key);

  if(key < monthKey(new Date())){
    el.innerHTML = `<div class="panel"><div class="panel-head"><h2>Cash-flow forecast · ${monthLabel}</h2></div>
      <div class="empty">A forecast looks forward, so it isn't available for a month that's already over. Use the arrows at the top to switch to this month or a later one.</div></div>`;
    return;
  }
  el.innerHTML = `
    <div class="panel cf-panel">
      <div class="panel-head">
        <div class="cf-title"><h2>Cash-flow forecast · up to payday</h2><span class="cf-pill" id="cfPill"></span></div>
        <span class="hint" id="cfHint">daily balance from today to your next payday</span>
      </div>
      <div class="cf-controls">
        <div class="cf-slider">
          <div class="cf-ctl-label">Everyday spending assumed</div>
          <div class="cf-slider-row"><input type="range" id="cfDaily" min="0" max="${Math.max(60, Math.ceil(Math.max(daily,def.value)*3/10)*10)}" step="1" value="${daily}" aria-label="Everyday spending per day"><b id="cfDailyVal">${escapeHtml(fmt(daily))}/day</b></div>
          <div class="cf-ctl-sub" id="cfDailySrc"></div>
          <div class="cf-ctl-sub cf-compare" id="cfCompare"></div>
        </div>
        <div class="cf-buffer">
          <div class="cf-ctl-label">Safety buffer</div>
          <label class="sv-amt"><span class="sv-cur">${escapeHtml(state.currency)}</span><input type="number" min="0" step="10" id="cfBuffer" value="${s.buffer}" aria-label="Safety buffer"></label>
          <div class="cf-ctl-sub">warn when the balance gets this low</div>
        </div>
      </div>
      <div id="cfDynamic"></div>
    </div>`;

  const dyn = document.getElementById('cfDynamic');
  const update = ()=>{
    const d = Number(document.getElementById('cfDaily').value)||0;
    const buf = Math.max(0, Number(document.getElementById('cfBuffer').value)||0);
    const c = computeCashflow(key, d, buf);
    paintCashflow(dyn, c);
  };
  const dailyInput = document.getElementById('cfDaily');
  dailyInput.oninput = ()=>{
    document.getElementById('cfDailyVal').textContent = fmt(Number(dailyInput.value)||0)+'/day';
    s.daily = Number(dailyInput.value)||0;
    paintSource();
    update();
  };
  dailyInput.onchange = ()=>save();
  const wireReset = ()=>{
    const r = document.getElementById('cfDailyReset');
    if(r) r.onclick = e=>{ e.preventDefault(); delete s.daily; save(); renderCashflow(); };
  };
  const paintSource = ()=>{
    const custom = typeof s.daily==='number';
    document.getElementById('cfDailySrc').innerHTML = custom
      ? `Your own figure · <a href="#" id="cfDailyReset">reset to ${escapeHtml(fmt(def.value))}/day</a>`
      : escapeHtml(def.source);
    const cur = Number(document.getElementById('cfDaily').value)||0;
    const cmp = document.getElementById('cfCompare');
    if(def.quickAvg!==null && def.quickAvg!==undefined){
      const diff = def.quickAvg - cur;
      cmp.innerHTML = diff>=2
        ? `<span style="color:var(--amber);">You've actually been spending about ${escapeHtml(fmt(def.quickAvg))}/day</span> (Quick Add) — more than this.`
        : `Your Quick Add average is about ${escapeHtml(fmt(def.quickAvg))}/day.`;
    } else cmp.innerHTML = '';
    wireReset();
  };
  paintSource();
  document.getElementById('cfBuffer').oninput = ()=>{ s.buffer = Math.max(0, Number(document.getElementById('cfBuffer').value)||0); update(); };
  document.getElementById('cfBuffer').onchange = ()=>save();
  update();
}

function paintCashflow(dyn, c){
  const pill = document.getElementById('cfPill');
  if(!c){ dyn.innerHTML = '<div class="empty">No data for this month.</div>'; return; }
  const dateLabel = (d, long)=>new Date(c.y, c.mo-1, d).toLocaleDateString('en-GB', long ? {weekday:'long',day:'numeric',month:'long'} : {weekday:'short',day:'numeric',month:'short'});
  const noItems = !c.events.length;
  const money = n => escapeHtml(fmt(n));
  const tone = {fine:'var(--green)', tight:'var(--amber)', short:'var(--red)'}[c.status];
  pill.className = 'cf-pill cf-'+c.status;
  pill.textContent = c.status==='short' ? `Short by ${fmt(-c.low.bal)}` : (c.status==='tight' ? 'Tight' : 'Looking fine');

  // headline
  let headline;
  const nextPayTxt = c.nextPay ? ` (${dateLabel(c.nextPay.day)})` : '';
  const lowDay = dateLabel(c.low.day);
  if(c.status==='short'){
    headline = `<b>You go below zero on ${dateLabel(c.firstNeg.day)}</b>${c.negDays.length>1 ? ` and stay there for ${c.negDays.length} day${c.negDays.length!==1?'s':''}` : ''}. At the worst point (${lowDay}) you'd be <b>${money(-c.low.bal)} short</b>${c.nextPay ? ` — just before payday${nextPayTxt}` : ''}.`;
  } else if(c.status==='tight'){
    headline = `<b>Lowest point: ${money(c.low.bal)} on ${lowDay}</b>${c.nextPay ? `, before payday${nextPayTxt}` : ''}. That's under your ${money(c.buffer)} buffer, so keep an eye on spending.`;
  } else {
    headline = `<b>You stay comfortably above your buffer.</b> Lowest point is ${money(c.low.bal)} on ${lowDay}${c.nextPay ? `, before payday${nextPayTxt}` : ''}.`;
  }
  const icon = c.status==='fine'
    ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${tone}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>`
    : c.status==='tight'
    ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${tone}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`
    : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${tone}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5"/><path d="M12 16.5h.01"/></svg>`;

  // fixes
  let fixesHtml = '';
  if(c.fixes){
    const f = c.fixes;
    const lines = [];
    if(f.big) lines.push(`<div class="cf-fix"><span class="cf-fix-n">1</span><span><b>${f.big.setAside ? `Hold off ${escapeHtml(f.big.name.toLowerCase())} until` : `Pay ${escapeHtml(f.big.name)}`} after payday</b>${f.big.setAside ? '' : ` instead of ${dateLabel(f.big.day)}`}. That clears <b>${money(f.bigAmt)}</b>.</span></div>`);
    if(f.trimPerDay>0 && f.canTrim) lines.push(`<div class="cf-fix"><span class="cf-fix-n">${f.big?2:1}</span><span><b>Trim everyday spending</b> from ${money(c.daily)} to ${money(f.newDaily)} a day. That clears about <b>${money(f.trimTotal)}</b>.</span></div>`);
    else if(f.trimPerDay>0) lines.push(`<div class="cf-fix"><span class="cf-fix-n">${f.big?2:1}</span><span>Trimming everyday spending alone can't cover the rest — you'd need an extra <b>${money(f.shortfall - f.bigAmt)}</b> in, or another bill moved.</span></div>`);
    if(f.big && f.trimPerDay>0 && f.canTrim) lines.push(`<div class="cf-fix"><span class="cf-fix-n cf-fix-ok">✓</span><span><b>Both together</b> and you bottom out at <b style="color:var(--green);">${f.leftover>=0?'+':'−'}${money(Math.abs(f.leftover))}</b> instead of −${money(f.shortfall)}.</span></div>`);
    if(f.big && f.trimPerDay===0) lines.push(`<div class="cf-fix"><span class="cf-fix-n cf-fix-ok">✓</span><span>That alone brings your lowest point to about <b style="color:var(--green);">${f.leftover>=0?'+':'−'}${money(Math.abs(f.leftover))}</b>.</span></div>`);
    fixesHtml = `<div class="cf-card"><div class="cf-card-title">Ways to close the gap</div><div class="cf-fixes">${lines.join('')}</div></div>`;
  }

  const stat = (k, v, sub, col) => `<div class="stat cf-stat"><div class="k">${k}</div><div class="v"${col?` style="color:${col};"`:''}>${v}</div><div class="s">${sub}</div></div>`;
  const endBal = c.series[c.series.length-1].bal;
  const stats = [
    stat('Lowest point', `${c.low.bal<0?'−':''}${money(Math.abs(c.low.bal))}`, `${dateLabel(c.low.day)}${c.nextPay ? ' · before payday' : ''}`, tone),
    c.nextPay ? stat('Next payday', `+${money(c.payAmount)}`, `${dateLabel(c.nextPay.day)} · ${c.isCurrent ? (c.nextPay.day-c.startDay===0?'today':`in ${c.nextPay.day-c.startDay} day${c.nextPay.day-c.startDay!==1?'s':''}`) : `${escapeHtml(c.nextPay.name)}`}`, 'var(--green)') : stat('Next payday', '—', 'no dated income found ahead'),
    stat(c.nextPay ? 'On payday' : 'Ends the month at', `${endBal<0?'−':''}${money(Math.abs(endBal))}`, c.nextPay ? 'once pay has landed' : 'on current plans', endBal<0?'var(--red)':''),
    c.status==='short' ? stat('Days below zero', String(c.negDays.length), `${dateLabel(c.negDays[0].day)} – ${dateLabel(c.negDays[c.negDays.length-1].day)}`, 'var(--red)') : ''
  ].join('');

  // events
  const rows = c.events.map(e=>`
    <div class="cf-ev${e.kind==='in'?' cf-ev-in':''}${e.after<0?' cf-ev-neg':''}">
      <span class="cf-ev-d">${dateLabel(e.day)}</span>
      <span class="cf-ev-n">${escapeHtml(e.name)}${e.late?'<span class="cf-late">Overdue</span>':''}${e.pay3?'<span class="cf-tagp3">Pay in 3</span>':''}</span>
      <span class="cf-ev-a" style="${e.kind==='in'?'color:var(--green);':''}">${e.kind==='in'?'+':'−'}${money(Math.abs(e.amount))}</span>
      <span class="cf-ev-b">→ ${e.after<0?'−':''}${money(Math.abs(e.after))}</span>
    </div>`);
  const showAll = cashflowShowAll;
  const evHtml = rows.length ? `<div class="cf-ev-list${showAll?'':' cf-collapsed'}">${rows.join('')}</div>${rows.length>3?`<button type="button" class="cf-showall" id="cfShowAll">${showAll?'Show fewer ▴':`Show all ${rows.length} ▾`}</button>`:''}` : '';

  const un = c.unplaced;
  const notes = [];
  if(un.outN) notes.push(`${un.outN} pending bill${un.outN!==1?'s':''} with no Day (${money(un.outAmt)})`);
  if(un.inN) notes.push(`${un.inN} income item${un.inN!==1?'s':''} with no schedule (${money(un.inAmt)})`);
  if(un.lateIn>0) notes.push(`${money(un.lateIn)} of income whose date has already passed`);
  const noteHtml = notes.length ? `<div class="cf-note"><b>Not on the chart:</b> ${notes.join(' · ')}. Give bills a Day (and income a schedule) in the Month Tracker to include them.</div>` : '';

  dyn.innerHTML = `
    <div class="cf-banner cf-b-${c.status}">${icon}<div>${headline}</div></div>
    ${c.noPay ? '<div class="cf-note" style="margin-bottom:12px;">No upcoming payday found, so this runs to the end of the month. Give your pay a date (or set up next month) and the forecast will run up to payday instead.</div>' : ''}
    ${noItems ? '<div class="cf-note" style="margin-bottom:12px;">No dated bills or income found before payday yet — the line below is just your balance minus everyday spending.</div>' : ''}
    <div class="cf-main">
      <div class="cf-chart">
        ${cashflowChartSvg(c)}
        <div class="cf-legend">
          <span><i class="cf-lg-line${c.isCurrent?' dash':''}"></i>Forecast</span>
          <span><i class="cf-lg-dot" style="border-color:var(--amber);"></i>Bill due</span>
          <span><i class="cf-lg-dot" style="background:var(--green);border-color:var(--green);"></i>Payday</span>
          ${c.status==='short' ? '<span><i class="cf-lg-sq"></i>Below zero</span>' : ''}
        </div>
      </div>
      <div class="cf-side">${stats}${fixesHtml}</div>
    </div>
    ${rows.length ? `<div class="cf-ev-title">Coming up</div>${evHtml}` : ''}
    ${noteHtml}`;

  const showAllBtn = document.getElementById('cfShowAll');
  if(showAllBtn) showAllBtn.onclick = ()=>{ cashflowShowAll = !cashflowShowAll; paintCashflow(dyn, c); };

  // hover / touch scrub on the chart
  const svg = document.getElementById('cfSvg'), overlay = document.getElementById('cfOverlay');
  if(svg && overlay){
    const L = Number(svg.dataset.l), R = Number(svg.dataset.r), VW = Number(svg.dataset.w);
    const guide = document.getElementById('cfGuide'), dot = document.getElementById('cfGuideDot');
    const vals = [c.opening, ...c.series.map(p=>p.bal)];
    // reuse the same scale as the chart by reading the polyline's points
    const poly = svg.querySelector('polyline').getAttribute('points').split(' ').map(p=>p.split(',').map(Number));
    const scrub = evt=>{
      const rect = svg.getBoundingClientRect();
      const px = (evt.clientX-rect.left)*(VW/rect.width);
      const x0 = c.startDay-1, day = Math.max(c.startDay, Math.min(c.endDay, x0+Math.round((px-L)/(R-L)*(c.endDay-x0))));
      const p = c.series.find(s=>s.day===day);
      const pt = poly[day-c.startDay+1];
      guide.setAttribute('x1', pt[0]); guide.setAttribute('x2', pt[0]); guide.setAttribute('opacity', .45);
      dot.setAttribute('cx', pt[0]); dot.setAttribute('cy', pt[1]); dot.setAttribute('opacity', 1);
      const evs = c.events.filter(e=>e.day===day);
      showChartTooltip(evt, `<div style="margin-bottom:3px;">${escapeHtml(dateLabel(day))}</div><div>Balance: <b>${p.bal<0?'−':''}${money(Math.abs(p.bal))}</b></div>${evs.map(e=>`<div style="color:var(--muted);font-weight:500;">${e.kind==='in'?'+':'−'}${money(Math.abs(e.amount))} ${escapeHtml(e.name)}</div>`).join('')}`, true, evt.pointerType==='touch' ? {x:evt.clientX, top:rect.top} : null);
    };
    const end = ()=>{ guide.setAttribute('opacity',0); dot.setAttribute('opacity',0); hideChartTooltip(); };
    overlay.addEventListener('pointermove', scrub);
    overlay.addEventListener('pointerdown', scrub);
    overlay.addEventListener('pointerleave', end);
    overlay.addEventListener('pointercancel', end);
  }
}

// ---------------- Pay in 3 page ----------------
let p3FormOpen = null;
function renderPay3(){
  syncPay3All();
  if(p3FormOpen===null) p3FormOpen = state.pay3.length===0;
  const el = document.getElementById('view-pay3');
  const sum = pay3Summary();
  const today = ymd(new Date());
  const fmtDate = str => parseYmd(str).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  const info = state.pay3.map(p=>{
    const paidCount = p.inst.filter((_,i)=>pay3Paid(p,i)).length;
    const nextIdx = p.inst.findIndex((_,i)=>!pay3Paid(p,i));
    return {p, paidCount, done: paidCount===p.inst.length, nextDate: nextIdx>=0 ? p.inst[nextIdx].date : '9999'};
  });
  const active = info.filter(x=>!x.done).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
  const completed = info.filter(x=>x.done);

  const card = ({p, paidCount, done})=>{
    const left = round2(p.inst.reduce((a,it,i)=>a + (pay3Paid(p,i) ? 0 : it.amount), 0));
    const pct = Math.round(paidCount/p.inst.length*100);
    const prov = PAY3_PROVIDERS[p.provider] ? PAY3_PROVIDERS[p.provider].label.split(' · ')[0] : 'Custom';
    return `<div class="panel p3-card${done?' p3-done':''}" data-plan="${p.id}">
      <div class="p3-head">
        <div class="p3-title"><span class="p3-name">${escapeHtml(p.name)}</span><span class="p3-badge">${escapeHtml(prov)}</span></div>
        <div class="p3-total">${fmt(p.total)}</div>
        <button class="del-btn p3-del" aria-label="Delete plan" title="Delete plan">✕</button>
      </div>
      <div class="p3-progress"><div class="p3-bar"><div class="p3-bar-fill" style="width:${pct}%;"></div></div>
        <div class="p3-progress-text">${done ? 'All paid ✓' : `${paidCount} of ${p.inst.length} paid · <b>${fmt(left)}</b> left`}</div></div>
      <div class="p3-insts">
        ${p.inst.map((it,i)=>{
          const paid = pay3Paid(p,i);
          const overdue = !paid && it.date < today;
          return `<div class="p3-inst${paid?' paid':''}${overdue?' overdue':''}">
            <span class="p3-dot">${paid?'✓':i+1}</span>
            <div class="p3-date">${fmtDate(it.date)}${overdue?'<span class="p3-tag">Overdue</span>':''}</div>
            <div class="p3-amt">${fmt(it.amount)}</div>
            <button type="button" class="btn secondary small p3-toggle" data-plan="${p.id}" data-i="${i}">${paid?'Paid ✓':'Mark paid'}</button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  };

  el.innerHTML = `
    <div class="trend-kpis p3-kpis">
      <div class="card trend-kpi"><div class="k">Still to pay</div><div class="v ${sum.owed>0?'neg':''}">${fmt(sum.owed)}</div><div class="sub">across ${sum.active} active plan${sum.active!==1?'s':''}</div></div>
      <div class="card trend-kpi"><div class="k">Next payment</div><div class="v">${sum.next ? fmt(sum.next.amount) : '—'}</div><div class="sub">${sum.next ? `${escapeHtml(sum.next.name)} · ${fmtDate(sum.next.date)}${sum.next.overdue?' · overdue':''}` : 'nothing due'}</div></div>
      <div class="card trend-kpi"><div class="k">Due this month</div><div class="v">${fmt(sum.dueThisMonth)}</div><div class="sub">still unpaid</div></div>
      <div class="card trend-kpi"><div class="k">Plans</div><div class="v">${info.length}</div><div class="sub">${completed.length} finished</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Add a plan</h2><button class="btn small ${p3FormOpen?'secondary':''}" id="p3FormToggle">${p3FormOpen?'Close':'+ New plan'}</button><span class="hint">instalments appear as bills in the month they're due</span></div>
      <div id="p3FormWrap" class="${p3FormOpen?'':'hidden'}">
      <div class="p3-form">
        <input type="text" id="p3Name" placeholder="What did you buy? (e.g. Headphones)">
        <select id="p3Provider">${Object.entries(PAY3_PROVIDERS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select>
        <label class="sv-amt"><span class="sv-cur">${escapeHtml(state.currency)}</span><input type="number" step="0.01" min="0" id="p3Total" placeholder="Total price"></label>
        <input type="date" id="p3Date" value="${today}" aria-label="First payment date">
        <div id="p3Custom" class="p3-custom hidden">
          <label>Instalments <input type="number" id="p3N" min="2" max="12" value="3"></label>
          <label>Every <select id="p3Every"><option value="14d">2 weeks</option><option value="28d">4 weeks</option><option value="month" selected>Month</option></select></label>
        </div>
        <label class="p3-check"><input type="checkbox" id="p3FirstPaid" checked> First payment already taken</label>
        <div class="p3-preview" id="p3Preview"></div>
        <button class="btn" id="p3Add">Add plan</button>
      </div>
      </div>
    </div>

    ${active.length ? `<div class="p3-section-title">Active</div>${active.map(card).join('')}` : ''}
    ${completed.length ? `<div class="p3-section-title">Finished</div>${completed.map(card).join('')}` : ''}
    ${!info.length ? '<div class="panel"><div class="empty">No plans yet — add a purchase above and each instalment will show up in your Month Tracker as a "Pay in 3" bill.</div></div>' : ''}
  `;

  // --- form
  const $ = id => document.getElementById(id);
  const readSchedule = ()=>{
    const prov = $('p3Provider').value;
    const total = Number($('p3Total').value);
    const n = prov==='custom' ? Math.max(2, Math.min(12, Math.round(Number($('p3N').value)||3))) : PAY3_PROVIDERS[prov].n;
    const every = prov==='custom' ? $('p3Every').value : PAY3_PROVIDERS[prov].every;
    if(!$('p3Date').value || !(total>0)) return {prov, total, n, every, inst:null};
    return {prov, total, n, every, inst: buildPay3Schedule(total, n, every, parseYmd($('p3Date').value), $('p3FirstPaid').checked)};
  };
  const updatePreview = ()=>{
    $('p3Custom').classList.toggle('hidden', $('p3Provider').value!=='custom');
    const r = readSchedule();
    $('p3Preview').innerHTML = r.inst
      ? `${r.n} × ${escapeHtml(fmt(r.inst[0].amount))}${r.inst.some(i=>i.amount!==r.inst[0].amount)?' (approx.)':''} · ${r.inst.map(i=>fmtDate(i.date).replace(/^\w+ /,'')).join(', ')}`
      : 'Enter the total and first payment date to see the schedule.';
  };
  ['p3Provider','p3Total','p3Date','p3N','p3Every','p3FirstPaid'].forEach(id=>{ $(id).addEventListener('input', updatePreview); $(id).addEventListener('change', updatePreview); });
  $('p3Date').addEventListener('change', ()=>{ $('p3FirstPaid').checked = $('p3Date').value <= today; updatePreview(); });
  updatePreview();
  $('p3FormToggle').onclick = ()=>{ p3FormOpen = !p3FormOpen; renderPay3(); };
  $('p3Add').onclick = ()=>{
    const r = readSchedule();
    if(!r.inst){ $('p3Total').focus(); return; }
    state.pay3.push({id:uid(), name: $('p3Name').value.trim() || 'Purchase', provider:r.prov, total:round2(r.total), every:r.every, inst:r.inst});
    syncPay3All();
    save();
    showToast('Plan added', `${r.n} instalments tracked`);
    p3FormOpen = false;
    renderPay3();
  };

  // --- cards
  el.querySelectorAll('.p3-toggle').forEach(b=>b.onclick = ()=>{
    const plan = state.pay3.find(x=>x.id===b.dataset.plan);
    if(!plan) return;
    const i = Number(b.dataset.i);
    setPay3Paid(plan, i, !pay3Paid(plan, i));
    renderPay3();
  });
  el.querySelectorAll('.p3-del').forEach(b=>b.onclick = ()=>{
    const id = b.closest('.p3-card').dataset.plan;
    const idx = state.pay3.findIndex(x=>x.id===id);
    if(idx<0) return;
    const plan = state.pay3[idx];
    removePay3Links(id);
    state.pay3.splice(idx, 1);
    save();
    renderPay3();
    showUndoToast(plan.name, ()=>{
      state.pay3.splice(Math.min(idx, state.pay3.length), 0, plan);
      syncPay3All();
      save();
      render();
    });
  });
}

// ---------------- Recurring costs summary (subscriptions overview) ----------------
const recurWhatIf = new Set();
// Recurring outgoings for the summary: this month's, plus any that only exist in later months.
function recurringSummaryItems(m){
  const own = m.outgoings.filter(o=>o.recurring && (Number(o.amount)||0)>0).map(o=>({...o, _from:null}));
  const other = [...recurringElsewhere(m, 'outgoings').values()].filter(({x})=>(Number(x.amount)||0)>0).map(({x,k})=>({...x, _from:k}));
  return [...own, ...other].sort((a,b)=>b.amount-a.amount);
}
function recurringSummaryHtml(m){
  const items = recurringSummaryItems(m);
  if(!items.length) return '';
  const monthly = round2(items.reduce((a,o)=>a+Number(o.amount),0));
  const subs = items.filter(o=>o.category==='Subscriptions');
  const subsMonthly = round2(subs.reduce((a,o)=>a+Number(o.amount),0));
  const max = items[0].amount;
  return `
    <div class="trend-kpis rc-kpis">
      <div class="card trend-kpi"><div class="k">Recurring / month</div><div class="v">${fmt(monthly)}</div><div class="sub">${items.length} recurring outgoing${items.length!==1?'s':''}</div></div>
      <div class="card trend-kpi"><div class="k">Recurring / year</div><div class="v">${fmt(monthly*12)}</div><div class="sub">if nothing changes</div></div>
      <div class="card trend-kpi"><div class="k">Subscriptions / year</div><div class="v">${fmt(subsMonthly*12)}</div><div class="sub">${subs.length} item${subs.length!==1?'s':''} · ${fmt(subsMonthly)} a month</div></div>
      <div class="card trend-kpi"><div class="k">Biggest</div><div class="v">${fmt(items[0].amount)}</div><div class="sub">${escapeHtml(items[0].name)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Where your recurring money goes</h2><span class="hint">tick any to see what you'd save by cancelling</span></div>
      <div class="rc-list">
        ${items.map(o=>`<label class="rc-row">
          <input type="checkbox" class="rc-check" data-id="${o.id}" ${recurWhatIf.has(o.id)?'checked':''}>
          ${catTile(o.category||'Uncategorized','sm')}
          <span class="rc-main"><span class="rc-name">${escapeHtml(o.name||'Unnamed')}${o._from?` <small class="rc-from">from ${escapeHtml(monthLabelFromKey(o._from).split(' ')[0])}</small>`:''}</span><span class="rc-bar"><span class="rc-bar-fill" style="width:${(o.amount/max*100).toFixed(1)}%;--c:${categoryColor(o.category||'Uncategorized')};"></span></span></span>
          <span class="rc-amts"><b>${escapeHtml(fmt(o.amount))}</b><small>${escapeHtml(fmt(o.amount*12))} / yr</small></span>
        </label>`).join('')}
      </div>
      <div class="rc-whatif" id="rcWhatIf"></div>
    </div>`;
}
function updateRecurWhatIf(m){
  const el = document.getElementById('rcWhatIf');
  if(!el) return;
  const items = recurringSummaryItems(m).filter(o=>recurWhatIf.has(o.id));
  const monthly = round2(items.reduce((a,o)=>a+(Number(o.amount)||0),0));
  el.innerHTML = items.length
    ? `Cancel ${items.length} and you'd save <b>${fmt(monthly)}</b> a month — <b>${fmt(monthly*12)}</b> a year.`
    : '';
}
function refreshRecurringSummary(){
  const box = document.getElementById('recurSummary');
  if(!box) return;
  const m = state.months[state.currentMonthKey];
  if(!m) return;
  // Forget ticks for items that no longer exist
  const ids = new Set(recurringSummaryItems(m).map(o=>o.id));
  [...recurWhatIf].forEach(id=>{ if(!ids.has(id)) recurWhatIf.delete(id); });
  box.innerHTML = recurringSummaryHtml(m);
  box.querySelectorAll('.rc-check').forEach(c=>c.onchange = ()=>{
    if(c.checked) recurWhatIf.add(c.dataset.id); else recurWhatIf.delete(c.dataset.id);
    updateRecurWhatIf(m);
  });
  updateRecurWhatIf(m);
}

  const afterEdit = e=>{ if(!e.target.closest('#recurSummary')) setTimeout(refreshRecurringSummary, 0); };

}

function exportJson(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  downloadBlob(blob, 'budget-tracker-backup.json');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}
function importJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.months) throw new Error('bad format');
      state = data;
      normalizeState();
      save();
      currentView='month';
      render();
    }catch(err){
      alert('Could not import this file — it doesn\'t look like an Embalance backup.');
    }
  };
  reader.readAsText(file);
}

// ---------------- Month recap ----------------
// Gathers the highlights for one tracked month: headline figures, its biggest
// category and single spend, and how spending compares to the month before.
function monthRecapData(key){
  const m = state.months[key];
  if(!m) return null;
  const t = monthTotals(m);
  const keys = Object.keys(state.months).sort();
  const idx = keys.indexOf(key);
  const prevKey = idx>0 ? keys[idx-1] : null;
  const pt = prevKey ? monthTotals(state.months[prevKey]) : null;
  const spent = round2(t.allOutgoing + t.weeklyTotal);
  const earned = t.allIncoming;
  const saved = round2(t.savingsAmount + t.stocksAmount);
  const net = round2(t.totalLeftOver - (Number(m.startingBalance)||0));
  const cats = categoryBreakdown(m, 'all');
  const catTotal = cats.reduce((s,r)=>s+r.amount,0);
  const topCat = cats[0] ? {...cats[0], pct: catTotal ? Math.round(cats[0].amount/catTotal*100) : 0} : null;
  const biggest = m.outgoings.filter(o=>(Number(o.amount)||0)>0).sort((a,b)=>b.amount-a.amount)[0] || null;
  const incomeRows = incomeBreakdown(m, 'all');
  const incomeTotal = incomeRows.reduce((a,r)=>a+r.amount,0);
  const topIncome = incomeRows[0] && incomeRows[0].category!=='Uncategorized' ? {...incomeRows[0], pct: incomeTotal ? Math.round(incomeRows[0].amount/incomeTotal*100) : 0} : null;
  const prevSpent = pt ? round2(pt.allOutgoing + pt.weeklyTotal) : null;
  const spendChangePct = prevSpent>=0.01 ? Math.round((spent-prevSpent)/prevSpent*100) : null;
  return {key, prevKey, spent, earned, saved, net, topCat, topIncome, biggest, spendChangePct, active: spent>0 || earned>0};
}

}

};
document.getElementById('themeSelect').onchange = e=>{
  state.theme = e.target.value;
  save(); render();
};

render();
if(bootstrapFromUrlIfNeeded()) render();
(function(){
  const p = activeProfileMeta();
  if(p && p.syncEnabled && p.syncCode) updateUrlHashForSyncCode(p.syncCode);
})();
syncActiveProfileFromCloud();
setInterval(renderSyncIndicator, 60000);

// Clears the app's cached files (service worker + Cache Storage, plus the browser's
// cached copy of this page) and reloads. Budget data lives in localStorage and
// Firestore, neither of which is touched.
async function forceRefresh(){
  const btn = document.getElementById('forceRefreshBtn');
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const names = await caches.keys();
      await Promise.all(names.map(n=>caches.delete(n)));
    }
    await fetch(location.pathname, {cache:'reload'});
  }catch(e){
    console.error('Force refresh partly failed', e);
  }
  location.reload();
}
document.getElementById('forceRefreshBtn').onclick = forceRefresh;

if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(hadController) showToast('Updated', 'Reload to get the latest version');
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Service worker registration failed', e));
  });
}
</script>
