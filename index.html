<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5b8cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1d2740; --border:#2a3552;
    --text:#e8ecf7; --muted:#8a93ab; --accent:#5b8cff; --accent2:#7c5bff;
    --green:#3ecf8e; --red:#ff5c7a; --amber:#ffb946;
    --radius:14px; --shadow:0 8px 24px rgba(0,0,0,0.35);
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="light"]{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#f0f2fa; --border:#e2e6f0;
    --text:#1a2033; --muted:#6b7186; --shadow:0 8px 24px rgba(30,40,80,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);transition:background .2s,color .2s;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .app{display:flex;min-height:100vh;}

  .sidebar{width:210px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:4px;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px 10px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:white;}
  .brand .name{font-weight:700;font-size:16px;}
  .brand .sub{font-size:11px;color:var(--muted);}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500;user-select:none;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--panel2);color:var(--text);}
  .nav-item.active{background:linear-gradient(135deg,rgba(91,140,255,.18),rgba(124,91,255,.18));color:var(--text);}
  .nav-item.active svg{color:var(--accent);}
  .sidebar-footer{margin-top:auto;padding:10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:8px;}

  .main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1150px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-size:22px;margin:0;}
  .month-switch{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px 8px;}
  .month-switch button{background:var(--panel2);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;}
  .month-switch button:hover{border-color:var(--accent);}
  .month-switch .label{font-weight:600;min-width:150px;text-align:center;font-size:14px;}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:white;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:rgba(255,92,122,.15);color:var(--red);border:1px solid rgba(255,92,122,.3);}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:8px;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  @media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .card.highlight{border-color:rgba(91,140,255,.5);background:linear-gradient(180deg,rgba(91,140,255,.08),var(--panel));}
  .card .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .card .v{font-size:21px;font-weight:700;}
  .card .v.pos{color:var(--green);}
  .card .v.neg{color:var(--red);}
  .card .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-head h2{font-size:15px;margin:0;font-weight:700;}
  .panel-head .hint{font-size:12px;color:var(--muted);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:8px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--panel2);}
  input[type=text],input[type=number],textarea{
    background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;width:100%;
  }
  select{
    background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;font-weight:600;cursor:pointer;
  }
  select.status-done{color:var(--green);border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.08);}
  select.status-none{color:var(--amber);border-color:rgba(255,185,70,.4);background:rgba(255,185,70,.06);}
  select.recur-yes{color:var(--accent);border-color:rgba(91,140,255,.5);background:rgba(91,140,255,.08);}
  select.recur-no{color:var(--muted);border-color:var(--border);background:var(--bg);}
  .row-input{border:none;background:transparent;padding:4px 6px;width:100%;}
  .row-input:focus{background:var(--panel2);border-radius:6px;}
  .amt-cell{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px;}
  .del-btn:hover{color:var(--red);background:rgba(255,92,122,.1);}

  .weekly-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:700px){.weekly-grid{grid-template-columns:repeat(2,1fr);}}
  .weekly-item label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  .weekly-item select{width:100%;}

  .field-inline{display:flex;gap:10px;align-items:center;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 10px;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;width:340px;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .legend-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .cat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;flex-shrink:0;}
  .cat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .cat-bar-label{width:150px;flex-shrink:0;font-size:13px;display:flex;align-items:center;}
  .cat-bar-track{flex:1;min-width:80px;background:var(--bg);border-radius:6px;height:16px;overflow:hidden;border:1px solid var(--border);}
  .cat-bar-fill{height:100%;border-radius:6px;transition:width .2s;}
  .cat-bar-amt{width:120px;flex-shrink:0;text-align:right;font-size:13px;font-weight:600;}
  .cat-bar-pct{color:var(--muted);font-weight:400;font-size:11.5px;}
  .seg-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .seg-btn{background:var(--panel2);border:none;color:var(--muted);padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .seg-btn.active{background:var(--accent);color:white;}
  @media (max-width:600px){
    .cat-bar-label{width:100%;}
    .cat-bar-amt{width:auto;margin-left:auto;}
  }
  .legend-item .dash{width:16px;height:0;border-top:2px dashed;flex-shrink:0;}
  .hidden{display:none !important;}
  .formula-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .formula-note b{color:var(--text);}
  .quick-add-panel{border-color:rgba(91,140,255,.4);background:linear-gradient(180deg,rgba(91,140,255,.06),var(--panel));}
  .quick-add-panel select{max-width:130px;}
  .month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
  .month-tile{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s,transform .1s;}
  .month-tile:hover{border-color:var(--accent);transform:translateY(-1px);}
  .month-tile.active{border-color:var(--accent);background:linear-gradient(180deg,rgba(91,140,255,.14),var(--panel2));}
  .month-tile .mt-name{font-weight:700;font-size:15px;}
  .month-tile .mt-year{font-size:11px;color:var(--muted);margin-bottom:10px;}
  .month-tile .mt-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .month-tile .mt-balance{font-size:16px;font-weight:700;margin-top:3px;}

  .hamburger-btn{display:none;background:var(--panel2);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;}
  .sidebar-backdrop.open{display:block;}

  @media (max-width:860px){
    .hamburger-btn{display:flex;}
    .sidebar{
      position:fixed;top:0;left:0;height:100vh;z-index:100;width:250px;
      transform:translateX(-100%);transition:transform .2s ease;
      box-shadow:0 0 30px rgba(0,0,0,.45);overflow-y:auto;
    }
    .sidebar.open{transform:translateX(0);}
    .main{max-width:100%;padding:16px 14px 50px;}
    .topbar{gap:10px;margin-bottom:16px;}
    .topbar h1{font-size:18px;}
    .month-switch{padding:5px 6px;}
    .month-switch .label{min-width:100px;font-size:12.5px;}
    .month-switch button{width:26px;height:26px;font-size:13px;}
    .btn{padding:8px 12px;font-size:12.5px;}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .card{padding:12px 13px;}
    .card .v{font-size:17px;}
    .card .v input{font-size:16px !important;}
    .panel{padding:14px 15px;}
    .panel-head{flex-wrap:wrap;row-gap:6px;}
    .panel-head .hint{width:100%;font-size:11px;}
    table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .weekly-grid{grid-template-columns:repeat(2,1fr);}
    .month-grid{grid-template-columns:repeat(2,1fr);}
    .field-inline{flex-direction:column;align-items:stretch;}
    .field-inline label{min-width:0 !important;}
    .field-inline select,.field-inline input{max-width:none !important;}

    /* Incoming/Outgoing/Recurring tables become stacked cards instead of a
       cramped, horizontally-scrolled grid — the name gets its own full-width
       line so it's actually readable, everything else wraps below it. */
    .responsive-table{display:block;overflow-x:visible;}
    .responsive-table thead{display:none;}
    .responsive-table tbody{display:block;}
    .responsive-table tr{
      display:flex;flex-wrap:wrap;gap:8px;align-items:center;
      background:var(--panel2);border:1px solid var(--border);border-radius:10px;
      padding:10px;margin-bottom:8px;
    }
    .responsive-table tr:hover td{background:transparent;}
    .responsive-table td{display:block;border:none;padding:0;width:auto;}
    .responsive-table td.cell-name{flex:1 1 100%;}
    .responsive-table td.cell-name input{font-size:15px;font-weight:600;}
    .responsive-table td:not(.cell-name):not(.cell-del){flex:1 1 90px;min-width:90px;}
    .responsive-table td.cell-del{flex:0 0 auto;margin-left:auto;}
    .responsive-table td[data-label]::before{content:attr(data-label);display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
    .responsive-table .empty{padding:14px 4px;}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
/* =========================================================
   BUDGET TRACKER — single-file local app

   Each incoming / outgoing item, and the savings amount, carries
   a status: 'none' (pending) or 'done' (actually happened).
   - Current Balance (live) = Starting Balance + done incoming
     - done outgoing - (savings if done). It updates the moment
     you flip an item's dropdown to "Done".
   - Total Left Over (projected) = Starting Balance + ALL incoming
     - weekly budget - ALL outgoing - savings, regardless of status.
     This is what carries forward as next month's Starting Balance.
   ========================================================= */
const DATA_KEY_BASE = 'budgetTracker.v5';
const PROFILES_META_KEY = 'budgetTracker.profiles';
function dataKeyFor(profileId){ return `${DATA_KEY_BASE}:${profileId}`; }

const OUTGOING_CATEGORIES = [
  'Uncategorized','Housing','Bills & Utilities','Groceries','Transport',
  'Subscriptions','Shopping','Eating Out','Health & Fitness','Entertainment',
  'Savings & Debt','Other'
];
const CATEGORY_COLORS = {
  'Uncategorized':'#8a93ab','Housing':'#5b8cff','Bills & Utilities':'#7c5bff',
  'Groceries':'#3ecf8e','Transport':'#36c5f0','Subscriptions':'#ffb946',
  'Shopping':'#ff5c7a','Eating Out':'#f2994a','Health & Fitness':'#00b894',
  'Entertainment':'#bb6bd9','Savings & Debt':'#e84393','Other':'#636e72'
};
function categoryColor(cat){ return CATEGORY_COLORS[cat] || CATEGORY_COLORS['Other']; }

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabelFromKey(k){
  const [y,m] = k.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-GB',{month:'long',year:'numeric'});
}
function shiftKey(k, delta){
  let [y,m] = k.split('-').map(Number);
  m += delta;
  while(m>12){m-=12;y++;}
  while(m<1){m+=12;y--;}
  return y+'-'+String(m).padStart(2,'0');
}

function blankMonth(startingBalance){
  return {
    startingBalance: round2(startingBalance||0),
    weekly: {
      week1:{amount:0, status:'none', recurring:false}, week2:{amount:0, status:'none', recurring:false},
      week3:{amount:0, status:'none', recurring:false}, week4:{amount:0, status:'none', recurring:false}
    },
    incoming: [],
    savings: {amount:0, status:'none'},
    stocks: {amount:0, status:'none'},
    outgoings: [],
    adjustment: 0
  };
}
function freshMonth(startingBalance){
  const m = blankMonth(startingBalance);
  m.incoming.push({id:uid(), name:'Pay', amount:0, status:'none', recurring:false});
  return m;
}
function carryForwardMonth(prevMonth, startingBalance){
  const m = blankMonth(startingBalance);
  m.incoming = prevMonth.incoming.filter(i=>i.recurring).map(i=>({id:uid(), name:i.name, amount:i.amount, status:'none', recurring:true}));
  m.outgoings = prevMonth.outgoings.filter(o=>o.recurring).map(o=>({id:uid(), name:o.name, amount:o.amount, status:'none', recurring:true, category:o.category||'Uncategorized'}));
  ['week1','week2','week3','week4'].forEach(wk=>{
    if(prevMonth.weekly[wk].recurring){
      m.weekly[wk] = {amount: prevMonth.weekly[wk].amount, status:'none', recurring:true};
    }
  });
  return m;
}
// Backfills recurring items/weeks from sourceMonth into an ALREADY-EXISTING targetMonth
// (e.g. it was created before an item was switched to Recurring). Never overwrites
// anything already present in targetMonth — only adds what's missing.
function syncRecurringForward(sourceMonth, targetMonth){
  const normName = s => (s||'').trim().toLowerCase();
  ['week1','week2','week3','week4'].forEach(wk=>{
    if(sourceMonth.weekly[wk].recurring && !targetMonth.weekly[wk].recurring){
      targetMonth.weekly[wk] = {amount: sourceMonth.weekly[wk].amount, status:'none', recurring:true};
    }
  });
  const targetIncomingNames = new Set(targetMonth.incoming.map(i=>normName(i.name)));
  sourceMonth.incoming.filter(i=>i.recurring).forEach(i=>{
    if(!targetIncomingNames.has(normName(i.name))){
      targetMonth.incoming.push({id:uid(), name:i.name, amount:i.amount, status:'none', recurring:true});
    }
  });
  const targetOutgoingNames = new Set(targetMonth.outgoings.map(o=>normName(o.name)));
  sourceMonth.outgoings.filter(o=>o.recurring).forEach(o=>{
    if(!targetOutgoingNames.has(normName(o.name))){
      targetMonth.outgoings.push({id:uid(), name:o.name, amount:o.amount, status:'none', recurring:true, category:o.category||'Uncategorized'});
    }
  });
}
function defaultState(){
  const now = new Date();
  const key = monthKey(now);
  const state = {
    currency: '£',
    theme: 'dark',
    currentMonthKey: key,
    months: {},
    pots: { savings:{manualLedger:[]}, stocks:{manualLedger:[]} }
  };
  state.months[key] = freshMonth(0);
  return state;
}
function normalizeState(){
  if(!state.pots) state.pots = {};
  if(!state.pots.savings) state.pots.savings = {manualLedger:[]};
  if(!state.pots.stocks) state.pots.stocks = {manualLedger:[]};
  Object.values(state.months).forEach(m=>{
    if(!m.stocks) m.stocks = {amount:0, status:'none'};
    if(typeof m.adjustment !== 'number') m.adjustment = 0;
    m.incoming.forEach(i=>{ if(typeof i.recurring !== 'boolean') i.recurring = false; });
    m.outgoings.forEach(o=>{ if(typeof o.recurring !== 'boolean') o.recurring = false; if(!o.category || !OUTGOING_CATEGORIES.includes(o.category)) o.category = 'Uncategorized'; });
    ['week1','week2','week3','week4'].forEach(wk=>{
      if(typeof m.weekly[wk].recurring !== 'boolean') m.weekly[wk].recurring = false;
    });
  });
}

// Keeps every month's Starting Balance in sync with the month before it, so any
// change anywhere (an edit, a Quick Add, marking something Done) ripples forward
// through every month that was already created after it.
function cascadeForward(){
  const keys = Object.keys(state.months).sort();
  for(let i=0; i<keys.length-1; i++){
    const cur = state.months[keys[i]], next = state.months[keys[i+1]];
    const newStart = round2(monthTotals(cur).totalLeftOver);
    if(next.startingBalance !== newStart) next.startingBalance = newStart;
  }
}
function save(){
  cascadeForward();
  state.__updatedAt = Date.now();
  localStorage.setItem(dataKeyFor(profilesMeta.activeId), JSON.stringify(state));
  pushToCloud();
}

function ensureMonth(key){
  if(!state.months[key]){
    const keys = Object.keys(state.months).sort();
    let prevKey = null;
    for(const k of keys){ if(k < key) prevKey = k; }
    if(prevKey){
      const startBal = monthTotals(state.months[prevKey]).totalLeftOver;
      state.months[key] = carryForwardMonth(state.months[prevKey], startBal);
    } else {
      state.months[key] = freshMonth(0);
    }
    save();
  }
  return state.months[key];
}
function monthTotals(m){
  const allIncoming = m.incoming.reduce((s,i)=>s+(Number(i.amount)||0),0);
  const doneIncoming = m.incoming.filter(i=>i.status==='done').reduce((s,i)=>s+(Number(i.amount)||0),0);
  const allOutgoing = m.outgoings.reduce((s,o)=>s+(Number(o.amount)||0),0);
  const doneOutgoing = m.outgoings.filter(o=>o.status==='done').reduce((s,o)=>s+(Number(o.amount)||0),0);
  const weekKeys = ['week1','week2','week3','week4'];
  const weeklyTotal = weekKeys.reduce((s,k)=>s+(Number(m.weekly[k].amount)||0),0);
  const doneWeekly = weekKeys.reduce((s,k)=>s+(m.weekly[k].status==='done' ? (Number(m.weekly[k].amount)||0) : 0),0);
  const savingsAmount = Number(m.savings.amount)||0;
  const doneSavings = m.savings.status==='done' ? savingsAmount : 0;
  const stocksAmount = Number(m.stocks.amount)||0;
  const doneStocks = m.stocks.status==='done' ? stocksAmount : 0;
  const adjustment = Number(m.adjustment)||0;

  const liveBalance = (Number(m.startingBalance)||0) + doneIncoming - doneOutgoing - doneSavings - doneStocks - doneWeekly + adjustment;
  const totalLeftOver = (Number(m.startingBalance)||0) + allIncoming - weeklyTotal - allOutgoing - savingsAmount - stocksAmount + adjustment;

  return {allIncoming, doneIncoming, allOutgoing, doneOutgoing, weeklyTotal, doneWeekly, savingsAmount, doneSavings, stocksAmount, doneStocks, adjustment, liveBalance, totalLeftOver};
}
// mode: 'all' = every outgoing regardless of status, 'done' = only what's actually been spent.
function categoryBreakdown(m, mode){
  const totals = {};
  m.outgoings.forEach(o=>{
    if(mode==='done' && o.status!=='done') return;
    const cat = o.category || 'Uncategorized';
    totals[cat] = (totals[cat]||0) + (Number(o.amount)||0);
  });
  const rows = Object.entries(totals).filter(([,amt])=>amt>0).map(([category,amount])=>({category, amount:round2(amount)}));
  rows.sort((a,b)=>b.amount-a.amount);
  return rows;
}

// ---------------- Pots (Savings / Stocks & Shares) ----------------
function potBalance(potKey){
  let auto = 0;
  Object.values(state.months).forEach(m=>{
    const item = potKey==='savings' ? m.savings : m.stocks;
    if(item && item.status==='done') auto += Number(item.amount)||0;
  });
  let manual = 0;
  (state.pots[potKey].manualLedger||[]).forEach(e=>{
    manual += (e.type==='in' ? (Number(e.amount)||0) : -(Number(e.amount)||0));
  });
  return auto + manual;
}
function potRows(potKey){
  const rows = [];
  Object.keys(state.months).sort().forEach(k=>{
    const m = state.months[k];
    const item = potKey==='savings' ? m.savings : m.stocks;
    if(item && item.status==='done' && Number(item.amount)>0){
      rows.push({month:k, type:'in', source:'auto', note: potKey==='savings' ? 'Add to Savings' : 'Move to Stocks & Shares', amount:Number(item.amount)});
    }
  });
  (state.pots[potKey].manualLedger||[]).forEach(e=>{
    rows.push({month:e.monthKey, type:e.type, source:e.source||'manual', note:e.note || (e.type==='in' ? 'Manual transfer in' : 'Transfer to Current Balance'), amount:e.amount, id:e.id});
  });
  rows.sort((a,b)=> (a.month||'').localeCompare(b.month||''));
  return rows;
}
// Running pot balance as of each month in monthKeys (chronological), for trend charts.
function potBalanceSeries(potKey, monthKeys){
  const monthDelta = {};
  potRows(potKey).forEach(r=>{
    monthDelta[r.month] = (monthDelta[r.month]||0) + (r.type==='in' ? r.amount : -r.amount);
  });
  let running = 0;
  return monthKeys.map(k=>{
    running += (monthDelta[k]||0);
    return running;
  });
}
// Planned/projected running pot balance: counts every month's Add-to-Savings /
// Move-to-Stocks amount whether or not it's been marked Done yet (assumes you
// stick to the budget), plus any manual transfers already made.
function potBalanceSeriesPlanned(potKey, monthKeys){
  const monthDelta = {};
  monthKeys.forEach(k=>{
    const m = state.months[k];
    const item = potKey==='savings' ? m.savings : m.stocks;
    const amt = Number(item.amount)||0;
    if(amt) monthDelta[k] = (monthDelta[k]||0) + amt;
  });
  (state.pots[potKey].manualLedger||[]).forEach(e=>{
    monthDelta[e.monthKey] = (monthDelta[e.monthKey]||0) + (e.type==='in' ? (Number(e.amount)||0) : -(Number(e.amount)||0));
  });
  let running = 0;
  return monthKeys.map(k=>{
    running += (monthDelta[k]||0);
    return running;
  });
}
function setPotBalance(potKey, newBalance){
  const current = potBalance(potKey);
  const delta = round2(newBalance - current);
  if(!delta) return;
  state.pots[potKey].manualLedger.push({
    id:uid(), type: delta>0?'in':'out', amount: Math.abs(delta),
    note:'Balance adjustment', monthKey: state.currentMonthKey, source:'adjustment'
  });
  save();
}
function addPotTransfer(potKey, type, amount, note){
  amount = round2(amount);
  if(!amount || amount<=0) return;
  const potLabel = potKey==='savings' ? 'Savings Pot' : 'Stocks & Shares Pot';
  const m = ensureMonth(state.currentMonthKey);
  const linkedItemId = uid();
  if(type==='out'){
    m.incoming.push({id:linkedItemId, name:`From ${potLabel}`, amount, status:'done', recurring:false});
  } else {
    m.outgoings.push({id:linkedItemId, name:`To ${potLabel}`, amount, status:'done', recurring:false, category:'Savings & Debt'});
  }
  state.pots[potKey].manualLedger.push({id:uid(), type, amount, note: note||'', monthKey: state.currentMonthKey, linkedItemId, source:'manual'});
  save();
}
function deletePotTransfer(potKey, entryId){
  const ledger = state.pots[potKey].manualLedger;
  const entry = ledger.find(e=>e.id===entryId);
  if(!entry) return;
  const m = state.months[entry.monthKey];
  if(m){
    if(entry.type==='out') m.incoming = m.incoming.filter(i=>i.id!==entry.linkedItemId);
    else m.outgoings = m.outgoings.filter(o=>o.id!==entry.linkedItemId);
  }
  state.pots[potKey].manualLedger = ledger.filter(e=>e.id!==entryId);
  save();
}

// ---------- tiny SVG line chart (no external deps) ----------
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
let chartTooltipEl = null;
function ensureChartTooltip(){
  if(chartTooltipEl) return chartTooltipEl;
  chartTooltipEl = document.createElement('div');
  chartTooltipEl.style.cssText = 'position:fixed;pointer-events:none;z-index:200;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow);display:none;white-space:nowrap;';
  document.body.appendChild(chartTooltipEl);
  return chartTooltipEl;
}
function showChartTooltip(evt, text){
  const t = ensureChartTooltip();
  t.textContent = text;
  t.style.display = 'block';
  const pad = 12;
  let left = evt.clientX + pad, top = evt.clientY - 14;
  const maxLeft = window.innerWidth - t.offsetWidth - pad;
  if(left > maxLeft) left = evt.clientX - t.offsetWidth - pad;
  t.style.left = Math.max(pad, left) + 'px';
  t.style.top = Math.max(pad, top) + 'px';
}
function hideChartTooltip(){
  if(chartTooltipEl) chartTooltipEl.style.display = 'none';
}
function lineChart(container, data, opts={}){
  // Accepts either a flat array of {x,y,label} (single series, default color)
  // or an array of series: {color, name, dashed, points:[{x,y,label}]}
  const isMulti = Array.isArray(data) && data.length>0 && data[0].points !== undefined;
  const series = isMulti ? data : [{color:'#5b8cff', points:data}];
  const w = opts.width||container.clientWidth||600, h = opts.height||240;
  const padL=54,padR=16,padT=16,padB=28;
  const allVals = series.flatMap(s=>s.points.map(p=>p.y));
  const maxV = Math.max(...allVals, 0), minV = Math.min(...allVals, 0);
  const rawRange = maxV - minV;
  const range = rawRange || 1;
  const n = series[0].points.length;
  const svg = svgEl('svg',{viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, style:'display:block'});
  const gridColor = getComputedStyle(document.body).getPropertyValue('--border').trim() || '#2a3552';
  const mutedColor = getComputedStyle(document.body).getPropertyValue('--muted').trim() || '#8a93ab';
  for(let i=0;i<=3;i++){
    const y = padT + (h-padT-padB)*i/3;
    svg.appendChild(svgEl('line',{x1:padL,y1:y,x2:w-padR,y2:y,stroke:gridColor,'stroke-width':1}));
    const val = rawRange===0 ? maxV : maxV - (range*i/3);
    const t = svgEl('text',{x:6,y:y+4,'font-size':10,fill:mutedColor}); t.textContent = state.currency+Math.round(val).toLocaleString();
    svg.appendChild(t);
  }
  const xStep = n>1 ? (w-padL-padR)/(n-1) : 0;
  const yFor = v => padT + (h-padT-padB)*(1-((v-minV)/range));

  series.forEach(s=>{
    let d='';
    s.points.forEach((p,i)=>{
      const x = padL + xStep*i;
      const y = yFor(p.y);
      d += (i===0?'M':'L')+x+','+y+' ';
    });
    const pathAttrs = {d, fill:'none', stroke:s.color||'#5b8cff', 'stroke-width':2.4, 'stroke-linejoin':'round','stroke-linecap':'round'};
    if(s.dashed) pathAttrs['stroke-dasharray'] = '6,4';
    svg.appendChild(svgEl('path', pathAttrs));
    s.points.forEach((p,i)=>{
      const x = padL + xStep*i;
      const y = yFor(p.y);
      const label = p.label || p.x;
      const tipText = s.name ? `${label} — ${s.name}: ${fmt(p.y)}` : `${label}: ${fmt(p.y)}`;
      const dot = svgEl('circle',{cx:x,cy:y,r:3,fill:s.color||'#5b8cff',style:'pointer-events:none;'});
      const onHover = evt => { showChartTooltip(evt, tipText); dot.setAttribute('r',5); };
      const onLeave = () => { hideChartTooltip(); dot.setAttribute('r',3); };
      const hit = svgEl('circle',{cx:x,cy:y,r:10,fill:'transparent',style:'cursor:pointer;'});
      hit.addEventListener('mouseenter', onHover);
      hit.addEventListener('mousemove', onHover);
      hit.addEventListener('mouseleave', onLeave);
      svg.appendChild(hit);
      svg.appendChild(dot);
    });
  });

  const maxLabels = Math.min(n, Math.floor(w/80));
  const step = Math.max(1, Math.round(n/maxLabels));
  series[0].points.forEach((p,i)=>{
    if(i%step!==0 && i!==n-1) return;
    const x = padL + xStep*i;
    // First/last labels anchor inward so they can't spill past the chart's own edge.
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    const t = svgEl('text',{x, y:h-8, 'font-size':10, fill:mutedColor, 'text-anchor':anchor});
    t.textContent = p.x;
    svg.appendChild(t);
  });
  container.innerHTML='';
  container.appendChild(svg);
}

  profileSel.onchange = e=>switchProfile(e.target.value);
  const titles = {month:'Month Tracker', calendar:'Calendar', trend:'Trend', recurring:'Recurring', pots:'Pots', settings:'Settings'};
  document.getElementById('viewTitle').textContent = titles[currentView];
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById('view-'+currentView).classList.remove('hidden');
  if(currentView==='month') renderMonth();
  if(currentView==='calendar') renderCalendar();
  if(currentView==='trend') renderTrend();
  if(currentView==='recurring') renderRecurring();
  if(currentView==='pots') renderPots();
  if(currentView==='settings') renderSettings();
}

// ---------------- Month Tracker ----------------
function renderMonth(){
  const m = ensureMonth(state.currentMonthKey);
  const t = monthTotals(m);
  const el = document.getElementById('view-month');
  el.innerHTML = `
    <div class="panel quick-add-panel">
      <div class="panel-head"><h2>Quick Add</h2><span class="hint">for one-off spends or money in — added as Done right away</span></div>
      <div class="field-inline" style="flex-wrap:wrap;">
        <select id="quickAddType">

          <option value="in">I received</option>

        <input type="number" step="0.01" id="quickAddAmount" placeholder="Amount" style="max-width:120px;">
        <input type="text" id="quickAddReason" placeholder="Reason (e.g. Bus, Pizza from Sam)" style="max-width:260px;flex:1;min-width:160px;">
        <select id="quickAddCategory" style="max-width:170px;">
          ${OUTGOING_CATEGORIES.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}

        <button class="btn small" id="quickAddBtn">+ Add</button>

      <button class="btn secondary small" id="quickAddLogToggle" style="margin-top:12px;">Show log</button>

          <tbody id="quickAddLogBody"></tbody>
        </table>
      </div>
    </div>

    <div class="grid">

      <div class="card highlight"><div class="k">Current Balance</div><div class="v"><input type="number" step="0.01" id="liveBalanceInput" value="${t.liveBalance}" style="font-size:19px;font-weight:700;padding:4px 6px;color:${t.liveBalance>=0?'var(--green)':'var(--red)'};"></div><div class="sub" id="liveBalanceSub">${t.adjustment ? `${fmt(t.adjustment)} manual adjustment · <a href="#" id="clearAdjustment" style="color:var(--red);text-decoration:underline;">clear</a>` : 'edit directly for deviations — updates as items are marked Done'}</div></div>
      <div class="card"><div class="k">Total Left Over</div><div class="v ${t.totalLeftOver>=0?'pos':'neg'}" id="totalLeftOverVal">${fmt(t.totalLeftOver)}</div><div class="sub">→ next month's starting balance</div></div>
      <div class="card"><div class="k">Incoming</div><div class="v pos" id="incomingVal">${fmt(t.allIncoming)}</div><div class="sub" id="incomingSub">${fmt(t.doneIncoming)} done</div></div>
      <div class="card"><div class="k">Weekly Budget</div><div class="v neg" id="weeklyVal">${fmt(t.weeklyTotal)}</div><div class="sub" id="weeklySub">${fmt(t.doneWeekly)} done</div></div>
      <div class="card"><div class="k">Outgoings</div><div class="v neg" id="outgoingVal">${fmt(t.allOutgoing)}</div><div class="sub" id="outgoingSub">${fmt(t.doneOutgoing)} done</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Weekly Budget</h2><span class="hint">amount for each week of the month</span></div>
      <div class="weekly-grid">
        ${['week1','week2','week3','week4'].map((wk,i)=>`
          <div class="weekly-item">
            <label>Week ${i+1}</label>
            <input type="number" step="0.01" class="week-input" data-week="${wk}" value="${m.weekly[wk].amount}" style="margin-bottom:8px;">
            <select class="week-status status-select status-${m.weekly[wk].status}" data-week="${wk}" style="margin-bottom:8px;">
              <option value="none" ${m.weekly[wk].status==='none'?'selected':''}>None</option>
              <option value="done" ${m.weekly[wk].status==='done'?'selected':''}>Done</option>
            </select>
            <select class="week-recur recur-select ${m.weekly[wk].recurring?'recur-yes':'recur-no'}" data-week="${wk}">
              <option value="no" ${!m.weekly[wk].recurring?'selected':''}>One-off</option>
              <option value="yes" ${m.weekly[wk].recurring?'selected':''}>Recurring</option>
            </select>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Incoming</h2>
        <button class="btn small" id="addIncomeBtn">+ Add incoming</button>
      </div>
      <table class="responsive-table">
        <thead><tr><th>Source</th><th style="width:120px;">Amount</th><th style="width:100px;">Status</th><th style="width:110px;">Recurring</th><th style="width:36px;"></th></tr></thead>
        <tbody id="incomeBody"></tbody>
      </table>

    <div class="panel">
      <div class="panel-head"><h2>Add to Savings</h2></div>
      <div class="field-inline">
        <label style="font-size:12px;color:var(--muted);min-width:170px;">Moving into savings this month</label>
        <input type="number" step="0.01" id="savingsInput" value="${m.savings.amount}" style="max-width:180px;">
        ${statusSelectHtml('savings-status', m.savings.status)}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Move to Stocks &amp; Shares</h2></div>
      <div class="field-inline">
        <label style="font-size:12px;color:var(--muted);min-width:170px;">Moving into stocks &amp; shares this month</label>
        <input type="number" step="0.01" id="stocksInput" value="${m.stocks.amount}" style="max-width:180px;">
        ${statusSelectHtml('stocks-status', m.stocks.status)}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Outgoings</h2>
        <button class="btn small" id="addOutgoingBtn">+ Add outgoing</button>
      </div>
      <table class="responsive-table">
        <thead><tr><th>Name</th><th style="width:140px;">Category</th><th style="width:120px;">Amount</th><th style="width:100px;">Status</th><th style="width:110px;">Recurring</th><th style="width:36px;"></th></tr></thead>
        <tbody id="outgoingBody"></tbody>
      </table>
      <div class="formula-note">
        <b>Current Balance</b> = Starting Balance + Incoming marked Done − Weekly Budget marked Done − Outgoings marked Done − Savings (if Done) − Stocks &amp; Shares (if Done).<br>
        <b>Total Left Over</b> = Starting Balance + all Incoming − Weekly Budget − all Outgoings − Savings − Stocks &amp; Shares (regardless of status) — this becomes next month's Starting Balance.
      </div>
    </div>
  `;

  const quickAddAmount = document.getElementById('quickAddAmount');
  const quickAddReason = document.getElementById('quickAddReason');
  const quickAddType = document.getElementById('quickAddType');
  const quickAddCategory = document.getElementById('quickAddCategory');
  const syncQuickAddCategoryVisibility = ()=>{
    quickAddCategory.style.display = quickAddType.value==='out' ? '' : 'none';
  };
  syncQuickAddCategoryVisibility();
  quickAddType.onchange = syncQuickAddCategoryVisibility;
  const doQuickAdd = ()=>{
    const amt = Number(quickAddAmount.value);
    if(!amt || amt<=0) return;
    const reason = quickAddReason.value.trim();
    const type = quickAddType.value;
    const entry = {id:uid(), name: reason || (type==='out'?'Spent':'Received'), amount: amt, status:'done', recurring:false, quickAdd:true, ts:Date.now()};
    if(type==='out'){ entry.category = quickAddCategory.value; m.outgoings.push(entry); } else m.incoming.push(entry);
    save();
    quickAddLogExpanded = true;
    renderMonth();
  };
  document.getElementById('quickAddBtn').onclick = doQuickAdd;
  [quickAddAmount, quickAddReason].forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doQuickAdd(); });
  });

  const quickAddLogToggle = document.getElementById('quickAddLogToggle');
  const quickAddLogWrap = document.getElementById('quickAddLogWrap');
  quickAddLogToggle.onclick = ()=>{
    quickAddLogExpanded = !quickAddLogExpanded;
    applyQuickAddLogState();
  };
  function applyQuickAddLogState(){
    const count = m.incoming.filter(i=>i.quickAdd).length + m.outgoings.filter(o=>o.quickAdd).length;
    quickAddLogWrap.classList.toggle('hidden', !quickAddLogExpanded);
    quickAddLogToggle.textContent = (quickAddLogExpanded ? '▾ Hide log' : '▸ Show log') + (count ? ` (${count})` : '');
  }
  function drawQuickAddLog(){
    applyQuickAddLogState();
    const body = document.getElementById('quickAddLogBody');
    const entries = [
      ...m.incoming.filter(i=>i.quickAdd).map(i=>({...i, kind:'in'})),
      ...m.outgoings.filter(o=>o.quickAdd).map(o=>({...o, kind:'out'}))
    ].sort((a,b)=>(b.ts||0)-(a.ts||0));
    body.innerHTML = entries.length ? entries.map(e=>`
      <tr data-id="${e.id}" data-kind="${e.kind}">
        <td>${e.kind==='in' ? '<span style="color:var(--green);">In</span>' : '<span style="color:var(--red);">Out</span>'}</td>
        <td>${e.kind==='out' ? `<span class="cat-dot" style="background:${categoryColor(e.category)};"></span>` : ''}${escapeHtml(e.name)}</td>
        <td class="amt-cell">${fmt(e.amount)}</td>
        <td><button class="del-btn quick-log-del">✕</button></td>
      </tr>
    `).join('') : `<tr><td colspan="4" class="empty">No quick adds yet this month</td></tr>`;
    body.querySelectorAll('tr').forEach(tr=>{
      const btn = tr.querySelector('.quick-log-del');
      if(!btn) return;
      btn.onclick = ()=>{
        const id = tr.dataset.id, kind = tr.dataset.kind;
        if(kind==='in') m.incoming = m.incoming.filter(x=>x.id!==id);
        else m.outgoings = m.outgoings.filter(x=>x.id!==id);
        save();
        renderMonth();
      };
    });
  }
  drawQuickAddLog();

  document.getElementById('startingBalanceInput').oninput = e=>{ m.startingBalance = Number(e.target.value); save(); refreshCards(); };
  const liveBalanceInput = document.getElementById('liveBalanceInput');
  const commitBalanceEdit = e=>{
    const newVal = Number(e.target.value);
    const currentLive = monthTotals(m).liveBalance;
    const delta = round2(newVal - currentLive);
    if(delta){ m.adjustment = round2((Number(m.adjustment)||0) + delta); save(); }
    refreshCards();
  };
  liveBalanceInput.onchange = commitBalanceEdit;
  liveBalanceInput.addEventListener('keydown', e=>{ if(e.key==='Enter') e.target.blur(); });
  const clearAdjustmentLink = document.getElementById('clearAdjustment');
  if(clearAdjustmentLink){
    clearAdjustmentLink.onclick = e=>{
      e.preventDefault();
      m.adjustment = 0; save(); renderMonth();
    };
  }
  el.querySelectorAll('.week-input').forEach(inp=>{
    inp.oninput = e=>{ m.weekly[e.target.dataset.week].amount = Number(e.target.value); save(); refreshCards(); };
  });
  el.querySelectorAll('.week-status').forEach(sel=>{
    sel.onchange = e=>{
      const wk = e.target.dataset.week;
      m.weekly[wk].status = e.target.value; save();
      e.target.className = `week-status status-select status-${e.target.value}`;
      refreshCards();
    };
  });
  el.querySelectorAll('.week-recur').forEach(sel=>{
    sel.onchange = e=>{
      const wk = e.target.dataset.week;
      m.weekly[wk].recurring = (e.target.value==='yes'); save();
      e.target.className = `week-recur recur-select ${m.weekly[wk].recurring?'recur-yes':'recur-no'}`;
    };
  });
  document.getElementById('savingsInput').oninput = e=>{ m.savings.amount = Number(e.target.value); save(); refreshCards(); };
  const savingsStatusSel = el.querySelector('.savings-status');
  savingsStatusSel.onchange = e=>{
    m.savings.status = e.target.value; save();
    e.target.className = `savings-status status-select status-${e.target.value}`;
    refreshCards();
  };
  document.getElementById('stocksInput').oninput = e=>{ m.stocks.amount = Number(e.target.value); save(); refreshCards(); };
  const stocksStatusSel = el.querySelector('.stocks-status');
  stocksStatusSel.onchange = e=>{
    m.stocks.status = e.target.value; save();
    e.target.className = `stocks-status status-select status-${e.target.value}`;
    refreshCards();
  };

  const incomeBody = document.getElementById('incomeBody');
  function drawIncome(){
    incomeBody.innerHTML = m.incoming.map(i=>`
      <tr data-id="${i.id}">
        <td class="cell-name"><input class="row-input inc-name" type="text" value="${escapeHtml(i.name)}"></td>
        <td data-label="Amount"><input class="row-input inc-amount amt-cell" type="number" step="0.01" value="${i.amount}"></td>
        <td data-label="Status">${statusSelectHtml('inc-status', i.status)}</td>
        <td data-label="Recurring">${recurringSelectHtml('inc-recur', i.recurring)}</td>
        <td class="cell-del"><button class="del-btn inc-del">✕</button></td>
      </tr>
    `).join('') || `<tr><td colspan="5" class="empty">No incoming added yet</td></tr>`;
    incomeBody.querySelectorAll('tr').forEach(tr=>{
      const id = tr.dataset.id;
      const item = m.incoming.find(x=>x.id===id);
      if(!item) return;
      tr.querySelector('.inc-name').oninput = e=>{ item.name=e.target.value; save(); };
      tr.querySelector('.inc-amount').oninput = e=>{ item.amount=Number(e.target.value); save(); refreshCards(); };
      const sel = tr.querySelector('.inc-status');
      sel.onchange = e=>{ item.status=e.target.value; save(); e.target.className = `inc-status status-select status-${e.target.value}`; refreshCards(); };
      const recurSel = tr.querySelector('.inc-recur');
      recurSel.onchange = e=>{ item.recurring = (e.target.value==='yes'); save(); e.target.className = `inc-recur recur-select ${item.recurring?'recur-yes':'recur-no'}`; };
      tr.querySelector('.inc-del').onclick = ()=>{ m.incoming = m.incoming.filter(x=>x.id!==id); save(); drawIncome(); refreshCards(); };
    });
  }
  drawIncome();
  document.getElementById('addIncomeBtn').onclick = ()=>{
    m.incoming.push({id:uid(), name:'New income', amount:0, status:'none', recurring:false});
    save(); drawIncome(); refreshCards();
  };

  const outgoingBody = document.getElementById('outgoingBody');
  function drawOutgoings(){
    outgoingBody.innerHTML = m.outgoings.map(o=>`
      <tr data-id="${o.id}">
        <td class="cell-name"><input class="row-input out-name" type="text" value="${escapeHtml(o.name)}"></td>
        <td data-label="Category">${categorySelectHtml('out-category', o.category)}</td>
        <td data-label="Amount"><input class="row-input out-amount amt-cell" type="number" step="0.01" value="${o.amount}"></td>
        <td data-label="Status">${statusSelectHtml('out-status', o.status)}</td>
        <td data-label="Recurring">${recurringSelectHtml('out-recur', o.recurring)}</td>
        <td class="cell-del"><button class="del-btn out-del">✕</button></td>
      </tr>
    `).join('') || `<tr><td colspan="6" class="empty">No outgoings added yet</td></tr>`;
    outgoingBody.querySelectorAll('tr').forEach(tr=>{
      const id = tr.dataset.id;
      const item = m.outgoings.find(x=>x.id===id);
      if(!item) return;
      tr.querySelector('.out-name').oninput = e=>{ item.name=e.target.value; save(); };
      tr.querySelector('.out-amount').oninput = e=>{ item.amount=Number(e.target.value); save(); refreshCards(); };
      const sel = tr.querySelector('.out-status');
      sel.onchange = e=>{ item.status=e.target.value; save(); e.target.className = `out-status status-select status-${e.target.value}`; refreshCards(); };
      const recurSel = tr.querySelector('.out-recur');
      recurSel.onchange = e=>{ item.recurring = (e.target.value==='yes'); save(); e.target.className = `out-recur recur-select ${item.recurring?'recur-yes':'recur-no'}`; };
      const catSel = tr.querySelector('.out-category');
      catSel.onchange = e=>{ item.category = e.target.value; save(); e.target.style.borderLeftColor = categoryColor(item.category); };
      tr.querySelector('.out-del').onclick = ()=>{ m.outgoings = m.outgoings.filter(x=>x.id!==id); save(); drawOutgoings(); refreshCards(); };
    });
  }
  drawOutgoings();
  document.getElementById('addOutgoingBtn').onclick = ()=>{
    m.outgoings.push({id:uid(), name:'New outgoing', amount:0, status:'none', recurring:false, category:'Uncategorized'});
    save(); drawOutgoings(); refreshCards();
  };

  function refreshCards(){
    const t2 = monthTotals(m);
    const lbInput = document.getElementById('liveBalanceInput');
    if(document.activeElement !== lbInput) lbInput.value = t2.liveBalance;
    lbInput.style.color = t2.liveBalance>=0 ? 'var(--green)' : 'var(--red)';
    const lbSub = document.getElementById('liveBalanceSub');
    lbSub.innerHTML = t2.adjustment ? `${fmt(t2.adjustment)} manual adjustment · <a href="#" id="clearAdjustment" style="color:var(--red);text-decoration:underline;">clear</a>` : 'edit directly for deviations — updates as items are marked Done';
    const clearLink = document.getElementById('clearAdjustment');
    if(clearLink){
      clearLink.onclick = e=>{ e.preventDefault(); m.adjustment = 0; save(); renderMonth(); };
    }
    const tlo = document.getElementById('totalLeftOverVal');
    tlo.textContent = fmt(t2.totalLeftOver);
    tlo.className = 'v ' + (t2.totalLeftOver>=0?'pos':'neg');
    document.getElementById('incomingVal').textContent = fmt(t2.allIncoming);
    document.getElementById('incomingSub').textContent = `${fmt(t2.doneIncoming)} done`;
    document.getElementById('weeklyVal').textContent = fmt(t2.weeklyTotal);
    document.getElementById('weeklySub').textContent = `${fmt(t2.doneWeekly)} done`;
    document.getElementById('outgoingVal').textContent = fmt(t2.allOutgoing);
    document.getElementById('outgoingSub').textContent = `${fmt(t2.doneOutgoing)} done`;
  }
}

// ---------------- Calendar ----------------
function renderCalendar(){
  const el = document.getElementById('view-calendar');
  const keys = Object.keys(state.months).sort();
  if(!keys.length){
    el.innerHTML = '<div class="panel"><div class="empty">No months tracked yet — head to Month Tracker to get started.</div></div>';
    return;
  }
  const byYear = {};
  keys.forEach(k=>{
    const year = k.split('-')[0];
    (byYear[year] = byYear[year]||[]).push(k);
  });
  const years = Object.keys(byYear).sort();
  el.innerHTML = years.map(year=>`
    <div class="panel">
      <div class="panel-head"><h2>${year}</h2><span class="hint">${byYear[year].length} month${byYear[year].length!==1?'s':''} tracked</span></div>
      <div class="month-grid">
        ${byYear[year].map(k=>{
          const m = state.months[k]; const t = monthTotals(m);
          const monthName = monthLabelFromKey(k).split(' ')[0];
          const isActive = k===state.currentMonthKey;
          return `
            <div class="month-tile ${isActive?'active':''}" data-key="${k}">
              <div class="mt-name">${monthName}</div>
              <div class="mt-year">${year}</div>
              <div class="mt-label">Current Balance</div>
              <div class="mt-balance" style="color:${t.liveBalance>=0?'var(--green)':'var(--red)'};">${fmt(t.liveBalance)}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.month-tile').forEach(tile=>{
    tile.onclick = ()=>{
      state.currentMonthKey = tile.dataset.key;
      currentView = 'month';
      save();
      render();
    };
  });
}

// ---------------- Trend ----------------
function renderTrend(){
  const el = document.getElementById('view-trend');
  const keys = Object.keys(state.months).sort();
  const savingsSeries = potBalanceSeries('savings', keys);
  const stocksSeries = potBalanceSeries('stocks', keys);
  const plannedSavingsSeries = potBalanceSeriesPlanned('savings', keys);
  const plannedStocksSeries = potBalanceSeriesPlanned('stocks', keys);
  const liveBalances = keys.map(k=>monthTotals(state.months[k]).liveBalance);
  const totalLeftOvers = keys.map(k=>monthTotals(state.months[k]).totalLeftOver);
  const monthLabels = keys.map(k=>monthLabelFromKey(k));
  const shortLabels = monthLabels.map(l=>l.slice(0,6));

  const actualNetWorth = keys.map((k,i)=>round2(liveBalances[i] + savingsSeries[i] + stocksSeries[i]));

  el.innerHTML = `
    <div class="panel">

    <div class="panel">

        <div class="legend-item"><span class="dot" style="background:#5b8cff;"></span>Actual — only what's marked Done</div>

    <div class="panel">

    document.getElementById('savingsPotChart').innerHTML = '<div class="empty">Track at least two months to see a trend line.</div>';
    document.getElementById('stocksPotChart').innerHTML = '<div class="empty">Track at least two months to see a trend line.</div>';
  } else {
    const points = keys.map((k,i)=>({x: shortLabels[i], label: monthLabels[i], y: totalLeftOvers[i]}));
    lineChart(document.getElementById('trendChart'), points, {height:220});
    lineChart(document.getElementById('netWorthChart'), [
      {color:'#5b8cff', name:'Actual', points: keys.map((k,i)=>({x:shortLabels[i], label:monthLabels[i], y:actualNetWorth[i]}))},
      {color:'#3ecf8e', name:'Projected', dashed:true, points: keys.map((k,i)=>({x:shortLabels[i], label:monthLabels[i], y:projectedNetWorth[i]}))}
    ], {height:240});
    lineChart(document.getElementById('savingsPotChart'), [
      {color:'#5b8cff', name:'Actual', points: keys.map((k,i)=>({x:shortLabels[i], label:monthLabels[i], y:savingsSeries[i]}))},
      {color:'#3ecf8e', name:'Projected', dashed:true, points: keys.map((k,i)=>({x:shortLabels[i], label:monthLabels[i], y:plannedSavingsSeries[i]}))}
    ], {height:200});
    lineChart(document.getElementById('stocksPotChart'), [
      {color:'#5b8cff', name:'Actual', points: keys.map((k,i)=>({x:shortLabels[i], label:monthLabels[i], y:stocksSeries[i]}))},
      {color:'#3ecf8e', name:'Projected', dashed:true, points: keys.map((k,i)=>({x:shortLabels[i], label:monthLabels[i], y:plannedStocksSeries[i]}))}
    ], {height:200});
  }
  renderCategoryBreakdown();
}
function renderCategoryBreakdown(){
  const keys = Object.keys(state.months).sort();
  if(!categoryBreakdownMonth || !keys.includes(categoryBreakdownMonth)){
    categoryBreakdownMonth = keys.includes(state.currentMonthKey) ? state.currentMonthKey : (keys[keys.length-1]||null);
  }
  const monthSel = document.getElementById('catBreakdownMonth');
  monthSel.innerHTML = keys.map(k=>`<option value="${k}" ${k===categoryBreakdownMonth?'selected':''}>${monthLabelFromKey(k)}</option>`).join('');
  monthSel.onchange = e=>{ categoryBreakdownMonth = e.target.value; renderCategoryBreakdown(); };
  document.querySelectorAll('.seg-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.mode===categoryBreakdownMode);
    b.onclick = ()=>{ categoryBreakdownMode = b.dataset.mode; renderCategoryBreakdown(); };
  });
  const bars = document.getElementById('catBreakdownBars');
  const totalEl = document.getElementById('catBreakdownTotal');
  if(!categoryBreakdownMonth){
    bars.innerHTML = '<div class="empty">No months tracked yet.</div>';
    totalEl.textContent = '';
    return;
  }
  const m = state.months[categoryBreakdownMonth];
  const rows = categoryBreakdown(m, categoryBreakdownMode);
  const total = rows.reduce((s,r)=>s+r.amount,0);
  totalEl.textContent = rows.length ? `${fmt(total)} ${categoryBreakdownMode==='done'?'spent so far':'budgeted'}` : '';
  if(!rows.length){
    bars.innerHTML = '<div class="empty">No outgoings for this month yet.</div>';
    return;
  }
  const max = Math.max(...rows.map(r=>r.amount));
  bars.innerHTML = rows.map(r=>`
    <div class="cat-bar-row">
      <div class="cat-bar-label"><span class="cat-dot" style="background:${categoryColor(r.category)};"></span>${escapeHtml(r.category)}</div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${max?(r.amount/max*100).toFixed(1):0}%;background:${categoryColor(r.category)};"></div></div>
      <div class="cat-bar-amt">${fmt(r.amount)} <span class="cat-bar-pct">(${total?Math.round(r.amount/total*100):0}%)</span></div>
    </div>
  `).join('');
}

// ---------------- Recurring ----------------
function recurringTableHtml(kind){
  const label = kind==='incoming' ? 'Source' : 'Name';
  const catTh = kind==='outgoing' ? '<th style="width:140px;">Category</th>' : '';
  return `
    <table class="responsive-table">
      <thead><tr><th>${label}</th>${catTh}<th style="width:120px;">Amount</th><th style="width:100px;">Status</th><th style="width:36px;"></th></tr></thead>
      <tbody class="recur-body-${kind}"></tbody>
    </table>
  `;
}
function drawRecurringTable(m, kind){
  const list = kind==='incoming' ? m.incoming : m.outgoings;
  const body = document.querySelector(`.recur-body-${kind}`);
  const items = list.filter(x=>x.recurring);
  const colspan = kind==='outgoing' ? 5 : 4;
  body.innerHTML = items.map(x=>`
    <tr data-id="${x.id}">
      <td class="cell-name"><input class="row-input recur-name-${kind}" type="text" value="${escapeHtml(x.name)}"></td>
      ${kind==='outgoing' ? `<td data-label="Category">${categorySelectHtml(`recur-category-${kind}`, x.category)}</td>` : ''}
      <td data-label="Amount"><input class="row-input recur-amount-${kind} amt-cell" type="number" step="0.01" value="${x.amount}"></td>
      <td data-label="Status">${statusSelectHtml(`recur-status-${kind}`, x.status)}</td>
      <td class="cell-del"><button class="del-btn recur-del-${kind}">✕</button></td>
    </tr>
  `).join('') || `<tr><td colspan="${colspan}" class="empty">No recurring ${kind==='incoming'?'incoming':'outgoings'} yet</td></tr>`;
  body.querySelectorAll('tr').forEach(tr=>{
    const id = tr.dataset.id;
    const item = list.find(x=>x.id===id);
    if(!item) return;
    tr.querySelector(`.recur-name-${kind}`).oninput = e=>{ item.name=e.target.value; save(); };
    tr.querySelector(`.recur-amount-${kind}`).oninput = e=>{ item.amount=Number(e.target.value); save(); };
    const sel = tr.querySelector(`.recur-status-${kind}`);
    sel.onchange = e=>{ item.status=e.target.value; save(); e.target.className = `recur-status-${kind} status-select status-${e.target.value}`; };
    const catSel = tr.querySelector(`.recur-category-${kind}`);
    if(catSel) catSel.onchange = e=>{ item.category = e.target.value; save(); e.target.style.borderLeftColor = categoryColor(item.category); };
    tr.querySelector(`.recur-del-${kind}`).onclick = ()=>{
      if(kind==='incoming') m.incoming = m.incoming.filter(x=>x.id!==id);
      else m.outgoings = m.outgoings.filter(x=>x.id!==id);
      save(); renderRecurring();
    };
  });
}
function renderRecurring(){
  const m = ensureMonth(state.currentMonthKey);
  const el = document.getElementById('view-recurring');
  el.innerHTML = `
    <div class="formula-note" style="margin-bottom:18px;">
      Anything marked <b>Recurring</b> carries into every new month automatically — same name and amount, Status reset to None — until you switch it to One-off or delete it. Editing an item here edits it directly in <b>${monthLabelFromKey(state.currentMonthKey)}</b>'s Month Tracker.
    </div>

    <div class="panel">

        <button class="btn small" id="addRecurOutgoingBtn">+ Add recurring outgoing</button>

    addPotTransfer(potKey, dirSel.value, amt, noteInp.value);

  const setBalBtn = document.querySelector(`.pot-setbal-btn-${potKey}`);
  setBalBtn.onclick = ()=>{
    if(setBalInp.value === '') return;
    setPotBalance(potKey, Number(setBalInp.value));
    renderPots();
  };
  document.querySelectorAll(`.pot-del-${potKey}`).forEach(b=>{
    b.onclick = ()=>{ deletePotTransfer(potKey, b.dataset.id); renderPots(); };
  });

function exportJson(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  downloadBlob(blob, 'budget-tracker-backup.json');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}
function importJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.months) throw new Error('bad format');
      state = data;
      normalizeState();
      save();
      currentView='month';
      render();
    }catch(err){
      alert('Could not import this file — it doesn\'t look like a Budget Tracker backup.');
    }
  };
  reader.readAsText(file);
}

function openInputModal(title, placeholder, onConfirm){
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.innerHTML = `<h3>${title}</h3>
    <input type="text" id="modalInputField" placeholder="${escapeHtml(placeholder||'')}" style="width:100%;">

  const current = ensureMonth(state.currentMonthKey);
  const leftOver = monthTotals(current).totalLeftOver;
  const nextKey = shiftKey(state.currentMonthKey, 1);
  const nextAlreadyExisted = !!state.months[nextKey];

  render();
};
document.getElementById('themeToggle').onclick = ()=>{
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  save(); render();
};

render();
if(bootstrapFromUrlIfNeeded()) render();
(function(){
  const p = activeProfileMeta();
  if(p && p.syncEnabled && p.syncCode) updateUrlHashForSyncCode(p.syncCode);
})();
syncActiveProfileFromCloud();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Service worker registration failed', e));
  });
}
</script>
</body>
</html>
