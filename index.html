// Compares this month's category spend against the previous tracked month, one
// callout per category whose spend actually changed — biggest swings first.
function renderCategoryDeltas(monthKey, mode, elId, kind){
  const isIncome = kind==='in';
  const rowsFor = mm => isIncome ? incomeBreakdown(mm, mode) : categoryBreakdown(mm, mode);
  const el = document.getElementById(elId||'catBreakdownDeltas');
  if(!el) return;
  const keys = Object.keys(state.months).sort();
  const idx = keys.indexOf(monthKey);
  if(idx<=0){
    el.innerHTML = '<div class="hint" style="font-size:12px;">Track an earlier month too to see month-over-month comparisons.</div>';
    return;
  }
  const prevKey = keys[idx-1];
  const curMap = {}; rowsFor(state.months[monthKey]).forEach(r=>curMap[r.category]=r.amount);
  const prevMap = {}; rowsFor(state.months[prevKey]).forEach(r=>prevMap[r.category]=r.amount);
  const cats = new Set([...Object.keys(curMap), ...Object.keys(prevMap)]);
  const deltas = [];
  cats.forEach(category=>{
    const cur = curMap[category]||0, prev = prevMap[category]||0;
    const diff = round2(cur-prev);
    if(Math.abs(diff) < 0.01) return;
    deltas.push({category, cur, prev, diff});
  });
  if(!deltas.length){
    el.innerHTML = `<div class="hint" style="font-size:12px;">No change from ${monthLabelFromKey(prevKey)} in any category.</div>`;
    return;
  }
  deltas.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  el.innerHTML = `
    <div class="hint" style="font-size:12px;margin-bottom:6px;">Compared to ${monthLabelFromKey(prevKey)}</div>
    ${deltas.slice(0,6).map(d=>{
      const up = d.diff>0;
      let text;
      if(d.prev<=0){
        text = isIncome ? `<b>${escapeHtml(d.category)}</b>: new this month (${fmt(d.cur)})` : `New spending on <b>${escapeHtml(d.category)}</b>: ${fmt(d.cur)}`;
      } else if(d.cur<=0){
        text = isIncome ? `<b>${escapeHtml(d.category)}</b>: nothing this month (was ${fmt(d.prev)})` : `No more spending on <b>${escapeHtml(d.category)}</b> (was ${fmt(d.prev)})`;
      } else {
        const pct = Math.round(Math.abs(d.diff)/d.prev*100);
        text = isIncome
          ? `<b>${escapeHtml(d.category)}</b>: <b>${pct}% ${up?'more':'less'}</b> than ${monthLabelFromKey(prevKey)} (${fmt(d.cur)} vs ${fmt(d.prev)})`
          : `You spent <b>${pct}% ${up?'more':'less'}</b> on <b>${escapeHtml(d.category)}</b> than ${monthLabelFromKey(prevKey)} (${fmt(d.cur)} vs ${fmt(d.prev)})`;
      }
      const good = isIncome ? up : !up;
      return `<div class="delta-row">
        <span class="delta-arrow ${good?'delta-down':'delta-up'}">${up?'▲':'▼'}</span>
        ${catTile(d.category)}
        <span class="delta-text">${text}</span>
      </div>`;
    }).join('')}
  `;
}
// Daily spend heatmap data: Quick Add entries carry a real timestamp, so those
// are placed on their exact day; any other outgoing with an optional "Day" set
// (e.g. Rent on the 1st) is placed on that day of the displayed month, clamped
// to the month's actual length. In 'done' mode, dated non-Quick-Add outgoings
// only count once marked Done — Quick Add entries are always Done already.
function dailySpendSeries(monthKey, mode){
  const m = state.months[monthKey];
  const days = {};
  if(!m) return days;
  const [y, mo] = monthKey.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(o.quickAdd && o.ts){
      const d = new Date(o.ts);
      if(d.getFullYear()!==y || (d.getMonth()+1)!==mo) return;
      const day = d.getDate();
      days[day] = round2((days[day]||0) + (Number(o.amount)||0));
      return;
    }
    if(mode==='done' && o.status!=='done') return;
    const day = resolveScheduledDay(o, y, mo);
    if(day) days[day] = round2((days[day]||0) + (Number(o.amount)||0));
  });
  return days;
}
function hexToRgbTriplet(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? `${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}` : '91,140,255';
}
// ---- Daily spending heatmap (month view, year view, day details) ----
let heatmapMonth = null, heatmapMode = 'all', heatmapView = 'month', heatmapYear = null;
const mondayIndexOf = jsDay => (jsDay+6)%7; // JS: 0=Sun..6=Sat -> Monday-first
const WEEKDAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

// Compact money for tiny cells: £42, £4.50, £1.2k.
function fmtCompact(n){
  if(hideMoney) return state.currency+'•••';
  const v = Math.abs(n), sign = n<0 ? '-' : '';
  if(v>=10000) return sign+state.currency+Math.round(v/1000)+'k';
  if(v>=1000) return sign+state.currency+(v/1000).toFixed(1).replace(/\.0$/,'')+'k';
  if(v>=100) return sign+state.currency+Math.round(v);
  return sign+state.currency+v.toFixed(2).replace(/\.00$/,'');
}
function heatmapCtx(mk){
  const [y, mo] = mk.split('-').map(Number);
  const dim = new Date(y, mo, 0).getDate();
  const now = new Date();
  const isCurrent = mk===monthKey(now), isPast = mk<monthKey(now);
  return {y, mo, dim, isCurrent, isPast, today: isCurrent ? now.getDate() : 0, elapsed: isPast ? dim : (isCurrent ? now.getDate() : 0)};
}
// Every dated outgoing/incoming (any status) by day, for tooltips, ghost
// amounts and the day-detail panel.
function scheduledByDay(mk){
  const m = state.months[mk];
  const bills = {}, pays = {};
  if(!m) return {bills, pays};
  const [y, mo] = mk.split('-').map(Number);
  m.outgoings.forEach(o=>{
    const d = resolveScheduledDay(o, y, mo);
    if(d && !o.quickAdd) (bills[d] = bills[d]||[]).push({name:o.name, amount:Number(o.amount)||0, done:o.status==='done', category:o.category||'Uncategorized'});
  });
  m.incoming.forEach(i=>{
    const d = resolveScheduledDay(i, y, mo);
    if(d && !i.quickAdd) (pays[d] = pays[d]||[]).push({name:i.name, amount:Number(i.amount)||0, done:i.status==='done'});
  });
  return {bills, pays};
}
// Quick Add spends only, by day — everyday discretionary spending, free of
// bills like rent that would otherwise dominate weekday patterns.
function discretionaryByDay(mk){
  const m = state.months[mk];
  const days = {};
  if(!m) return days;
  const [y, mo] = mk.split('-').map(Number);
  m.outgoings.forEach(o=>{
    if(!(o.quickAdd && o.ts)) return;
    const d = new Date(o.ts);
    if(d.getFullYear()!==y || (d.getMonth()+1)!==mo) return;
    days[d.getDate()] = round2((days[d.getDate()]||0) + (Number(o.amount)||0));
  });
  return days;
}
function cumulativeSpend(series, dim, upto){
  const out = [];
  let run = 0;
  for(let d=1; d<=Math.min(dim, upto); d++){ run += series[d]||0; out.push(round2(run)); }
  return out;
}

function renderSpendingHeatmap(){
  const el = document.getElementById('spendHeatmap');
  if(!el) return;
  const keys = Object.keys(state.months).sort();
  if(!keys.length){ el.innerHTML = '<div class="empty">No months tracked yet.</div>'; return; }
  if(!heatmapMonth || !state.months[heatmapMonth]) heatmapMonth = state.months[state.currentMonthKey] ? state.currentMonthKey : keys[keys.length-1];
  if(heatmapYear===null) heatmapYear = Number(heatmapMonth.slice(0,4));
  const years = keys.map(k=>Number(k.slice(0,4)));
  const minYear = Math.min(...years), maxYear = Math.max(...years);
  const idx = keys.indexOf(heatmapMonth);

  const navHtml = heatmapView==='year'
    ? `<div class="month-switch"><button id="hmPrev" ${heatmapYear<=minYear?'disabled':''}>‹</button><div class="label">${heatmapYear}</div><button id="hmNext" ${heatmapYear>=maxYear?'disabled':''}>›</button></div>`
    : `<div class="month-switch"><button id="hmPrev" ${idx<=0?'disabled':''}>‹</button><div class="label">${monthLabelFromKey(heatmapMonth)}</div><button id="hmNext" ${idx>=keys.length-1?'disabled':''}>›</button></div>`;
  const controls = `
    <div class="hm-controls">
      ${navHtml}
      <div class="seg-toggle" id="hmViewToggle">
        <button class="seg-btn${heatmapView==='month'?' active':''}" data-v="month">Month</button>
        <button class="seg-btn${heatmapView==='year'?' active':''}" data-v="year">Year</button>
      </div>
      <div class="seg-toggle" id="hmModeToggle">
        <button class="seg-btn${heatmapMode==='all'?' active':''}" data-m="all">Budgeted</button>
        <button class="seg-btn${heatmapMode==='done'?' active':''}" data-m="done">Actual (Paid)</button>
      </div>
    </div>`;

  const body = heatmapView==='year' ? heatmapYearHtml(keys) : heatmapMonthHtml(heatmapMonth);
  el.innerHTML = controls + body.html;

  document.getElementById('hmPrev').onclick = ()=>{
    if(heatmapView==='year') heatmapYear--; else heatmapMonth = keys[idx-1];
    renderSpendingHeatmap();
  };
  document.getElementById('hmNext').onclick = ()=>{
    if(heatmapView==='year') heatmapYear++; else heatmapMonth = keys[idx+1];
    renderSpendingHeatmap();
  };
  el.querySelectorAll('#hmViewToggle .seg-btn').forEach(b=>b.onclick = ()=>{
    heatmapView = b.dataset.v;
    if(heatmapView==='year') heatmapYear = Number(heatmapMonth.slice(0,4));
    renderSpendingHeatmap();
  });
  el.querySelectorAll('#hmModeToggle .seg-btn').forEach(b=>b.onclick = ()=>{ heatmapMode = b.dataset.m; renderSpendingHeatmap(); });
  if(body.after) body.after(el);
}

function heatmapLegendHtml(accentRgb){
  return `<div class="heatmap-legend">
      <span>Less</span>
      ${[0.18,0.4,0.65,0.9].map(a=>`<span class="heatmap-legend-swatch" style="background:rgba(${accentRgb},${a});"></span>`).join('')}
      <span>More</span>
      <span class="hm-leg"><span class="hm-leg-dot" style="background:var(--amber);"></span>Bill due</span>
      <span class="hm-leg"><span class="hm-leg-dot" style="background:var(--green);"></span>Payday</span>
      <span class="hm-leg"><span class="hm-leg-tick">✓</span>No spend</span>
    </div>`;
}

function heatmapMonthHtml(mk){
  const c = heatmapCtx(mk);
  const daySpend = dailySpendSeries(mk, heatmapMode);
  const {bills, pays} = scheduledByDay(mk);
  const disc = discretionaryByDay(mk);
  const max = Math.max(0, ...Object.values(daySpend));
  const accentRgb = hexToRgbTriplet(getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#5b8cff');
  const monthShort = monthLabelFromKey(mk).split(' ')[0].slice(0,3);
  const firstDow = mondayIndexOf(new Date(c.y, c.mo-1, 1).getDay());

  // Month stats
  let spentToDate = 0, noSpend = 0, best = 0, run = 0, busiest = null;
  for(let d=1; d<=c.dim; d++){
    const amt = daySpend[d]||0;
    if(amt>0 && (!busiest || amt>busiest.amt)) busiest = {day:d, amt};
    if(d<=c.elapsed){
      spentToDate += amt;
      if(amt===0){ noSpend++; run++; best = Math.max(best, run); } else run = 0;
    }
  }
  const curStreak = run;
  const total = round2(Object.values(daySpend).reduce((a,b)=>a+b,0));
  const chips = [
    `<div class="hm-stat"><div class="k">Month total</div><div class="v">${fmt(total)}</div></div>`,
    c.elapsed>0 ? `<div class="hm-stat"><div class="k">Daily average</div><div class="v">${fmt(round2(spentToDate/c.elapsed))}</div></div>` : '',
    busiest ? `<div class="hm-stat"><div class="k">Busiest day</div><div class="v">${monthShort} ${busiest.day} · ${fmt(busiest.amt)}</div></div>` : '',
    c.elapsed>0 ? `<div class="hm-stat" title="Days with nothing logged against them"><div class="k">No-spend days</div><div class="v">${noSpend}<span class="hm-sub"> · best streak ${best}${curStreak>=2?` · now ${curStreak}`:''}</span></div></div>` : ''
  ].join('');

  let cells = '';
  for(let i=0; i<firstDow; i++) cells += `<div class="heatmap-cell empty"></div>`;
  for(let day=1; day<=c.dim; day++){
    const amt = daySpend[day]||0;
    const ratio = max>0 ? amt/max : 0;
    const dow = mondayIndexOf(new Date(c.y, c.mo-1, day).getDay());
    const isWeekend = dow >= 5;
    const isToday = day===c.today;
    const isFuture = !c.isPast && day>c.elapsed;
    const bg = amt>0 ? `rgba(${accentRgb},${(0.18+0.72*ratio).toFixed(2)})` : 'transparent';
    const dayBills = bills[day]||[], dayPays = pays[day]||[];
    const pendingBills = dayBills.filter(b=>!b.done), pendingPays = dayPays.filter(p=>!p.done);
    const ghostAmt = heatmapMode==='done' ? round2(pendingBills.reduce((a,b)=>a+b.amount,0)) : 0;
    const noSpendDay = !isFuture && amt===0;
    let tip = `<div style="font-weight:700;margin-bottom:3px;">${WEEKDAY_FULL[dow].slice(0,3)} ${day} ${monthShort}</div>`;
    tip += amt>0 ? `<div>Spent: ${escapeHtml(fmt(amt))}</div>` : (noSpendDay ? '<div style="color:var(--muted);">Nothing logged</div>' : '<div style="color:var(--muted);">Nothing planned</div>');
    pendingBills.forEach(b=>{ tip += `<div><span style="color:var(--amber);">●</span> Due: ${escapeHtml(b.name)} ${escapeHtml(fmt(b.amount))}</div>`; });
    pendingPays.forEach(p=>{ tip += `<div><span style="color:var(--green);">●</span> Pay: ${escapeHtml(p.name)} ${escapeHtml(fmt(p.amount))}</div>`; });
    tip += '<div style="color:var(--muted);margin-top:3px;">Click for details</div>';
    const markers = (pendingPays.length?'<span class="pay-marker"></span>':'') + (pendingBills.length?'<span class="bill-marker"></span>':'');
    const low = (amt>0 ? (ratio>0.5?'hm-hot':'') : '');
    cells += `<button type="button" class="heatmap-cell${isWeekend?' weekend':''}${isToday?' today':''}${isFuture?' future':''}${low?' '+low:''}" data-day="${day}" data-tip="${escapeHtml(tip)}" style="background:${bg};">
      <span class="hm-day">${day}</span>
      <span class="hm-markers">${markers}</span>
      <span class="hm-foot">
        ${amt>0 ? `<span class="hm-amt">${fmtCompact(amt)}</span>` : (noSpendDay ? '<span class="hm-tick">✓</span>' : '')}
        ${ghostAmt>0 ? `<span class="hm-ghost">${fmtCompact(ghostAmt)} due</span>` : ''}
      </span>
    </button>`;
  }

  // Weekday pattern from Quick Add spends only
  const wd = Array.from({length:7}, ()=>({sum:0, count:0}));
  for(let d=1; d<=c.elapsed; d++) wd[mondayIndexOf(new Date(c.y, c.mo-1, d).getDay())].count++;
  Object.entries(disc).forEach(([d,v])=>{ if(Number(d)<=c.elapsed) wd[mondayIndexOf(new Date(c.y, c.mo-1, Number(d)).getDay())].sum += v; });
  const avgs = wd.map(x=>x.count ? x.sum/x.count : 0);
  const maxAvg = Math.max(0, ...avgs);
  let wdInsight = 'Log spends with Quick Add to see which days cost you most.';
  if(maxAvg>0){
    const top = avgs.indexOf(maxAvg);
    wdInsight = `${WEEKDAY_FULL[top]}s cost you most — about ${fmt(round2(maxAvg))} on average.`;
    const sum = (idxs, f) => idxs.reduce((a,i)=>a+wd[i][f],0);
    const wkndDays = sum([5,6],'count'), wkdyDays = sum([0,1,2,3,4],'count');
    if(wkndDays>0 && wkdyDays>0){
      const wknd = sum([5,6],'sum')/wkndDays, wkdy = sum([0,1,2,3,4],'sum')/wkdyDays;
      if(wkdy>0 && wknd>0){
        const ratio = wknd/wkdy;
        if(ratio>=2) wdInsight += ` Weekend days cost about ${ratio.toFixed(1).replace(/\.0$/,'')}× as much as weekdays.`;
        else {
          const pct = Math.round((ratio-1)*100);
          if(Math.abs(pct)>=5) wdInsight += ` Weekends run ${Math.abs(pct)}% ${pct>0?'higher':'lower'} than weekdays.`;
        }
      }
    }
  }
  const wdHtml = `
    <div class="hm-card">
      <div class="hm-card-title">Everyday spending by weekday</div>
      <div class="hm-wd">
        ${avgs.map((a,i)=>`<div class="hm-wd-col" title="${WEEKDAY_FULL[i]}: ${escapeHtml(fmt(round2(a)))} avg over ${wd[i].count} day${wd[i].count!==1?'s':''}">
          <div class="hm-wd-val">${a>0?fmtCompact(a):''}</div>
          <div class="hm-wd-track"><div class="hm-wd-bar${a===maxAvg&&a>0?' top':''}${i>=5?' wknd':''}" style="height:${maxAvg?Math.max(a/maxAvg*100, a>0?4:0).toFixed(1):0}%;"></div></div>
          <div class="hm-wd-lbl">${WEEKDAY_FULL[i].slice(0,3)}</div>
        </div>`).join('')}
      </div>
      <div class="hm-insight">${wdInsight}</div>
    </div>`;

  // Pace vs the previous tracked month
  let paceHtml = '', paceAfter = null;
  if(c.elapsed>0){
    const keys = Object.keys(state.months).sort();
    const prevKey = keys[keys.indexOf(mk)-1];
    const curCum = cumulativeSpend(daySpend, c.dim, c.elapsed);
    let caption = `${fmt(curCum[curCum.length-1]||0)} spent by day ${c.elapsed}.`;
    let series;
    const dayLabel = d => `${monthShort} ${d}`;
    const xs = Array.from({length:c.dim}, (_,i)=>i+1);
    if(prevKey){
      const pc = heatmapCtx(prevKey);
      const prevCumRaw = cumulativeSpend(dailySpendSeries(prevKey, heatmapMode), pc.dim, pc.dim);
      const prevCum = xs.map(d=>prevCumRaw[Math.min(d, prevCumRaw.length)-1]||0);
      const diff = round2((curCum[c.elapsed-1]||0) - prevCum[c.elapsed-1]);
      caption += Math.abs(diff)<0.005 ? ` Exactly level with ${monthLabelFromKey(prevKey)}.`
        : ` <span style="color:var(--${diff>0?'red':'green'});font-weight:700;">${fmt(Math.abs(diff))} ${diff>0?'more':'less'}</span> than ${monthLabelFromKey(prevKey)} by the same day.`;
      series = [
        {color:cssVar('--muted','#8a93ab'), name:monthLabelFromKey(prevKey), dashed:true, points: xs.map((d,i)=>({x:String(d), label:dayLabel(d), y:prevCum[i]}))},
        {color:cssVar('--accent','#5b8cff'), name:monthLabelFromKey(mk), points: curCum.map((v,i)=>({x:String(i+1), label:dayLabel(i+1), y:v}))}
      ];
    } else {
      series = [{color:cssVar('--accent','#5b8cff'), name:monthLabelFromKey(mk), points: curCum.map((v,i)=>({x:String(i+1), label:dayLabel(i+1), y:v}))}];
    }
    paceHtml = `
      <div class="hm-card">
        <div class="hm-card-title">Spending pace</div>
        <div id="hmPace"></div>
        <div class="hm-insight">${caption}</div>
      </div>`;
    paceAfter = ()=>{
      const pe = document.getElementById('hmPace');
      if(pe && series[0].points.length>=2) lineChart(pe, series, {height:170, marker: c.today ? {index:c.today-1, label:'Today'} : null});
      else if(pe) pe.innerHTML = '<div class="empty">Not enough days yet.</div>';
    };
  }

  const empty = !Object.keys(daySpend).length && !Object.keys(bills).length && !Object.keys(pays).length;
  const html = `
    <div class="hm-stats">${chips}</div>
    ${empty ? '<div class="empty" style="padding:6px 0 14px;">No Quick Add spends or dated outgoings for this month yet — click any day to log one, or give an outgoing a Day.</div>' : ''}
    <div class="heatmap-grid">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="heatmap-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    ${heatmapLegendHtml(accentRgb)}
    <div class="hm-insights">${wdHtml}${paceHtml}</div>`;
  return {html, after: root=>{
    root.querySelectorAll('.heatmap-cell[data-day]').forEach(cell=>{
      cell.addEventListener('mouseenter', evt=>showChartTooltip(evt, cell.dataset.tip, true));
      cell.addEventListener('mousemove', evt=>showChartTooltip(evt, cell.dataset.tip, true));
      cell.addEventListener('mouseleave', hideChartTooltip);
      cell.addEventListener('click', ()=>{ hideChartTooltip(); openDayModal(mk, Number(cell.dataset.day)); });
    });
    if(paceAfter) paceAfter();
  }};
}

// Year at a glance: twelve mini calendars on one shared colour scale.
function heatmapYearHtml(keys){
  const y = heatmapYear;
  const accentRgb = hexToRgbTriplet(getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#5b8cff');
  const monthData = Array.from({length:12}, (_,i)=>{
    const mk = `${y}-${String(i+1).padStart(2,'0')}`;
    const tracked = !!state.months[mk];
    return {mk, i, tracked, spend: tracked ? dailySpendSeries(mk, heatmapMode) : {}};
  });
  const max = Math.max(0, ...monthData.flatMap(m=>Object.values(m.spend)));
  const yearTotal = round2(monthData.reduce((a,m)=>a+Object.values(m.spend).reduce((x,v)=>x+v,0),0));
  const cards = monthData.map(m=>{
    const dim = new Date(y, m.i+1, 0).getDate();
    const first = mondayIndexOf(new Date(y, m.i, 1).getDay());
    let sq = '';
    for(let b=0; b<first; b++) sq += '<span class="hm-sq blank"></span>';
    for(let d=1; d<=dim; d++){
      const a = m.spend[d]||0;
      sq += `<span class="hm-sq" style="${a>0?`background:rgba(${accentRgb},${(0.2+0.7*(max?a/max:0)).toFixed(2)});border-color:transparent;`:''}"></span>`;
    }
    const total = round2(Object.values(m.spend).reduce((x,v)=>x+v,0));
    const name = new Date(y, m.i, 1).toLocaleString('en-GB',{month:'short'});
    return `<button type="button" class="hm-mini${m.tracked?'':' untracked'}" data-mk="${m.mk}" ${m.tracked?'':'disabled'}>
      <div class="hm-mini-head"><span>${name}</span><span class="hm-sub">${m.tracked && total>0 ? fmtCompact(total) : ''}</span></div>
      <div class="hm-mini-grid">${sq}</div>
    </button>`;
  }).join('');
  const html = `
    <div class="hm-stats"><div class="hm-stat"><div class="k">${y} total</div><div class="v">${fmt(yearTotal)}</div></div></div>
    <div class="hm-year">${cards}</div>
    ${heatmapLegendHtml(accentRgb)}`;
  return {html, after: root=>{
    root.querySelectorAll('.hm-mini:not(.untracked)').forEach(b=>b.addEventListener('click', ()=>{
      heatmapMonth = b.dataset.mk; heatmapView = 'month'; renderSpendingHeatmap();
    }));
  }};
}

// Day details: what was spent, what's due, payday, and (for today or earlier)
// a form to log a spend against that exact day.
function openDayModal(mk, day){
  const m = state.months[mk];
  if(!m) return;
  const c = heatmapCtx(mk);
  const date = new Date(c.y, c.mo-1, day);
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.className = 'modal day-modal';
  const spends = m.outgoings.filter(o=>{
    if(!(o.quickAdd && o.ts)) return false;
    const d = new Date(o.ts);
    return d.getFullYear()===c.y && d.getMonth()+1===c.mo && d.getDate()===day;
  });
  const {bills, pays} = scheduledByDay(mk);
  const dayBills = bills[day]||[], dayPays = pays[day]||[];
  const spentTotal = round2(spends.reduce((a,o)=>a+(Number(o.amount)||0),0));
  const canAdd = c.isPast || (c.isCurrent && day<=c.today);
  const row = (tile, name, sub, amt) => `<div class="dm-row">${tile}<div class="dm-main"><div class="dm-name">${escapeHtml(name)}</div><div class="dm-sub">${sub}</div></div><div class="dm-amt">${escapeHtml(fmt(amt))}</div></div>`;
  const spendRows = spends.map(o=>`<div class="dm-row">${catTile(o.category||'Uncategorized','sm')}<div class="dm-main"><div class="dm-name">${escapeHtml(o.name)}</div><div class="dm-sub">${escapeHtml(o.category||'Uncategorized')} · ${new Date(o.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="dm-amt">${escapeHtml(fmt(o.amount))}</div><button class="del-btn dm-del" data-id="${o.id}" aria-label="Delete">✕</button></div>`).join('');
  const billRows = dayBills.map(b=>row(catTile(b.category,'sm'), b.name, b.done?'Bill · paid':'Bill · due', b.amount)).join('');
  const payRows = dayPays.map(p=>row(catTile('Salary','sm'), p.name, p.done?'Payday · received':'Payday · expected', p.amount)).join('');
  const section = (title, html) => html ? `<div class="dm-sec"><div class="dm-sec-title">${title}</div><div class="dm-list">${html}</div></div>` : '';
  box.innerHTML = `
    <h3 style="margin-bottom:2px;">${date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>
    <div class="dm-total">${spentTotal>0 ? `${escapeHtml(fmt(spentTotal))} logged` : 'Nothing logged this day'}</div>
    ${section('Spent', spendRows)}
    ${section('Bills', billRows)}
    ${section('Pay', payRows)}
    ${canAdd ? `
      <div class="dm-sec"><div class="dm-sec-title">Log a spend on this day</div>
        <div class="dm-form">
          <input type="number" step="0.01" id="dmAmount" placeholder="Amount">
          <input type="text" id="dmReason" placeholder="Reason">
          ${categoryDropdownHtml('dmCategory','Uncategorized')}
          <button class="btn small" id="dmAdd">Add</button>
        </div>
      </div>` : `<div class="dm-note">This day hasn't happened yet, so spending can't be logged against it.</div>`}
    <div class="actions"><button class="btn secondary small" id="dmClose">Close</button></div>`;
  bg.classList.add('open');
  bg.onclick = e=>{ if(e.target===bg) closeRecapModal(); };
  document.getElementById('dmClose').onclick = closeRecapModal;
  box.querySelectorAll('.dm-del').forEach(b=>b.onclick = ()=>{
    removeWithUndo(m, 'outgoings', b.dataset.id, null,
      ()=>{ renderSpendingHeatmap(); openDayModal(mk, day); },
      ()=>{ renderSpendingHeatmap(); if(document.getElementById('modalBg').classList.contains('open') && document.getElementById('dmClose')) openDayModal(mk, day); });
  });
  if(canAdd){
    const cat = box.querySelector('.dmCategory');
    const amountEl = document.getElementById('dmAmount'), reasonEl = document.getElementById('dmReason');
    const smartDm = attachSmartCategory(reasonEl, cat, 'out');
    initCategoryDropdown(cat, ()=>smartDm.markPicked());
    const add = ()=>{
      const amt = Number(amountEl.value);
      if(!amt || amt<=0) return;
      const isToday = c.isCurrent && day===c.today;
      const ts = isToday ? Date.now() : new Date(c.y, c.mo-1, day, 12, 0, 0).getTime();
      m.outgoings.push({id:uid(), name: reasonEl.value.trim() || 'Spent', amount:amt, status:'done', recurring:false, quickAdd:true, ts, category: cat.dataset.value});
      save(); renderSpendingHeatmap(); openDayModal(mk, day);
      showToast(`Added ${fmt(amt)}`, date.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}));
    };
    document.getElementById('dmAdd').onclick = add;
    [amountEl, reasonEl].forEach(i=>i.addEventListener('keydown', e=>{ if(e.key==='Enter') add(); }));
  }
}

// ---------------- Quarterly ----------------
function quarterOfMonth(mm){ return Math.floor((mm-1)/3)+1; }
const QUARTER_LABEL = q => ['Jan–Mar','Apr–Jun','Jul–Sep','Oct–Dec'][q-1];
function quarterStatsFor(gk, groups){
  const g = groups[gk];
  const monthKeys = g.monthKeys.slice().sort();
  let income=0, spending=0, saved=0;
  const catTotals = {};
  monthKeys.forEach(mk=>{
    const m = state.months[mk];
    const t = monthTotals(m);
    income += t.doneIncoming;
    spending += t.doneOutgoing + t.doneWeekly;
    saved += t.doneSavings + t.doneStocks;
    m.outgoings.forEach(o=>{
      if(o.status!=='done') return;
      const cat = o.category || 'Uncategorized';
      catTotals[cat] = (catTotals[cat]||0) + (Number(o.amount)||0);
    });
  });
  const firstM = state.months[monthKeys[0]];
  const lastM = state.months[monthKeys[monthKeys.length-1]];
  const startBalance = round2(firstM.startingBalance);
  const endBalance = round2(monthTotals(lastM).liveBalance);
  const net = round2(income - spending - saved);
  const savingsRate = income>0 ? Math.round(saved/income*100) : 0;
  const catRows = Object.entries(catTotals).filter(([,amt])=>amt>0)
    .map(([category,amount])=>({category, amount:round2(amount)}))
    .sort((a,b)=>b.amount-a.amount);
  return {gk, year:g.year, q:g.q, monthKeys, income:round2(income), spending:round2(spending), saved:round2(saved), net, startBalance, endBalance, savingsRate, catRows};
}
let quarterlySelectedKey = null;

    (groups[gk] = groups[gk] || {year:y, q, monthKeys:[]}).monthKeys.push(k);
  });
  const groupKeys = Object.keys(groups).sort();
  const quarterStats = groupKeys.map(gk=>quarterStatsFor(gk, groups));

      {color:cssVar('--green','#3ecf8e'), name:'Income', points: quarterStats.map((qs,i)=>({x:labels[i], label:`Q${qs.q} ${qs.year}`, y:qs.income}))},
      {color:cssVar('--red','#ff5c7a'), name:'Spending', points: quarterStats.map((qs,i)=>({x:labels[i], label:`Q${qs.q} ${qs.year}`, y:qs.spending}))},
      {color:cssVar('--accent','#5b8cff'), name:'Net', dashed:true, points: quarterStats.map((qs,i)=>({x:labels[i], label:`Q${qs.q} ${qs.year}`, y:qs.net}))}
    ], {height:220});
  } else {
    document.getElementById('quarterlyChart').innerHTML = '<div class="empty">Track at least two quarters to see a trend line.</div>';
  }
  const renderDetail = ()=>{
    const qs = quarterStatsFor(quarterlySelectedKey, groups);
    const detailEl = document.getElementById('quarterlyDetail');
    detailEl.innerHTML = `
      <div class="panel-head" style="margin-bottom:10px;">
        <h2>Q${qs.q} ${qs.year} <span style="font-weight:400;color:var(--muted);font-size:13px;">(${QUARTER_LABEL(qs.q)})</span></h2>
        <span class="hint">${qs.monthKeys.length} month${qs.monthKeys.length!==1?'s':''} tracked</span>
      </div>
      <div class="grid">
        <div class="card"><div class="k">Income</div><div class="v pos">${fmt(qs.income)}</div><div class="sub">marked Received</div></div>
        <div class="card"><div class="k">Spending</div><div class="v neg">${fmt(qs.spending)}</div><div class="sub">outgoings + weekly, Paid</div></div>
        <div class="card"><div class="k">Saved</div><div class="v pos">${fmt(qs.saved)}</div><div class="sub">savings + stocks, Paid</div></div>
        <div class="card highlight"><div class="k">Net Change</div><div class="v ${qs.net>=0?'pos':'neg'}">${fmt(qs.net)}</div><div class="sub">${qs.savingsRate}% savings rate</div></div>
        <div class="card"><div class="k">Starting Balance</div><div class="v">${fmt(qs.startBalance)}</div><div class="sub">start of quarter</div></div>
        <div class="card"><div class="k">Ending Balance</div><div class="v" style="color:${qs.endBalance>=0?'var(--green)':'var(--red)'};">${fmt(qs.endBalance)}</div><div class="sub">end of quarter (live)</div></div>
      </div>
      ${qs.catRows.length ? (()=>{
        const qTotal = qs.catRows.reduce((a,r)=>a+r.amount,0);
        return `
        <div class="formula-note" style="margin-top:0;margin-bottom:12px;">Spending by category this quarter</div>
        <div class="q-cat">
          ${gaugeChartHtml(qs.catRows, qTotal, 'spent this quarter')}
          <div class="q-cat-list">
            ${qs.catRows.slice(0,6).map(r=>`
              <div class="cat-bar-row">
                <div class="cat-bar-label">${catTile(r.category,'inl')}${escapeHtml(r.category)}</div>
                <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${qs.catRows[0].amount?(r.amount/qs.catRows[0].amount*100).toFixed(1):0}%;--c:${categoryColor(r.category)};"></div></div>

              </div>

        </div>`;
      })() : ''}
    `;
  };
  renderDetail();
  el.querySelectorAll('.yr-open').forEach(b=>b.onclick = ()=>openYearReview(Number(b.dataset.year)));
  const sampleBtn = document.getElementById('yrSample');
  if(sampleBtn) sampleBtn.onclick = ()=>openYearReview(new Date().getFullYear(), true);
  document.getElementById('quarterlySelect').onchange = e=>{ quarterlySelectedKey = e.target.value; renderDetail(); };
  document.getElementById('quarterlyPrev').onclick = ()=>{
    const i = groupKeys.indexOf(quarterlySelectedKey);
    if(i>0){ quarterlySelectedKey = groupKeys[i-1]; document.getElementById('quarterlySelect').value = quarterlySelectedKey; renderDetail(); }
  };
  document.getElementById('quarterlyNext').onclick = ()=>{
    const i = groupKeys.indexOf(quarterlySelectedKey);
    if(i<groupKeys.length-1){ quarterlySelectedKey = groupKeys[i+1]; document.getElementById('quarterlySelect').value = quarterlySelectedKey; renderDetail(); }
  };
}

function recurringTableHtml(kind){
  const label = kind==='incoming' ? 'Source' : 'Name';
  const catTh = kind==='outgoing' ? '<th style="width:140px;">Category</th><th style="width:76px;">Day</th>' : '<th style="width:136px;">Category</th><th style="width:152px;">Schedule</th>';
  return `
    <table class="responsive-table${kind==='incoming'?' income-table':''}">
      <thead><tr><th>${label}</th>${catTh}<th style="width:120px;">Amount</th><th style="width:130px;">Status</th><th style="width:36px;"></th></tr></thead>
      <tbody class="recur-body-${kind}"></tbody>
    </table>
    <div class="rc-else" id="recurElse-${kind}"></div>
  `;
}
// Recurring items that exist in later (already generated) months but not in the
// month being viewed — e.g. something added as recurring in November while you're
// looking at October. Each gets a button that jumps to that month to edit it.
function recurringElsewhere(m, listKey){
  const norm = n => String(n||'').trim().toLowerCase();
  const have = new Set(m[listKey].filter(x=>x.recurring && !x.transfer).map(x=>norm(x.name)));
  const found = new Map();
  Object.keys(state.months).sort().filter(k=>k>state.currentMonthKey).forEach(k=>{
    state.months[k][listKey].forEach(x=>{
      if(!x.recurring || x.transfer) return;
      const key = norm(x.name);
      if(have.has(key) || found.has(key)) return;
      found.set(key, {x, k});
    });
  });
  return found;
}
function drawRecurringElsewhere(m, kind){
  const box = document.getElementById(`recurElse-${kind}`);
  if(!box) return;
  const listKey = kind==='incoming' ? 'incoming' : 'outgoings';
  const found = recurringElsewhere(m, listKey);
  if(!found.size){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="rc-else-title">Added in later months <small>— not in ${escapeHtml(monthLabelFromKey(state.currentMonthKey))} yet</small></div><div class="rw-list">` +
    [...found.values()].map(({x,k})=>`
      <div class="rw-row">
        ${catTile(x.category||(kind==='incoming'?'Salary':'Uncategorized'),'md')}
        <div class="rw-main"><div class="rw-name">${escapeHtml(x.name||'Unnamed')}</div><div class="rw-sub">Recurring from ${escapeHtml(monthLabelFromKey(k))} · ${escapeHtml(fmt(Number(x.amount)||0))}</div></div>
        <button type="button" class="btn secondary small rc-open" data-month="${k}">Open ${escapeHtml(monthLabelFromKey(k).split(' ')[0])}</button>
      </div>`).join('') + `</div>`;
  box.querySelectorAll('.rc-open').forEach(b=>{
    b.onclick = ()=>{ state.currentMonthKey = b.dataset.month; ensureMonth(state.currentMonthKey); save(); render(); };
  });
}
// Weeks of the Weekly Budget that are set to Recurring.
function drawRecurringWeekly(m){

      <button type="button" class="btn secondary small rw-stop">Stop</button>
    </div>`).join('') : `<div class="empty">No recurring weeks yet — set a week to Recurring in the Month Tracker's Weekly Budget and it will appear here.</div>`;

function drawRecurringTable(m, kind){
  const list = kind==='incoming' ? m.incoming : m.outgoings;
  const body = document.querySelector(`.recur-body-${kind}`);

function bossHpSegs(plan, hitIdx){
  return plan.inst.map((it,i)=>{
    const on = !pay3Paid(plan,i);
    return `<i class="${on?'on':''}${i===hitIdx?' hit':''}" style="--w:${Math.max(1, Math.round(it.amount*100))};"></i>`;

}

// Decides whether this log earns a lucky ember (about 1 in 4, and never more than 7 logs apart). Returns a tier or null.
function luckyRoll(){

const LUCKY_TIPS = [

  () => 'Paying yourself first works — move savings out the moment your pay lands.',

function openTcgModal(){

  const num = done.findIndex(p=>p.id===plan.id) + 1;

  const rar = tcgRarity(plan), [rn, rc, rg] = TCG_RARITY[rar];

  if(!ov){ ov = document.createElement('div'); ov.id = 'cardOverlay'; ov.className = 'boss-overlay lucky'; ov.setAttribute('aria-hidden','true'); document.body.appendChild(ov); }

function bindTrophy(el){
  const stack = el.querySelector('#tcgStack');
  if(!stack) return;
  const center = (item, smooth)=>{ stack.scrollTo({left: item.offsetLeft - (stack.clientWidth - item.offsetWidth)/2, behavior: smooth ? 'smooth' : 'auto'}); };
  const done = ()=>tcgSorted(state.pay3.filter(p=>p.inst.length && p.inst.every((_,i)=>pay3Paid(p,i))));
  const bindInfo = ()=>{
    const look = el.querySelector('#tcgLook'), del = el.querySelector('#tcgDel');
    if(look) look.onclick = openTcgModal;
    if(del) del.onclick = ()=>deletePay3(tcgSel);
  };
  bindInfo();
  stack.querySelectorAll('.tcg-item').forEach(it=>it.onclick = ()=>{
    if(it.dataset.card===tcgSel){ openTcgModal(); return; }
    tcgSel = it.dataset.card;
    stack.querySelectorAll('.tcg-item').forEach(x=>x.classList.toggle('sel', x===it));
    const list = done(), idx = list.findIndex(p=>p.id===tcgSel);
    el.querySelector('#tcgInfo').innerHTML = tcgInfoHtml(list[idx], idx+1);
    bindInfo();
    setTimeout(()=>center(it, true), 30);
  });
  const cur = stack.querySelector('.tcg-item.sel');
  if(cur) requestAnimationFrame(()=>center(cur, false));
}

    <div class="panel">

// ---------------- Recurring costs summary (subscriptions overview) ----------------
const recurWhatIf = new Set();
// Recurring outgoings for the summary: this month's, plus any that only exist in later months.
function recurringSummaryItems(m){
  const own = m.outgoings.filter(o=>o.recurring && (Number(o.amount)||0)>0).map(o=>({...o, _from:null}));
  const other = [...recurringElsewhere(m, 'outgoings').values()].filter(({x})=>(Number(x.amount)||0)>0).map(({x,k})=>({...x, _from:k}));
  return [...own, ...other].sort((a,b)=>b.amount-a.amount);
}
function recurringSummaryHtml(m){
  const items = recurringSummaryItems(m);
  if(!items.length) return '';
  const monthly = round2(items.reduce((a,o)=>a+Number(o.amount),0));
  const subs = items.filter(o=>o.category==='Subscriptions');
  const subsMonthly = round2(subs.reduce((a,o)=>a+Number(o.amount),0));
  const max = items[0].amount;
  return `
    <div class="trend-kpis rc-kpis">
      <div class="card trend-kpi"><div class="k">Recurring / month</div><div class="v">${fmt(monthly)}</div><div class="sub">${items.length} recurring outgoing${items.length!==1?'s':''}</div></div>
      <div class="card trend-kpi"><div class="k">Recurring / year</div><div class="v">${fmt(monthly*12)}</div><div class="sub">if nothing changes</div></div>
      <div class="card trend-kpi"><div class="k">Subscriptions / year</div><div class="v">${fmt(subsMonthly*12)}</div><div class="sub">${subs.length} item${subs.length!==1?'s':''} · ${fmt(subsMonthly)} a month</div></div>
      <div class="card trend-kpi"><div class="k">Biggest</div><div class="v">${fmt(items[0].amount)}</div><div class="sub">${escapeHtml(items[0].name)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Where your recurring money goes</h2><span class="hint">tick any to see what you'd save by cancelling</span></div>
      <div class="rc-list">
        ${items.map(o=>`<label class="rc-row">
          <input type="checkbox" class="rc-check" data-id="${o.id}" ${recurWhatIf.has(o.id)?'checked':''}>
          ${catTile(o.category||'Uncategorized','sm')}
          <span class="rc-main"><span class="rc-name">${escapeHtml(o.name||'Unnamed')}${o._from?` <small class="rc-from">from ${escapeHtml(monthLabelFromKey(o._from).split(' ')[0])}</small>`:''}</span><span class="rc-bar"><span class="rc-bar-fill" style="width:${(o.amount/max*100).toFixed(1)}%;--c:${categoryColor(o.category||'Uncategorized')};"></span></span></span>
          <span class="rc-amts"><b>${escapeHtml(fmt(o.amount))}</b><small>${escapeHtml(fmt(o.amount*12))} / yr</small></span>
        </label>`).join('')}
      </div>
      <div class="rc-whatif" id="rcWhatIf"></div>
    </div>`;
}
function updateRecurWhatIf(m){
  const el = document.getElementById('rcWhatIf');
  if(!el) return;
  const items = recurringSummaryItems(m).filter(o=>recurWhatIf.has(o.id));
  const monthly = round2(items.reduce((a,o)=>a+(Number(o.amount)||0),0));
  el.innerHTML = items.length
    ? `Cancel ${items.length} and you'd save <b>${fmt(monthly)}</b> a month — <b>${fmt(monthly*12)}</b> a year.`
    : '';
}
function refreshRecurringSummary(){
  const box = document.getElementById('recurSummary');
  if(!box) return;
  const m = state.months[state.currentMonthKey];
  if(!m) return;
  // Forget ticks for items that no longer exist
  const ids = new Set(recurringSummaryItems(m).map(o=>o.id));
  [...recurWhatIf].forEach(id=>{ if(!ids.has(id)) recurWhatIf.delete(id); });
  box.innerHTML = recurringSummaryHtml(m);
  box.querySelectorAll('.rc-check').forEach(c=>c.onchange = ()=>{
    if(c.checked) recurWhatIf.add(c.dataset.id); else recurWhatIf.delete(c.dataset.id);
    updateRecurWhatIf(m);
  });
  updateRecurWhatIf(m);
}

// A scheduled job (.github/workflows/reminders.yml) reads your synced budget each morning and
// pushes "due today / tomorrow / overdue" to every device that turned reminders on here.
const PUSH_PUBLIC_KEY = 'BA65VlyQdykUQfsM_kB63btFf-qonJe3_gZQnbJhaA2wWnTThnFQ2TutuEBnhTKtOR594VIdZXVg2QA-uBJEikI';
function pushB64ToBytes(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw, c=>c.charCodeAt(0));
}
// The service worker can be missing or slow (e.g. over plain http); never wait on it forever.
function pushRegistration(){
  if(!('serviceWorker' in navigator)) return Promise.resolve(null);
  return Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null), 2500))]).catch(()=>null);
}
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushIsStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
function pushIsIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
async function pushDocRef(){
  const p = activeProfileMeta();
  if(!p || !p.syncEnabled || !p.syncCode) return null;
  const db = initCloud();
  return db ? db.collection('budgets').doc(p.syncCode+'__push') : null;
}
async function pushReadSubs(ref){
  const snap = await ref.get();
  if(!snap.exists) return [];
  try{ return JSON.parse(snap.data().subs || '[]'); }catch(e){ return []; }
}
async function enablePushReminders(){
  const ref = await pushDocRef();
  if(!ref){ showToast('Turn on Cloud Sync first', 'Reminders read your synced budget.'); return; }
  const perm = await Notification.requestPermission();
  if(perm!=='granted'){ showToast('Notifications are blocked', 'Allow them for this site in your browser or phone settings, then try again.'); return; }
  const reg = await pushRegistration();
  if(!reg){ showToast("Reminders aren't ready yet", 'Open the installed app (or the live site) and try again.'); return; }
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:pushB64ToBytes(PUSH_PUBLIC_KEY)});
  const subs = (await pushReadSubs(ref)).filter(x=>x.endpoint!==sub.endpoint);
  subs.push(sub.toJSON());
  await ref.set({subs: JSON.stringify(subs), updatedAt: Date.now()});
  showToast('Reminders are on', 'This device will get a daily nudge when something is due.');
}
async function disablePushReminders(){
  try{
    const reg = await pushRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    const ref = await pushDocRef();
    if(sub){
      if(ref){ const subs = (await pushReadSubs(ref)).filter(x=>x.endpoint!==sub.endpoint); await ref.set({subs: JSON.stringify(subs), updatedAt: Date.now()}); }
      await sub.unsubscribe();
    }
  }catch(e){ console.error(e); }
  showToast('Reminders are off', 'This device will stop getting them.');
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}
function importJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.months) throw new Error('bad format');
      state = data;
      normalizeState();
      save();
      currentView='month';
      render();
    }catch(err){
      alert('Could not import this file — it doesn\'t look like an Embalance backup.');
    }
  };
  reader.readAsText(file);
}

// ---------------- Month recap ----------------
// Gathers the highlights for one tracked month: headline figures, its biggest
// category and single spend, and how spending compares to the month before.
function monthRecapData(key){
  const m = state.months[key];
  if(!m) return null;
  const t = monthTotals(m);
  const keys = Object.keys(state.months).sort();
  const idx = keys.indexOf(key);
  const prevKey = idx>0 ? keys[idx-1] : null;
  const pt = prevKey ? monthTotals(state.months[prevKey]) : null;
  const spent = round2(t.allOutgoing + t.weeklyTotal);
  const earned = t.allIncoming;
  const saved = round2(t.savingsAmount + t.stocksAmount);
  const net = round2(t.totalLeftOver - (Number(m.startingBalance)||0));
  const cats = categoryBreakdown(m, 'all');
  const catTotal = cats.reduce((s,r)=>s+r.amount,0);
  const topCat = cats[0] ? {...cats[0], pct: catTotal ? Math.round(cats[0].amount/catTotal*100) : 0} : null;
  const biggest = m.outgoings.filter(o=>(Number(o.amount)||0)>0).sort((a,b)=>b.amount-a.amount)[0] || null;

  const spendChangePct = prevSpent>=0.01 ? Math.round((spent-prevSpent)/prevSpent*100) : null;

function searchEntries(){

    const m = state.months[k];
    const [y, mo] = k.split('-').map(Number);
    const label = monthLabelFromKey(k);

        hay: `${item.name||''} ${cat} ${label} ${kind==='in'?'incoming received':'outgoing spend'} ${item.status==='done'?'paid done':'unpaid not paid pending'} ${item.quickAdd?'quick add':''}`.toLowerCase(), amountStr: amount.toFixed(2)});
    };

function searchTokens(q){ return (q||'').toLowerCase().split(/\s+/).map(t=>t.replace(/^£/,'')).filter(Boolean); }
function searchMatch(e, st, ignoreType){

    if(st.type==='out' && !(e.kind==='out' && !e.quick)) return false;
    if(st.type==='in' && !(e.kind==='in' && !e.quick)) return false;
    if(st.type==='quick' && !e.quick) return false;
  }
  if(st.month!=='any' && e.monthKey!==st.month) return false;
  if(st.status==='paid' && !e.done) return false;
  if(st.status==='unpaid' && e.done) return false;
  if(st.min && e.amount < st.min) return false;
  if(st.cat && e.cat!==st.cat) return false;
  if(st.overdue){
    if(e.kind!=='out' || e.done || e.quick) return false;
    const past = e.monthKey<curKey || (e.date && e.date<today);
    if(!past) return false;
  }
  return searchTokens(st.q).every(t=> e.hay.includes(t) || (/^[0-9.]+$/.test(t) && e.amountStr.includes(t)));

function searchHasCriteria(st){ return !!(st.q.trim() || st.type!=='all' || st.month!=='any' || st.status!=='any' || st.min || st.cat || st.overdue); }

function searchHighlight(name, q){
  const tokens = searchTokens(q).filter(t=>!/^[0-9.]+$/.test(t) || name.toLowerCase().includes(t));

    const safe = escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try{ html = html.replace(new RegExp('('+safe+')(?![^<]*>)','ig'), '<mark>$1</mark>'); }catch(e){}
  });
  return html;
}

function yearReviewData(year){
  const curKey = monthKey(new Date());
  const rows = Object.keys(state.months).filter(k=>k.startsWith(year+'-') && k<=curKey).sort().map(k=>{
    const m = state.months[k], t = monthTotals(m);
    const sc = monthScoreData(k);
    return {k, m, t, spent:round2(t.allOutgoing+t.weeklyTotal), earned:t.allIncoming, saved:round2(t.savingsAmount+t.stocksAmount), score: sc && sc.active ? sc.score : null};
  }).filter(x=>x.earned>0 || x.spent>0);
  if(rows.length<3) return {year, ok:false, n:rows.length};
  const sum = f => round2(rows.reduce((a,x)=>a+f(x),0));
  const earned = sum(x=>x.earned), spent = sum(x=>x.spent), saved = sum(x=>x.saved);
  const net = round2(rows[rows.length-1].t.totalLeftOver - (Number(rows[0].m.startingBalance)||0));
  const catMap = {};
  rows.forEach(x=>categoryBreakdown(x.m,'all').forEach(r=>{ catMap[r.category] = round2((catMap[r.category]||0)+r.amount); }));
  const cats = Object.entries(catMap).map(([category,amount])=>({category,amount})).sort((a,b)=>b.amount-a.amount);
  const catTotal = cats.reduce((a,r)=>a+r.amount,0);
  const bySpend = rows.slice().sort((a,b)=>b.spent-a.spent);
  const scores = rows.filter(x=>x.score!==null).map(x=>x.score);
  const avgScore = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  // Longest run of days with no everyday (Quick Add) spending, across the months tracked so far.
  let quickCount = 0, run = 0, best = 0, bestEnd = null, runEnd = null;
  const today = new Date(); today.setHours(0,0,0,0);
  rows.forEach(x=>{
    const [y, mo] = x.k.split('-').map(Number);
    const days = discretionaryByDay(x.k);
    quickCount += x.m.outgoings.filter(o=>o.quickAdd).length;
    const dim = new Date(y, mo, 0).getDate();
    for(let d=1; d<=dim; d++){
      const date = new Date(y, mo-1, d);
      if(date>today) break;
      if((days[d]||0)>0){ run = 0; }
      else { run++; if(run>best){ best = run; bestEnd = date; } }
    }
  });
  const streak = quickCount>=5 && best>=2 ? {days:best, end:bestEnd} : null;
  // vs the year before
  const prevRows = Object.keys(state.months).filter(k=>k.startsWith((year-1)+'-')).map(k=>{ const t = monthTotals(state.months[k]); return round2(t.allOutgoing+t.weeklyTotal); }).filter(v=>v>0);
  const avgSpend = spent/rows.length;
  const prevAvg = prevRows.length>=3 ? prevRows.reduce((a,b)=>a+b,0)/prevRows.length : null;
  const vsPrev = prevAvg ? Math.round((avgSpend-prevAvg)/prevAvg*100) : null;
  return {year, ok:true, rows, earned, spent, saved, net, cats, catTotal, biggest:bySpend[0], lightest:bySpend[bySpend.length-1], avgScore, streak, vsPrev};
}

  if(d.avgScore!==null || d.streak){
    const sc = d.avgScore;
    const col = sc===null ? 'var(--accent)' : (sc>=70 ? 'var(--green)' : sc>=50 ? 'var(--amber)' : 'var(--red)');
    slides.push(`<div class="yr-slide">
      <div class="yr-kicker">Habits</div><div class="yr-h">How you did</div>
      <div class="yr-sub">Your average monthly score${d.streak?' and your best no-spend run':''}.</div>
      ${sc!==null ? `<div class="score-ring" style="width:150px;height:150px;"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="color-mix(in srgb, var(--text) 10%, transparent)" stroke-width="10"/><circle class="sr-fill" id="yrScoreRing" cx="60" cy="60" r="50" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 60 60)" data-v="${sc}" style="filter:drop-shadow(0 0 6px ${col});"/></svg><div class="score-center"><div class="score-num" style="font-size:38px;">${sc}</div><div class="score-of">avg score</div></div></div>` : ''}
      ${d.streak ? `<div class="yr-two" style="grid-template-columns:1fr;"><div class="yr-stat"><div class="k">Longest no-spend streak</div><div class="v">${d.streak.days} days</div><div class="s">ending ${d.streak.end.toLocaleDateString('en-GB',{day:'numeric',month:'long'})} — nothing logged in Quick Add</div></div></div>` : ''}
    </div>`);
  }
  // 5. vs last year
  if(d.vsPrev!==null){
    const up = d.vsPrev>0;
    slides.push(`<div class="yr-slide">
      <div class="yr-kicker">Compared with ${year-1}</div><div class="yr-h">${d.vsPrev===0?'About the same':`${Math.abs(d.vsPrev)}% ${up?'more':'less'} a month`}</div>
      <div class="yr-sub">Your average monthly spending against last year.</div>
      <div class="recap-hero"><div class="lbl">Average spend a month</div><div class="big ${up?'neg':'pos'}">${escapeHtml(fmt(round2(d.spent/d.rows.length)))}</div><div class="note">${up?'▲':'▼'} ${Math.abs(d.vsPrev)}% vs ${year-1}</div></div>
    </div>`);
  }
  box.innerHTML = `
    <div class="yr-view" id="yrView"><div class="yr-track" id="yrTrack">${slides.join('')}</div></div>
    <div class="yr-pager"><button class="btn secondary small" id="yrPrev">Back</button><div class="yr-dots">${slides.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div><button class="btn small" id="yrNext">Next</button></div>`;
  bg.classList.add('open');
  bg.onclick = e=>{ if(e.target===bg) closeRecapModal(); };
  let idx = 0;
  const track = document.getElementById('yrTrack'), view = document.getElementById('yrView');
  const prev = document.getElementById('yrPrev'), next = document.getElementById('yrNext');
  const show = i=>{
    idx = Math.max(0, Math.min(slides.length-1, i));
    track.style.transform = `translateX(${-idx*100}%)`;
    box.querySelectorAll('.yr-dots i').forEach((dot,j)=>dot.classList.toggle('on', j===idx));
    prev.style.visibility = idx===0 ? 'hidden' : 'visible';
    next.textContent = idx===slides.length-1 ? 'Done' : 'Next';
    // animate whatever the current slide holds
    const slide = track.children[idx];
    slide.querySelectorAll('#yrBars i').forEach(b=>{ b.style.height = b.dataset.h+'px'; });
    const dn = slide.querySelector('#yrDonut'); if(dn && !dn.dataset.done){ dn.dataset.done = '1'; donutChart(dn, d.cats, {size:200}); }
    const ring = slide.querySelector('#yrScoreRing'); if(ring) ring.setAttribute('stroke-dasharray', `${ring.dataset.v} 100`);
  };
  next.onclick = ()=>{ if(idx===slides.length-1) closeRecapModal(); else show(idx+1); };
  prev.onclick = ()=>show(idx-1);
  // swipe
  let sx = null;
  view.addEventListener('pointerdown', e=>{ sx = e.clientX; });
  view.addEventListener('pointerup', e=>{ if(sx===null) return; const dx = e.clientX - sx; sx = null; if(Math.abs(dx)>50) show(idx + (dx<0?1:-1)); });
  // Keep the pop-up the same size on every card: use the tallest card's height.
  const fixHeight = ()=>{ view.style.height = Math.max(...[...track.children].map(c=>c.scrollHeight)) + 'px'; };
  fixHeight();
  setTimeout(fixHeight, 120);
  setTimeout(()=>show(0), 60);
}
// Monthly score out of 100, from four parts: spending vs income (30), saving rate (25),
// leftover cushion (25) and bills on track (20).
function monthScoreData(key){
  const m = state.months[key];
  if(!m) return null;
  const t = monthTotals(m);
  const earned = t.allIncoming;
  const spent = round2(t.allOutgoing + t.weeklyTotal);
  const saved = round2(t.savingsAmount + t.stocksAmount);
  const left = t.totalLeftOver;
  const clamp = (v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const pct = v=>Math.round(v*100);
  const parts = [];
  // 1. spending
  const spendRatio = earned>0 ? spent/earned : null;
  parts.push({id:'spend', name:'Spending vs income', max:30, icon:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', color:'var(--red)',
    pts: spendRatio===null ? 0 : clamp(30*(1-Math.max(0,spendRatio-0.7)/0.3), 0, 30),
    note: spendRatio===null ? 'No income tracked yet' : `You plan to spend ${pct(spendRatio)}% of your income (aim for under 70%)`,
    tip: 'Trim spending a little to get under 70% of your income.'});
  // 2. saving
  const rate = earned>0 ? saved/earned : 0;
  parts.push({id:'save', name:'Saving rate', max:25, icon:CATEGORY_ICON_PATHS['Savings & Debt'], color:'var(--green)',
    pts: clamp(25*rate/0.2, 0, 25),
    note: `${fmt(saved)} set aside — ${pct(rate)}% of income (aim for 20%)`,
    tip: 'Move a bit more into savings or stocks — 20% of income is the target.'});
  // 3. cushion
  const leftRatio = earned>0 ? left/earned : 0;
  parts.push({id:'cushion', name:'Money left over', max:25, icon:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', color:'var(--accent)',
    pts: left<0 ? 0 : clamp(8 + 17*(leftRatio/0.1), 0, 25),
    note: left<0 ? `You'd finish ${fmt(-left)} short` : `${fmt(left)} left at the end (${pct(leftRatio)}% of income)`,
    tip: 'Build the leftover up to around 10% of your income.'});
  // 4. bills on track
  const now = new Date(), curKey = monthKey(now);
  const [y, mo] = key.split('-').map(Number);
  const due = m.outgoings.filter(o=>!o.quickAdd && (Number(o.amount)||0)>0 && (key<curKey || (key===curKey && (()=>{ const d = resolveScheduledDay(o,y,mo); return d && d<=now.getDate(); })())));
  const overdue = due.filter(o=>o.status!=='done');
  parts.push({id:'bills', name:'Bills on track', max:20, icon:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M9 15l2 2 4-4', color:'var(--amber)',
    pts: due.length ? 20*(1-overdue.length/due.length) : 20,
    note: !due.length ? 'Nothing due yet this month' : overdue.length ? `${overdue.length} of ${due.length} bills due so far still unpaid` : `All ${due.length} bills due so far are paid`,
    tip: 'Mark overdue bills as paid, or give them a new date.'});
  parts.forEach(p=>{ p.pts = round2(p.pts); });
  const score = Math.round(parts.reduce((a,p)=>a+p.pts,0));
  const weakest = parts.slice().sort((a,b)=>(a.pts/a.max)-(b.pts/b.max))[0];
  const rating = score>=85 ? ['Excellent','var(--green)'] : score>=70 ? ['Healthy','var(--green)'] : score>=50 ? ['Okay','var(--amber)'] : ['Needs attention','var(--red)'];
  return {key, score, parts, weakest, rating, active: earned>0 || spent>0};
}
function openScoreModal(key){
  const d = monthScoreData(key);
  if(!d) return;
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.className = 'modal recap-modal';
  const color = d.rating[1];
  box.innerHTML = `
    <div class="recap-eyebrow">Monthly score</div>
    <div class="recap-title">${monthLabelFromKey(d.key)}</div>
    <div class="recap-sub">How this month is shaping up.</div>
    ${d.active ? `
      <div class="score-hero stagger-card" style="--i:0;">
        <div class="score-ring">
          <svg viewBox="0 0 120 120" role="img" aria-label="Score ${d.score} out of 100">
            <circle cx="60" cy="60" r="50" fill="none" stroke="color-mix(in srgb, var(--text) 10%, transparent)" stroke-width="10"/>
            <circle class="sr-fill" cx="60" cy="60" r="50" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 6px ${color});"/>
          </svg>
          <div class="score-center"><div class="score-num" id="scoreNum">0</div><div class="score-of">out of 100</div></div>
        </div>
        <span class="score-rating" style="background:color-mix(in srgb, ${color} 18%, transparent);color:${color};">${d.rating[0]}</span>
        <div class="score-tip">${d.weakest.pts/d.weakest.max<0.99 ? `<b>Quickest win:</b> ${escapeHtml(d.weakest.tip)}` : 'Nothing to fix — every part is on target.'}</div>
      </div>
      <div class="recap-rows">
        ${d.parts.map((p,i)=>`
          <div class="score-row stagger-card" style="--i:${i+1};">
            ${iconTile(p.icon, p.color, 'sm')}
            <div class="sr-main">
              <div class="sr-top"><span class="sr-name">${p.name}</span><span class="sr-pts"><b>${Math.round(p.pts)}</b> / ${p.max}</span></div>
              <div class="sr-bar"><i style="--c:${p.pts/p.max>=0.8?'var(--green)':p.pts/p.max>=0.5?'var(--amber)':'var(--red)'};width:0%;" data-w="${(p.pts/p.max*100).toFixed(1)}"></i></div>
              <div class="sr-note">${escapeHtml(p.note)}</div>
            </div>
          </div>`).join('')}
      </div>`
    : `<div class="recap-empty">Nothing tracked in this month yet — add some income or outgoings and your score will appear.</div>`}
    <div class="actions"><button class="btn small" id="scoreClose">Close</button></div>`;
  bg.classList.add('open');
  bg.onclick = e=>{ if(e.target===bg) closeRecapModal(); };
  document.getElementById('scoreClose').onclick = closeRecapModal;
  if(d.active){
    // draw the ring, fill the bars and count the number up
    setTimeout(()=>{
      const ring = box.querySelector('.sr-fill'); if(ring) ring.setAttribute('stroke-dasharray', `${d.score} 100`);
      box.querySelectorAll('.sr-bar i').forEach(i=>{ i.style.width = i.dataset.w+'%'; });
      const num = document.getElementById('scoreNum');
      const t0 = performance.now(), dur = 1000;
      const tick = now=>{
        if(!num.isConnected) return;
        const f = Math.min(1,(now-t0)/dur);
        num.textContent = Math.round(d.score*(1-Math.pow(1-f,3)));
        if(f<1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      setTimeout(()=>{ if(num.isConnected) num.textContent = d.score; }, dur+150);
    }, 150);
  }
}
function closeRecapModal(){
  const bg = document.getElementById('modalBg');
  bg.classList.remove('open');
  bg.onclick = null;
  document.getElementById('modalBox').className = 'modal';
}
function openRecapModal(key, opts){
  opts = opts||{};
  const d = monthRecapData(key);
  if(!d) return;
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.className = 'modal recap-modal';
  const rows = [];
  if(d.topCat){
    rows.push(`<div class="recap-row stagger-card" style="--i:4;">
      ${catTile(d.topCat.category,'sm')}
      <div class="rl"><div class="rt">Top category</div><div class="rv">${escapeHtml(d.topCat.category)}</div></div>
      <div class="ramt">${fmt(d.topCat.amount)}<small>${d.topCat.pct}% of categorised</small></div></div>`);
  }
  if(d.biggest){
    const bc = d.biggest.category || 'Uncategorized';
    rows.push(`<div class="recap-row stagger-card" style="--i:5;">
      ${catTile(bc,'sm')}
      <div class="rl"><div class="rt">Biggest single spend</div><div class="rv">${escapeHtml(d.biggest.name||'Unnamed')}</div></div>
      <div class="ramt">${fmt(d.biggest.amount)}<small>${escapeHtml(bc)}</small></div></div>`);
  }
  if(d.spendChangePct!==null){
    const up = d.spendChangePct>0;
    const flat = d.spendChangePct===0;
    rows.push(`<div class="recap-row stagger-card" style="--i:6;">
      <span class="cat-dd-chip" style="background:var(--panel);border:1px solid var(--border);">${flat?'＝':up?'▲':'▼'}</span>
      <div class="rl"><div class="rt">Spending vs ${monthLabelFromKey(d.prevKey)}</div><div class="rv" style="color:${flat?'var(--muted)':up?'var(--red)':'var(--green)'};">${flat?'No change':`${up?'Up':'Down'} ${Math.abs(d.spendChangePct)}%`}</div></div></div>`);
  }
  if(d.topIncome){
    rows.push(`<div class="recap-row stagger-card" style="--i:6;">
      ${catTile(d.topIncome.category,'sm')}
      <div class="rl"><div class="rt">Top income source</div><div class="rv">${escapeHtml(d.topIncome.category)}</div></div>
      <div class="ramt">${fmt(d.topIncome.amount)}<small>${d.topIncome.pct}% of income</small></div></div>`);
  }
  if(d.earned>0 && d.saved>0){
    rows.push(`<div class="recap-row stagger-card" style="--i:7;">
      ${iconTile(CATEGORY_ICON_PATHS['Savings & Debt'],'var(--green)','sm')}
      <div class="rl"><div class="rt">Savings rate</div><div class="rv">Put away ${Math.round(d.saved/d.earned*100)}% of income</div></div>
      <div class="ramt">${fmt(d.saved)}</div></div>`);
  }
  box.innerHTML = `
    <div class="recap-eyebrow">Month recap</div>
    <div class="recap-title">${monthLabelFromKey(d.key)}</div>
    <div class="recap-sub">${opts.fromNewMonth ? 'Here\'s how that month wrapped up.' : 'Your month in review.'}</div>
    ${d.active ? `
      <div class="recap-hero stagger-card" style="--i:0;">
        <div class="lbl">Net change this month</div>
        <div class="big ${d.net>=0?'pos':'neg'}" id="recapNet">${fmt(0)}</div>
        <div class="note">${d.net>=0?'You ended the month ahead.':'You spent more than came in.'}</div>
      </div>
      <div class="recap-tiles">
        <div class="recap-tile stagger-card" style="--i:1;"><div class="k">Earned</div><div class="v" style="color:var(--green);">${fmt(d.earned)}</div></div>
        <div class="recap-tile stagger-card" style="--i:2;"><div class="k">Spent</div><div class="v" style="color:var(--red);">${fmt(d.spent)}</div></div>
        <div class="recap-tile stagger-card" style="--i:3;"><div class="k">Saved</div><div class="v">${fmt(d.saved)}</div></div>
      </div>
      <div class="recap-rows">${rows.join('')}</div>`
    : `<div class="recap-empty">Nothing tracked in this month yet — add some income or outgoings and the recap will fill in.</div>`}
    ${d.active && yearReviewData(Number(d.key.slice(0,4))).ok ? `<a class="recap-link" id="recapYearLink">See your ${d.key.slice(0,4)} year in review →</a>` : ''}
    <div class="actions"><button class="btn small" id="recapClose">${opts.fromNewMonth ? 'Continue' : 'Close'}</button></div>`;
  bg.classList.add('open');
  bg.onclick = e=>{ if(e.target===bg) closeRecapModal(); };
  const yearLink = document.getElementById('recapYearLink');
  if(yearLink) yearLink.onclick = ()=>openYearReview(Number(d.key.slice(0,4)));
  document.getElementById('recapClose').onclick = ()=>{
    closeRecapModal();
    // Rolling December into January: offer the whole year next.
    if(opts.fromNewMonth && d.key.endsWith('-12') && yearReviewData(Number(d.key.slice(0,4))).ok) setTimeout(()=>openYearReview(Number(d.key.slice(0,4))), 250);
  };
  if(d.active){
    const netEl = document.getElementById('recapNet');
    netEl.dataset.animValue = '0';
    setTimeout(()=>animateNumberText(netEl, d.net, 900), 150);
  }
}

// Clears the app's cached files (service worker + Cache Storage, plus the browser's
// cached copy of this page) and reloads. Budget data lives in localStorage and
// Firestore, neither of which is touched.
async function forceRefresh(){
  const btn = document.getElementById('forceRefreshBtn');
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const names = await caches.keys();
      await Promise.all(names.map(n=>caches.delete(n)));
    }
    await fetch(location.pathname, {cache:'reload'});
  }catch(e){
    console.error('Force refresh partly failed', e);
  }
  location.reload();
}
document.getElementById('forceRefreshBtn').onclick = forceRefresh;

if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(hadController) showToast('Updated', 'Reload to get the latest version');
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Service worker registration failed', e));
  });
}
