  drawProfilesTable();
  document.getElementById('addProfileBtn').onclick = ()=>{
    openInputModal('New profile', "e.g. Sam's Budget", name=>addProfile(name));
  };

  document.getElementById('syncToggle').onchange = e=>{
    const on = e.target.value==='on';
    p.syncEnabled = on;
    if(on && !p.syncCode) p.syncCode = genSyncCode();
    saveProfilesMeta();
    if(on){ pushToCloud(); updateUrlHashForSyncCode(p.syncCode); }
    renderSettings();
  };
  const copyBtn = document.getElementById('copySyncCodeBtn');
  if(copyBtn) copyBtn.onclick = ()=>{
    const inp = document.getElementById('syncCodeDisplay');
    inp.select();
    navigator.clipboard && navigator.clipboard.writeText(inp.value).catch(()=>{});
    copyBtn.textContent = 'Copied!';
    setTimeout(()=>{ copyBtn.textContent = 'Copy'; }, 1500);
  };
  const syncNowBtn = document.getElementById('syncNowBtn');
  if(syncNowBtn) syncNowBtn.onclick = ()=>{
    syncNowBtn.disabled = true;
    const original = syncNowBtn.textContent;
    syncNowBtn.textContent = 'Syncing…';
    save();
    syncActiveProfileFromCloud();
    setTimeout(()=>{ syncNowBtn.disabled = false; syncNowBtn.textContent = original; }, 900);
  };
  renderSyncIndicator();
  document.getElementById('pullSyncBtn').onclick = ()=>{
    const code = document.getElementById('pullSyncCodeInput').value.trim();
    if(!code) return;
    pullFromCloud(code).then(doc=>{
      if(!doc){ alert('No cloud data found for that sync code.'); return; }
      try{
        state = JSON.parse(doc.data);
        normalizeState();
        p.syncEnabled = true;
        p.syncCode = code;
        saveProfilesMeta();
        save();
        updateUrlHashForSyncCode(code);
        currentView = 'month';
        render();
      }catch(e){ alert('That sync code\'s data looked corrupted.'); }
    }).catch(()=>{ alert('Could not reach the cloud — check your connection and try again.'); });
  };

  document.getElementById('currencyInput').oninput = e=>{ state.currency = e.target.value||'£'; save(); };
  document.getElementById('exportJsonBtn').onclick = exportJson;
  document.getElementById('importInput').onchange = importJson;
  document.getElementById('resetBtn').onclick = ()=>{
    openConfirmModal('Reset this profile\'s data?', 'This clears every tracked month and setting for the current profile only. Other profiles are unaffected. This cannot be undone.', ()=>{
      localStorage.removeItem(dataKeyFor(profilesMeta.activeId));
      state = defaultState();
      save();
      currentView='month';
      render();
    });
  };
}

function exportJson(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  downloadBlob(blob, 'budget-tracker-backup.json');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}
function importJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.months) throw new Error('bad format');
      state = data;
      normalizeState();
      save();
      currentView='month';
      render();
    }catch(err){
      alert('Could not import this file — it doesn\'t look like a Budget Tracker backup.');
    }
  };
  reader.readAsText(file);
}

// ---------------- Month recap ----------------
// Gathers the highlights for one tracked month: headline figures, its biggest
// category and single spend, and how spending compares to the month before.
function monthRecapData(key){
  const m = state.months[key];
  if(!m) return null;
  const t = monthTotals(m);
  const keys = Object.keys(state.months).sort();
  const idx = keys.indexOf(key);
  const prevKey = idx>0 ? keys[idx-1] : null;
  const pt = prevKey ? monthTotals(state.months[prevKey]) : null;
  const spent = round2(t.allOutgoing + t.weeklyTotal);
  const earned = t.allIncoming;
  const saved = round2(t.savingsAmount + t.stocksAmount);
  const net = round2(t.totalLeftOver - (Number(m.startingBalance)||0));
  const cats = categoryBreakdown(m, 'all');
  const catTotal = cats.reduce((s,r)=>s+r.amount,0);
  const topCat = cats[0] ? {...cats[0], pct: catTotal ? Math.round(cats[0].amount/catTotal*100) : 0} : null;
  const biggest = m.outgoings.filter(o=>(Number(o.amount)||0)>0).sort((a,b)=>b.amount-a.amount)[0] || null;
  const prevSpent = pt ? round2(pt.allOutgoing + pt.weeklyTotal) : null;
  const spendChangePct = prevSpent>=0.01 ? Math.round((spent-prevSpent)/prevSpent*100) : null;
  return {key, prevKey, spent, earned, saved, net, topCat, biggest, spendChangePct, active: spent>0 || earned>0};
}
function closeRecapModal(){
  const bg = document.getElementById('modalBg');
  bg.classList.remove('open');
  bg.onclick = null;
  document.getElementById('modalBox').className = 'modal';
}
function openRecapModal(key, opts){
  opts = opts||{};
  const d = monthRecapData(key);
  if(!d) return;
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.className = 'modal recap-modal';
  const rows = [];
  if(d.topCat){
    rows.push(`<div class="recap-row stagger-card" style="--i:4;">
      <span class="cat-dd-chip" style="background:${categoryColor(d.topCat.category)};">${categoryIcon(d.topCat.category)}</span>
      <div class="rl"><div class="rt">Top category</div><div class="rv">${escapeHtml(d.topCat.category)}</div></div>
      <div class="ramt">${fmt(d.topCat.amount)}<small>${d.topCat.pct}% of categorised</small></div></div>`);
  }
  if(d.biggest){
    const bc = d.biggest.category || 'Uncategorized';
    rows.push(`<div class="recap-row stagger-card" style="--i:5;">
      <span class="cat-dd-chip" style="background:${categoryColor(bc)};">${categoryIcon(bc)}</span>
      <div class="rl"><div class="rt">Biggest single spend</div><div class="rv">${escapeHtml(d.biggest.name||'Unnamed')}</div></div>
      <div class="ramt">${fmt(d.biggest.amount)}<small>${escapeHtml(bc)}</small></div></div>`);
  }
  if(d.spendChangePct!==null){
    const up = d.spendChangePct>0;
    const flat = d.spendChangePct===0;
    rows.push(`<div class="recap-row stagger-card" style="--i:6;">
      <span class="cat-dd-chip" style="background:var(--panel);border:1px solid var(--border);">${flat?'＝':up?'▲':'▼'}</span>
      <div class="rl"><div class="rt">Spending vs ${monthLabelFromKey(d.prevKey)}</div><div class="rv" style="color:${flat?'var(--muted)':up?'var(--red)':'var(--green)'};">${flat?'No change':`${up?'Up':'Down'} ${Math.abs(d.spendChangePct)}%`}</div></div></div>`);
  }
  if(d.earned>0 && d.saved>0){
    rows.push(`<div class="recap-row stagger-card" style="--i:7;">
      <span class="cat-dd-chip" style="background:var(--accent);color:var(--on-accent);">💰</span>
      <div class="rl"><div class="rt">Savings rate</div><div class="rv">Put away ${Math.round(d.saved/d.earned*100)}% of income</div></div>
      <div class="ramt">${fmt(d.saved)}</div></div>`);
  }
  box.innerHTML = `
    <div class="recap-eyebrow">Month recap</div>
    <div class="recap-title">${monthLabelFromKey(d.key)}</div>
    <div class="recap-sub">${opts.fromNewMonth ? 'Here\'s how that month wrapped up.' : 'Your month in review.'}</div>
    ${d.active ? `
      <div class="recap-hero stagger-card" style="--i:0;">
        <div class="lbl">Net change this month</div>
        <div class="big ${d.net>=0?'pos':'neg'}" id="recapNet">${fmt(0)}</div>
        <div class="note">${d.net>=0?'You ended the month ahead.':'You spent more than came in.'}</div>
      </div>
      <div class="recap-tiles">
        <div class="recap-tile stagger-card" style="--i:1;"><div class="k">Earned</div><div class="v" style="color:var(--green);">${fmt(d.earned)}</div></div>
        <div class="recap-tile stagger-card" style="--i:2;"><div class="k">Spent</div><div class="v" style="color:var(--red);">${fmt(d.spent)}</div></div>
        <div class="recap-tile stagger-card" style="--i:3;"><div class="k">Saved</div><div class="v">${fmt(d.saved)}</div></div>
      </div>
      <div class="recap-rows">${rows.join('')}</div>`
    : `<div class="recap-empty">Nothing tracked in this month yet — add some income or outgoings and the recap will fill in.</div>`}
    <div class="actions"><button class="btn small" id="recapClose">${opts.fromNewMonth ? 'Continue' : 'Close'}</button></div>`;
  bg.classList.add('open');
  bg.onclick = e=>{ if(e.target===bg) closeRecapModal(); };
  document.getElementById('recapClose').onclick = closeRecapModal;
  if(d.active){
    const netEl = document.getElementById('recapNet');
    netEl.dataset.animValue = '0';
    setTimeout(()=>animateNumberText(netEl, d.net, 900), 150);
  }
}

// ---------------- modal ----------------
function openConfirmModal(title, body, onConfirm){
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.innerHTML = `<h3>${title}</h3><p style="font-size:13px;color:var(--muted);">${body}</p>
    <div class="actions"><button class="btn secondary small" id="modalCancel">Cancel</button><button class="btn danger small" id="modalOk">Confirm</button></div>`;
  bg.classList.add('open');
  document.getElementById('modalCancel').onclick = ()=>bg.classList.remove('open');
  document.getElementById('modalOk').onclick = ()=>{ bg.classList.remove('open'); onConfirm(); };
}
function openInputModal(title, placeholder, onConfirm){
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modalBox');
  box.innerHTML = `<h3>${title}</h3>
    <input type="text" id="modalInputField" placeholder="${escapeHtml(placeholder||'')}" style="width:100%;">
    <div class="actions"><button class="btn secondary small" id="modalCancel">Cancel</button><button class="btn small" id="modalOk">Add</button></div>`;
  bg.classList.add('open');
  const inputEl = document.getElementById('modalInputField');
  inputEl.focus();
  const commit = ()=>{
    const val = inputEl.value.trim();
    bg.classList.remove('open');
    if(val) onConfirm(val);
  };
  document.getElementById('modalCancel').onclick = ()=>bg.classList.remove('open');
  document.getElementById('modalOk').onclick = commit;
  inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') commit(); });
}

// ---------------- nav / events ----------------
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
document.getElementById('hamburgerBtn').onclick = ()=>{
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
};
document.getElementById('sidebarBackdrop').onclick = closeSidebar;
document.querySelectorAll('.nav-item').forEach(n=>{
  n.addEventListener('click', ()=>{ currentView = n.dataset.view; render(); closeSidebar(); });
});
document.getElementById('prevMonth').onclick = ()=>{ state.currentMonthKey = shiftKey(state.currentMonthKey,-1); ensureMonth(state.currentMonthKey); save(); render(); };
document.getElementById('nextMonth').onclick = ()=>{ state.currentMonthKey = shiftKey(state.currentMonthKey,1); ensureMonth(state.currentMonthKey); save(); render(); };
document.getElementById('recapBtn').onclick = ()=>openRecapModal(state.currentMonthKey);
document.getElementById('newMonthBtn').onclick = ()=>{
  const leavingKey = state.currentMonthKey;
  const current = ensureMonth(state.currentMonthKey);
  const leftOver = monthTotals(current).totalLeftOver;
  const nextKey = shiftKey(state.currentMonthKey, 1);
  const nextAlreadyExisted = !!state.months[nextKey];
  const next = ensureMonth(nextKey);
  next.startingBalance = round2(leftOver);
  if(nextAlreadyExisted) syncRecurringForward(current, next);
  state.currentMonthKey = nextKey;
  save();
  render();
  const recap = monthRecapData(leavingKey);
  if(recap && recap.active) openRecapModal(leavingKey, {fromNewMonth:true});
};
document.getElementById('themeSelect').onchange = e=>{
  state.theme = e.target.value;
  save(); render();
};

render();
if(bootstrapFromUrlIfNeeded()) render();
(function(){
  const p = activeProfileMeta();
  if(p && p.syncEnabled && p.syncCode) updateUrlHashForSyncCode(p.syncCode);
})();
syncActiveProfileFromCloud();
setInterval(renderSyncIndicator, 60000);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Service worker registration failed', e));
  });
}
